<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🍽 Log a meal</title>
<meta name="theme-color" content="#233357">
<!-- Deliberately NO manifest link: Chrome's "Add to Home Screen" on this page then creates a
     plain shortcut straight to meallog.html (its own icon), instead of installing the main
     Bucky PWA whose start_url is "/". That shortcut IS the "meal widget". -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --navy:#233357; --red:#ba303e; --bg:#eef2fa; --card:#fff; --ink:#1c2434; --muted:#68738a; --line:#d9e0ee; --good:#1e7d43; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink);
         display: flex; flex-direction: column; align-items: center; padding: max(18px, env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 430px; }
  header .logo { font-weight: 900; color: var(--navy); font-size: 17px; text-decoration: none; }
  header .sub { color: var(--muted); font-size: 12.5px; margin-left: auto; }
  main { flex: 1; width: 100%; max-width: 430px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
  #micBtn { width: 148px; height: 148px; border-radius: 50%; border: 0; background: var(--navy); color: #fff; font-size: 58px;
            box-shadow: 0 10px 30px rgba(35,51,87,.35); cursor: pointer; transition: transform .15s, background .2s; }
  #micBtn:active { transform: scale(.96); }
  #micBtn.listening { background: var(--red); animation: pulse 1.1s ease-in-out infinite; }
  #micBtn.busy { background: #8b94ab; animation: none; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(186,48,62,.45); } 50% { box-shadow: 0 0 0 26px rgba(186,48,62,0); } }
  #status { font-size: 17px; font-weight: 700; color: var(--navy); min-height: 24px; }
  #heard { font-size: 15px; color: var(--muted); min-height: 40px; max-width: 92%; }
  #result { display: none; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; width: 100%; box-shadow: 0 6px 18px rgba(28,36,52,.08); }
  #result .big { font-size: 21px; font-weight: 900; color: var(--navy); }
  #result .cal { font-size: 34px; font-weight: 900; color: var(--good); margin: 6px 0 2px; }
  #result .parts { font-size: 13px; color: var(--muted); line-height: 1.5; }
  #result .where { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .btnrow { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
  .btn { border: 0; border-radius: 12px; padding: 12px 18px; font-size: 15px; font-weight: 800; cursor: pointer; }
  .btn.primary { background: var(--navy); color: #fff; }
  .btn.ghost { background: #e7ecf7; color: var(--navy); }
  #typedRow { display: flex; gap: 8px; width: 100%; }
  #typedRow input { flex: 1; min-width: 0; padding: 13px; font-size: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  #typedRow button { border: 0; border-radius: 12px; background: var(--navy); color: #fff; font-weight: 800; padding: 0 16px; font-size: 14px; }
  footer { width: 100%; max-width: 430px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.6; }
  footer button { border: 0; background: none; color: var(--navy); font-weight: 800; cursor: pointer; font-size: 12px; text-decoration: underline; }
  #err { color: var(--red); font-size: 13px; min-height: 18px; font-weight: 700; }
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html#mealplan">← Bucky</a>
  <span class="sub">Quick meal log</span>
</header>
<main>
  <button id="micBtn" aria-label="Tap and say what you ate">🎤</button>
  <div id="status">Tap the mic, then say what you ate</div>
  <div id="heard"></div>
  <div id="err"></div>
  <div id="result">
    <div class="big" id="resName"></div>
    <div class="cal" id="resCal"></div>
    <div class="parts" id="resParts"></div>
    <div class="where" id="resWhere"></div>
    <div class="btnrow">
      <button class="btn ghost" id="undoBtn">↩ Undo</button>
      <button class="btn primary" id="againBtn">🎤 Log another</button>
    </div>
  </div>
  <div id="typedRow">
    <input type="text" id="typedText" placeholder="…or type it" autocomplete="off">
    <button id="typedGo">Log it</button>
  </div>
</main>
<footer>
  Logging as <b id="whoName"></b> · <button id="whoSwap">switch</button><br>
  Meals appear in Bucky → Plan → Meals. Add this page to your home screen for one-tap logging
  (Chrome menu → “Add to Home screen”).
</footer>
<script type="module">
// Standalone voice meal logger. Speak (or type) what you ate → the farmgpt "calories" mode
// (Sonnet) estimates it → the entry is queued in the settings backend as mealInbox_<user>
// {items:[{k,meal,n,c}]}; index.html's Meals tab drains that inbox into the real log through
// its own template-aware add path (so Mom's plan days stay correct). Cloud when reachable
// (same settings_<familyKey> docs as the app, config duplicated per house convention),
// localStorage "setting_<id>" fallback otherwise — the same key the app's local backend reads.
const firebaseConfig = {
  apiKey: "AIzaSyAA1hn-j9_pPuXoaHIzcyyXYJN6EhUccJU",
  authDomain: "amen-farms-app.firebaseapp.com",
  projectId: "amen-farms-app",
  storageBucket: "amen-farms-app.firebasestorage.app",
  messagingSenderId: "321230755979",
  appId: "1:321230755979:web:d362c56aaf7e50b4ab5c8e"
};
const FAMILY_PASSWORD = "amenfarms";
function roomId(pw){ let h = 0; for (const ch of pw.toLowerCase()) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return "fam" + h.toString(36); }
const familyKey = roomId(FAMILY_PASSWORD);
const MEAL_USERS = ["Mom", "Dad"];   // keep in sync with index.html MEAL_USERS / MEAL_PROFILES
const SUFFIX = { Mom: "", Dad: "_Dad" };

const $ = (id) => document.getElementById(id);
let who = localStorage.getItem("meallog_who")
  || (MEAL_USERS.includes(localStorage.getItem("choreUser")) ? localStorage.getItem("choreUser") : "Dad");
if (!MEAL_USERS.includes(who)) who = "Dad";

// ---- cloud (best-effort, 4s budget) ----
let cloud = null;   // { getSetting, setSetting } or null
async function initCloud(){
  try {
    const load = (async () => {
      const appMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
      const fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
      const db = fs.getFirestore(appMod.initializeApp(firebaseConfig));
      return {
        getSetting: async (id) => { const d = await fs.getDoc(fs.doc(db, "settings_" + familyKey, id)); return d.exists() ? d.data() : null; },
        setSetting: async (id, data) => { await fs.setDoc(fs.doc(db, "settings_" + familyKey, id), data, { merge: true }); },
      };
    })();
    cloud = await Promise.race([load, new Promise((r) => setTimeout(() => r(null), 4000))]);
  } catch { cloud = null; }
}
const cloudReady = initCloud();
const localGet = (id) => { try { return JSON.parse(localStorage.getItem("setting_" + id)) || null; } catch { return null; } };
const localSet = (id, data) => localStorage.setItem("setting_" + id, JSON.stringify(data));

// ---- day key + meal-of-day (America/Chicago, matching the app) ----
const dayKey = () => new Date().toLocaleDateString("en-CA", { timeZone: "America/Chicago" });
function mealOfDay(){
  const parts = new Intl.DateTimeFormat("en-US", { timeZone: "America/Chicago", hour: "numeric", minute: "numeric", hour12: false }).formatToParts(new Date());
  const g = (t) => parseInt(parts.find((p) => p.type === t).value, 10);
  const mins = (g("hour") % 24) * 60 + g("minute");
  if (mins < 630) return "Breakfast";      // before 10:30
  if (mins < 840) return "Lunch";          // before 2:00
  if (mins < 990) return "Snack";          // before 4:30
  return "Dinner";
}

// ---- inbox write (queue for the app to drain) ----
let lastLogged = null;   // { inboxId, item, synced } — for Undo
async function queueMeal(name, cal){
  const inboxId = "mealInbox" + (SUFFIX[who] || "");
  const item = { k: dayKey(), meal: mealOfDay(), n: name, c: cal };
  await cloudReady;
  let synced = false;
  if (cloud){
    try {
      const s = await cloud.getSetting(inboxId);
      const items = (s && Array.isArray(s.items)) ? s.items : [];
      items.push(item);
      await cloud.setSetting(inboxId, { items });
      synced = true;
    } catch {}
  }
  if (!synced){
    const s = localGet(inboxId);
    const items = (s && Array.isArray(s.items)) ? s.items : [];
    items.push(item);
    localSet(inboxId, { items });
  }
  lastLogged = { inboxId, item, synced };
  return synced;
}
async function undoLast(){
  if (!lastLogged) return;
  const { inboxId, item, synced } = lastLogged; lastLogged = null;
  const drop = (items) => { const i = items.findIndex((x) => x.k === item.k && x.n === item.n && x.c === item.c); if (i >= 0) items.splice(i, 1); return items; };
  if (synced && cloud){
    try { const s = await cloud.getSetting(inboxId); await cloud.setSetting(inboxId, { items: drop((s && s.items) || []) }); return; } catch {}
  }
  const s = localGet(inboxId); localSet(inboxId, { items: drop((s && s.items) || []) });
}

// ---- estimate (farmgpt mode "calories") ----
async function estimate(text){
  const r = await fetch("/.netlify/functions/farmgpt", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ secret: FAMILY_PASSWORD, mode: "calories", text: String(text).slice(0, 500) }),
  });
  let j = null; try { j = await r.json(); } catch {}
  if (!r.ok) throw new Error((j && j.error) || "Couldn't reach the estimator — check wifi");
  if (!j || !j.ok) throw new Error((j && j.message) || "Couldn't estimate that — try rewording");
  return j;
}

// ---- UI state machine ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, phase = "idle";   // idle | listening | busy | done
function setPhase(p, statusText){
  phase = p;
  $("micBtn").classList.toggle("listening", p === "listening");
  $("micBtn").classList.toggle("busy", p === "busy");
  $("micBtn").textContent = p === "busy" ? "…" : "🎤";
  $("result").style.display = p === "done" ? "block" : "none";
  $("typedRow").style.display = p === "done" ? "none" : "flex";
  if (statusText != null) $("status").textContent = statusText;
}
function fail(msg){ $("err").textContent = msg; setPhase("idle", "Tap the mic to try again"); }

async function logText(text){
  const t = String(text || "").trim();
  if (!t || phase === "busy") return;
  $("err").textContent = "";
  $("heard").textContent = "“" + t + "”";
  setPhase("busy", "Counting the calories…");
  try {
    const j = await estimate(t);
    const synced = await queueMeal(j.name, j.total);
    $("resName").textContent = j.name;
    $("resCal").textContent = "≈ " + j.total.toLocaleString() + " cal";
    $("resParts").textContent = (j.items || []).map((it) => it.n + " " + it.c).join(" · ");
    $("resWhere").textContent = (synced ? "✓ Synced — " : "✓ Saved on this phone — ")
      + "logged to " + mealOfDay() + " in " + who + "'s Meals tab.";
    setPhase("done", "Logged! 🎉");
  } catch (e){ fail(e.message || "Something went wrong — try again"); }
}

function listen(){
  if (!SR){ fail("This browser can't do voice — type it below instead"); return; }
  if (phase === "listening"){ try { rec && rec.stop(); } catch {} return; }
  $("err").textContent = ""; $("heard").textContent = "";
  let finalText = "";
  try {
    rec = new SR();
    rec.lang = "en-US"; rec.interimResults = true; rec.maxAlternatives = 1;
    rec.onresult = (e) => {
      localStorage.setItem("meallog_mic_ok", "1");   // mic worked — future opens auto-listen
      let t = "";
      for (const r of e.results){ t += r[0].transcript; if (r.isFinal) finalText = t; }
      $("heard").textContent = "“" + t + "”";
    };
    rec.onerror = (e) => {
      if (phase !== "listening") return;
      fail(e && e.error === "not-allowed" ? "Mic permission needed — allow it, then tap again"
        : "Didn't catch that — tap and try again");
    };
    rec.onend = () => {
      if (phase !== "listening") return;
      const t = (finalText || $("heard").textContent.replace(/^“|”$/g, "")).trim();
      if (t) logText(t); else setPhase("idle", "Didn't hear anything — tap to try again");
    };
    rec.start();
    setPhase("listening", "Listening… say what you ate");
  } catch { fail("Couldn't start the mic — type it below instead"); }
}

$("micBtn").onclick = listen;
$("againBtn").onclick = () => { $("heard").textContent = ""; setPhase("idle"); listen(); };
$("undoBtn").onclick = async () => { await undoLast(); $("heard").textContent = ""; setPhase("idle", "Undone — tap the mic to log again"); };
$("typedGo").onclick = () => { logText($("typedText").value); $("typedText").value = ""; };
$("typedText").addEventListener("keydown", (e) => { if (e.key === "Enter") { logText($("typedText").value); $("typedText").value = ""; } });
function paintWho(){ $("whoName").textContent = who; }
$("whoSwap").onclick = () => { who = MEAL_USERS[(MEAL_USERS.indexOf(who) + 1) % MEAL_USERS.length]; localStorage.setItem("meallog_who", who); paintWho(); };
paintWho();
if (!SR){ $("status").textContent = "Voice isn't supported here — type what you ate"; }
// Auto-listen on open (the one-tap widget flow): only once permission has been granted before,
// so a brand-new install still gets the friendly tap-first prompt instead of a surprise dialog.
else if (localStorage.getItem("meallog_mic_ok") === "1"){ setTimeout(listen, 250); }
window.addEventListener("pagehide", () => { try { rec && rec.abort(); } catch {} });

// Test hook (headless suites drive this; module globals are unreachable from evaluate).
window.__MLOG__ = {
  state: () => ({ phase, who, cloud: !!cloud }),
  listen, logText, undo: () => undoLast(),
  setWho: (w) => { who = w; paintWho(); },
  mealOfDay, dayKey,
};
</script>
</body>
</html>
