<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Institute Grounds</title>
<meta name="description" content="A scale 3D model of the Institute war-game grounds on Mars from Red Rising, built from the book's map and the descriptions in the text.">
<style>
  :root{
    --ink:#f4efe6; --ink-dim:#c9c1b4; --panel:rgba(22,20,18,.86); --line:rgba(255,255,255,.14);
    --gold:#d8b45a; --accent:#e0c27a;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;height:100%;overflow:hidden;background:#9db4c6;color:var(--ink);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;left:0;top:0;white-space:nowrap;pointer-events:auto;cursor:pointer;
    transform-origin:0 0;will-change:transform;user-select:none}
  .lbl.region{z-index:1} .lbl.minor{z-index:2} .lbl.house,.lbl.olympus{z-index:3}
  .lbl.house{background:rgba(20,18,16,.78);border:1px solid var(--line);border-radius:999px;
    padding:2px 9px 2px 6px;font-size:12px;font-weight:600;letter-spacing:.02em;display:flex;gap:6px;align-items:center}
  .lbl.house i{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
  .lbl.house:hover,.lbl.house.on{background:rgba(70,55,25,.92);border-color:var(--gold)}
  .lbl.minor{background:rgba(20,18,16,.6);border-radius:4px;padding:1px 6px;font-size:11px;color:var(--ink-dim)}
  .lbl.region{font-size:12px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 10px rgba(0,0,0,.45)}
  .lbl.region.water{color:#e3f1ff;font-style:italic;letter-spacing:.18em}
  .lbl.olympus{background:rgba(245,238,222,.92);color:#2b2620;border-radius:4px;padding:3px 9px;font-weight:700;
    letter-spacing:.14em;font-size:12px;text-transform:uppercase}
  .lbl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:10px;background:rgba(255,255,255,.55)}
  .lbl.region::after,.lbl.water::after{display:none}
  .lbl.stop{z-index:4;background:#c8402b;color:#fff;border:1.5px solid #fff;border-radius:999px;padding:0 6px;
    font-size:11px;font-weight:700;line-height:17px;font-variant-numeric:tabular-nums;box-shadow:0 1px 3px rgba(0,0,0,.5)}
  .lbl.stop::after{display:none}
  .lbl.stop.on{background:var(--gold);color:#221c10;border-color:#221c10}
  canvas#route{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  .tournav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
  .tournav .count{margin-left:auto;color:var(--ink-dim);font-size:12px;font-variant-numeric:tabular-nums}

  #hud{position:fixed;left:12px;top:12px;max-width:min(340px,calc(100vw - 24px));background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;backdrop-filter:blur(6px)}
  #hud h1{margin:0;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  #hud p.sub{margin:2px 0 8px;color:var(--ink-dim);font-size:12px}
  .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
  .row{margin-top:5px;gap:4px}
  .row .k{font-size:10px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.08em;min-width:54px}
  button.b{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);
    padding:3px 8px;border-radius:6px;font:inherit;font-size:12px;cursor:pointer}
  button.b:hover{border-color:var(--gold)}
  button.b[aria-pressed="true"]{background:var(--gold);color:#221c10;border-color:var(--gold);font-weight:600}

  #info{position:fixed;right:12px;top:12px;width:min(380px,calc(100vw - 24px));max-height:calc(100% - 24px);
    overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;backdrop-filter:blur(6px)}
  #info h2{margin:0 0 2px;font-size:17px;color:var(--accent)}
  #info .where{color:var(--ink-dim);font-size:12px;margin-bottom:8px}
  #info h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin:12px 0 4px}
  #info p,#info li{margin:0 0 6px}
  #info ul{padding-left:18px;margin:0}
  #info a{color:var(--accent)}
  #info .x{position:absolute;right:8px;top:6px}

  #scale{position:fixed;left:12px;bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:6px 10px 8px;font-size:12px}
  #scale .bar{height:6px;border:2px solid #fff;border-top:0;margin-top:3px}
  #compass{position:fixed;right:12px;bottom:14px;width:46px;height:46px;border-radius:50%;background:var(--panel);
    border:1px solid var(--line);display:grid;place-items:center}
  #compass svg{width:34px;height:34px}
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#1b1917;color:var(--ink);
    font-size:14px;letter-spacing:.2em;text-transform:uppercase;z-index:9}
  #hint{color:var(--ink-dim);font-size:11px;margin-top:8px}
  @media (max-width:640px){
    #hud{padding:8px 10px}
    #hud p.sub{display:none}
    #info{top:auto;bottom:70px;max-height:46%}
    .row .k{min-width:0;width:100%}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="route"></canvas>
<div id="labels"></div>

<div id="hud">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h1>The Institute</h1><button class="b" id="hudToggle" aria-expanded="true">Hide</button></div>
  <div id="hudBody">
  <p class="sub">The war-game grounds on Mars, from the map and text of <em>Red Rising</em>. Full scale: 54.5 by 39&nbsp;km.</p>
  <div class="row"><span class="k">View</span>
    <button class="b" data-view="overview">Overview</button>
    <button class="b" data-view="map">Map</button>
    <button class="b" data-view="olympus">Olympus</button>
    <button class="b" data-view="about">Sources</button>
  </div>
  <div class="row"><span class="k">Castles</span>
    <button class="b" data-ls="1" aria-pressed="true">True size</button>
    <button class="b" data-ls="5" aria-pressed="false">Enlarge x5</button>
  </div>
  <div class="row"><span class="k">Relief</span>
    <button class="b" data-ve="1" aria-pressed="true">x1</button>
    <button class="b" data-ve="2" aria-pressed="false">x2</button>
    <button class="b" data-ve="3" aria-pressed="false">x3</button>
  </div>
  <div class="row"><span class="k">Season</span>
    <button class="b" data-season="summer" aria-pressed="true">Summer</button>
    <button class="b" data-season="winter" aria-pressed="false">Winter</button>
    <button class="b" id="lblToggle" aria-pressed="true">Labels</button>
  </div>
  <div class="row"><span class="k">Darrow</span>
    <button class="b" id="routeToggle" aria-pressed="true">Path</button>
    <button class="b" id="tourStart">Follow his year</button>
  </div>
  <div id="hint">Drag to orbit, right-drag to pan, scroll to zoom. Click a name to fly there.</div>
  </div>
</div>

<aside id="info" hidden>
  <button class="b x" id="infoClose" aria-label="Close">Close</button>
  <div id="infoBody"></div>
</aside>

<div id="scale"><span id="scaleTxt">10 km</span><div class="bar" id="scaleBar" style="width:100px"></div></div>
<div id="compass" title="North"><svg viewBox="-20 -20 40 40" id="compassSvg"><g id="needle"><path d="M0,-15 L5,2 L0,-2 L-5,2Z" fill="#e05a3a"/><path d="M0,15 L5,2 L0,-2 L-5,2Z" fill="#ddd"/><text x="0" y="-16" font-size="7" fill="#fff" text-anchor="middle" dy="-1">N</text></g></svg></div>
<div id="loading">Raising the valley</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
"use strict";
/* =====================================================================================
   THE INSTITUTE GROUNDS — scale model.

   Everything is laid out in "map pixels": coordinates traced by hand off the map printed
   in Red Rising (868 x 633 px scan, inner frame x 12..850, y 12..612; north is up).
   One map pixel = M_PER_PX metres. World axes: +x east, +z south, +y up, metres.
   ===================================================================================== */
const M_PER_PX = 65;
const CX = 430, CY = 312;                  // map pixel at world origin
const FRAME = { x0: 12, x1: 850, y0: 12, y1: 612 };
const toW = (px, py) => ({ x: (px - CX) * M_PER_PX, z: (py - CY) * M_PER_PX });
const toPx = (x, z) => ({ px: x / M_PER_PX + CX, py: z / M_PER_PX + CY });

/* ---------------- traced geography (map pixels) ---------------- */
const MOUNTAINS = [[-200,-200],[198,-200],[200,40],[186,90],[172,140],[186,190],[206,232],[178,262],[196,302],[206,352],[192,400],[176,446],[150,476],[-200,476]];
const HIGHLANDS = [[448,-200],[702,-200],[722,60],[702,130],[704,200],[690,252],[620,262],[560,262],[518,250],[462,222],[444,160],[452,80]];
const POSTERN   = [[778,-200],[1100,-200],[1100,262],[818,244],[806,182],[784,92]];
const NORTHWOODS= [[226,-30],[506,-30],[500,46],[442,82],[356,88],[262,62]];
const GREATWOODS= [[540,252],[650,232],[760,232],[880,232],[880,505],[700,505],[625,492],[560,480],[505,472],[472,442],[452,402],[472,370],[520,340],[540,300]];
const SEA       = [[140,474],[232,468],[290,478],[322,487],[380,491],[432,490],[470,482],[505,476],[546,490],[590,502],[620,515],[640,538],[650,560],
                   [626,564],[600,553],[575,558],[540,574],[500,594],[466,640],[120,640],[138,560],[146,500]];
// Rivers: polylines flowing downstream. w = width in metres (assumed; the map draws them far wider than life).
const RIVERS = [
  { id:"argos",  name:"Argos River", w:150, depth:7, pts:[[352,24],[352,60],[348,120],[338,172],[318,205],[306,250],[304,300],[322,345],[322,400],[310,445],[305,482]] },
  { id:"westtrib", name:"Western tributary", w:80, depth:4, pts:[[206,24],[212,40],[235,90],[270,140],[298,180],[318,205]] },
  { id:"metas",  name:"River Metas", w:55, depth:3, pts:[[548,24],[545,50],[538,105],[525,152]] },
  { id:"furor",  name:"River Furor", w:55, depth:3, pts:[[702,142],[650,138],[612,136],[570,146],[525,152]] },
  { id:"easttrib", name:"Highlands tributary", w:85, depth:4, pts:[[525,152],[480,158],[430,162],[385,164],[338,172]] },
  { id:"venusbrook", name:"Southern brook", w:40, depth:3, pts:[[598,606],[596,580],[602,557]] },
];

/* Twelve houses. Seven are labelled on the book's map. Five markers are unlabelled; four
   are assigned from the text (see notes) and Venus takes the one left over. */
const HOUSES = [
  { id:"mars",    name:"House Mars",    px:597, py:115, col:"#b8382c", pad:140,
    where:"Northern Highlands",
    book:"Castle Mars stands in the Highlands in the north of the grounds. The house also holds two outlying towers, Phobos and Deimos, on the western side of the Highlands, with the meeting of the Furor and the Metas between them (Red Rising ch. 21). Early in the year its warbands raid Ceres daily; later it is besieged by Jupiter, Pluto and Apollo.",
    assume:"Square curtain wall about 170 by 140 m, 16 m walls, a 40 m keep with a great hall, set on a shelf of the Highlands just north of the Furor." },
  { id:"minerva", name:"House Minerva", px:763, py:165, col:"#7d5ab5", pad:130,
    where:"Northeast, at the western edge of the Postern Hills",
    book:"On the plains at the western foot of the Postern Hills, east of the Highlands and north of Diana. Olive trees and gardens wind between sandstone columns on the ground level; the third level holds the command room with the map, the war table and a statue of Minerva. It has its own stable and a hidden back gate. Mars and Diana take it with soldiers hidden inside dead horses.",
    assume:"Three stepped sandstone tiers, each 12 m tall, inside a low octagonal wall." },
  { id:"ceres",   name:"House Ceres",   px:375, py:150, col:"#c99a2e", pad:160,
    where:"Plains beside the Argos",
    book:"Out in the open beside the Argos, where the tributary from the Highlands joins it. Orchards, ovens and horses let it shrug off sieges; it holds out for about six months until Darrow's army takes it.",
    assume:"A low twelve-sided wall with granaries and ovens inside, orchards in rows outside." },
  { id:"jupiter", name:"House Jupiter", px:115, py:60,  col:"#4a7fb5", pad:170,
    where:"Northwest mountains",
    book:"In the mountains of the northwest corner, in low passes just south of the northernmost peaks. Jupiter becomes a northern superpower, takes Juno and Vulcan, and wars on Mars. Pluto seizes the empty castle to ambush Darrow.",
    assume:"The largest fortress on the grounds, 220 by 160 m in grey granite, filling the pass." },
  { id:"juno",    name:"House Juno",    px:268, py:205, col:"#2f8f8a", pad:120,
    where:"West bank of the Argos",
    book:"On the west bank of the Argos where the western tributary joins it, west of Ceres and Mars. Deep cellars full of salted beef, cheese, fish and smoked horsemeat. Conquered by Jupiter; Darrow's army later raids it for food.",
    assume:"A square slate fortress with a squat keep." },
  { id:"diana",   name:"House Diana",   px:727, py:275, col:"#4f8a3b", pad:0,
    where:"Northern Greatwoods",
    book:"Hidden in the northern Greatwoods, southeast of the Highlands and southwest of Minerva. It is built up in the branches of the godTrees rather than on the ground. Bloodback bears, boar and deer roam the woods around it.",
    assume:"Platforms 60 to 75 m up in six 130 m godTrees, linked by rope bridges." },
  { id:"apollo",  name:"House Apollo",  px:797, py:445, col:"#e2b93b", pad:140,
    where:"Southeast edge of the Greatwoods",
    book:"Near the southeastern edge of the Greatwoods, north of the South Sea. Tall, white and ornate: six grand spiralling towers around a round cobblestone plaza. The Howlers get in through its latrine holes and open the gates.",
    assume:"Towers 80 m tall around a 120 m plaza, joined by a white curtain wall." },
  { id:"pluto",   name:"House Pluto",   px:122, py:235, col:"#5b5566", pad:0,
    where:"Western mountains (underground)",
    book:"A fortress dug into the low mountains in the middle of the western range, near Vulcan. Colder, harder country; its students dress warmer and ride smaller horses. When Vulcan attacks, the Jackal collapses the tunnels and the house is sealed underground for nearly a month.",
    assume:"Map marker: the unlabelled castle in the mountains. Shown as tunnel mouths and vents in the mountainside; the fortress itself is below ground." },
  { id:"vulcan",  name:"House Vulcan",  px:290, py:315, col:"#d0652a", pad:130,
    where:"West shore of the Argos",
    book:"In the foothills on the western shore of the Argos, near Pluto, with forges for making weapons. In an earlier year Vulcan dammed the Argos between its own castle and the one opposite, then let the water go on an attacking army.",
    assume:"Map marker: the unlabelled castle west of the Argos. Black stone with a forge hall and three smoking chimneys." },
  { id:"mercury", name:"House Mercury", px:365, py:360, col:"#9aa7b3", pad:120,
    where:"East shore of the Argos",
    book:"Somewhere in the south; the house is driven out of its castle and wanders as a band of vagabonds until Tactus hunts it down.",
    assume:"Map marker: the unlabelled castle across the Argos from Vulcan, as the fan wiki reads it. Pale stone, slender towers." },
  { id:"bacchus", name:"House Bacchus", px:490, py:450, col:"#8a2f5a", pad:130,
    where:"Southwest edge of the Greatwoods, on the South Sea",
    book:"Has cellars for grape juice, which Darrow's army drinks on the march to Jupiter. Conquered early; Apollo holds many of its students as slaves, which puts it near Apollo.",
    assume:"Map marker: the unlabelled castle on the north shore of the South Sea, as the fan wiki reads it. Ochre walls with vineyards around them." },
  { id:"venus",   name:"House Venus",   px:597, py:590, col:"#d7869a", pad:120,
    where:"South shore of the South Sea",
    book:"In the south. Holds out for six months, losing students to Apollo, until Tactus takes it after Olympus falls.",
    assume:"The map shows exactly twelve castle markers. With the other eleven placed, this one, on the far shore of the South Sea, is the only one left, so it is Venus here. The fan wiki guesses the western shore instead, under the map's inset, which would make thirteen. Rose marble with a domed hall." },
];
const TOWERS = [
  { id:"phobos", name:"Phobos", px:495, py:100, book:"Outpost tower of House Mars on the western side of the Highlands, north of where the Furor and Metas meet (ch. 21).", assume:"A 38 m round tower inside a small walled yard." },
  { id:"deimos", name:"Deimos", px:535, py:195, book:"Outpost tower of House Mars on the western side of the Highlands, south of where the Furor and Metas meet (ch. 21).", assume:"A 38 m round tower inside a small walled yard." },
];
const OLYMPUS = { id:"olympus", name:"Olympus", px:470, py:290, float:2000,
  book:"An artificial mountain floating two kilometres above the grounds. A bone-pale marble citadel sits at the top of its incline, and the Proctors watch the year's game from it (Red Rising ch. 42). Darrow's army storms it to free Mustang.",
  assume:"The book does not fix where it hangs; it is placed here over the open plains between the Argos and the Greatwoods. 2.2 km across, 1.5 km from summit to the tip of its underside." };
const REGIONS = [
  { id:"mountains",  name:"Mountains",     px:95,  py:285, book:"A range along the whole western edge. Jupiter holds the northern passes; Pluto lies under the low mountains in the middle; Vulcan sits in the southern foothills.", assume:"Peaks to about 2.8 km above the plains, snow above about 2.2 km. The map's inset hides the southwest corner, so the range is assumed to run down to the South Sea." },
  { id:"northwoods", name:"North Woods",   px:400, py:45,  book:"Woods at the head of the Argos, between the western tributary and the Highlands. Mustang nurses Darrow back to health here.", assume:"Ordinary conifers, 20 to 30 m." },
  { id:"highlands",  name:"Highlands",     px:640, py:42,  book:"Hill country in the north holding Castle Mars and the towers Phobos and Deimos. The Furor runs west and the Metas south through it.", assume:"Ridges 300 to 900 m above the plains." },
  { id:"postern",    name:"Postern Hills", px:815, py:90, book:"Hills along the northeastern edge, with Minerva on the plains at their western foot.", assume:"Rolling hills up to about 350 m." },
  { id:"greatwoods", name:"Greatwoods",    px:690, py:370, book:"A large forest filling the east of the grounds, split from the Argos by open plains. Its godTrees grow as tall as buildings, block out the sun, and spread their roots like tentacles (ch. 30).", assume:"godTrees 70 to 110 m tall. At this scale every tree drawn stands for a stand of several." },
  { id:"argos",      name:"Argos River",   px:296, py:268, water:true, book:"Runs north to south down the middle of the grounds and ends in the South Sea. Tributaries join it from the western mountains and from the Highlands.", assume:"150 m wide. The map draws every river far wider than life." },
  { id:"southsea",   name:"South Sea",     px:380, py:548, water:true, book:"A large body of water across the south of the grounds, where the Argos ends.", assume:"Shoreline traced from the map; the western shore under the inset is a guess." },
  { id:"furor",      name:"Furor",         px:640, py:152, water:true, small:true, book:"Flows west through the Highlands to meet the Metas between Phobos and Deimos (ch. 21).", assume:"55 m wide." },
  { id:"metas",      name:"Metas",         px:556, py:70,  water:true, small:true, book:"Flows south through the Highlands to meet the Furor between Phobos and Deimos (ch. 21).", assume:"55 m wide." },
];

/* Darrow's course through the war game, in book order (Red Rising ch. 19 to 44).
   at: the landmark a stop sits on. via: map points passed through on the way from the previous
   stop. air: reached on gravBoots. Where the book does not place an event, `assume` says so. */
const DARROW = [
 { at:"mars", ch:"19", when:"The night of the Passage", title:"The Passage", text:"Hooded and flown out from the Institute's main building, he wakes in a stone room beneath Castle Mars with Julian au Bellona. Only one of them may leave. He kills Julian and climbs up into the castle." },
 { px:440, py:140, via:[[560,128],[500,135]], ch:"21", when:"Day 1", title:"Ambush on the plains", text:"On the orientation tour of Mars territory, Ceres students spring an ambush on the plains. Darrow and Cassius beat it off and win a feast for the house.", assume:"The book puts the fight on the plains near Ceres. The exact spot is a guess." },
 { at:"mars", via:[[500,135],[560,128]], ch:"23", when:"Days 2 to 6", title:"The house splits", text:"The war game begins. House Mars breaks into factions under Darrow and Cassius, Titus, and Antonia. Darrow's band sleeps in the gatehouse." },
 { at:"phobos", via:[[550,104]], ch:"23", when:"Day 6", title:"Flight to Phobos", text:"A parley with Vixus turns into an ambush by Titus. Darrow fights his way out and leads his band to Phobos Tower, which becomes their fort." },
 { at:"mars", via:[[550,104]], ch:"25", when:"Day 30", title:"Watching the gatehouse", text:"He and Cassius creep up to the gatehouse and hear what Titus is doing to the captured Ceres girls. On the way back Fitchner drops down on gravBoots, and Darrow starts planning Titus's fall." },
 { at:"phobos", via:[[550,104]], ch:"26", when:"Day 31", title:"Quinn is taken", text:"Quinn goes to Deimos to carry his apology to Antonia and is captured by Titus's band. Cassius tries to free her and is beaten." },
 { px:690, py:190, via:[[540,128],[600,150],[650,168]], ch:"26", when:"Day 32", title:"Mustang and the lake", text:"Darrow and Cassius ride east and try to take a Minervan girl's horse. He names her Mustang. Her housemates chase them into a lake, while Roque lights the signal fire that draws Minerva onto Castle Mars.", assume:"The map draws no lake. It is placed on the plains west of Minerva." },
 { at:"minerva", via:[[730,182]], ch:"27", when:"Day 32", title:"The Minervan standard", text:"Sevro pulls them out and leads them to Castle Minerva, emptied by its own raid on Mars. They steal the standard and carry off the cook, June." },
 { at:"mars", via:[[700,140],[650,126]], ch:"27 to 29", when:"Days 32 to 34", title:"Titus falls", text:"With Antonia's help they beat the Minervan warband and trade the standard back for Castle Mars. Darrow learns that Titus is a Red in disguise and sentences him; Cassius carries it out. Darrow asks for horses as his first bounty." },
 { at:"diana", via:[[640,182],[684,238]], ch:"30", when:"About day 62", title:"Into the Greatwoods", text:"A month later he and Sevro go into the Greatwoods to win an alliance with House Diana. Sevro lets slip that he knows who killed Julian." },

/* ---------------- noise ---------------- */
function hash(ix, iy){
  let h = (Math.imul(ix|0, 374761393) + Math.imul(iy|0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y){
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const sx = fx*fx*(3-2*fx), sy = fy*fy*(3-2*fy);
  const a = hash(ix,iy), b = hash(ix+1,iy), c = hash(ix,iy+1), d = hash(ix+1,iy+1);
  return a + (b-a)*sx + (c-a)*sy + (a-b-c+d)*sx*sy;
}
function fbm(x, y, o){ let s=0, a=.5, f=1, n=0; for (let i=0;i<o;i++){ s+=a*vnoise(x*f+i*31.7,y*f-i*17.3); n+=a; a*=.5; f*=2.03; } return s/n; }
function ridged(x, y, o){ let s=0, a=.5, f=1, n=0; for (let i=0;i<o;i++){ let v = 1-Math.abs(vnoise(x*f+i*17.3,y*f-i*9.1)*2-1); v*=v; s+=a*v; n+=a; a*=.5; f*=2.1; } return s/n; }
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
function smooth(e0, e1, x){ const t = clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); }

/* signed distance to polygon (negative inside), map px */
function sdPoly(px, py, v){
  let d = (px-v[0][0])**2 + (py-v[0][1])**2, s = 1;
  for (let i=0, j=v.length-1; i<v.length; j=i, i++){
    const ex = v[j][0]-v[i][0], ey = v[j][1]-v[i][1], wx = px-v[i][0], wy = py-v[i][1];
    const t = clamp((wx*ex+wy*ey)/(ex*ex+ey*ey),0,1);
    const bx = wx-ex*t, by = wy-ey*t; const dd = bx*bx+by*by; if (dd<d) d = dd;
    const c1 = py>=v[i][1], c2 = py<v[j][1], c3 = ex*wy>ey*wx;
    if ((c1&&c2&&c3)||(!c1&&!c2&&!c3)) s = -s;
  }
  return s*Math.sqrt(d);
}

/* ---------------- terrain height ----------------
   baseHeight: everything except rivers and castle pads. Heights in metres above sea level. */
function baseHeight(px, py, out){
  // plains: a gentle fall from north to south, toward the sea the Argos runs into
  let h = 22 + clamp((470-py)/460,0,1)*150 + (fbm(px/60, py/60, 4)-.5)*40;
  const dm = sdPoly(px,py,MOUNTAINS), mm = smooth(18,-30,dm);
  if (mm > 0){
    let peak = 450 + ridged(px/42, py/42, 5)*2350;
    peak *= lerp(1, .5, smooth(330, 470, py));                 // the range lowers toward the sea
    peak *= 1 - .45*Math.exp(-(((px-122)**2+(py-235)**2)/(2*30*30)));  // Pluto's "low mountains"
    h += mm*peak;
  }
  const dh = sdPoly(px,py,HIGHLANDS), mh = smooth(14,-22,dh);
  if (mh > 0) h += mh*(140 + ridged(px/28+50, py/28, 4)*700);
  const dp = sdPoly(px,py,POSTERN), mp = smooth(16,-28,dp);
  if (mp > 0) h += mp*(60 + fbm(px/24, py/24, 4)*300);
  // sea and shore
  const ds = sdPoly(px,py,SEA);
  if (ds < 14){
    if (ds > 0) h = lerp(3 + ds*.6, h, smooth(0, 14, ds));
    else h = lerp(3, -42 - fbm(px/30,py/30,3)*25, smooth(0, -22, ds));
  }
  // the canyon: the grounds sit in a terraformed arm of the Valles Marineris
  const dOut = Math.max(FRAME.x0-px, px-FRAME.x1, FRAME.y0-py, py-FRAME.y1);
  if (dOut > -12){
    // a steep cliff about 1.5 km deep into the margin, then the high desert plateau
    const edge = dOut + (fbm(px/9, py/9, 3)-.5)*16;
    const rim = 3500 + (fbm(px/40, py/40, 4)-.5)*500 + ridged(px/14, py/14, 3)*120*smooth(30, 60, dOut);
    const wall = (Math.pow(smooth(-4, 22, edge), 1.35)*.85 + smooth(14, 40, edge)*.15)*rim;
    if (wall > h) h = lerp(h, wall, smooth(-12, 4, dOut));
  }
  if (out){ out.mm = mm; out.mh = mh; out.mp = mp; out.ds = ds; out.dOut = dOut;
    out.dg = sdPoly(px,py,GREATWOODS); out.dn = sdPoly(px,py,NORTHWOODS); }
  return h;
}

/* river water levels: sample each river downstream, level never rises */
const RIVER_STEP = 1;   // px
for (const r of RIVERS){
  const s = [];
  for (let k=0; k<r.pts.length-1; k++){
    const [ax,ay] = r.pts[k], [bx,by] = r.pts[k+1];
    const n = Math.max(1, Math.ceil(Math.hypot(bx-ax, by-ay)/RIVER_STEP));
    for (let i=0; i<n; i++) s.push([ax+(bx-ax)*i/n, ay+(by-ay)*i/n]);
  }
  s.push(r.pts[r.pts.length-1].slice());
  r.samples = s;
}
function levelAtPolyline(r, px, py){   // nearest sample
  let best=Infinity, bi=0;
  for (let i=0;i<r.samples.length;i++){ const d=(r.samples[i][0]-px)**2+(r.samples[i][1]-py)**2; if (d<best){best=d;bi=i;} }
  return r.levels[bi];
}
function computeLevels(r, floorAtEnd){
  let prev = Infinity; r.levels = [];
  for (const [px,py] of r.samples){ const v = Math.min(prev, baseHeight(px,py)-2.5); r.levels.push(v); prev = v; }
  r.levels[r.levels.length-1] = Math.min(r.levels[r.levels.length-1], r.levels[r.levels.length-2]);
  if (floorAtEnd != null) for (let i=0;i<r.levels.length;i++) r.levels[i] = Math.max(r.levels[i], floorAtEnd);
}
const RIV = Object.fromEntries(RIVERS.map(r => [r.id, r]));
computeLevels(RIV.argos);
RIV.argos.levels = RIV.argos.levels.map(v => Math.max(v, .4));      // meets the sea at sea level
computeLevels(RIV.easttrib, levelAtPolyline(RIV.argos, 338, 172));
computeLevels(RIV.westtrib, levelAtPolyline(RIV.argos, 318, 205));
computeLevels(RIV.metas,    levelAtPolyline(RIV.easttrib, 525, 152));
computeLevels(RIV.furor,    levelAtPolyline(RIV.easttrib, 525, 152));
computeLevels(RIV.venusbrook, .4);

/* nearest river point: distance in metres + water level there */
function nearestRiver(px, py){
  let best = { d: Infinity, level: 0, r: null };
  for (const r of RIVERS){
    const p = r.pts;
    for (let k=0;k<p.length-1;k++){
      const ax=p[k][0], ay=p[k][1], ex=p[k+1][0]-ax, ey=p[k+1][1]-ay;
      const t = clamp(((px-ax)*ex+(py-ay)*ey)/(ex*ex+ey*ey),0,1);
      const d = Math.hypot(px-ax-ex*t, py-ay-ey*t)*M_PER_PX;
      if (d < best.d){ best.d = d; best.r = r; best.qx = ax+ex*t; best.qy = ay+ey*t; }
    }
  }
  if (best.r && best.d < 600) best.level = levelAtPolyline(best.r, best.qx, best.qy);
  return best;
}

function carve(h, px, py){
  const n = nearestRiver(px, py);
  if (!n.r || n.d > n.r.w/2 + 260) return h;
  const half = n.r.w/2;
  const bed = n.level - n.r.depth;
  // banks: pulled down to just above the water within ~250 m, to the bed inside the channel
  const bank = Math.min(h, n.level + 1.2 + Math.max(0, n.d-half)*0.06);
  let out = lerp(h, bank, smooth(half+260, half+20, n.d));
  out = lerp(out, Math.min(out, bed), smooth(half*1.05, half*.55, n.d));
  return out;
}

/* castle pads are flattened at the height of the carved terrain at their centre */
const PADS = [];
function heightAt(px, py, out){
  let h = carve(baseHeight(px, py, out), px, py);
  for (const p of PADS){
    const d = Math.hypot(px-p.px, py-p.py)*M_PER_PX;
    if (d < p.r*1.9) h = lerp(h, p.h, smooth(p.r*1.9, p.r*1.05, d));
  }
  return h;
}
for (const H of HOUSES) if (H.pad) PADS.push({ px:H.px, py:H.py, r:H.pad, h: carve(baseHeight(H.px,H.py),H.px,H.py) });
// a pad must be wider than the 150 m terrain grid or the drawn surface never shows it (towers floated 25 m at r=40)
for (const T of TOWERS) PADS.push({ px:T.px, py:T.py, r:120, h: carve(baseHeight(T.px,T.py),T.px,T.py) });

/* ---------------- terrain mesh ---------------- */
const MARGIN_PX = 190;
const EXT = { x0: FRAME.x0-MARGIN_PX, x1: FRAME.x1+MARGIN_PX, y0: FRAME.y0-MARGIN_PX, y1: FRAME.y1+MARGIN_PX };
const GRID_M = 150;
const terrainW = (EXT.x1-EXT.x0)*M_PER_PX, terrainD = (EXT.y1-EXT.y0)*M_PER_PX;
const NX = Math.round(terrainW/GRID_M), NZ = Math.round(terrainD/GRID_M);
let terrain, terrainGeo, colorsSummer, colorsWinter, heights;

function buildTerrain(){
  const geo = new THREE.PlaneGeometry(terrainW, terrainD, NX, NZ);
  geo.rotateX(-Math.PI/2);
  const c0 = toW((EXT.x0+EXT.x1)/2, (EXT.y0+EXT.y1)/2);
  geo.translate(c0.x, 0, c0.z);
  const pos = geo.attributes.position, n = pos.count;
  heights = new Float32Array(n);
  const masks = new Array(n);
  const o = {};
  for (let i=0;i<n;i++){
    const { px, py } = toPx(pos.getX(i), pos.getZ(i));
    const h = heightAt(px, py, o);
    heights[i] = h; pos.setY(i, h);
    masks[i] = { mm:o.mm, mh:o.mh, mp:o.mp, ds:o.ds, dOut:o.dOut, dg:o.dg, dn:o.dn, px, py };
  }
  geo.computeVertexNormals();
  const nrm = geo.attributes.normal;
  colorsSummer = new Float32Array(n*3); colorsWinter = new Float32Array(n*3);
  const C = (h) => new THREE.Color(h);
  const P = {
    grass1:C("#8f9c55"), grass2:C("#b0a965"), wood:C("#3f5a2d"), nwood:C("#475c36"), heather:C("#7e7650"),
    hill:C("#93995c"), rock:C("#8a7f72"), rockDark:C("#655b52"), snow:C("#f1f1ee"), sand:C("#cdb98b"),
    seabed:C("#5d7166"), wallA:C("#a85b38"), wallB:C("#8a462c"), wallC:C("#c4804f"), rim:C("#b58258"),
    wsnow:C("#e9edf0"), wsnowShade:C("#c9d1d8"), wwood:C("#3c4a3c"),
  };
  const tmp = new THREE.Color(), tmp2 = new THREE.Color();
  for (let i=0;i<n;i++){
    const m = masks[i], h = heights[i], slope = 1 - nrm.getY(i);
    const nz = fbm(m.px/9, m.py/9, 3);
    // summer
    tmp.copy(P.grass1).lerp(P.grass2, clamp(nz*1.6-.4,0,1));
    tmp.lerp(P.hill, m.mp*.8);
    tmp.lerp(P.heather, m.mh*.85);
    tmp.lerp(P.wood, smooth(3,-4,m.dg));
    tmp.lerp(P.nwood, smooth(3,-4,m.dn));
    tmp.lerp(P.rock, clamp(m.mm*1.1 - .1 + (h>900? .2:0),0,1));
    tmp.lerp(P.rockDark, smooth(.18,.45,slope)*.8);
    if (m.ds < 5 && h < 7) tmp.lerp(P.sand, smooth(7,2,h));
    if (h < 0) tmp.copy(P.seabed);
    const snowLine = 2150 + (nz-.5)*500;
    if (h > snowLine) tmp.lerp(P.snow, smooth(snowLine, snowLine+250, h)*(1-smooth(.35,.6,slope)*.6));
    if (m.dOut > -4){ // canyon wall strata
      const band = .5 + .5*Math.sin(h/85 + nz*2.5);
      tmp2.copy(P.wallA).lerp(band>.5? P.wallC : P.wallB, Math.abs(band-.5)*1.6);
      if (h > 3400) tmp2.lerp(P.rim, smooth(3400,3700,h));
      tmp.lerp(tmp2, smooth(-4, 8, m.dOut));
    }
    colorsSummer[i*3]=tmp.r; colorsSummer[i*3+1]=tmp.g; colorsSummer[i*3+2]=tmp.b;
    // winter: snow over everything but steep rock, forests and water
    const w = tmp2.copy(tmp);
    if (h >= 0 && m.dOut < 2){          // the valley's weather stops at the canyon walls
      const forest = Math.max(smooth(3,-4,m.dg), smooth(3,-4,m.dn));
      w.lerp(P.wsnow, (1-smooth(.3,.55,slope))*.92);
      w.lerp(P.wsnowShade, (nz-.3)*.4);
      w.lerp(P.wwood, forest*.55);
    }
    colorsWinter[i*3]=w.r; colorsWinter[i*3+1]=w.g; colorsWinter[i*3+2]=w.b;
  }
  geo.setAttribute("color", new THREE.BufferAttribute(colorsSummer.slice(), 3));
  const mat = new THREE.MeshLambertMaterial({ vertexColors:true });
  terrain = new THREE.Mesh(geo, mat);
  terrainGeo = geo;
  world.add(terrain);
}

/* bilinear sample of the built terrain (what is actually drawn), in metres */
function sampleTerrain(x, z){
  const c0 = toW(EXT.x0, EXT.y0);
  const gx = (x - c0.x)/terrainW*NX, gz = (z - c0.z)/terrainD*NZ;
  const ix = clamp(Math.floor(gx),0,NX-1), iz = clamp(Math.floor(gz),0,NZ-1), fx = gx-ix, fz = gz-iz;
  const at = (a,b) => heights[b*(NX+1)+a];
  return lerp(lerp(at(ix,iz),at(ix+1,iz),fx), lerp(at(ix,iz+1),at(ix+1,iz+1),fx), fz);
}

/* ---------------- water ---------------- */
function buildWater(){
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(terrainW, terrainD).rotateX(-Math.PI/2),
    new THREE.MeshPhongMaterial({ color:0x3e6d86, shininess:60, specular:0x6688aa }));
  const c0 = toW((EXT.x0+EXT.x1)/2, (EXT.y0+EXT.y1)/2);
  sea.position.set(c0.x, 0, c0.z);
  world.add(sea);
  const rmat = new THREE.MeshPhongMaterial({ color:0x4a7c96, shininess:30, specular:0x223344, side:THREE.DoubleSide,
    polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2 });
  for (const r of RIVERS){
    const s = r.samples, pos = [], idx = [];
    for (let i=0;i<s.length;i++){
      const a = s[Math.max(0,i-1)], b = s[Math.min(s.length-1,i+1)];
      let dx = b[0]-a[0], dy = b[1]-a[1]; const L = Math.hypot(dx,dy)||1; dx/=L; dy/=L;
      const half = r.w/2/M_PER_PX;
      const w = toW(s[i][0], s[i][1]), y = r.levels[i] + .3;
      pos.push(w.x - dy*half*M_PER_PX, y, w.z + dx*half*M_PER_PX, w.x + dy*half*M_PER_PX, y, w.z - dx*half*M_PER_PX);
      if (i>0){ const k = i*2; idx.push(k-2,k-1,k, k-1,k+1,k); }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx); g.computeVertexNormals();
    const m = new THREE.Mesh(g, rmat); m.userData.veScale = true;
    world.add(m);
  }
}

/* ---------------- trees ---------------- */
let treeSets = [];
function scatter(poly, count, seed, fn){
  let xs = poly.map(p=>p[0]), ys = poly.map(p=>p[1]);
  const x0 = Math.max(Math.min(...xs), FRAME.x0+2), x1 = Math.min(Math.max(...xs), FRAME.x1-2);
  const y0 = Math.max(Math.min(...ys), FRAME.y0+2), y1 = Math.min(Math.max(...ys), FRAME.y1-2);
  let s = seed, placed = 0, tries = 0;
  const rnd = () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296;
  while (placed < count && tries < count*8){
    tries++;
    const px = x0 + rnd()*(x1-x0), py = y0 + rnd()*(y1-y0);
    const d = sdPoly(px, py, poly);
    if (d > 0) continue;
    if (d > -6 && rnd() < .6) continue;             // thin out at the edges
    if (nearestRiver(px,py).d < 160) continue;
    if (sdPoly(px,py,SEA) < 3) continue;
    let nearCastle = false;

function buildTrees(){

  scatter(NORTHWOODS, 7000, 11, (px,py,rnd) => pines.push({ px, py, h: 20+rnd()*12, r: 6+rnd()*3, c: rnd() }));

function placeTrees(){
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), p = new THREE.Vector3();
  const [g, pn] = treeSets, ve = state.ve;
  g.list.forEach((T,i) => {

    m4.compose(p.set(w.x,y-2,w.z), q, sc.set(T.r*.12, T.h*.7, T.r*.12)); g.trunk.setMatrixAt(i, m4);

  pn.list.forEach((T,i) => {

    m4.compose(p.set(w.x,T.y*ve-1,w.z), q, sc.set(T.r, T.h, T.r)); pn.cone.setMatrixAt(i, m4);

const MAT = {};
function mat(hex, extra){ const k = hex + (extra? JSON.stringify(extra):""); return MAT[k] || (MAT[k] = new THREE.MeshLambertMaterial(Object.assign({ color:hex }, extra||{}))); }
function Kit(){
  const parts = new Map();
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), p = new THREE.Vector3(), s = new THREE.Vector3();
  const add = (geo, hex, x,y,z, ry=0, sx=1,sy=1,sz=1, rx=0, rz=0) => {
    m4.compose(p.set(x,y,z), q.setFromEuler(e.set(rx,ry,rz)), s.set(sx,sy,sz));
    let g = geo.index ? geo.toNonIndexed() : geo.clone();
    g.applyMatrix4(m4);
    for (const k of Object.keys(g.attributes)) if (!["position","normal","uv"].includes(k)) g.deleteAttribute(k);
    if (!parts.has(hex)) parts.set(hex, []); parts.get(hex).push(g);
  };
  const K = {
    box(w,h,d,hex,x,y,z,ry=0){ add(new THREE.BoxGeometry(w,h,d), hex, x, y+h/2, z, ry); },
    cyl(r,h,hex,x,y,z,seg=14,rt){ add(new THREE.CylinderGeometry(rt==null?r:rt, r, h, seg), hex, x, y+h/2, z); },
    cone(r,h,hex,x,y,z,seg=14){ add(new THREE.ConeGeometry(r,h,seg), hex, x, y+h/2, z); },
    dome(r,hex,x,y,z){ add(new THREE.SphereGeometry(r,16,8,0,Math.PI*2,0,Math.PI/2), hex, x, y, z); },
    ball(r,hex,x,y,z,sy=1){ add(new THREE.IcosahedronGeometry(r,1), hex, x, y, z, 0, 1, sy, 1); },
    geo(g,hex,x,y,z,ry=0){ add(g,hex,x,y,z,ry); },
    // straight wall with merlons
    wall(x1,z1,x2,z2,h,t,hex,merlon=true){
      const L = Math.hypot(x2-x1,z2-z1), ry = -Math.atan2(z2-z1, x2-x1);
      add(new THREE.BoxGeometry(L,h,t), hex, (x1+x2)/2, h/2, (z1+z2)/2, ry);
      if (!merlon) return;
      const n = Math.floor(L/5);
      for (let i=0;i<n;i++){
        const f = (i+.5)/n, x = lerp(x1,x2,f), z = lerp(z1,z2,f);

    },
    tower(x,z,r,h,hex,roof){
      K.cyl(r,h,hex,x,0,z,16);
      if (roof) K.cone(r*1.2, r*1.6, roof, x, h, z, 16);
      else for (let i=0;i<10;i++){ const a=i/10*Math.PI*2; add(new THREE.BoxGeometry(2.4,2.4,1.6), hex, x+Math.cos(a)*(r-.7), h+1.2, z+Math.sin(a)*(r-.7), -a); }
    },
    ring(pts,h,t,hex,towerR,towerH,roof){
      for (let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; K.wall(a[0],a[1],b[0],b[1],h,t,hex); }
      if (towerR) for (const a of pts) K.tower(a[0],a[1],towerR,towerH,hex,roof);
    },
    flag(x,y,z,hex){ K.cyl(.35,12,"#3a2f25",x,y,z,5); K.box(.4,5,9,hex,x,y+6.5,z+4.6); },
    build(){
      const g = new THREE.Group();
      for (const [hex, list] of parts){
        const merged = THREE.BufferGeometryUtils.mergeBufferGeometries(list);

        g.add(new THREE.Mesh(merged, emissive ? new THREE.MeshBasicMaterial({ color:hex }) : mat(hex)));

  const cit = K.build(); cit.scale.setScalar(1.6); cit.position.set(0, top*(1-1.6), cz*(1-1.6)); g.add(cit);
  g.position.set(w.x, ground + OLYMPUS.float, w.z);
  g.userData = { ground, kind:"olympus" };
  world.add(g);
  landmarks.olympus = { group:g, x:w.x, z:w.z, y:ground+OLYMPUS.float, kind:"olympus", def:OLYMPUS, ground, topLocal: top };
}

/* ---------------- smoke at Vulcan ---------------- */
const puffs = [];
function buildSmoke(){
  const L = landmarks.vulcan, gm = new THREE.SphereGeometry(1, 8, 6);
  for (let i=0;i<36;i++){
    const m = new THREE.Mesh(gm, new THREE.MeshLambertMaterial({ color:0x6f6a66, transparent:true, opacity:.5, depthWrite:false }));
    m.userData = { cx: [-26,-6,14][i%3], t: i/36 };
    L.group.add(m); puffs.push(m);
  }
}
function animSmoke(dt){
  for (const m of puffs){
    m.userData.t = (m.userData.t + dt*.08) % 1;
    const t = m.userData.t;
    m.position.set(m.userData.cx + t*40, 45 + t*120, 4 + t*12);
    m.scale.setScalar(4 + t*18);
    m.material.opacity = .55*(1-t);
  }
}

const v3 = new THREE.Vector3();

/* ---------------- camera moves ---------------- */
let fly = null;
function groundUnder(p){ return Math.max(0, sampleTerrain(p.x, p.z))*state.ve; }
function flyTo(target, camPos, ms=1400){
  fly = { t0: performance.now(), ms, fromP: camera.position.clone(), fromT: controls.target.clone(), toP: camPos, toT: target };
}
function flyToLandmark(id){
  const L = landmarks[id]; if (!L) return;
  const yT = (L.kind === "olympus" ? (L.ground + OLYMPUS.float)*state.ve + (1500 - 300) : L.y*state.ve + 30*state.ls);
  const dist = L.kind === "olympus" ? 5200 : (L.kind === "region" ? 14000 : 520*Math.max(1, state.ls*.75));
  flyToPoint(new THREE.Vector3(L.x, yT, L.z), dist);
}
function flyToPoint(target, dist){
  const dir = camera.position.clone().sub(controls.target).setY(0);
  if (dir.lengthSq() < 1) dir.set(0,0,1); dir.normalize();
  const camPos = target.clone().add(dir.multiplyScalar(dist*.8)).add(new THREE.Vector3(0, dist*.55, 0));
  camPos.y = Math.max(camPos.y, groundUnder(camPos) + 60);     // never end inside a mountain
  flyTo(target, camPos);
}
const OVERVIEW = { t: new THREE.Vector3(-7000,0,2500), p: new THREE.Vector3(-9000, 30000, 46000) };
const VIEWS = {
  overview(){ flyTo(OVERVIEW.t.clone(), OVERVIEW.p.clone()); },
  map(){ flyTo(new THREE.Vector3(0,0,0), new THREE.Vector3(0, 62000, 1)); },
  olympus(){ flyToLandmark("olympus"); showInfo(OLYMPUS); },
  about(){ showAbout(); },
};

/* ---------------- Darrow's course: path, stops, tour ---------------- */
const route = { legs: [], visible: true, cur: -1, playing: false, playT: 0, anim: null, markers: [] };
const LEG_STEP_PX = 1.5;
function buildRoute(){
  let total = 0;
  DARROW.forEach((s, i) => {
    s.n = i + 1;
    if (s.at){
      const d = s.at === "olympus" ? OLYMPUS : (HOUSES.find(h => h.id === s.at) || TOWERS.find(t => t.id === s.at));
      s.px = d.px; s.py = d.py;
    }
    if (i === 0){ route.legs.push({ pts: [], km: 0, total: 0 }); return; }
    const a = DARROW[i-1], line = [[a.px, a.py], ...(s.via || []), [s.px, s.py]];
    const pts = []; let len = 0;
    for (let k = 0; k < line.length-1; k++){
      const [ax, ay] = line[k], [bx, by] = line[k+1], L = Math.hypot(bx-ax, by-ay), n = Math.max(1, Math.ceil(L/LEG_STEP_PX));
      for (let j = 0; j < n; j++) pts.push({ px: ax+(bx-ax)*j/n, py: ay+(by-ay)*j/n, d: len + L*j/n });
      len += L;
    }
    pts.push({ px: s.px, py: s.py, d: len });
    // hug the surface that is drawn (the 150 m grid), not the finer height function under it,
    // or the path dips into ridges the grid rounds over
    for (const p of pts){ const w = toW(p.px, p.py); p.t = len ? p.d/len : 1; p.h = Math.max(0, sampleTerrain(w.x, w.z)); }
    const km = len*M_PER_PX/1000; total += km;
    route.legs.push({ pts, km, total, air: !!s.air, fromOly: a.at === "olympus", toOly: s.at === "olympus" });
  });
}
function olyTopY(){ const L = landmarks.olympus; return L.group.position.y + L.topLocal + 25; }
const ROUTE_LIFT = 22;     // metres above the ground, so the path never sinks into the terrain
function routeY(leg, p){
  const ground = p.h*state.ve + ROUTE_LIFT;
  if (!leg.air) return ground;
  const a = leg.pts[0], b = leg.pts[leg.pts.length-1];
  const yA = leg.fromOly ? olyTopY() : a.h*state.ve + ROUTE_LIFT;
  const yB = leg.toOly ? olyTopY() : b.h*state.ve + ROUTE_LIFT;
  return Math.max(ground, lerp(yA, yB, p.t) + Math.sin(Math.PI*p.t)*700);
}
function stopWorld(s){
  const w = toW(s.px, s.py);
  return { x: w.x, z: w.z, y: s.at === "olympus" ? olyTopY() : Math.max(0, sampleTerrain(w.x, w.z))*state.ve + ROUTE_LIFT };
}

const routeCanvas = document.getElementById("route"), rctx = routeCanvas.getContext("2d");
function sizeRoute(){
  const d = Math.min(devicePixelRatio || 1, 2);
  routeCanvas.width = Math.round(innerWidth*d); routeCanvas.height = Math.round(innerHeight*d);
  rctx.setTransform(d, 0, 0, d, 0, 0);
}
const pv = new THREE.Vector3();
function project(x, y, z){
  pv.set(x, y, z).project(camera);
  if (pv.z > 1 || pv.z < -1) return null;
  return [(pv.x*.5+.5)*innerWidth, (-pv.y*.5+.5)*innerHeight];
}
function tracePath(leg, uptoT){
  rctx.beginPath(); let pen = false;
  for (const p of leg.pts){
    if (p.t > uptoT) break;
    const w = toW(p.px, p.py), s = project(w.x, routeY(leg, p), w.z);
    if (!s){ pen = false; continue; }
    if (!pen){ rctx.moveTo(s[0], s[1]); pen = true; } else rctx.lineTo(s[0], s[1]);
  }
}
function drawRoute(now){
  rctx.clearRect(0, 0, innerWidth, innerHeight);
  if (!route.visible) return;
  const upto = route.cur < 0 ? Infinity : route.cur;
  rctx.lineJoin = rctx.lineCap = "round";
  for (let i = 1; i < route.legs.length; i++){
    const leg = route.legs[i], walked = i <= upto;
    let t = 1;
    if (route.anim && route.anim.leg === i) t = clamp((now - route.anim.t0)/route.anim.ms, 0, 1);
    for (const pass of [0, 1]){
      if (walked && t < 1){ // the leg being walked right now: faint whole leg, then the bright part
        tracePath(leg, 1); rctx.setLineDash(leg.air ? [7, 6] : []);
        rctx.lineWidth = 2; rctx.strokeStyle = "rgba(232,72,48,.3)"; if (pass) rctx.stroke();
      }
      tracePath(leg, walked ? t : 1);
      rctx.setLineDash(leg.air ? [7, 6] : []);
      if (pass === 0){ rctx.lineWidth = walked ? 5.5 : 3.5; rctx.strokeStyle = walked ? "rgba(25,12,6,.55)" : "rgba(25,12,6,.18)"; }
      else { rctx.lineWidth = walked ? 3 : 2; rctx.strokeStyle = walked ? "rgba(232,72,48,.96)" : "rgba(232,72,48,.38)"; }
      rctx.stroke();
    }
    if (walked && t < 1){
      const p = leg.pts[Math.min(leg.pts.length-1, Math.floor(t*(leg.pts.length-1)))];
      const w = toW(p.px, p.py), s = project(w.x, routeY(leg, p), w.z);
      if (s){ rctx.setLineDash([]); rctx.beginPath(); rctx.arc(s[0], s[1], 6, 0, Math.PI*2);
        rctx.fillStyle = "#ffd36b"; rctx.fill(); rctx.lineWidth = 2; rctx.strokeStyle = "#3a1a10"; rctx.stroke(); }
    }
  }
}

/* one marker per place; a place he came back to lists every visit (Castle Mars: 1, 3, 5 ...) */
function buildStopMarkers(){
  const groups = new Map();
  for (const s of DARROW){ const k = s.px + "," + s.py; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(s); }
  for (const list of groups.values()){
    const first = list[0];
    const it = addLabel(list.map(s => s.n).join(" · "), "stop",
      v => { const w = stopWorld(first); v.set(w.x, w.y, w.z); },
      () => { const next = list.find(s => s.n-1 > route.cur) || list[0]; tourGo(next.n-1); });
    it.when = () => route.visible;
    it.el.title = list.map(s => `${s.n}. ${s.title}`).join("\n");
    route.markers.push({ it, list });
  }
}
function refreshStopMarkers(){
  for (const m of route.markers) m.it.el.classList.toggle("on", m.list.some(s => s.n-1 === route.cur));
}
function showStop(s){
  const leg = route.legs[s.n-1];
  const legTxt = s.n === 1 ? "Start of the year" : `${leg.km.toFixed(1)} km from the last stop${leg.air ? " by gravBoots" : ""}, ${leg.total.toFixed(0)} km so far`;
  infoBody.innerHTML =
    `<h2>${s.n}. ${esc(s.title)}</h2>` +
    `<div class="where">Red Rising ch. ${esc(s.ch)}. ${esc(s.when)}. ${legTxt}.</div>` +
    `<h3>What happens</h3><p>${esc(s.text)}</p>` +
    (s.assume ? `<h3>Assumed for the map</h3><p>${esc(s.assume)}</p>` : "") +
    `<div class="tournav"><button class="b" id="tourPrev" ${s.n === 1 ? "disabled" : ""}>Previous</button>` +
    `<button class="b" id="tourPlay" aria-pressed="${route.playing}">${route.playing ? "Pause" : "Play"}</button>` +
    `<button class="b" id="tourNext" ${s.n === DARROW.length ? "disabled" : ""}>Next</button>` +
    `<span class="count">Stop ${s.n} of ${DARROW.length}</span></div>`;
  info.hidden = false;
  document.getElementById("tourPrev").onclick = () => { route.playing = false; tourGo(route.cur - 1); };
  document.getElementById("tourNext").onclick = () => { route.playing = false; tourGo(route.cur + 1); };
  document.getElementById("tourPlay").onclick = () => {
    route.playing = !route.playing; route.playT = performance.now();
    if (route.playing && route.cur >= DARROW.length-1) tourGo(0); else showStop(DARROW[route.cur]);
  };
}
function tourGo(i){
  i = clamp(i, 0, DARROW.length-1);
  const prev = route.cur; route.cur = i; route.playT = performance.now();
  if (!route.visible) setRouteVisible(true);
  route.anim = (i > 0 && i === prev + 1) ? { leg: i, t0: performance.now(), ms: 1600 } : null;
  const s = DARROW[i], w = stopWorld(s);
  flyToPoint(new THREE.Vector3(w.x, w.y, w.z), s.at === "olympus" ? 7500 : 5200);
  if (fly) fly.ms = 1600;
  showStop(s); refreshStopMarkers();
  if (i === DARROW.length-1) route.playing = false;
}
function tickTour(now){
  if (route.playing && now - route.playT > 5200){
    if (route.cur < DARROW.length-1) tourGo(route.cur + 1); else route.playing = false;
  }
}
function setRouteVisible(v){
  route.visible = v;
  document.getElementById("routeToggle").setAttribute("aria-pressed", String(v));
  if (!v){ route.playing = false; route.cur = -1; route.anim = null; refreshStopMarkers(); }
}
document.getElementById("routeToggle").onclick = () => setRouteVisible(!route.visible);
document.getElementById("tourStart").onclick = () => { route.playing = false; tourGo(0); };

/* ---------------- toggles ---------------- */

/* ---------------- scale bar + compass ---------------- */
const scaleTxt = document.getElementById("scaleTxt"), scaleBar = document.getElementById("scaleBar"), needle = document.getElementById("needle");
function updateHud(){
  const dist = camera.position.distanceTo(controls.target);
  const mPerPx = 2*dist*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))/innerHeight;
  const target = mPerPx*120, pow = Math.pow(10, Math.floor(Math.log10(target)));
  const nice = [1,2,5,10].map(k=>k*pow).filter(v=>v<=target).pop() || pow;
  scaleBar.style.width = Math.round(nice/mPerPx) + "px";
  scaleTxt.textContent = nice >= 1000 ? `${nice/1000} km` : `${nice} m`;
  const az = Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
  needle.setAttribute("transform", `rotate(${THREE.MathUtils.radToDeg(az)})`);
}

function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); sizeRoute(); }
addEventListener("resize", resize);

/* ---------------- build ---------------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(.1, (now-last)/1000); last = now;
  if (fly){
    const t = clamp((now - fly.t0)/fly.ms, 0, 1), e = t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
    camera.position.lerpVectors(fly.fromP, fly.toP, e); controls.target.lerpVectors(fly.fromT, fly.toT, e);
    if (t >= 1) fly = null;
  }
  controls.update();
  const floor = groundUnder(camera.position) + 25;                // keep the camera out of the terrain
  if (camera.position.y < floor) camera.position.y = floor;
  animSmoke(dt);
  renderer.render(scene, camera);
  drawRoute(now); tickTour(now);
  updateLabels(); updateHud();
  requestAnimationFrame(frame);
}

function build(){
  const t0 = performance.now();
  buildTerrain();
  buildWater();
  for (const H of HOUSES) placeLandmark(H, "house");
  for (const T of TOWERS) placeLandmark(T, "tower");
  buildOlympus();
  buildTrees();
  buildSmoke();
  buildRoute();
  buildStopMarkers();

  for (const H of HOUSES){
    const L = landmarks[H.id];
    const it = addLabel(H.name.replace("House ",""), "house", v => v.set(L.x, (L.y + (H.id==="diana"?135:H.id==="apollo"?100:H.id==="jupiter"?95:50)*state.ls)*1 + L.y*(state.ve-1), L.z),
      () => { document.querySelectorAll(".lbl.on").forEach(e=>e.classList.remove("on")); it.el.classList.add("on"); showInfo(H); flyToLandmark(H.id); }, H.col);
  }
  for (const T of TOWERS){
    const L = landmarks[T.id];
    addLabel(T.name, "minor", v => v.set(L.x, L.y*state.ve + 55*state.ls, L.z), () => { showInfo(T); flyToLandmark(T.id); }, null, 22000);
  }
  const O = landmarks.olympus;
  addLabel("Olympus", "olympus", v => v.set(O.x, (O.ground+OLYMPUS.float)*state.ve + 1950, O.z - 300), () => VIEWS.olympus());
  for (const R of REGIONS){
    const w = toW(R.px, R.py);
    const y = Math.max(0, heightAt(R.px, R.py));
    landmarks["region:"+R.id] = { x:w.x, z:w.z, y, kind:"region", def:R };
    addLabel(R.name, "region" + (R.water ? " water" : ""), v => v.set(w.x, y*state.ve + 200, w.z), () => { showInfo(R); flyToLandmark("region:"+R.id); }, null, R.small ? 22000 : 0);
  }

  resize();
  camera.position.copy(OVERVIEW.p); controls.target.copy(OVERVIEW.t); controls.update();
  if (innerWidth < 640) document.getElementById("hudToggle").click();
  document.getElementById("loading").hidden = true;
  window.__institute.buildMs = performance.now() - t0;
  window.__institute.ready = true;
  requestAnimationFrame(frame);
}

/* test/inspection hook */
window.__institute = {
  ready:false, M_PER_PX, DARROW, route, tourGo, stopWorld, routeY, setRouteVisible, POSTERN, HOUSES, TOWERS, OLYMPUS, RIVERS, REGIONS, counts, landmarks, state,
  toW, heightAt, sampleTerrain, sdPoly, SEA, GREATWOODS, MOUNTAINS, HIGHLANDS,
  riverXAt(id, py){ const p = RIV[id].pts; for (let k=0;k<p.length-1;k++){ const [ax,ay]=p[k],[bx,by]=p[k+1]; if ((py-ay)*(py-by) <= 0 && ay!==by) return ax + (bx-ax)*(py-ay)/(by-ay); } return null; },
  distanceKm(a, b){ const A = landmarks[a], B = landmarks[b]; return Math.hypot(A.x-B.x, A.z-B.z)/1000; },
  setVE(v){ document.querySelector(`[data-ve="${v}"]`).click(); },
  setLS(v){ document.querySelector(`[data-ls="${v}"]`).click(); },
  camera, controls, renderer, scene, VIEWS, flyToLandmark,
};
setTimeout(build, 30);
</script>
