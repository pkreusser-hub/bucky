<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#233357" />
<title>BUCKY — Games</title>
<link rel="icon" href="bucky.png" />
<!-- Roboto so desktop renders in the same face Android does (iOS keeps San Francisco via -apple-system) — mirrors index.html / farmgpt.html -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700;800;900&display=swap" />
<link rel="apple-touch-icon" href="bucky.png" />
<style>
  :root {
    --bg: #eef2fa;
    --card: #ffffff;
    --ink: #15233f;
    --muted: #5d6b86;
    --green: #233357;     /* Old Glory navy — primary */
    --green-d: #18233b;
    --red: #ba303e;       /* Old Glory red — accent */
    --line: #d7e0f0;
    --shadow: 0 1px 3px rgba(35,51,87,.10), 0 6px 16px rgba(35,51,87,.06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, Roboto, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding-bottom: calc(env(safe-area-inset-bottom) + 112px);   /* clears the fixed two-row bottom nav */
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: var(--green);
    color: #fff;
    padding: calc(env(safe-area-inset-top) + 16px) 16px 14px;
    position: sticky; top: 0; z-index: 20;
    box-shadow: var(--shadow);
  }
  #bar { display: flex; align-items: center; gap: 10px; }
  #bar a {
    color: #fff; text-decoration: none; font-weight: 800; font-size: 15px;
    background: rgba(255,255,255,.16); padding: 7px 12px; border-radius: 9px; flex: 0 0 auto;
  }
  #bar .t { font-size: 18px; font-weight: 800; letter-spacing: .2px; }
  /* candy stripe retired with the 2026-07 app-shell redesign (index.html dropped it too) */
  .stripes { display: none; }
  main { max-width: 760px; margin: 0 auto; padding: 12px; }
  .progress { font-size: 13px; color: var(--muted); margin: 14px 2px 12px; }
  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  li.dash-grid { background: transparent; border: 0; box-shadow: none; padding: 6px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .dash-tile {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
    padding: 18px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 5px; align-items: center;
    text-align: center; text-decoration: none;
  }
  .dash-tile:active { background: var(--done, #e7eefb); }
  .dash-ico { font-size: 30px; line-height: 1; }
  .dash-name { font-weight: 800; font-size: 15px; color: var(--ink); }
  .dash-desc { font-size: 12px; color: var(--muted); }

  /* Live lobby banner cards (bucky-lobby shim) */
  #lobbyBanners { display: flex; flex-direction: column; gap: 10px; margin: 0 0 14px; }
  .lobby-card {
    display: flex; align-items: center; gap: 10px; background: var(--card);
    border: 1px solid var(--line); border-left: 5px solid var(--red); border-radius: 14px;
    box-shadow: var(--shadow); padding: 12px 14px; text-decoration: none; color: var(--ink);
  }
  .lobby-card.static { border-left-color: var(--green); cursor: default; }
  .lobby-ico { font-size: 24px; flex: 0 0 auto; }
  .lobby-text { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; }
  .lobby-join { flex: 0 0 auto; background: var(--red); color: #fff; font-weight: 800; font-size: 13px; padding: 7px 12px; border-radius: 9px; }

  /* ==========================================================================
     Desktop left rail (>=1024px) - mirrors index.html's #sidenav/buildSideNav
     and farmgpt.html's copy. Below 1024px this page is unchanged: sticky
     header + the fixed two-row bottom nav (this page has no composer to
     protect, so keeping the bar position:fixed - unlike farmgpt's in-flow
     bar - is correct here). The rail is fixed at the left; body gets
     padding-left so header/main slide right of it. */
  #sidenav { display: none; }
  @media (min-width: 1024px) {
    :root { --sidenav-w: 230px; }
    body { padding-left: var(--sidenav-w); padding-bottom: 0; }
    #sidenav {
      display: flex; flex-direction: column;
      position: fixed; top: 0; bottom: 0; left: 0; width: var(--sidenav-w); z-index: 30;
      background: linear-gradient(180deg, #0d3d76 0%, var(--green) 55%, var(--green-d) 100%);
      border-right: 1px solid rgba(255,255,255,.10);
      box-shadow: 2px 0 18px rgba(35,51,87,.14);
      overflow-y: auto; overscroll-behavior: contain;
    }
    .sn-brand {
      display: block; width: 100%; text-align: left; text-decoration: none; cursor: pointer;
      background: transparent; border: 0; color: #fff; font: inherit;
      padding: 20px 18px 16px; border-bottom: 1px solid rgba(255,255,255,.12);
    }
    .sn-brand .sn-name { font-size: 22px; font-weight: 800; letter-spacing: .2px; line-height: 1.05; }
    .sn-brand .sn-sub {
      font-size: 10.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      color: rgba(255,255,255,.62); margin-top: 4px;
    }
    .sn-brand::after {
      content: ""; display: block; height: 3px; width: 46px; margin-top: 10px; border-radius: 2px;
      background: repeating-linear-gradient(90deg, var(--red) 0 9px, #fff 9px 18px);
    }
    .sn-list { display: flex; flex-direction: column; gap: 2px; padding: 12px 10px 20px; }
    .sn-item {
      display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
      text-decoration: none; border: 0; background: transparent; cursor: pointer; font: inherit;
      color: rgba(255,255,255,.80); padding: 10px 12px; border-radius: 11px;
      border-left: 3px solid transparent;
      transition: background .15s ease, color .15s ease;
    }
    .sn-item:hover { background: rgba(255,255,255,.09); color: #fff; }
    .sn-item .sn-ico { font-size: 18px; line-height: 1; flex: 0 0 auto; filter: grayscale(.35) opacity(.9); }
    .sn-item .sn-label { font-size: 14.5px; font-weight: 700; letter-spacing: .1px; }
    .sn-item.active {
      background: rgba(255,255,255,.15); color: #fff; border-left-color: var(--red); cursor: default;
    }
    .sn-item.active .sn-ico { filter: none; }

    /* The rail already carries the wordmark, so the header's own back link is
       redundant chrome on desktop -- the title stays. */
    #backLink { display: none; }

    #buckyNav { display: none; }

    main { max-width: 900px; padding: 20px 24px; }
  }
</style>
</head>
<body>

<!-- Desktop left rail (>=1024px, hidden below): same NAV_GROUPS data + gates as
     the mobile #buckyNav bar below -- see the nav-building script placed after
     the main content block. -->
<nav id="sidenav" aria-label="BUCKY sections"></nav>

<header>
  <div id="bar">
    <a href="index.html" id="backLink">← Bucky</a>
    <span class="t">🎮 Games</span>
  </div>
  <div class="stripes"></div>
</header>

<!-- Persistent BUCKY bottom nav -- mirrors index.html's bar (Old Glory palette),
     balanced two-row-on-phone grid (--bnav-cols set from JS so the rows stay
     balanced whatever areas this person can see). Fixed on mobile (this page
     has no composer to protect); hidden entirely on desktop (see the #sidenav
     rail above). Built by the script placed after the main content block. -->
<style>
  #buckyNav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: grid;
    grid-template-columns: repeat(var(--bnav-cols, 6), minmax(0, 1fr));
    gap: 2px 4px;
    background: rgba(255,255,255,.9);
    -webkit-backdrop-filter: saturate(1.3) blur(14px); backdrop-filter: saturate(1.3) blur(14px);
    border-top: 1px solid #d7e0f0;
    padding: 3px 6px calc(env(safe-area-inset-bottom) + 3px);
    box-shadow: 0 -2px 16px rgba(35,51,87,.08);
  }
  #buckyNav a {
    min-width: 0; text-decoration: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 5px 0 4px; border-radius: 12px; color: #5d6b86;
    transition: color .15s ease, background .15s ease, transform .1s ease;
  }
  #buckyNav a .bico { font-size: 21px; line-height: 1; filter: grayscale(.4) opacity(.75); transition: filter .15s ease, transform .12s ease; }
  #buckyNav a .blabel { font-size: 10px; font-weight: 700; letter-spacing: .1px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #buckyNav a:active { transform: scale(.93); }
  #buckyNav a.active { color: #233357; background: #e7eefb; }
  #buckyNav a.active .bico { filter: none; transform: translateY(-1px) scale(1.08); }
  @media (min-width: 700px) and (max-width: 1023.98px) {
    #buckyNav { grid-template-columns: repeat(var(--bnav-all, 12), minmax(0, 96px)); justify-content: center; gap: 6px; }
  }
  /* The head <style> already hides #buckyNav at >=1024px, but this block's own
     unconditional #buckyNav rule (above) shares the same specificity and comes
     later in source order, so it would otherwise win the cascade -- restate the
     hide here, last, so it actually sticks. */
  @media (min-width: 1024px) { #buckyNav { display: none; } }
</style>
<nav id="buckyNav" aria-label="BUCKY sections"></nav>

<main>
  <div id="lobbyBanners"></div>
  <div class="progress">Pick a game!</div>
  <ul class="list">
    <li class="dash-grid" id="gamesGrid"></li>
  </ul>
</main>
<script>
(function () {
  // Mirrors index.html's NAV_GROUPS (12 areas: Home/Plan/Meals/Chores/Fit/News/Jobs/
  // Shop/Bank/Farm/AI/Play). This page IS the "Play" area (games live under Play),
  // so its entry has no href and renders active/inert instead of linking anywhere.
  // Gate lists duplicated from index.html -- keep in sync with index.html.
  var BANK_USERS = ["Eleanor", "Isaac", "Dad", "Mom"];
  var MEAL_USERS = ["Mom", "Dad"];
  var FITNESS_USERS = ["Isaac", "Eleanor", "Dad"];
  var me = localStorage.getItem("choreUser") || "";
  function seesBank(){ return BANK_USERS.indexOf(me) >= 0; }
  function seesMeals(){ return MEAL_USERS.indexOf(me) >= 0; }
  function seesFitness(){ return FITNESS_USERS.indexOf(me) >= 0; }

  var NAV_GROUPS = [
    { ico:"🏠", name:"Home",  href:"index.html#dashboard" },
    { ico:"📅", name:"Plan",  href:"index.html#calendar" },
    { ico:"🍽️", name:"Meals", href:"index.html#mealplan", gate:seesMeals },
    { ico:"✅", name:"Chores",href:"index.html#chores" },
    { ico:"💪", name:"Fit",   href:"index.html#fitness",  gate:seesFitness },
    { ico:"📰", name:"News",  href:"index.html#news" },
    { ico:"🛠️", name:"Jobs",  href:"index.html#workorders" },
    { ico:"🛒", name:"Shop",  href:"index.html#shopping" },
    { ico:"💰", name:"Bank",  href:"index.html#farmbank", gate:seesBank },
    { ico:"🐐", name:"Farm",  href:"index.html#goathooves" },
    { ico:"🌾", name:"AI",    href:"farmgpt.html" },
    { ico:"🎮", name:"Play",  href:null, active:true },   // this page
  ];
  var shown = NAV_GROUPS.filter(function (g) { return !g.gate || g.gate(); });

  // Mobile/tablet fixed bar -- balanced two rows on a phone (same --bnav-cols
  // technique as index.html's buildBottomNav / farmgpt.html).
  var bnav = document.getElementById("buckyNav");
  bnav.style.setProperty("--bnav-cols", Math.ceil(shown.length / 2));
  bnav.style.setProperty("--bnav-all", shown.length);
  shown.forEach(function (g) {
    var a = document.createElement("a");
    if (g.href) a.href = g.href; else a.href = "javascript:void(0)";
    var ico = document.createElement("span"); ico.className = "bico"; ico.textContent = g.ico;
    var lbl = document.createElement("span"); lbl.className = "blabel"; lbl.textContent = g.name;
    a.append(ico, lbl); a.title = g.name; a.setAttribute("aria-label", g.name);
    if (g.active) a.className = "active";
    bnav.appendChild(a);
  });

  // Desktop (>=1024px) left rail -- same data/gates, index.html's #sidenav look.
  var sn = document.getElementById("sidenav");
  var brand = document.createElement("a");
  brand.className = "sn-brand"; brand.href = "index.html#dashboard";
  brand.setAttribute("aria-label", "Back to dashboard");
  var bn = document.createElement("div"); bn.className = "sn-name"; bn.textContent = "Bucky";
  var bs = document.createElement("div"); bs.className = "sn-sub"; bs.textContent = "Family Farm Hub";
  brand.append(bn, bs);
  sn.appendChild(brand);

  var list = document.createElement("div"); list.className = "sn-list";
  shown.forEach(function (g) {
    var a = document.createElement("a");
    a.className = "sn-item" + (g.active ? " active" : "");
    if (g.href) a.href = g.href; else a.href = "javascript:void(0)";
    a.setAttribute("aria-label", g.name);
    var ico = document.createElement("span"); ico.className = "sn-ico"; ico.textContent = g.ico;
    var lbl = document.createElement("span"); lbl.className = "sn-label"; lbl.textContent = g.name;
    a.append(ico, lbl);
    list.appendChild(a);
  });
  sn.appendChild(list);
})();
</script>

<script type="module">
  // bucky-lobby shim — live lobby banner cards for open/started game lobbies.
  // Duplicated (intentionally) in index.html; this repo has no shared JS module,
  // so keep this copy tiny and in sync with the other one.
  const firebaseConfig = {
    apiKey: "AIzaSyAA1hn-j9_pPuXoaHIzcyyXYJN6EhUccJU",
    authDomain: "amen-farms-app.firebaseapp.com",
    projectId: "amen-farms-app",
    storageBucket: "amen-farms-app.firebasestorage.app",
    messagingSenderId: "321230755979",
    appId: "1:321230755979:web:d362c56aaf7e50b4ab5c8e"
  };
  const FAMILY_PASSWORD = "amenfarms";
  function roomId(pw){
    let h = 0;
    for (const ch of pw.toLowerCase()) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return "fam" + h.toString(36);
  }
  // ?fam= override: dev/test hook so automated verification can watch a scratch family
  // collection instead of production (memory: test familyKey for automated writes).
  const familyKey = (new URLSearchParams(location.search).get("fam")) || roomId(FAMILY_PASSWORD);

  const OPEN_LIVE_MS = 45 * 1000;      // "open" lobby heartbeat is every 15s now — 45s window = 3 missed beats before we call it stale
  const STARTED_LIVE_MS = 90 * 1000;   // "started" (mid-game) cards keep the old, more forgiving window
  const STALE_MS = 3 * 60 * 1000;      // lazy-delete docs older than this (dropped from 10min — stale cards were sticking around too long)

  // Per-game card text (2026-07-09: Farm Kart family lobby port). Bistro keeps its original
  // kitchen/chef wording; unknown future games get a neutral generic fallback so a new game
  // doesn't need a games.html change just to appear here.
  const LOBBY_TEXT = {
    farmparty: {
      open: (d) => `🎉 ${d.hostName || "Someone"}'s farm party is on! · ${d.playerCount || 1}/${d.maxPlayers || 4} partiers`,
      started: (d) => `🎉 ${d.hostName || "Someone"}'s party is mid-game!`
    },
    barnyardbistro: {
      open: (d) => `${d.hostName || "Someone"}'s kitchen is open! · ${d.playerCount || 1}/${d.maxPlayers || 2} chefs`,
      started: (d) => `🍳 ${d.hostName || "Someone"} is cooking with ${d.playerCount || 1} chefs`
    },
    farmkart: {
      open: (d) => `🏁 ${d.hostName || "Someone"}'s race is forming! · ${d.playerCount || 1}/${d.maxPlayers || 4} racers`,
      started: (d) => `🏁 ${d.hostName || "Someone"}'s race is mid-race!`
    },
    pasturepanic: {
      open: (d) => `🐀 ${d.hostName || "Someone"}'s pasture is open! · ${d.playerCount || 1}/${d.maxPlayers || 2} farmers`,
      started: (d) => `🐀 ${d.hostName || "Someone"} is surviving the stampede!`
    },
    farmlife: {
      open: (d) => `🌱 ${d.hostName || "Someone"} is on the farm! · ${d.playerCount || 1} farming`,
      started: (d) => `🌱 ${d.hostName || "Someone"} is on the farm! · ${d.playerCount || 1} farming`,
      // Farm Life lives at /farmlife/dist/ and derives its room from the family
      // key — no #r= room hash. bistro/farmkart omit `href` and keep the
      // default `<game>.html#r=<roomCode>` join link below.
      href: () => `farmlife/dist/`
    },
    // internal game id stays "farmstead" (see assets/farmstead/fs-net.js — the lobby
    // doc's id/collection key are unchanged by the rename) but the launch page is
    // castlekruzer.html (2026-08-02 rename to "Castle Kruzer"), so — like farmlife
    // above — this needs an explicit href or the default `<game>.html#r=` scheme
    // below would build the dead "farmstead.html#r=…" link.
    farmstead: {
      open: (d) => `🏰 ${d.hostName || "Someone"}'s kingdom is open! · ${d.playerCount || 1}/${d.maxPlayers || 2} rulers`,
      started: (d) => `🏰 ${d.hostName || "Someone"}'s kingdom is mid-siege!`,
      href: (d) => `castlekruzer.html#r=${encodeURIComponent(d.roomCode || "")}`
    }
  };
  function lobbyText(data, cooking){
    const t = LOBBY_TEXT[data.game];
    if (t) return cooking ? t.started(data) : t.open(data);
    return cooking
      ? `${data.hostName || "Someone"} is hosting ${data.gameName || data.game}!`
      : `${data.hostName || "Someone"} is hosting ${data.gameName || data.game}! · ${data.playerCount || 1}/${data.maxPlayers || 2}`;
  }
  // Per-game JOIN href. A game may supply `LOBBY_TEXT[game].href(data)` — used
  // by farmlife (no #r= hash at all) and farmstead/Castle Kruzer (id and page
  // name diverged in the 2026-08-02 rename); every other game (bistro/farmkart/
  // unknown) falls back to the original `<game>.html#r=<roomCode>` scheme below.
  function lobbyHref(data){
    const t = LOBBY_TEXT[data.game];
    if (t && typeof t.href === "function") return t.href(data);
    return `${data.game}.html#r=${encodeURIComponent(data.roomCode || "")}`;
  }

  function renderLobbies(docs, fs, col){
    const wrap = document.getElementById("lobbyBanners");
    if (!wrap) return;
    wrap.innerHTML = "";
    const now = Date.now();
    // Defensive dedupe: if multiple docs share the same hostName+game (e.g. a host reconnected
    // and a new doc got created before the old one aged out), only render the freshest one per
    // (hostName, game) pair. The stale-delete sweep above will clean up the rest over time.
    const freshestByKey = new Map();
    for (const d of docs){
      const data = d.data();
      const key = (data.hostName || "") + "|" + (data.game || "");
      const prev = freshestByKey.get(key);
      if (!prev || (data.updatedAt || 0) > (prev.data.updatedAt || 0)) freshestByKey.set(key, { doc: d, data });
    }

    for (const d of docs){
      const data = d.data();
      const age = now - (data.updatedAt || 0);
      if (age >= STALE_MS){ fs.deleteDoc(fs.doc(col, d.id)).catch(()=>{}); continue; }
      const key = (data.hostName || "") + "|" + (data.game || "");
      const freshest = freshestByKey.get(key);
      if (freshest && freshest.doc.id !== d.id) continue;   // superseded by a fresher doc for the same host+game

      const live = data.status === "open" && age < OPEN_LIVE_MS;
      const cooking = data.status === "started" && age < STARTED_LIVE_MS;
      if (!live && !cooking) continue;

      if (live){
        const a = document.createElement("a");
        a.className = "lobby-card";
        a.href = lobbyHref(data);
        const ico = document.createElement("span"); ico.className = "lobby-ico"; ico.textContent = data.ico || "🎮";
        const text = document.createElement("span"); text.className = "lobby-text";
        text.textContent = lobbyText(data, false);
        const join = document.createElement("span"); join.className = "lobby-join"; join.textContent = "JOIN";
        a.append(ico, text, join);
        wrap.appendChild(a);
      } else if (cooking){
        const card = document.createElement("div");
        card.className = "lobby-card static";
        const ico = document.createElement("span"); ico.className = "lobby-ico"; ico.textContent = data.ico || "🎮";
        const text = document.createElement("span"); text.className = "lobby-text";
        text.textContent = lobbyText(data, true);
        card.append(ico, text);
        wrap.appendChild(card);
      }
    }
  }

  async function initLobbies(){
    try {
      const appMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
      const fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
      const app = appMod.initializeApp(firebaseConfig, "bucky-lobby");
      const db = fs.getFirestore(app);
      const col = fs.collection(db, "lobbies_" + familyKey);
      fs.onSnapshot(col, (snap) => renderLobbies(snap.docs, fs, col), () => { /* offline/error: page stays static, like today */ });
    } catch (e) {
      // Firebase unreachable/blocked: fail silently, page renders as a plain static page.
    }
  }
  initLobbies();
</script>
</body>
</html>
