<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Draft Day — live keeper draft board</title>
<meta name="description" content="Live fantasy football keeper draft board — claim your team, set your keepers, draft from ESPN rankings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>

/* ============================================================================
   DRAFT DAY — standalone page, deliberately NOT the family-app look.
   Broadcast-dark NFL theme: deep navy chrome, condensed display type, red
   accent, position-colored board wall. No emojis anywhere — text + a couple
   of inline SVG glyphs (keeper lock, queue star).
   ========================================================================== */
:root{
  --bg:#0c1017; --card:#151b26; --card2:#1a2231; --line:#263043;
  --ink:#e9edf4; --muted:#8a94a7;
  --accent:#d50a0a; --accent-d:#a30808; --navy:#013369; --gold:#ffb612;
  --board-bg:#080b11; --board-line:#1b2333; --board-ink:#f2f2ee;
  --pos-QB:#a03449; --pos-RB:#2e8659; --pos-WR:#3a72b5; --pos-TE:#c07c2b;
  --pos-K:#7b5ea7; --pos-DST:#6b6154; --pos-X:#454c5c;
  --ok:#2e8659; --bad:#c23b25;
  --disp:"Barlow Condensed","Arial Narrow",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:14.5px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:64px;
}
button{font:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
[hidden]{display:none !important}
h1,h2,h3{font-family:var(--disp); letter-spacing:.4px}

/* ---------- header ---------- */
header{
  background:linear-gradient(180deg,#101724,#0d1320);
  border-top:3px solid var(--accent);
  border-bottom:1px solid var(--line);
  padding:12px 16px 10px;
}
.brand{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.wordmark{
  font-family:var(--disp); font-weight:700; font-size:24px; color:#fff;
  letter-spacing:1.5px; white-space:nowrap;
}
#lgName{color:var(--muted); font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.8px}
#phaseLine{color:var(--muted); font-size:12.5px; margin-top:3px}
#soundBtn{
  margin-left:auto; background:none; border:1px solid var(--line); color:var(--muted);
  border-radius:6px; padding:3px 10px; font-size:10.5px; font-weight:700; letter-spacing:.8px;
}
#soundBtn.off{opacity:.55}
#connBanner{background:var(--accent-d); color:#fff; padding:8px 14px; font-size:13px; font-weight:600}
#localBadge{
  background:#2a2f1d; color:#cfd68a; padding:6px 14px; font-size:11.5px; font-weight:700; letter-spacing:.6px;
}

/* ---------- on-the-clock strip ---------- */
#clockStrip{
  background:linear-gradient(90deg,var(--navy),#0a2a52);
  color:#fff; padding:9px 16px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  position:sticky; top:0; z-index:29;
  border-bottom:2px solid var(--accent);
}
#clockStrip .pickno{
  font-family:var(--disp); font-weight:700; font-size:22px; letter-spacing:1px; white-space:nowrap;
}
#clockStrip .who{font-weight:700; font-size:15.5px}
#clockStrip .own{opacity:.7; font-size:12.5px}
#clockStrip .next{opacity:.75; font-size:12.5px; margin-left:auto; text-align:right}
#clockStrip .cd{
  font-variant-numeric:tabular-nums; font-weight:700; font-size:18px; font-family:var(--disp);
  background:rgba(0,0,0,.35); border-radius:6px; padding:2px 12px; white-space:nowrap; letter-spacing:1px;
}
#clockStrip .cd.low{background:var(--accent); animation:cdpulse 1s infinite}
@keyframes cdpulse{50%{opacity:.55}}
#clockStrip.paused{background:#3a4152}
#clockStrip.done{background:linear-gradient(90deg,#2a3444,#1c2534)}
#clockStrip.mine{background:linear-gradient(90deg,var(--accent-d),var(--accent)); animation:minepulse 1.6s infinite}
@keyframes minepulse{50%{filter:brightness(1.22)}}

/* ---------- tabs ---------- */
nav#tabs{
  display:flex; gap:2px; padding:0 12px; background:#0d1320;
  border-bottom:1px solid var(--line); overflow-x:auto;
}
nav#tabs button{
  border:none; background:none; color:var(--muted);
  padding:11px 16px 9px; font-family:var(--disp); font-weight:600; font-size:15.5px;
  letter-spacing:1.2px; text-transform:uppercase; white-space:nowrap;
  border-bottom:3px solid transparent;
}
nav#tabs button.on{color:#fff; border-bottom-color:var(--accent)}

main{max-width:1220px; margin:0 auto; padding:14px 12px}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:14px 16px; margin-bottom:12px;
}
.card h2{font-size:17px; margin:0 0 8px; color:#fff; text-transform:uppercase; letter-spacing:1px}
.card h3{font-size:13px; margin:12px 0 6px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted)}
.mut{color:var(--muted); font-size:12.5px}
.btn{
  border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:7px;
  padding:9px 18px; font-weight:700; font-size:13.5px; letter-spacing:.3px;
}
.btn:hover{background:var(--accent-d)}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
.btn.ghost:hover{background:var(--card2)}
.btn.warn{background:transparent; color:#e08972; border-color:#7e3a2a}
.btn.sm{padding:5px 11px; font-size:12px; border-radius:6px}
.btn:disabled{opacity:.4; cursor:default}
.row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
input[type=text],input[type=number],select{
  border:1px solid var(--line); border-radius:7px; padding:8px 10px; background:#0e131d; color:var(--ink);
}
input::placeholder{color:#5b6579}

/* ---------- board ---------- */
.panner{overflow-x:auto; -webkit-overflow-scrolling:touch}
#boardGrid{
  background:var(--board-bg); border-radius:10px; padding:8px; border:1px solid var(--line);
  display:grid; gap:3px; width:max-content; min-width:100%;
}
.bhead{
  color:var(--board-ink); font-family:var(--disp); font-weight:600; font-size:14px;
  letter-spacing:.8px; text-align:center; padding:6px 4px 4px; line-height:1.1;
}
.bhead .own{display:block; font-family:Inter; font-weight:400; font-size:9.5px; opacity:.55; letter-spacing:0}
.brnd{
  color:#5f6a80; font-family:var(--disp); font-weight:600; font-size:12px;
  display:flex; align-items:center; justify-content:center; gap:2px; letter-spacing:.5px;
}
.cell{
  border-radius:5px; min-height:46px; padding:5px 6px; color:#fff; position:relative;
  font-size:11.5px; line-height:1.25; background:#131926; border:1px solid var(--board-line);
  overflow:hidden;
}
.cell b{display:block; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600}
.cell .pn{position:absolute; top:3px; right:5px; font-size:9px; opacity:.6; font-variant-numeric:tabular-nums}
.cell .pt{font-size:10px; opacity:.72}
.cell .kb{width:9px; height:9px; margin-right:3px; opacity:.9; vertical-align:baseline}
.cell.pos-QB{background:var(--pos-QB); border-color:transparent}
.cell.pos-RB{background:var(--pos-RB); border-color:transparent}
.cell.pos-WR{background:var(--pos-WR); border-color:transparent}
.cell.pos-TE{background:var(--pos-TE); border-color:transparent}
.cell.pos-K{background:var(--pos-K); border-color:transparent}
.cell.pos-DST{background:var(--pos-DST); border-color:transparent}
.cell.pos-X{background:var(--pos-X); border-color:transparent}
.cell.cur{outline:2px solid var(--gold); animation:curpulse 1.4s infinite}
@keyframes curpulse{50%{outline-color:rgba(255,182,18,.35)}}
.cell.deck{outline:1.5px dashed rgba(255,182,18,.5)}
.vbadge{
  position:absolute; bottom:3px; right:4px; font-size:8px; font-weight:800; letter-spacing:.5px;
  border-radius:3px; padding:1px 4px;
}
.vbadge.steal{background:#0d3b24; color:#7ee2ae}
.vbadge.reach{background:#42210c; color:#f0a35f}
#boardLegend .kb{width:10px;height:10px;vertical-align:middle}

/* recap (draft grades) */
#recapCard .grrow{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line); flex-wrap:wrap}
#recapCard .gr{
  font-family:var(--disp); font-weight:700; font-size:19px; width:38px; height:38px; border-radius:7px;
  display:flex; align-items:center; justify-content:center; background:var(--navy); color:#fff; flex:0 0 auto;
}
#recapCard .grrow b{font-size:13.5px}
#recapCard .grv{font-variant-numeric:tabular-nums; font-weight:700; color:var(--gold)}

/* ---------- combined Players & Teams: players left, teams right ---------- */
@media (min-width:1100px){
  #vPlayers .pwrap{display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:14px; align-items:start}
}

/* ---------- desktop: board + players side by side ---------- */
#boardRail{min-width:0}
@media (min-width:1100px){
  #vBoard .boardwrap{display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:14px; align-items:start}
}
#boardGrid.fit{width:100%; min-width:0}
#boardGrid.fit .cell{padding:4px 5px; min-width:0}
#boardGrid.fit .cell b{padding-right:22px}
#boardGrid.fit .bhead{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#boardGrid.fit .bhead .own{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ---------- players ---------- */
#pSearchRow{display:flex; gap:8px; margin-bottom:8px}
#pSearch{flex:1}
.chips{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:10px}
.chips button{
  border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:6px;
  padding:5px 12px; font-family:var(--disp); font-weight:600; font-size:13px; letter-spacing:.8px;
}
.chips button.on{background:var(--navy); color:#fff; border-color:var(--navy)}
#pList{overflow-y:auto; -webkit-overflow-scrolling:touch; border-radius:8px; border:1px solid var(--line)}
.prow{
  display:flex; align-items:center; gap:9px; padding:8px 10px; border-bottom:1px solid var(--line);
  background:var(--card); cursor:pointer;
}
.prow:last-child{border-bottom:none}
.prow:hover{background:var(--card2)}
.prow.taken{opacity:.4}
.prow .rk{width:26px; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; font-weight:700; font-size:12px}
.prow .dot{width:34px; text-align:center; border-radius:4px; color:#fff; font-size:10px; font-weight:800; padding:3px 0; letter-spacing:.5px; flex:0 0 auto}
.prow .tlogo{width:22px; height:22px; object-fit:contain; flex:0 0 auto}
.prow .nm{flex:1; min-width:0}
.prow .nm b{
  /* FULL name always — wrap to a second line before ever truncating */
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; font-weight:600; line-height:1.25;
}
.prow .nm .mut{font-size:11px; display:block}
.prow .tk{font-size:10.5px; color:var(--muted); font-weight:700; white-space:nowrap}
.inj{color:#ef6a4d; font-weight:700; font-size:10px}
.qbtn{
  background:none; border:none; padding:2px; color:#4b5570; flex:0 0 auto; line-height:0;
}
.qbtn.on{color:var(--gold)}
.qbtn svg{width:17px; height:17px}

/* queue + needs strips */
#qStrip{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:8px}
#qStrip .qtitle,#needsBar .ntitle{
  font-family:var(--disp); font-weight:700; font-size:12px; letter-spacing:1px; color:var(--muted);
}
.qchip{
  background:var(--card2); border:1px solid var(--line); color:var(--ink); border-radius:6px;
  padding:4px 8px; font-size:12px; font-weight:600;
}
.qchip .qx{color:var(--muted); margin-left:4px}
.qchip.qtaken{text-decoration:line-through; opacity:.45}
#needsBar{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:8px}
.nslot{
  background:var(--card2); border:1px solid var(--line); border-radius:6px; padding:3px 8px;
  font-size:11px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums;
}
.nslot.unfilled{color:var(--gold); border-color:#5b4a17}

/* ---------- confirm bar ---------- */
#confirmBar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:#05070c; border-top:2px solid var(--accent); color:#fff; padding:10px 14px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
#confirmBar .what{flex:1; min-width:180px; font-size:14px}
#confirmBar select{border-radius:6px; padding:6px; background:#0e131d}

/* ---------- keepers ---------- */
.keepCard .krow{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line)}
.keepCard .krow .cost{
  background:var(--navy); color:#fff; border-radius:6px; padding:2px 9px; font-weight:700;
  font-size:12.5px; white-space:nowrap; font-family:var(--disp); letter-spacing:.5px;
}
.keepCard .krow .basis{color:var(--muted); font-size:11.5px}
.kslot{color:var(--muted); font-style:italic; padding:7px 0; font-size:13px}
/* roster candidates: cost chip on every eligible player, greyed lock + reason
   on the ineligible (3 straight keeps / not on the roster) */
.chips .kQuick{display:inline-flex; align-items:center; gap:6px}
.kcost{
  background:var(--navy); color:#fff; border-radius:4px; padding:1px 6px; font-weight:700;
  font-size:11px; font-family:var(--disp); letter-spacing:.5px; flex:0 0 auto;
}
.kchain{color:var(--gold); font-size:10px; font-weight:700; letter-spacing:.4px; text-transform:uppercase}
/* keep cost vs market: ADP expressed as a round — green when the keep is
   cheaper than his draft price, red when you could just draft him there */
.kadp{
  font-size:10px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
  color:var(--muted); border-radius:4px; padding:1px 5px; background:#161c29; flex:0 0 auto;
}
.kadp.good{background:#0d3b24; color:#7ee2ae}
.kadp.bad{background:#42210c; color:#f0a35f}
.kQuick.kNo{
  border:1px solid var(--line); border-radius:6px; padding:5px 12px; color:var(--muted);
  opacity:.5; font-size:13px; cursor:not-allowed;
}
.kQuick.kNo svg{width:12px; height:12px; flex:0 0 auto}
.kQuick.kNo .kwhy{font-size:10px; letter-spacing:.3px}
.pLock{color:#4b5570; line-height:0; flex:0 0 auto}
.pLock svg{width:15px; height:15px}

/* ---------- teams ---------- */
.tchips{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:10px}
.tchips button{
  border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:6px; padding:6px 11px;
  font-family:var(--disp); font-weight:600; font-size:13.5px; letter-spacing:.8px;
}
.tchips button.on{background:var(--navy); color:#fff; border-color:var(--navy)}
.rrow{display:flex; gap:10px; padding:6px 0; border-bottom:1px dashed var(--line); align-items:center}
.rrow .rd{width:34px; color:var(--muted); font-weight:700; font-size:12px; text-align:right; font-variant-numeric:tabular-nums}
.rrow .pos{width:34px; text-align:center; border-radius:4px; color:#fff; font-size:10px; font-weight:800; padding:3px 0; letter-spacing:.5px}
.rrow.empty{color:#4b5570; font-style:italic}
.claimrow{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line)}
.claimrow b{flex:1}
.ownchip{background:#1c2e4d; color:#9fc0f0; border-radius:5px; padding:3px 10px; font-size:12px; font-weight:700}

/* ---------- commish ---------- */
.linkbox{
  background:#0e131d; border:1px dashed var(--line); border-radius:8px; padding:9px 11px;
  font-size:11.5px; word-break:break-all; margin:4px 0 8px; font-family:ui-monospace,monospace; color:#a9b3c6;
}
.ordrow{display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px dashed var(--line)}
.ordrow .n{width:22px; color:var(--muted); font-weight:700; text-align:right; font-variant-numeric:tabular-nums}
.ordrow b{flex:1}
@media (min-width:760px){ .cols2{display:grid; grid-template-columns:1fr 1fr; gap:12px} }

/* ---------- player detail card ---------- */
#pcOverlay{position:fixed; inset:0; background:rgba(4,6,10,.72); z-index:50; display:flex; align-items:center; justify-content:center; padding:14px}
#pcCard{
  background:var(--card); border-radius:12px; max-width:460px; width:100%; max-height:88vh;
  overflow-y:auto; padding:16px; border:1px solid var(--line); border-top:3px solid var(--accent);
}
#pcCard h2{margin:0; font-size:22px; color:#fff; letter-spacing:.5px}
#pcCard .tlogo{width:42px; height:42px; object-fit:contain}
.pctotals{display:flex; gap:10px; margin:12px 0 4px}
.pctotals .tot{flex:1; background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; text-align:center}
.pctotals .tot b{display:block; font-size:22px; font-family:var(--disp); letter-spacing:.5px}
.pctotals .tot span{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px}
.pcstats{width:100%; border-collapse:collapse; margin:8px 0; font-size:13px}
.pcstats th,.pcstats td{padding:4px 6px; border-bottom:1px dashed var(--line); text-align:right; font-variant-numeric:tabular-nums}
.pcstats th:first-child,.pcstats td:first-child{text-align:left}
.pcstats th{color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.6px}
.pcout{font-size:13.5px; line-height:1.55; overflow-wrap:anywhere; color:#c9d1e0}
.pcact{display:flex; gap:8px; margin-top:12px; align-items:center}

/* ---------- draft chat ---------- */
#chatCard{margin-top:12px}
#chatCard.slim{margin:0 0 12px}
#chatCard.slim #chatMsgs{height:140px}
#chatCard.slim h2{font-size:15px}
#chatMsgs{height:230px; overflow-y:auto; background:#0e131d; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13.5px}
#chatMsgs .cmsg{margin-bottom:6px; overflow-wrap:anywhere}
#chatMsgs .cmsg b{color:#9fc0f0}
#chatMsgs .cmsg .ct{color:#4b5570; font-size:10.5px; margin-left:6px}
#chatMsgs .cempty{color:var(--muted); font-style:italic}
#chatRow{display:flex; gap:8px; margin-top:8px}
#chatIn{flex:1; min-width:0}

/* ---------- toasts ---------- */
#toastWrap{position:fixed; left:50%; transform:translateX(-50%); bottom:70px; z-index:60; display:flex; flex-direction:column; gap:6px}
.toast{
  background:#05070c; border:1px solid var(--line); border-left:3px solid var(--navy); color:#fff;
  border-radius:8px; padding:9px 16px; font-weight:600; font-size:13px;
  box-shadow:0 6px 18px rgba(0,0,0,.5); max-width:88vw;
}
.toast.err{border-left-color:var(--accent)}

/* ---------- landing ---------- */
#vLanding .hero{text-align:center; padding:44px 16px}
#vLanding .hero h1{
  font-size:44px; margin:0 0 8px; color:#fff; letter-spacing:3px; font-weight:700;
}
#vLanding .hero h1::after{content:""; display:block; width:64px; height:3px; background:var(--accent); margin:10px auto 0}

/* ---------- TV mode ---------- */
body.tv{padding-bottom:64px}
body.tv header{padding:8px 18px 7px}
body.tv #phaseLine,body.tv #soundBtn{display:none}
body.tv main{max-width:none; padding:12px 18px}
body.tv .cell{min-height:56px; font-size:13px}
body.tv .cell b{font-size:14.5px}
body.tv .cell .pt{font-size:11px}
body.tv #clockStrip .pickno{font-size:28px}
body.tv #clockStrip .who{font-size:19px}
body.tv #boardLegend{display:none}
#tvTicker{
  position:fixed; bottom:0; left:0; right:0; z-index:45;
  background:#05070b; border-top:2px solid var(--accent);
  display:flex; gap:26px; padding:12px 18px; overflow:hidden; white-space:nowrap;
}
#tvTicker .tvpick{color:#cfd6e2; font-size:15px}
#tvTicker .tvpick b{color:var(--gold); font-family:var(--disp); letter-spacing:.5px; margin-right:4px}
#tvSpot{
  position:fixed; inset:0; z-index:48; display:flex; align-items:center; justify-content:center;
  background:rgba(4,7,11,.78);
}
#tvSpot .spin{
  background:var(--card); border:1px solid var(--line); border-top:5px solid var(--accent);
  border-radius:12px; padding:30px 60px; text-align:center; animation:spotin .25s ease-out;
}
#tvSpot .spl{display:block; font-family:var(--disp); font-weight:600; color:var(--gold); font-size:20px; letter-spacing:2px}
#tvSpot b{display:block; font-family:var(--disp); font-size:42px; color:#fff; letter-spacing:1px; margin:6px 0 2px}
#tvSpot .spin>span:last-child{color:var(--muted); font-size:15px}
@keyframes spotin{from{transform:scale(.85); opacity:0}}
</style>
</head>
<body>
<div id="connBanner" hidden>CAN'T REACH THE DRAFT ROOM — check your connection and reload.</div>
<div id="localBadge" hidden>PRACTICE MODE — this draft lives on this device only.</div>
<header>
  <div class="brand"><span class="wordmark">DRAFT DAY</span><span id="lgName"></span><button id="soundBtn" hidden>SOUND ON</button></div>
  <div id="phaseLine"></div>
</header>

<script>
(function () {

  function lsGet2(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }

      $("connBanner").hidden = false;

  // write, or throws Error(message) to abort with a toast. Cloud runs it inside
  // a Firestore transaction so concurrent picks retry against fresh state.
  function mutate(fn) {

          if (next) { next.updatedAt = Date.now(); localWrite(next); D = next; renderAll(); }

    }).catch(function (e) {

    });
  }

  // ---------------- server data (ESPN through sports.mjs) ----------------
  function api(action, params) {
    var body = Object.assign({ secret: FAMILY_PASSWORD, action: action }, params || {});
    return fetch(FN, {
      method: "POST",

    }).then(function (r) {

  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  function loadInfo(force) {
    var k = "ffd_info2_" + SEASON;   // v2: +slots (needs tracker)
    var c = lsGet(k);
    if (c && !force) { info = c.data; }
    if (c && !force && Date.now() - c.ts < 6 * 3600000) return Promise.resolve(info);
    return api("ff_draftinfo", {}).then(function (j) {
      if (j && j.ok) { info = j; lsSet(k, { ts: Date.now(), data: j }); }
      else if (!info) info = j || null;
      return info;
    }).catch(function () { return info; });
  }

    for (var i = 0; i < pool.length; i++) poolByPid[pool[i].pid] = pool[i];
  }
  // A real ESPN pool ALWAYS contains defenses; a sizable pool with zero D/ST
  // means the slot sweep failed upstream (or the copy predates it). Such a
  // pool is fine to SHOW but never to trust for 24 hours.
  function poolHealthy(list) {
    if (!list || list.length < 20) return true;
    for (var i = 0; i < list.length; i++) if (list[i].pos === "D/ST") return true;
    return false;
  }
  function loadPool(force) {
    var fmt = (info && info.ppr === false) ? "standard" : "ppr";
    var k = "ffd_pool3_" + SEASON;   // v3: +the D/ST/K slot sweep — old caches have no defenses
    var c = lsGet(k);
    var cacheOk = c && c.format === fmt && poolHealthy(c.players);
    if (cacheOk && !force) { pool = c.players || []; indexPool(); }
    if (cacheOk && !force && Date.now() - c.ts < 24 * 3600000) return Promise.resolve(pool);
    return api("ff_draftpool", { format: fmt }).then(function (j) {
      if (j && j.ok && j.players && j.players.length) {
        pool = j.players; indexPool();
        // An unhealthy fetch renders but is never cached — the next open retries.
        if (poolHealthy(pool)) lsSet(k, { ts: Date.now(), format: fmt, players: pool });
      }
      return pool;
    }).catch(function () { return pool; });
  }
  function loadLastDraft(force) {
    var k = "ffd_last2_" + SEASON;   // 2: shape gained chains/historyOk
    var c = lsGet(k);
    if (c && !force) { lastDraft = c.data; }
    if (c && !force && Date.now() - c.ts < 24 * 3600000) return Promise.resolve(lastDraft);
    return api("ff_lastdraft", {}).then(function (j) {
      if (j && j.ok) { lastDraft = j; lsSet(k, { ts: Date.now(), data: j }); }
      return lastDraft;
    }).catch(function () { return lastDraft; });
  }

  // ---------------- draft-doc derivations (pure) ----------------
  function isCommish(d) { return !!(d && me.ckey && d.commishKey === me.ckey); }
  function myTeam(d) {
    if (!d) return null;
    for (var i = 0; i < d.teams.length; i++) {
      var o = d.teams[i].owner;
      if (o && o.dev === me.dev) return d.teams[i];
    }
    return null;
  }
  function teamById(d, id) {
    for (var i = 0; i < d.teams.length; i++) if (d.teams[i].id === id) return d.teams[i];
    return null;
  }
  // The full snake order: [{round, teamId, key, label "3.05"}...]
  function slotSeq(d) {
    var ids = d.teams.map(function (t) { return t.id; });
    var out = [];
    for (var r = 1; r <= d.rounds; r++) {
      var row = (r % 2 === 1) ? ids : ids.slice().reverse();
      for (var i = 0; i < row.length; i++) {
        out.push({
          round: r, teamId: row[i], key: "r" + r + "_t" + row[i],
          label: r + "." + String(i + 1).padStart(2, "0"),
        });
      }
    }
    return out;
  }
  function currentSlot(d) {
    var seq = slotSeq(d);
    for (var i = 0; i < seq.length; i++) if (!d.picks[seq[i].key]) return seq[i];
    return null;
  }
  function nextSlotAfter(d, cur) {
    var seq = slotSeq(d), seen = false;
    for (var i = 0; i < seq.length; i++) {
      if (seen && !d.picks[seq[i].key]) return seq[i];
      if (seq[i].key === cur.key) seen = true;
    }
    return null;
  }

    // pid -> the team that has him. The value must be TRUTHY for every taken
    // player (the guards test it), so a failed team lookup still marks taken.
    var s = {};
    if (!d) return s;
    Object.keys(d.picks || {}).forEach(function (k) {
      // The slot key carries the team: "r<round>_t<teamId>".
      s[d.picks[k].pid] = teamById(d, Number(k.split("_t")[1])) || { name: "taken", abbrev: "" };
    });

    if (d.phase === "setup" || d.phase === "keepers") {
      Object.keys(d.keepers || {}).forEach(function (tid) {
        (d.keepers[tid] || []).forEach(function (k) { s[k.pid] = teamById(d, Number(tid)) || { name: "taken", abbrev: "" }; });
      });
    }
    return s;
  }
  function canPickFor(d, teamId) {
    if (isCommish(d)) return true;
    var t = teamById(d, teamId);
    return !!(t && t.owner && t.owner.dev === me.dev);
  }

  // ---------------- keeper costs (the family rule) ----------------
  // Kept or drafted last year: this year costs one round EARLIER (a 1st stays
  // a 1st) — last year's ESPN draft shows a keeper AT his cost round, so
  // "last round − 1" covers both cases. Waiver pickups (absent from last
  // year's draft) cost the team's LATEST pick.
  function keeperCostOf(pid, d) {

    if (lastDraft && lastDraft.picks) {
      for (var i = 0; i < lastDraft.picks.length; i++) {
        if (lastDraft.picks[i].pid === pid) { lp = lastDraft.picks[i]; break; }
      }

    if (!lp) return { round: d.rounds, basis: "waiver pickup → latest pick", waiver: true, keptBefore: false };

      round: r,

      waiver: false,

  // family's roster/draft PDFs for 2022-2025. chain 3 = kept three straight
  // years = he must return to the pool. A keeper must also be on YOUR final
  // roster from last season. Degrades permissively: no roster data for the
  // team (or a custom player) → the roster rule is skipped; history fetch
  // failed → chains empty → nobody is locked out by the 3-keep rule.
  function keeperStatusOf(pid, teamId, d) {
    var chain = (lastDraft && lastDraft.chains && lastDraft.chains[pid]) || 0;
    var cost = keeperCostOf(pid, d);
    var custom = typeof pid === "string" && pid.charAt(0) === "c";
    var ros = lastDraft && lastDraft.rosters

    var onRoster = custom ? null
      : (ros && ros.players.length

    var st = { chain: chain, cost: cost, onRoster: onRoster, keptCount: chain + 1, eligible: true, reason: "" };
    if (onRoster === false) {
      st.eligible = false;
      st.reason = "not on your " + (lastDraft ? lastDraft.season : SEASON - 1) + " roster";
    } else if (chain >= MAX_KEEPS_OF_ONE_PLAYER) {

      st.reason = "kept " + chain + " straight years — back to the pool";

  }
  function ordinal(n) { return n + (n === 1 ? "st" : n === 2 ? "nd" : n === 3 ? "rd" : "th"); }
  // Keeper cost vs the market: turn ESPN's ADP (an overall pick number) into a
  // ROUND for this league and compare it to the keep cost. Keeping a player a
  // round or more LATER than his ADP round = value (green); a round or more
  // EARLIER = you could just draft him there (red). No ADP (off the top-300
  // pool) → no badge.
  function keeperAdpBadge(costRound, pid, d) {
    var p = poolByPid[pid];

    var teams = (d.teams && d.teams.length) || 8;
    var round = Math.max(1, Math.min(d.rounds, Math.ceil(p.adp / teams)));
    var diff = costRound - round;
    return { round: round, diff: diff, cls: diff >= 1 ? "good" : diff <= -1 ? "bad" : "" };
  }
  function adpBadgeHTML(costRound, pid, d) {
    var b = keeperAdpBadge(costRound, pid, d);
    if (!b) return "";
    return '<span class="kadp ' + b.cls + '" title="' + (b.cls === "good" ? "cheaper than his draft price"
      : b.cls === "bad" ? "he usually goes later than this cost" : "about his draft price") + '">ADP R' + b.round + "</span>";
  }

  // collision, walk EARLIER (a keeper never gets cheaper from a collision),

  // deterministic — the render and the start-draft materialization both call
  // this, so what the panel shows is exactly what lands on the board.
  function resolveKeeperRounds(keepers, rounds) {

    var sorted = keepers.slice().sort(function (a, b) {
      var ra = a.overrideRound || a.round, rb = b.overrideRound || b.round;

      for (var r = want; r >= 1; r--) if (!used[r]) { got = r; break; }
      if (got == null) for (var r2 = want + 1; r2 <= rounds; r2++) if (!used[r2]) { got = r2; break; }

  // ---------------- mutations ----------------
  function newDraftDoc() {

      phase: "setup",

  // ---------------- roster needs (my starting slots vs my picks) ----------------

        '<span class="mut">' + esc(p.proTeam || "FA") + (bye ? " · bye " + bye : "") +
        (p.proj != null ? " · " + p.proj + " proj" : "") +
        (p.lastPts != null ? " · " + p.lastPts + " " + lastYr : "") + "</span></span>" +
        (taken ? '<span class="tk">' + esc(taken ? (taken.abbrev || taken.name || "taken") : "") + "</span>"
          : '<button class="qbtn' + (inQueue(p.pid) ? " on" : "") + '" data-pid="' + esc(p.pid) + '" title="Queue">' + STAR_SVG + "</button>" +
            keepCell +
            (D.phase === "live" ? '<button class="btn sm pDraft" data-pid="' + esc(p.pid) + '"' + (canDraftNow ? "" : " disabled") + ">Draft</button>" : "")) +
        "</div>";
    });
    if (!list.length) {
      h += '<div class="card"><p class="mut">No players match' + (q ? ' "' + esc(q) + '"' : "") + ".</p>" +
        (q && (keepMode || D.phase === "live") ? '<button class="btn ghost sm" id="customAdd">+ Add "' + esc(q) + '" as a custom player</button>' : "") +
        "</div>";
    }
    $("pList").innerHTML = h;
    $("pList").querySelectorAll(".pDraft").forEach(function (b) {
      b.onclick = function () { var p = poolByPid[castPid(b.dataset.pid)]; if (p) armConfirm(p, "pick"); };
    });
    $("pList").querySelectorAll(".pKeep").forEach(function (b) {
      b.onclick = function () { var p = poolByPid[castPid(b.dataset.pid)]; if (p) armConfirm(p, "keep"); };
    });
    $("pList").querySelectorAll(".qbtn").forEach(function (b) {
      b.onclick = function () { toggleQueue(castPid(b.dataset.pid)); };
    });
    renderNeeds();
    renderQueue();
    // Tapping the row itself (not its buttons) opens the stats/outlook card.
    $("pList").querySelectorAll(".prow").forEach(function (row) {
      row.addEventListener("click", function (e) {
        if (e.target.closest("button")) return;
        openPlayerCard(castPid(row.dataset.pid));
      });
    });
    requestAnimationFrame(sizePList);
    var ca = $("customAdd");
    if (ca) ca.onclick = function () {
      var nm = searchQ.trim();
      if (!nm) return;
      armConfirm({ pid: "c_" + nm.toLowerCase().replace(/[^a-z0-9]+/g, "-"), name: nm, pos: "RB", proTeam: "", proTeamId: 0, custom: true },
        (D.phase === "live") ? "pick" : "keep");
    };
    $("poolNote").textContent = pool.length
      ? "ESPN " + ((info && info.ppr === false) ? "standard" : "PPR") + " rankings · " + pool.length + " players"
        + (poolHealthy(pool) ? "" : " — ESPN didn't send the defenses this time; reload to retry")
      : "Player rankings haven't loaded — search still works once they do, or add custom players.";
  }

  function armConfirm(player, mode) {
    if (mode === "keep") {
      var t0 = keeperTargetTeam();
      var st0 = t0 ? keeperStatusOf(player.pid, t0.id, D) : null;
      if (st0 && !st0.eligible) { toast(player.name + " can't be kept — " + st0.reason, true); return; }
    }
    selPlayer = { player: player, mode: mode };
    renderConfirm();
  }
  function renderConfirm() {
    var el = $("confirmBar");
    if (!selPlayer || !D) { el.hidden = true; return; }
    el.hidden = false;
    var p = selPlayer.player;
    var h = "";
    if (selPlayer.mode === "keep") {
      var t = keeperTargetTeam();
      var st = t ? keeperStatusOf(p.pid, t.id, D) : { cost: keeperCostOf(p.pid, D), keptCount: 1 };
      var ab = keeperAdpBadge(st.cost.round, p.pid, D);
      h = '<span class="what">Keep <b>' + esc(p.name) + "</b> for " + esc(t ? t.name : "?") +
        " — costs <b>Round " + st.cost.round + "</b> <span style='opacity:.7'>(" + esc(st.cost.basis) +
        (ab ? " · goes ~R" + ab.round + " in drafts" : "") +
        (st.keptCount > 1 ? " · " + ordinal(st.keptCount) + " straight keep" +
          (st.keptCount === MAX_KEEPS_OF_ONE_PLAYER ? " — last time" : "") : "") + ")</span></span>";
    } else {
      var cur = currentSlot(D);
      var ct = cur ? teamById(D, cur.teamId) : null;
      h = '<span class="what">Draft <b>' + esc(p.name) + "</b> " + esc(p.pos || "") +
        (cur ? " at pick <b>" + esc(cur.label) + "</b> for " + esc(ct ? ct.name : "?") : "") + "</span>";
    }
    if (p.custom) {
      h += '<select id="customPos">' + POS.map(function (x) {
        return '<option' + (p.pos === x ? " selected" : "") + ">" + x + "</option>";
      }).join("") + "</select>";
    }
    h += '<button class="btn" id="cbGo">' + (selPlayer.mode === "keep" ? "Keep him" : "Draft him") + "</button>" +
      '<button class="btn ghost" id="cbNo" style="background:transparent;color:#fff;border-color:#666">Cancel</button>';
    el.innerHTML = h;
    $("cbNo").onclick = function () { selPlayer = null; renderConfirm(); };
    $("cbGo").onclick = function () {
      var sp = selPlayer; selPlayer = null; renderConfirm();
      var cp = $("customPos");
      if (cp) sp.player.pos = cp.value;
      if (sp.mode === "keep") {
        var t = keeperTargetTeam();
        if (t) addKeeper(t.id, sp.player);
      } else {
        makePick(sp.player);
      }
    };
  }

  // ---------------- teams view ----------------
  function renderTeams() {
    // Lives in the right column of the combined Players & Teams view.
    if (!D) return;
    // Claim card — once you've picked your team the whole section collapses
    // to one line (release stays as the escape hatch).
    var mine = myTeam(D);
    var ch;
    if (mine) {
      ch = '<div class="card"><div class="row" style="justify-content:space-between">' +
        "<span>You run <b>" + esc(mine.name) + "</b> <span class='mut'>(" + esc(me.name) + ")</span></span>" +
        '<button class="btn ghost sm relBtn" data-tid="' + mine.id + '">release</button></div></div>';
    } else {
      ch = '<div class="card"><h2>Who are you?</h2>' +
        '<div class="row"><input type="text" id="nameIn" placeholder="Your name" value="' + esc(me.name) + '" maxlength="24">' +
        '<button class="btn ghost sm" id="nameSave">Save</button></div>' +
        '<p class="mut">Type your name, then claim your team below.</p>';
      D.teams.forEach(function (t) {
        ch += '<div class="claimrow"><b>' + esc(t.name) + "</b>" +
          (t.espnOwner ? '<span class="mut">' + esc(t.espnOwner) + "</span>" : "") +
          (t.owner
            ? '<span class="ownchip">' + esc(t.owner.name) + "</span>" +
              (isCommish(D) ? ' <button class="btn ghost sm relBtn" data-tid="' + t.id + '">release</button>' : "")
            : '<button class="btn sm claimBtn" data-tid="' + t.id + '">That\'s me</button>') +
          "</div>";
      });
      ch += "</div>";
    }
    $("claimCard").innerHTML = ch;
    var ns = $("nameSave");
    if (ns) ns.onclick = function () { setMyName($("nameIn").value); toast("Hi, " + (me.name || "friend") + "!"); renderAll(); };
    document.querySelectorAll(".claimBtn").forEach(function (b) {
      b.onclick = function () { var ni = $("nameIn"); if (ni) setMyName(ni.value); claimTeam(Number(b.dataset.tid)); };
    });
    document.querySelectorAll(".relBtn").forEach(function (b) {
      b.onclick = function () { releaseTeam(Number(b.dataset.tid)); };
    });

    // Roster browser
    if (teamSel == null || !teamById(D, teamSel)) teamSel = (mine || D.teams[0]).id;
    $("teamChips").innerHTML = D.teams.map(function (t) {
      return '<button data-tid="' + t.id + '" class="' + (teamSel === t.id ? "on" : "") + '">' + esc(t.abbrev || t.name) + "</button>";
    }).join("");
    $("teamChips").querySelectorAll("button").forEach(function (b) {
      b.onclick = function () { teamSel = Number(b.dataset.tid); renderTeams(); };
    });
    var t = teamById(D, teamSel);
    var h = '<div class="card"><h2>' + esc(t.name) + "</h2>";
    if (D.phase === "setup" || D.phase === "keepers") {
      var resolved = resolveKeeperRounds(D.keepers[t.id] || [], D.rounds);
      if (resolved.length) {
        h += "<h3>Keepers</h3>";
        resolved.forEach(function (k) {
          h += '<div class="rrow"><span class="rd">R' + k.finalRound + '</span><span class="pos" style="background:' + posColor(k.pos) + '">' + esc(k.pos) + "</span><b>" + esc(k.name) + "</b> <span class='mut'>" + esc(k.proTeam || "") + "</span></div>";
        });
      } else {
        h += '<p class="mut">No keepers picked yet.</p>';
      }
    } else {
      for (var r = 1; r <= D.rounds; r++) {
        var p = D.picks["r" + r + "_t" + t.id];
        h += p
          ? '<div class="rrow"><span class="rd">R' + r + '</span><span class="pos" style="background:' + posColor(p.pos) + '">' + esc(p.pos) + "</span><b>" + esc(p.name) + "</b><span class='mut'>" + esc(p.proTeam || "") + (p.keeper ? " · keeper" : "") + "</span></div>"
          : '<div class="rrow empty"><span class="rd">R' + r + "</span><span>—</span></div>";
      }
    }
    h += "</div>";
    $("teamRoster").innerHTML = h;
  }

  // ---------------- commish view ----------------
  function guestLink() {
    var u = new URL(location.href);
    u.searchParams.delete("c");
    return u.toString();
  }
  function commishLink(d) {
    var u = new URL(location.href);
    u.searchParams.set("c", d.commishKey);
    return u.toString();
  }
  function renderCommish() {
    var el = $("vCommish");
    el.hidden = view !== "commish" || !D || !isCommish(D);
    if (el.hidden) return;
    var d = D;
    var h = '<div class="cols2">';

    h += '<div class="card"><h2>Share links</h2>' +
      '<p class="mut">Send everyone the guest link. Keep the commissioner link to yourself — it\'s the only admin control.</p>' +
      "<b>Guest link</b><div class='linkbox' id='glink'>" + esc(guestLink()) + "</div>" +
      '<button class="btn ghost sm" id="copyGuest">Copy guest link</button> ' +
      "<b style='display:block;margin-top:10px'>Commissioner link</b><div class='linkbox'>" + esc(commishLink(d)) + "</div>" +
      '<button class="btn ghost sm" id="copyCommish">Copy commissioner link</button></div>';

    h += '<div class="card"><h2>Run the draft</h2>';
    if (d.phase === "setup") {
      h += '<p class="mut">1) Everyone claims a team → 2) open keeper picking → 3) start the draft.</p>' +
        '<button class="btn" id="phKeepers">Open keeper picking</button> ' +
        '<button class="btn ghost" id="phLiveDirect">Skip keepers → start draft</button>';
    } else if (d.phase === "keepers") {
      h += '<p class="mut">Keepers lock onto the board when you start. Rows marked * were bumped by a same-round collision.</p>' +
        '<button class="btn" id="phLive">Start the draft</button> ' +
        '<button class="btn ghost sm" id="phBackSetup">Back to setup</button>';
    } else if (d.phase === "live") {
      h += '<button class="btn" id="phPause">' + (d.paused ? "Resume" : "Pause") + "</button> " +
        '<button class="btn ghost" id="phUndo">Undo last pick</button> ' +
        '<button class="btn warn" id="phEnd">End draft</button>';
    } else {
      h += '<p>Draft complete.</p><button class="btn ghost" id="phReopen">Reopen (back to live)</button>';
    }
    h += "</div>";

    h += '<div class="card"><h2>Settings</h2>' +
      '<div class="row"><label>Rounds <input type="number" id="setRounds" min="4" max="30" value="' + d.rounds + '" style="width:70px"' + (d.phase === "live" || d.phase === "done" ? " disabled" : "") + "></label>" +
      '<label>Pick clock (sec, 0 = off) <input type="number" id="setTimer" min="0" max="600" value="' + d.timerSecs + '" style="width:80px"></label>' +
      '<button class="btn ghost sm" id="setSave">Apply</button></div>' +
      '<p class="mut">Format: ' + ((info && info.ppr === false) ? "Standard" : "PPR") + " rankings · " + d.teams.length + " teams</p>" +
      (LOCAL ? '<label class="row" style="margin:8px 0"><input type="checkbox" id="mockToggle"' + (d.mock ? " checked" : "") +
        "> Mock draft — auto-pick for unclaimed teams (practice mode)</label>" : "") +
      '<div class="row"><button class="btn ghost sm" id="refreshData">Refresh ESPN data</button>' +
      '<button class="btn ghost sm" id="resetClaims">Reset team claims</button>' +
      '<button class="btn warn sm" id="resetBoard">Reset the board</button></div></div>';

    // Mock drafting lives in the PRACTICE room — a private copy on this
    // device only, so a rehearsal can never touch the family's real board.
    h += LOCAL
      ? '<div class="card"><h2>Practice room</h2>' +
        '<p class="mut">This is the private practice copy — nothing here touches the family draft. ' +
        "Claim a team, start the draft, and flip on Mock draft above: bots pick for every unclaimed team while you take your own turns.</p>" +
        '<p><a class="btn ghost sm" style="text-decoration:none" href="ffdraft.html">‹ Back to the real draft room</a></p></div>'
      : '<div class="card"><h2>Mock draft</h2>' +
        '<p class="mut">Rehearse the whole night in a private practice room on this device — claim your team, turn on Mock draft, and bots pick for the other seven. The family board is never touched.</p>' +
        '<p><a class="btn ghost sm" style="text-decoration:none" href="ffdraft.html?local=1">Open the practice room</a></p></div>';

    h += '<div class="card"><h2>Draft order</h2>' +
      '<p class="mut">Round 1 order, top to bottom (snakes each round).' + (d.phase === "live" || d.phase === "done" ? " Locked — the draft has started." : "") + "</p>";
    d.teams.forEach(function (t, i) {
      h += '<div class="ordrow"><span class="n">' + (i + 1) + "</span><b>" + esc(t.name) + "</b>" +
        (t.owner ? '<span class="ownchip">' + esc(t.owner.name) + "</span>" : '<span class="mut">unclaimed</span>') +
        (d.phase === "setup" || d.phase === "keepers"
          ? '<button class="btn ghost sm ordUp" data-i="' + i + '">↑</button><button class="btn ghost sm ordDn" data-i="' + i + '">↓</button>'
          : "") +
        "</div>";
    });
    if (d.phase === "setup" || d.phase === "keepers") {
      h += '<p style="margin-top:8px"><button class="btn ghost sm" id="ordShuffle">Shuffle order</button></p>';
    }
    h += "</div></div>";
    el.innerHTML = h;

    function on(id, fn) { var b = $(id); if (b) b.onclick = fn; }
    on("copyGuest", function () { copyText(guestLink()); });
    on("copyCommish", function () { copyText(commishLink(d)); });
    on("phKeepers", function () { setPhase("keepers"); });
    on("phLiveDirect", function () { if (confirm("Start the draft with no keepers?")) setPhase("live"); });
    on("phLive", function () { if (confirm("Start the draft? Keepers lock onto the board.")) setPhase("live"); });
    on("phBackSetup", function () { setPhase("setup"); });
    on("phPause", togglePause);
    on("phUndo", undoLast);
    on("phEnd", function () { if (confirm("End the draft?")) setPhase("done"); });
    on("phReopen", function () { setPhase("live"); });
    on("setSave", function () {
      // Read both BEFORE mutating — the first apply re-renders this panel and
      // would reset the second input under us. Rounds are skipped once the
      // draft is live (the input is disabled then).
      var roundsLocked = $("setRounds").disabled;
      var rv = $("setRounds").value, tv = $("setTimer").value;
      var p = roundsLocked ? Promise.resolve() : setSetting("rounds", rv);
      p.then(function () { return setSetting("timerSecs", tv); });
      toast("Settings applied");
    });
    on("refreshData", function () {
      toast("Refreshing ESPN data…");
      Promise.all([loadInfo(true), loadLastDraft(true)]).then(function () { return loadPool(true); }).then(renderAll);
    });
    on("resetBoard", function () { if (confirm("Clear every pick and go back to setup? Keepers are kept.")) resetDraft(); });
    on("resetClaims", function () { if (confirm("Release EVERY team claim? Everyone re-claims their team (keepers and picks stay).")) resetClaims(); });
    var mt = $("mockToggle");
    if (mt) mt.onchange = function () {
      var v = mt.checked;
      act(function (dd) {
        if (!isCommish(dd)) throw new Error("Commissioner only");
        dd.mock = v;
        return dd;
      }, v ? "Mock draft ON — bots pick for unclaimed teams" : "Mock draft off");
    };
    on("ordShuffle", shuffleOrder);
    el.querySelectorAll(".ordUp").forEach(function (b) { b.onclick = function () { moveTeam(Number(b.dataset.i), -1); }; });
    el.querySelectorAll(".ordDn").forEach(function (b) { b.onclick = function () { moveTeam(Number(b.dataset.i), 1); }; });
  }
  function copyText(s) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(s).then(function () { toast("Copied!"); }, function () { toast("Couldn't copy — long-press the link", true); });
    } else toast("Long-press the link to copy it", true);
  }

  function renderAll() {
    renderHeader();
    renderClock();
    renderTabs();
    renderLanding();
    placePanels();
    renderBoard();
    renderPlayers();
    renderTeams();
    renderCommish();
    renderConfirm();
    renderChat();
    renderPlayerCard();
    renderSound();
    watchClock();
    watchPicks();
    watchQueue();
    renderTv();
  }

  // ---------------- wiring ----------------
  $("tabs").querySelectorAll("button").forEach(function (b) {
    b.onclick = function () { view = b.dataset.v; renderAll(); };
  });
  $("pSearch").addEventListener("input", function () { searchQ = $("pSearch").value; renderPlayers(); });
  $("pHideTaken").onclick = function () { hideTaken = !hideTaken; renderPlayers(); };
  $("chatSend").onclick = function () { sendChat(); };
  $("chatIn").addEventListener("keydown", function (e) { if (e.key === "Enter") sendChat(); });
  $("pcOverlay").addEventListener("click", function (e) { if (e.target === $("pcOverlay")) closePlayerCard(); });
  if (DESK_MQ.addEventListener) DESK_MQ.addEventListener("change", function () { renderAll(); });

  // ---------------- boot ----------------
  if (TV) { document.body.classList.add("tv"); view = "board"; }
  backendReady = initBackend();
  loadInfo().then(function () { return Promise.all([loadPool(), loadLastDraft()]); }).then(renderAll);
  renderAll();

  // Test hook (house convention).
  window.__DRAFT__ = {
    get D() { return D; },
    get me() { return me; },
    get pool() { return pool; },
    get info() { return info; },
    get lastDraft() { return lastDraft; },
    get view() { return view; },
    setView: function (v) { view = v; renderAll(); },
    setMe: function (name, dev, ckey) {
      if (name != null) setMyName(name);
      if (dev != null) { me.dev = dev; localStorage.setItem("ffd_dev", dev); }
      if (ckey != null) { me.ckey = ckey; localStorage.setItem("ffd_ckey_" + SEASON, ckey); }
      renderAll();
    },
    slotSeq: function () { return D ? slotSeq(D) : []; },
    currentSlot: function () { return D ? currentSlot(D) : null; },
    keeperCostOf: function (pid) { return D ? keeperCostOf(pid, D) : null; },
    keeperStatusOf: function (pid, teamId) { return D ? keeperStatusOf(pid, teamId, D) : null; },
    keeperAdpBadge: function (costRound, pid) { return D ? keeperAdpBadge(costRound, pid, D) : null; },
    resolveKeeperRounds: resolveKeeperRounds,
    takenPids: function () { return takenPids(D); },
    createDraft: createDraft,
    claimTeam: claimTeam,
    releaseTeam: releaseTeam,
    addKeeper: addKeeper,
    removeKeeper: removeKeeper,
    setPhase: setPhase,
    makePick: makePick,
    undoLast: undoLast,
    togglePause: togglePause,
    moveTeam: moveTeam,
    setSetting: setSetting,
    resetDraft: resetDraft,
    resetClaims: resetClaims,
    renderAll: renderAll,
    backendReady: function () { return backendReady; },
    loads: function () { return Promise.all([loadInfo(), loadPool(), loadLastDraft()]); },
    get chat() { return chatMsgs; },
    get sndLog() { return sndLog; },
    sendChat: sendChat,
    openPlayerCard: openPlayerCard,
    closePlayerCard: closePlayerCard,
    panelOnBoard: panelOnBoard,
    valueBadge: valueBadge,
    get queue() { return queue; },
    toggleQueue: toggleQueue,
    needsFor: needsFor,
    titleFlashing: function () { return !!titleTimer; },
    clockMine: function () { return myClockNow().mine; },
    setMockDelay: function (ms) { mockDelayMs = ms; },
    spotlight: spotlight,
  };
})();
</script>
</body>
</html>
