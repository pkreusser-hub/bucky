<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Draft Day — live keeper draft board</title>
<meta name="description" content="Live fantasy football keeper draft board — claim your team, set your keepers, draft from ESPN rankings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   DRAFT DAY — standalone page, deliberately NO Bucky chrome. Anyone with the
   link can use it; the commissioner's link carries ?c=<key>. Warm-cream app
   chrome (the site's palette) around a DARK draft board (the projector look).
   ========================================================================== */
:root{
  --bg:#f4f1e8; --card:#fffdf7; --ink:#24312b; --muted:#6b7a70; --line:#e2ddcc;
  --pine:#3f5c46; --pine-d:#324a38; --clay:#b8552f; --gold:#e0a83a;
  --board-bg:#171a20; --board-line:#262b35; --board-ink:#f2f2ee;
  --pos-QB:#8e3b4e; --pos-RB:#2f7a55; --pos-WR:#33639b; --pos-TE:#b0742f;
  --pos-K:#7b5ea7; --pos-DST:#6b6154; --pos-X:#4a4f5a;
  --ok:#2f7a55; --bad:#a8442e;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.45 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:64px;
}
button{font:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
[hidden]{display:none !important}

/* ---------- header ---------- */
header{
  background:var(--card); border-bottom:1px solid var(--line);
  padding:10px 14px 8px;
}
.brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.wordmark{
  font-family:Fraunces,Georgia,serif; font-weight:700; font-size:21px; color:var(--pine);
  letter-spacing:.2px; white-space:nowrap;
}
#lgName{color:var(--muted); font-size:13px; font-weight:600}
#phaseLine{color:var(--muted); font-size:12.5px; margin-top:2px}
#connBanner{
  background:#7e2f1d; color:#fff; padding:8px 14px; font-size:13.5px; font-weight:600;
}
#localBadge{
  background:#eadfa9; color:#5d4a12; padding:6px 14px; font-size:12.5px; font-weight:600;
}

/* ---------- on-the-clock strip ---------- */
#clockStrip{
  background:var(--pine); color:#fff; padding:8px 14px;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  position:sticky; top:0; z-index:29;
}
#clockStrip .pickno{
  font-family:Fraunces,Georgia,serif; font-weight:700; font-size:19px; white-space:nowrap;
}
#clockStrip .who{font-weight:700; font-size:16px}
#clockStrip .own{opacity:.75; font-size:12.5px}
#clockStrip .next{opacity:.8; font-size:12.5px; margin-left:auto; text-align:right}
#clockStrip .cd{
  font-variant-numeric:tabular-nums; font-weight:700; font-size:18px;
  background:rgba(0,0,0,.25); border-radius:8px; padding:2px 10px; white-space:nowrap;
}
#clockStrip .cd.low{background:var(--clay); animation:cdpulse 1s infinite}
@keyframes cdpulse{50%{opacity:.55}}
#clockStrip.paused{background:#6b6154}
#clockStrip.done{background:var(--gold); color:#3a2c07}

/* ---------- tabs ---------- */
nav#tabs{
  display:flex; gap:6px; padding:8px 12px; background:var(--bg);
  border-bottom:1px solid var(--line);
  overflow-x:auto;
}
nav#tabs button{
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:999px; padding:7px 15px; font-weight:700; font-size:13.5px; white-space:nowrap;
}
nav#tabs button.on{background:var(--pine); border-color:var(--pine); color:#fff}

main{max-width:1160px; margin:0 auto; padding:12px}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:14px; margin-bottom:12px;
}
.card h2{font-family:Fraunces,Georgia,serif; font-size:17px; margin:0 0 8px; color:var(--pine)}
.card h3{font-size:14px; margin:12px 0 6px}
.mut{color:var(--muted); font-size:12.5px}
.btn{
  border:1px solid var(--pine); background:var(--pine); color:#fff; border-radius:10px;
  padding:9px 16px; font-weight:700; font-size:14px;
}
.btn.ghost{background:var(--card); color:var(--pine)}
.btn.warn{background:var(--clay); border-color:var(--clay)}
.btn.sm{padding:5px 10px; font-size:12.5px; border-radius:8px}
.btn:disabled{opacity:.45; cursor:default}
.row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
input[type=text],input[type=number],select{
  border:1px solid var(--line); border-radius:9px; padding:8px 10px; background:#fff;
}

/* ---------- board ---------- */
.panner{overflow-x:auto; -webkit-overflow-scrolling:touch}
#boardGrid{
  background:var(--board-bg); border-radius:12px; padding:8px;
  display:grid; gap:3px; width:max-content; min-width:100%;
}
.bhead{
  color:var(--board-ink); font-weight:700; font-size:12px; text-align:center;
  padding:6px 4px 4px; line-height:1.15;
}
.bhead .own{display:block; font-weight:400; font-size:10px; opacity:.6}
.brnd{
  color:#8b93a3; font-weight:700; font-size:11px; display:flex; align-items:center;
  justify-content:center; gap:2px;
}
.cell{
  border-radius:6px; min-height:44px; padding:4px 6px; color:#fff; position:relative;
  font-size:11.5px; line-height:1.2; background:#20242d; border:1px solid var(--board-line);
  overflow:hidden;
}
.cell b{display:block; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cell .pn{position:absolute; top:2px; right:5px; font-size:9px; opacity:.65}
.cell .pt{font-size:10px; opacity:.75}
.cell.pos-QB{background:var(--pos-QB); border-color:transparent}
.cell.pos-RB{background:var(--pos-RB); border-color:transparent}
.cell.pos-WR{background:var(--pos-WR); border-color:transparent}
.cell.pos-TE{background:var(--pos-TE); border-color:transparent}
.cell.pos-K{background:var(--pos-K); border-color:transparent}
.cell.pos-DST{background:var(--pos-DST); border-color:transparent}
.cell.pos-X{background:var(--pos-X); border-color:transparent}
.cell.cur{outline:2px solid var(--gold); animation:curpulse 1.4s infinite}
@keyframes curpulse{50%{outline-color:rgba(224,168,58,.35)}}
.cell.deck{outline:1.5px dashed rgba(224,168,58,.55)}
.cell .kb{font-size:10px}

/* ---------- players ---------- */
#pSearchRow{display:flex; gap:8px; margin-bottom:8px}
#pSearch{flex:1}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px}
.chips button{
  border:1px solid var(--line); background:var(--card); border-radius:999px;
  padding:5px 12px; font-weight:700; font-size:12.5px;
}
.chips button.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.prow{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-bottom:1px solid var(--line);
  background:var(--card);
}
.prow:first-child{border-radius:10px 10px 0 0}
.prow.taken{opacity:.45}
.prow .rk{width:30px; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; font-weight:700; font-size:12.5px}
.prow .dot{width:34px; text-align:center; border-radius:6px; color:#fff; font-size:10.5px; font-weight:700; padding:3px 0}
.prow .nm{flex:1; min-width:0}
.prow .nm b{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.prow .nm .mut{font-size:11.5px}
.prow .adp{color:var(--muted); font-size:11.5px; width:52px; text-align:right}
.prow .tk{font-size:11px; color:var(--muted); font-weight:700; white-space:nowrap}
.inj{color:var(--clay); font-weight:700; font-size:10.5px}
#confirmBar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--ink); color:#fff; padding:10px 14px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
#confirmBar .what{flex:1; min-width:180px; font-size:14px}
#confirmBar select{border-radius:8px; padding:6px}

/* ---------- keepers ---------- */
.keepCard .krow{
  display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line);
}
.keepCard .krow .cost{
  background:var(--pine); color:#fff; border-radius:8px; padding:2px 9px; font-weight:700;
  font-size:12.5px; white-space:nowrap;
}
.keepCard .krow .basis{color:var(--muted); font-size:11.5px}
.kslot{color:var(--muted); font-style:italic; padding:7px 0}

/* ---------- teams ---------- */
.tchips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px}
.tchips button{
  border:1px solid var(--line); background:var(--card); border-radius:10px; padding:6px 11px;
  font-weight:700; font-size:12.5px;
}
.tchips button.on{background:var(--pine); color:#fff; border-color:var(--pine)}
.rrow{display:flex; gap:10px; padding:6px 0; border-bottom:1px dashed var(--line); align-items:center}
.rrow .rd{width:34px; color:var(--muted); font-weight:700; font-size:12px; text-align:right}
.rrow .pos{width:34px; text-align:center; border-radius:6px; color:#fff; font-size:10.5px; font-weight:700; padding:3px 0}
.rrow.empty{color:var(--muted); font-style:italic}
.claimrow{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line)}
.claimrow b{flex:1}
.ownchip{background:#e8efe9; color:var(--pine-d); border-radius:999px; padding:3px 10px; font-size:12px; font-weight:700}

/* ---------- commish ---------- */
.linkbox{
  background:#f0ede1; border:1px dashed var(--line); border-radius:10px; padding:9px 11px;
  font-size:12px; word-break:break-all; margin:4px 0 8px; font-family:ui-monospace,monospace;
}
.ordrow{display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px dashed var(--line)}
.ordrow .n{width:22px; color:var(--muted); font-weight:700; text-align:right}
.ordrow b{flex:1}

/* ---------- desktop: board + players side by side ---------- */
#boardRail{min-width:0}
@media (min-width:1100px){
  #vBoard .boardwrap{display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:14px; align-items:start}
}

/* ---------- players list: its own scroll, richer rows ---------- */
#pList{overflow-y:auto; -webkit-overflow-scrolling:touch; border-radius:10px}
.prow .tlogo{width:22px; height:22px; object-fit:contain; flex:0 0 auto}
.prow .pstat{width:72px; text-align:right; font-size:11px; color:var(--muted); line-height:1.3; font-variant-numeric:tabular-nums; flex:0 0 auto}
.prow .pstat b{color:var(--ink); font-weight:700}
.prow{cursor:pointer}

/* ---------- player detail card ---------- */
#pcOverlay{position:fixed; inset:0; background:rgba(24,28,20,.55); z-index:50; display:flex; align-items:center; justify-content:center; padding:14px}
#pcCard{background:var(--card); border-radius:16px; max-width:460px; width:100%; max-height:88vh; overflow-y:auto; padding:16px; border:1px solid var(--line)}
#pcCard h2{margin:0; font-family:Fraunces,Georgia,serif; color:var(--pine); font-size:20px}
#pcCard .tlogo{width:42px; height:42px; object-fit:contain}
.pctotals{display:flex; gap:10px; margin:12px 0 4px}
.pctotals .tot{flex:1; background:#f0ede1; border-radius:10px; padding:8px 10px; text-align:center}
.pctotals .tot b{display:block; font-size:18px}
.pctotals .tot span{font-size:11px; color:var(--muted)}
.pcstats{width:100%; border-collapse:collapse; margin:8px 0; font-size:13px}
.pcstats th,.pcstats td{padding:4px 6px; border-bottom:1px dashed var(--line); text-align:right; font-variant-numeric:tabular-nums}
.pcstats th:first-child,.pcstats td:first-child{text-align:left}
.pcstats th{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.4px}
.pcout{font-size:13.5px; line-height:1.5; overflow-wrap:anywhere}
.pcact{display:flex; gap:8px; margin-top:12px; align-items:center}

/* ---------- draft chat ---------- */
#chatCard{margin-top:12px}
#chatMsgs{height:230px; overflow-y:auto; background:#faf8f0; border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:13.5px}
#chatMsgs .cmsg{margin-bottom:6px; overflow-wrap:anywhere}
#chatMsgs .cmsg b{color:var(--pine-d)}
#chatMsgs .cmsg .ct{color:var(--muted); font-size:10.5px; margin-left:6px}
#chatMsgs .cempty{color:var(--muted); font-style:italic}
#chatRow{display:flex; gap:8px; margin-top:8px}
#chatIn{flex:1; min-width:0}

/* ---------- toasts ---------- */
#toastWrap{position:fixed; left:50%; transform:translateX(-50%); bottom:70px; z-index:60; display:flex; flex-direction:column; gap:6px}
.toast{
  background:var(--ink); color:#fff; border-radius:10px; padding:9px 16px; font-weight:600;
  font-size:13.5px; box-shadow:0 4px 14px rgba(0,0,0,.25); max-width:88vw;
}
.toast.err{background:var(--bad)}

/* ---------- landing ---------- */
#vLanding .hero{
  text-align:center; padding:34px 16px;
}
#vLanding .hero h1{font-family:Fraunces,Georgia,serif; color:var(--pine); font-size:30px; margin:0 0 6px}
@media (min-width:760px){
  .cols2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
}
</style>
</head>
<body>
<div id="connBanner" hidden>⚠️ Can't reach the draft room — check your connection and reload.</div>
<div id="localBadge" hidden>🧪 Practice mode — this draft lives on this device only.</div>
<header>
  <div class="brand"><span class="wordmark">🏈 Draft Day</span><span id="lgName"></span></div>
  <div id="phaseLine"></div>
</header>
<div id="clockStrip" hidden></div>
<nav id="tabs" hidden>
  <button data-v="board">📋 Board</button>
  <button data-v="players">👤 Players</button>
  <button data-v="teams">🏈 Teams</button>
  <button data-v="commish" id="tabCommish" hidden>⚙️ Commish</button>
</nav>
<main>
  <section id="vLanding" hidden></section>
  <section id="vBoard" hidden>
    <div class="boardwrap">
      <div class="boardmain">
        <div class="panner"><div id="boardGrid"></div></div>
        <p class="mut" id="boardLegend" style="margin-top:8px"></p>
        <div id="boardChatSlot"></div>
      </div>
      <aside id="boardRail" hidden></aside>
    </div>
  </section>
  <section id="vPlayers" hidden>
    <div id="playersHost"><div id="playersPanel">
      <div id="keeperPanel"></div>
      <div id="pSearchRow">
        <input type="text" id="pSearch" placeholder="Search players…" autocomplete="off">
        <button class="btn ghost sm" id="pHideTaken">Hide taken</button>
      </div>
      <div class="chips" id="posChips"></div>
      <div id="pList"></div>
      <p class="mut" id="poolNote" style="margin-top:8px"></p>
    </div></div>
    <div id="playersChatSlot"></div>
  </section>
  <section id="vTeams" hidden>
    <div id="claimCard"></div>
    <div class="tchips" id="teamChips"></div>
    <div id="teamRoster"></div>
  </section>
  <section id="vCommish" hidden></section>
</main>
<div class="card" id="chatCard" hidden>
  <h2>💬 Draft chat</h2>
  <div id="chatMsgs"></div>
  <div id="chatRow">
    <input type="text" id="chatIn" placeholder="Say something…" maxlength="300" autocomplete="off">
    <button class="btn sm" id="chatSend">Send</button>
  </div>
</div>
<div id="pcOverlay" hidden><div id="pcCard"></div></div>
<div id="confirmBar" hidden></div>
<div id="toastWrap"></div>

<script>
(function () {
  "use strict";

  // The real gate is server-side: sports.mjs checks this against BUCKY_NOTIFY_SECRET.
  var FAMILY_PASSWORD = "amenfarms";
  var FN = "/.netlify/functions/sports";
  var POS = ["QB", "RB", "WR", "TE", "K", "DST"];
  var MAX_KEEPERS = 3;
  var MAX_KEEPS_OF_ONE_PLAYER = 3;   // "no player can be kept more than 3 times"

  var qs = new URLSearchParams(location.search);
  var LOCAL = qs.get("local") === "1";

  // The league year this draft belongs to (Jan/Feb still belong to LAST season).
  function seasonNow() {
    if (/^\d{4}$/.test(qs.get("season") || "")) return Number(qs.get("season"));
    var d = new Date();
    return d.getUTCMonth() < 2 ? d.getUTCFullYear() - 1 : d.getUTCFullYear();
  }
  var SEASON = seasonNow();

  // Same family-key derivation as every Bucky page (?fam= is the test override).
  function roomId(pw) {
    var h = 0;
    for (var i = 0; i < pw.length; i++) h = (h * 31 + pw.toLowerCase().charCodeAt(i)) >>> 0;
    return "fam" + h.toString(36);
  }
  var FAMILY_KEY = qs.get("fam") || roomId(FAMILY_PASSWORD);
  var DOC_COLL = "ffdraft_" + FAMILY_KEY;
  var DOC_ID = "draft_" + SEASON;

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function toast(msg, isErr, ms) {
    var w = $("toastWrap");
    while (w.children.length >= 2) w.removeChild(w.firstChild);
    var d = document.createElement("div");
    d.className = "toast" + (isErr ? " err" : "");
    d.textContent = msg;
    w.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, ms || 3500);
  }

  // ---------------- identity (loginless): a name + a device token ----------------
  function rndKey(n) {
    var a = "abcdefghjkmnpqrstuvwxyz23456789", s = "";
    for (var i = 0; i < n; i++) s += a[Math.floor(Math.random() * a.length)];
    return s;
  }
  var me = {
    name: localStorage.getItem("ffd_name") || "",
    dev: localStorage.getItem("ffd_dev") || "",
    ckey: localStorage.getItem("ffd_ckey_" + SEASON) || "",
  };
  if (!me.dev) { me.dev = rndKey(10); localStorage.setItem("ffd_dev", me.dev); }
  // The commissioner's link carries ?c=<key>; adopt it, then clean the URL so
  // the address bar copy someone shares is the GUEST link.
  if (qs.get("c")) {
    me.ckey = qs.get("c");
    localStorage.setItem("ffd_ckey_" + SEASON, me.ckey);
    qs.delete("c");
    try { history.replaceState(null, "", location.pathname + (qs.toString() ? "?" + qs.toString() : "")); } catch (e) {}
  }
  function setMyName(n) {
    me.name = String(n || "").trim().slice(0, 24);
    localStorage.setItem("ffd_name", me.name);
  }

  // ---------------- state ----------------
  var D = null;              // the shared draft doc
  var info = null;           // ff_draftinfo (league facts) — cached
  var pool = [];             // ff_draftpool players — cached
  var poolByPid = {};
  var lastDraft = null;      // ff_lastdraft — cached
  var view = "board";
  var posFilter = "ALL";
  var hideTaken = false;
  var searchQ = "";
  var selPlayer = null;      // pending confirm { player, mode:"pick"|"keep" }
  var teamSel = null;        // Teams view selection
  var keepFor = null;        // commish: which team keepers are being set for
  var connState = "boot";    // boot | ok | dead
  var backendReady = null;
  var chatMsgs = [];         // the shared draft chat
  var pcPid = null;          // player detail card: open pid (null = closed)
  var cardCache = {};        // pid -> ff_player payload (or {err})
  var DESK_MQ = window.matchMedia("(min-width:1100px)");

  // ---------------- backend: Firestore doc, or localStorage in practice mode ----
  // ONE draft doc; every mutation is a transaction-style read-modify-write so
  // two phones can't double-pick. In LOCAL mode the same mutation functions run
  // against localStorage (used by the test suite and for practice drafts) —
  // cloud failure NEVER silently falls back to local: that would put eight
  // people in eight separate drafts. It shows the red banner instead.
  var Cloud = { fs: null, db: null, ref: null };

  function localRead() {
    try { return JSON.parse(localStorage.getItem("ffd_local_" + SEASON) || "null"); } catch (e) { return null; }
  }
  function localWrite(d) {
    localStorage.setItem("ffd_local_" + SEASON, JSON.stringify(d));
  }
  var CHAT_KEY = "ffd_localchat_" + SEASON;
  function localChatRead() {
    try { return JSON.parse(localStorage.getItem(CHAT_KEY) || "[]") || []; } catch (e) { return []; }
  }

  function initBackend() {
    if (LOCAL) {
      connState = "ok";
      $("localBadge").hidden = false;
      D = localRead();
      chatMsgs = localChatRead();
      // Another tab on this device counts as another "device" in practice mode.
      window.addEventListener("storage", function (e) {
        if (e.key === "ffd_local_" + SEASON) { D = localRead(); renderAll(); }
        if (e.key === CHAT_KEY) { chatMsgs = localChatRead(); renderChat(); }
      });
      renderAll();
      return Promise.resolve();
    }
    return import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js").then(function (appMod) {
      return import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js").then(function (fs) {
        var app = appMod.initializeApp({
          apiKey: "AIzaSyAA1hn-j9_pPuXoaHIzcyyXYJN6EhUccJU",
          authDomain: "amen-farms-app.firebaseapp.com",
          projectId: "amen-farms-app",
          storageBucket: "amen-farms-app.firebasestorage.app",
          messagingSenderId: "321230755979",
          appId: "1:321230755979:web:d362c56aaf7e50b4ab5c8e",
        }, "ffdraft");
        Cloud.fs = fs;
        Cloud.db = fs.getFirestore(app);
        Cloud.ref = fs.doc(Cloud.db, DOC_COLL, DOC_ID);

  // ---------------- draft-doc derivations (pure) ----------------

      // The slot key carries the team: "r<round>_t<teamId>".

  // ---------------- keeper costs (the family rule) ----------------
  // Kept or drafted last year: this year costs one round EARLIER (a 1st stays
  // a 1st) — last year's ESPN draft shows a keeper AT his cost round, so
  // "last round − 1" covers both cases. Waiver pickups (absent from last
  // year's draft) cost the team's LATEST pick. The commissioner can override
  // any cost and tracks the kept-count (3 keeps max per player).
  function keeperCostOf(pid, d) {
    var lp = null;
    if (lastDraft && lastDraft.picks) {
      for (var i = 0; i < lastDraft.picks.length; i++) {
        if (lastDraft.picks[i].pid === pid) { lp = lastDraft.picks[i]; break; }
      }
    }
    if (!lp) return { round: d.rounds, basis: "waiver pickup → latest pick", waiver: true, keptBefore: false };
    var r = Math.max(1, (lp.round || d.rounds) - 1);
    return {
      round: r,
      basis: (lp.keeper ? "kept last year (R" + lp.round + ")" : "drafted R" + lp.round + " last year") + " → R" + r,
      waiver: false,

  // Resolve a team's keepers onto distinct rounds. Requested round first; on a
  // collision, walk EARLIER (a keeper never gets cheaper from a collision),
  // then later from the requested round if nothing earlier is free. Pure and
  // deterministic — the render and the start-draft materialization both call
  // this, so what the panel shows is exactly what lands on the board.
  function resolveKeeperRounds(keepers, rounds) {

      // keepers were set must never strand a keeper off the grid.
      var want = Math.min(rounds, Math.max(1, k.overrideRound || k.round));
      var got = null;
      for (var r = want; r >= 1; r--) if (!used[r]) { got = r; break; }
      if (got == null) for (var r2 = want + 1; r2 <= rounds; r2++) if (!used[r2]) { got = r2; break; }
      if (got == null) got = want;
      used[got] = true;
      return Object.assign({}, k, { finalRound: got, bumped: got !== want });
    });
  }

    if (taken) h += '<span class="mut">On ' + esc(taken.name || "a roster") + "</span>";
    else if (keepMode && t) h += '<button class="btn" id="pcKeep">🔒 Keep him</button>';
    else if (D.phase === "live") h += '<button class="btn" id="pcDraft"' + (canDraftNow ? "" : " disabled") + ">Draft him</button>";
    h += "</div>";
    $("pcCard").innerHTML = h;
    $("pcClose").onclick = closePlayerCard;
    var kb = $("pcKeep"), db = $("pcDraft");
    var player = poolByPid[pcPid];

    if (db && player) db.onclick = function () { closePlayerCard(); armConfirm(player, "pick"); };

  // ---------------- rendering ----------------
  function fmtName(full) {
    var parts = String(full || "").split(" ");

  function phaseText(d) {
    if (!d) return "";

    if (d.phase === "keepers") {
      var total = 0;
      Object.keys(d.keepers || {}).forEach(function (k) { total += (d.keepers[k] || []).length; });
      return "🔒 Keeper picking is open — choose up to " + MAX_KEEPERS + " in the Players tab (" + total + " kept so far).";

  function renderHeader() {

  function renderClock() {
    var el = $("clockStrip");
    if (!D || (D.phase !== "live" && D.phase !== "done")) { el.hidden = true; return; }
    el.hidden = false;
    el.className = D.phase === "done" ? "done" : (D.paused ? "paused" : "");
    if (D.phase === "done") {
      el.innerHTML = '<span class="pickno">🏆 That\'s a wrap!</span><span class="who">Draft complete — see the Board.</span>';
      return;
    }
    var cur = currentSlot(D);

  function tickClock() {
    var el = $("cdown");

    var left = Math.max(0, D.deadline - Date.now());
    var s = Math.ceil(left / 1000);
    el.textContent = left <= 0 ? "TIME ⏰" : Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    el.classList.toggle("low", s <= 15);

  function renderLanding() {
    var el = $("vLanding");

          : '<p class="mut">⚠️ Couldn\'t load the ESPN league (' + esc((info && info.reason) || "error") + ") — the room will start with placeholder team names the commissioner can fix later.</p>")) +
      "</div>";

  function posClass(pos) { return POS.indexOf(pos) >= 0 ? "pos-" + pos : "pos-X"; }

  }

  function renderBoard() {
    var el = $("vBoard");
    el.hidden = view !== "board" || !D;
    if (el.hidden) return;
    var g = $("boardGrid");
    var cur = D.phase === "live" ? currentSlot(D) : null;
    var deck = cur ? nextSlotAfter(D, cur) : null;
    var cols = D.teams.length;
    g.style.gridTemplateColumns = "40px repeat(" + cols + ", minmax(88px, 1fr))";
    var h = '<div class="bhead" style="color:#8b93a3">RD</div>';
    D.teams.forEach(function (t) {
      h += '<div class="bhead">' + esc(t.abbrev || t.name) +
        '<span class="own">' + esc(t.owner ? t.owner.name : "—") + "</span></div>";
    });
    for (var r = 1; r <= D.rounds; r++) {
      var ids = r % 2 === 1 ? D.teams : D.teams.slice().reverse();
      h += '<div class="brnd">' + r + (r % 2 === 1 ? " →" : " ←") + "</div>";
      // Cells render in TEAM-COLUMN order; the snake lives in the pick labels.
      D.teams.forEach(function (t) {
        var key = "r" + r + "_t" + t.id;
        var p = D.picks[key];
        var seqIdx = (r % 2 === 1 ? D.teams.indexOf(t) : cols - 1 - D.teams.indexOf(t)) + 1;
        var label = r + "." + String(seqIdx).padStart(2, "0");
        var cls = "cell";
        if (p) cls += " " + posClass(p.pos);
        if (cur && cur.key === key) cls += " cur";
        else if (deck && deck.key === key) cls += " deck";
        h += '<div class="' + cls + '" data-key="' + key + '">' +
          '<span class="pn">' + esc(label) + "</span>" +
          (p ? ((p.keeper ? '<span class="kb">🔒 </span>' : "") + "<b>" + esc(fmtName(p.name)) + "</b>" +
            '<span class="pt">' + esc(p.pos) + (p.proTeam ? " · " + esc(p.proTeam) : "") + "</span>")
            : "") +
          "</div>";
      });
    }

    $("boardLegend").innerHTML = POS.map(function (p) {

  // ---------------- players view ----------------
  function playerBye(p) {

  }
  function keeperTargetTeam() {
    // Whose keepers get set from the Players tab: the commish's selected team,

  }
  function renderKeeperPanel() {

    var t = keeperTargetTeam();

    if (isCommish(D)) {
      h += '<div class="row" style="margin-bottom:6px"><span class="mut">Setting keepers for:</span>' +
        '<select id="keepForSel">' + D.teams.map(function (x) {

        }).join("") + "</select></div>";

    }

    h += '<p class="mut">' + esc(t.name) + " can keep up to " + MAX_KEEPERS + ". A keeper costs one round earlier than last year (1sts stay 1sts); waiver pickups cost your latest pick.</p>";
    resolved.forEach(function (k) {
      var overKept = (k.keptCount || 1) > MAX_KEEPS_OF_ONE_PLAYER;
      h += '<div class="krow" data-pid="' + esc(k.pid) + '">' +
        '<span class="cost">R' + k.finalRound + (k.bumped ? "*" : "") + "</span>" +
        "<div style='flex:1'><b>" + esc(k.name) + "</b> <span class='mut'>" + esc(k.pos) + (k.proTeam ? " · " + esc(k.proTeam) : "") + "</span>" +
        '<div class="basis">' + esc(k.basis) + (k.bumped ? " · bumped (round taken by another keeper)" : "") +
        " · kept ×" + (k.keptCount || 1) + (overKept ? ' <span class="inj">— over the 3-keep limit!</span>' : "") + "</div></div>" +
        (isCommish(D) ?
          '<select class="kOver" data-pid="' + esc(k.pid) + '" title="Commissioner: override the round">' +
          '<option value="">auto</option>' +
          Array.from({ length: D.rounds }, function (_, i) {
            return '<option value="' + (i + 1) + '"' + (k.overrideRound === i + 1 ? " selected" : "") + ">R" + (i + 1) + "</option>";
          }).join("") + "</select>" +
          '<select class="kCount" data-pid="' + esc(k.pid) + '" title="Years kept in a row (counting this one)">' +
          [1, 2, 3, 4].map(function (n) { return '<option value="' + n + '"' + ((k.keptCount || 1) === n ? " selected" : "") + ">×" + n + "</option>"; }).join("") +
          "</select>"
          : "") +
        '<button class="btn ghost sm kDel" data-pid="' + esc(k.pid) + '">✕</button>' +
        "</div>";
    });
    for (var i = list.length; i < MAX_KEEPERS; i++) {
      h += '<div class="kslot">Keeper slot ' + (i + 1) + " — tap 🔒 Keep on a player below</div>";
    }
    // Last year's roster = the natural keeper candidates.
    if (lastDraft && lastDraft.rosters) {
      var ros = lastDraft.rosters.find(function (r) { return r.teamId === t.id; });
      if (ros && ros.players.length) {
        var tk = takenPids(D);
        h += "<h3>Your " + esc(String(lastDraft.season)) + " roster</h3><div class='chips'>";
        ros.players.forEach(function (p) {
          if (tk[p.pid]) return;
          h += '<button class="kQuick" data-pid="' + esc(p.pid) + '">' + esc(fmtName(p.name)) + " <span class='mut'>" + esc(p.pos) + "</span></button>";
        });
        h += "</div>";
      }
    }
    h += "</div>";
    el.innerHTML = h;
    var sel = $("keepForSel");
    if (sel) sel.onchange = function () { keepFor = Number(sel.value); renderAll(); };
    el.querySelectorAll(".kDel").forEach(function (b) {
      b.onclick = function () { removeKeeper(t.id, castPid(b.dataset.pid)); };
    });
    el.querySelectorAll(".kOver").forEach(function (s) {
      s.onchange = function () { setKeeperField(t.id, castPid(s.dataset.pid), "overrideRound", s.value ? Number(s.value) : null); };
    });
    el.querySelectorAll(".kCount").forEach(function (s) {
      s.onchange = function () { setKeeperField(t.id, castPid(s.dataset.pid), "keptCount", Number(s.value)); };
    });
    el.querySelectorAll(".kQuick").forEach(function (b) {
      b.onclick = function () {
        var pid = castPid(b.dataset.pid);
        var p = poolByPid[pid] || rosterPlayer(t.id, pid);
        if (p) armConfirm(p, "keep");
      };
    });
  }
  function rosterPlayer(teamId, pid) {
    if (!lastDraft || !lastDraft.rosters) return null;
    var ros = lastDraft.rosters.find(function (r) { return r.teamId === teamId; });
    if (!ros) return null;
    return ros.players.find(function (p) { return p.pid === pid; }) || null;
  }
  // pids are numbers from ESPN but strings in data- attributes; customs are "c…" strings.
  function castPid(v) { return /^\d+$/.test(v) ? Number(v) : v; }

  // Desktop shows the players panel BESIDE the board so you can draft without
  // leaving the wall; placePanels() moves the one panel node between homes.
  function panelOnBoard() { return view === "board" && DESK_MQ.matches; }
  function placePanels() {
    var deskBoard = panelOnBoard() && !!D;
    var rail = $("boardRail");
    var panel = $("playersPanel");
    if (deskBoard) {
      rail.hidden = false;
      if (panel.parentNode !== rail) rail.appendChild(panel);
    } else {
      rail.hidden = true;
      var host = $("playersHost");
      if (panel.parentNode !== host) host.appendChild(panel);
    }
    var chat = $("chatCard");
    var slot = D && view === "board" ? $("boardChatSlot") : (D && view === "players" ? $("playersChatSlot") : null);
    chat.hidden = !slot;
    if (slot && chat.parentNode !== slot) slot.appendChild(chat);
  }
  // The list scrolls INSIDE itself — scrolling players must never scroll the page.
  function sizePList() {
    var el = $("pList");
    if (!el || !el.offsetParent) return;
    var top = el.getBoundingClientRect().top;
    el.style.maxHeight = Math.max(200, window.innerHeight - top - (selPlayer ? 84 : 16)) + "px";
  }
  window.addEventListener("resize", sizePList);

  function renderPlayers() {
    $("vPlayers").hidden = view !== "players" || !D;
    if (!D || (view !== "players" && !panelOnBoard())) return;
    renderKeeperPanel();
    var chips = $("posChips");
    chips.innerHTML = ["ALL"].concat(POS).map(function (p) {
      return '<button data-pos="' + p + '" class="' + (posFilter === p ? "on" : "") + '">' + p + "</button>";
    }).join("");
    chips.querySelectorAll("button").forEach(function (b) {
      b.onclick = function () { posFilter = b.dataset.pos; renderPlayers(); };
    });
    $("pHideTaken").classList.toggle("on", hideTaken);
    $("pHideTaken").textContent = hideTaken ? "Show taken" : "Hide taken";

    var tk = takenPids(D);
    var q = searchQ.trim().toLowerCase();
    var list = pool.filter(function (p) {
      if (posFilter !== "ALL" && p.pos !== posFilter) return false;
      if (q && p.name.toLowerCase().indexOf(q) < 0) return false;
      if (hideTaken && tk[p.pid]) return false;
      return true;
    }).slice(0, 120);

    var keepMode = D.phase === "keepers" || D.phase === "setup";
    var t = keeperTargetTeam();
    var cur = D.phase === "live" ? currentSlot(D) : null;
    var canDraftNow = !!(cur && canPickFor(D, cur.teamId) && !D.paused);
    var lastYr = "’" + String(SEASON - 1).slice(2);
    var h = "";
    list.forEach(function (p) {

      h += '<div class="prow' + (taken ? " taken" : "") + '" data-pid="' + esc(p.pid) + '" title="Tap for stats & outlook">' +
        '<span class="rk">' + (p.rank != null ? p.rank : "—") + "</span>" +
        '<span class="dot" style="background:' + posColor(p.pos) + '">' + esc(p.pos || "?") + "</span>" +
        teamLogoImg(p.proTeam) +

        '<span class="mut">' + esc(p.proTeam || "FA") + (bye ? " · bye " + bye : "") + "</span></span>" +
        '<span class="pstat">' + (p.proj != null ? "<b>" + p.proj + "</b> proj" : "") +

        (taken ? '<span class="tk">' + esc(taken ? (taken.abbrev || taken.name || "taken") : "") + "</span>"
          : (keepMode && t ? '<button class="btn ghost sm pKeep" data-pid="' + esc(p.pid) + '">🔒 Keep</button>' : "") +
            (D.phase === "live" ? '<button class="btn sm pDraft" data-pid="' + esc(p.pid) + '"' + (canDraftNow ? "" : " disabled") + ">Draft</button>" : "")) +

    var h = '<div class="card"><h2>' + esc(t.name) + "</h2>";
    if (D.phase === "setup" || D.phase === "keepers") {
      var resolved = resolveKeeperRounds(D.keepers[t.id] || [], D.rounds);
      if (resolved.length) {
        h += "<h3>Keepers</h3>";
        resolved.forEach(function (k) {
          h += '<div class="rrow"><span class="rd">R' + k.finalRound + '</span><span class="pos" style="background:' + posColor(k.pos) + '">' + esc(k.pos) + "</span><b>" + esc(k.name) + "</b> <span class='mut'>" + esc(k.proTeam || "") + "</span></div>";
        });
      } else {
        h += '<p class="mut">No keepers picked yet.</p>';
      }
    } else {
      for (var r = 1; r <= D.rounds; r++) {
        var p = D.picks["r" + r + "_t" + t.id];
        h += p
          ? '<div class="rrow"><span class="rd">R' + r + '</span><span class="pos" style="background:' + posColor(p.pos) + '">' + esc(p.pos) + "</span><b>" + esc(p.name) + "</b><span class='mut'>" + esc(p.proTeam || "") + (p.keeper ? " · 🔒 keeper" : "") + "</span></div>"
          : '<div class="rrow empty"><span class="rd">R' + r + "</span><span>—</span></div>";
      }
    }
    h += "</div>";
    $("teamRoster").innerHTML = h;
  }

  // ---------------- commish view ----------------
  function guestLink() {
    var u = new URL(location.href);
    u.searchParams.delete("c");
    return u.toString();
  }
  function commishLink(d) {
    var u = new URL(location.href);
    u.searchParams.set("c", d.commishKey);
    return u.toString();
  }
  function renderCommish() {
    var el = $("vCommish");
    el.hidden = view !== "commish" || !D || !isCommish(D);
    if (el.hidden) return;
    var d = D;
    var h = '<div class="cols2">';

    h += '<div class="card"><h2>🔗 Share</h2>' +
      '<p class="mut">Send everyone the guest link. Keep the commissioner link to yourself — it\'s the only admin control.</p>' +
      "<b>Guest link</b><div class='linkbox' id='glink'>" + esc(guestLink()) + "</div>" +
      '<button class="btn ghost sm" id="copyGuest">Copy guest link</button> ' +
      "<b style='display:block;margin-top:10px'>Commissioner link</b><div class='linkbox'>" + esc(commishLink(d)) + "</div>" +
      '<button class="btn ghost sm" id="copyCommish">Copy commissioner link</button></div>';

    h += '<div class="card"><h2>🚦 Run the draft</h2>';
    if (d.phase === "setup") {
      h += '<p class="mut">1) Everyone claims a team → 2) open keeper picking → 3) start the draft.</p>' +
        '<button class="btn" id="phKeepers">Open keeper picking</button> ' +
        '<button class="btn ghost" id="phLiveDirect">Skip keepers → start draft</button>';
    } else if (d.phase === "keepers") {
      h += '<p class="mut">Keepers lock onto the board when you start. Rows marked * were bumped by a same-round collision.</p>' +
        '<button class="btn" id="phLive">🏈 Start the draft</button> ' +
        '<button class="btn ghost sm" id="phBackSetup">Back to setup</button>';
    } else if (d.phase === "live") {
      h += '<button class="btn" id="phPause">' + (d.paused ? "▶ Resume" : "⏸ Pause") + "</button> " +
        '<button class="btn ghost" id="phUndo">↩ Undo last pick</button> ' +
        '<button class="btn warn" id="phEnd">End draft</button>';
    } else {
      h += '<p>🏆 Draft complete.</p><button class="btn ghost" id="phReopen">Reopen (back to live)</button>';
    }
    h += "</div>";

    h += '<div class="card"><h2>⚙️ Settings</h2>' +
      '<div class="row"><label>Rounds <input type="number" id="setRounds" min="4" max="30" value="' + d.rounds + '" style="width:70px"' + (d.phase === "live" || d.phase === "done" ? " disabled" : "") + "></label>" +
      '<label>Pick clock (sec, 0 = off) <input type="number" id="setTimer" min="0" max="600" value="' + d.timerSecs + '" style="width:80px"></label>' +
      '<button class="btn ghost sm" id="setSave">Apply</button></div>' +
      '<p class="mut">Format: ' + ((info && info.ppr === false) ? "Standard" : "PPR") + " rankings · " + d.teams.length + " teams</p>" +
      '<div class="row"><button class="btn ghost sm" id="refreshData">↻ Refresh ESPN data</button>' +
      '<button class="btn warn sm" id="resetBoard">Reset the board</button></div></div>';

    h += '<div class="card"><h2>🔀 Draft order</h2>' +
      '<p class="mut">Round 1 order, top to bottom (snakes each round).' + (d.phase === "live" || d.phase === "done" ? " Locked — the draft has started." : "") + "</p>";
    d.teams.forEach(function (t, i) {
      h += '<div class="ordrow"><span class="n">' + (i + 1) + "</span><b>" + esc(t.name) + "</b>" +
        (t.owner ? '<span class="ownchip">' + esc(t.owner.name) + "</span>" : '<span class="mut">unclaimed</span>') +
        (d.phase === "setup" || d.phase === "keepers"
          ? '<button class="btn ghost sm ordUp" data-i="' + i + '">↑</button><button class="btn ghost sm ordDn" data-i="' + i + '">↓</button>'
          : "") +
        "</div>";
    });
    if (d.phase === "setup" || d.phase === "keepers") {
      h += '<p style="margin-top:8px"><button class="btn ghost sm" id="ordShuffle">🎲 Shuffle order</button></p>';
    }
    h += "</div></div>";
    el.innerHTML = h;

    function on(id, fn) { var b = $(id); if (b) b.onclick = fn; }
    on("copyGuest", function () { copyText(guestLink()); });
    on("copyCommish", function () { copyText(commishLink(d)); });
    on("phKeepers", function () { setPhase("keepers"); });
    on("phLiveDirect", function () { if (confirm("Start the draft with no keepers?")) setPhase("live"); });
    on("phLive", function () { if (confirm("Start the draft? Keepers lock onto the board.")) setPhase("live"); });
    on("phBackSetup", function () { setPhase("setup"); });
    on("phPause", togglePause);
    on("phUndo", undoLast);
    on("phEnd", function () { if (confirm("End the draft?")) setPhase("done"); });
    on("phReopen", function () { setPhase("live"); });
    on("setSave", function () {
      // Read both BEFORE mutating — the first apply re-renders this panel and
      // would reset the second input under us. Rounds are skipped once the
      // draft is live (the input is disabled then).
      var roundsLocked = $("setRounds").disabled;
      var rv = $("setRounds").value, tv = $("setTimer").value;
      var p = roundsLocked ? Promise.resolve() : setSetting("rounds", rv);
      p.then(function () { return setSetting("timerSecs", tv); });
      toast("Settings applied");
    });
    on("refreshData", function () {
      toast("Refreshing ESPN data…");
      Promise.all([loadInfo(true), loadLastDraft(true)]).then(function () { return loadPool(true); }).then(renderAll);
    });
    on("resetBoard", function () { if (confirm("Clear every pick and go back to setup? Keepers are kept.")) resetDraft(); });
    on("ordShuffle", shuffleOrder);
    el.querySelectorAll(".ordUp").forEach(function (b) { b.onclick = function () { moveTeam(Number(b.dataset.i), -1); }; });
    el.querySelectorAll(".ordDn").forEach(function (b) { b.onclick = function () { moveTeam(Number(b.dataset.i), 1); }; });
  }
  function copyText(s) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(s).then(function () { toast("Copied!"); }, function () { toast("Couldn't copy — long-press the link", true); });
    } else toast("Long-press the link to copy it", true);
  }

  function renderAll() {
    renderHeader();
    renderClock();
    renderTabs();
    renderLanding();
    placePanels();
    renderBoard();
    renderPlayers();
    renderTeams();
    renderCommish();
    renderConfirm();
    renderChat();
    renderPlayerCard();
  }

  // ---------------- wiring ----------------
  $("tabs").querySelectorAll("button").forEach(function (b) {
    b.onclick = function () { view = b.dataset.v; renderAll(); };
  });
  $("pSearch").addEventListener("input", function () { searchQ = $("pSearch").value; renderPlayers(); });
  $("pHideTaken").onclick = function () { hideTaken = !hideTaken; renderPlayers(); };
  $("chatSend").onclick = function () { sendChat(); };
  $("chatIn").addEventListener("keydown", function (e) { if (e.key === "Enter") sendChat(); });
  $("pcOverlay").addEventListener("click", function (e) { if (e.target === $("pcOverlay")) closePlayerCard(); });
  if (DESK_MQ.addEventListener) DESK_MQ.addEventListener("change", function () { renderAll(); });

  // ---------------- boot ----------------
  backendReady = initBackend();
  loadInfo().then(function () { return Promise.all([loadPool(), loadLastDraft()]); }).then(renderAll);
  renderAll();

  // Test hook (house convention).
  window.__DRAFT__ = {
    get D() { return D; },
    get me() { return me; },
    get pool() { return pool; },
    get info() { return info; },
    get lastDraft() { return lastDraft; },
    get view() { return view; },
    setView: function (v) { view = v; renderAll(); },
    setMe: function (name, dev, ckey) {
      if (name != null) setMyName(name);
      if (dev != null) { me.dev = dev; localStorage.setItem("ffd_dev", dev); }
      if (ckey != null) { me.ckey = ckey; localStorage.setItem("ffd_ckey_" + SEASON, ckey); }
      renderAll();
    },
    slotSeq: function () { return D ? slotSeq(D) : []; },
    currentSlot: function () { return D ? currentSlot(D) : null; },
    keeperCostOf: function (pid) { return D ? keeperCostOf(pid, D) : null; },
    resolveKeeperRounds: resolveKeeperRounds,
    takenPids: function () { return takenPids(D); },
    createDraft: createDraft,
    claimTeam: claimTeam,
    releaseTeam: releaseTeam,
    addKeeper: addKeeper,
    removeKeeper: removeKeeper,
    setKeeperField: setKeeperField,
    setPhase: setPhase,
    makePick: makePick,
    undoLast: undoLast,
    togglePause: togglePause,
    moveTeam: moveTeam,
    setSetting: setSetting,
    resetDraft: resetDraft,
    renderAll: renderAll,
    backendReady: function () { return backendReady; },
    loads: function () { return Promise.all([loadInfo(), loadPool(), loadLastDraft()]); },
    get chat() { return chatMsgs; },
    sendChat: sendChat,
    openPlayerCard: openPlayerCard,
    closePlayerCard: closePlayerCard,
    panelOnBoard: panelOnBoard,
  };
})();
</script>
</body>
</html>
