<!-- The GFFL bar (2026-09-27, user: "its hard to get back to the GFFL from Sunday … that way the
     gffl bar can be present when on the Sunday page"). The same eight entries as league.html's
     #bnav, each a link into the league at its view's hash. The last entry is this page, lit,
     labelled Scores: it replaced GFFL's own Scores tab (2026-09-27). Phone: fixed at the
     bottom, where Sunday's own tab bar used to be. Desktop: GFFL's top strip. -->
<nav class="gnav" id="gnav" aria-label="GFFL">
  <a href="league.html#league">League</a>
  <a href="league.html#matchup">Matchup</a>
  <a href="league.html#team">My Team</a>
  <a href="league.html#rosters">Rosters</a>
  <a href="league.html#moves">Moves</a>
  <a href="league.html#chat">Chat</a>
  <a href="sunday.html" aria-current="page">Scores</a>
</nav>

<div id="board-view">
  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <div class="wordmark" aria-label="Scores">SCORES<a class="wm-tag" href="league.html" aria-label="Open GFFL">GFFL</a></div>
      <div class="week-nav">
        <button class="icon-btn" id="week-prev" aria-label="Previous week"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="week-label" id="week-label" aria-haspopup="dialog">Week</button>
        <button class="icon-btn" id="week-next" aria-label="Next week"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <button class="sync" id="sync" aria-label="Scores refresh automatically. Tap to refresh now" title="Auto-refresh. Tap to refresh now">
        <svg class="sync-ring" viewBox="0 0 36 36"><circle class="track" cx="18" cy="18" r="15"/><circle class="prog" id="sync-prog" cx="18" cy="18" r="15"/></svg>
        <span class="sync-dot" id="sync-dot"></span>
      </button>
      <button class="icon-btn" id="settings-btn" aria-label="Settings" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>
  <div class="status-line" id="status-line"></div>
  <div id="ff-head"></div>
  <main id="board" class="board" aria-live="polite"></main>
  <footer class="foot">Scores and play-by-play from ESPN's public feed. Updates automatically while this page is open.</footer>
</div>

<section id="team-view" class="game-view team-view" hidden aria-label="Team"></section>
<section id="game-view" class="game-view" hidden aria-label="Game detail"></section>
<div id="video-modal" class="vmodal" hidden></div>
<div id="ra" class="ra" hidden></div>
<div id="week-sheet" class="sheet" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="celebrate" class="celebrate" hidden></div>
