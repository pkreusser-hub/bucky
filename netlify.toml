[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Scheduled chore reminders. Cross-product cron (6 UTC fires/day); the handler selects the
# 3 intended Central sends (8:30 AM / 1:00 PM / 8:30 PM) via its own UTC-minute match +
# Central-band guard. See netlify/functions/chorereminders.mjs. Activates only after deploy.
[functions."chorereminders"]
  schedule = "0,30 1,13,18 * * *"

# GFFL S5 — scheduled waiver-processing nudge (cron as REMINDER only; the client engine stays
# authoritative). Two UTC fires every Wednesday (13:00 and 14:00) — one for each DST state — so
# the handler's own Central-hour guard (netlify/functions/leaguecron.mjs) can pick the correct
# 8:00 AM Central fire without hardcoding an offset that would silently drift twice a year.
# Cron day-of-week 3 = Wednesday. Activates only after deploy; the function itself also no-ops
# before the season's first waiver Wednesday (2026-09-09) and independently re-checks the
# Central weekday, so a stray manual invoke can never fire outside its intended window.
[functions."leaguecron"]
  schedule = "0 13,14 * * 3"

# GFFL lineup warnings (netlify/functions/lineupwarn.mjs). Every 15 minutes across UTC 11:00-01:59,
# which is Central 06:00-20:59 in CDT and 05:00-19:59 in CST — wide enough for both DST states
# (2026-11-01) without hardcoding an offset. The handler itself picks kickoffs 75-105 minutes
# away from ESPN's scoreboard (a window twice the cadence, so one skipped fire loses nothing) and
# a Firestore marker makes the second tick inert, so DST only decides which ticks can matter, never
# when a warning goes out. Most ticks stop after one scoreboard fetch.
[functions."lineupwarn"]
  schedule = "*/15 11-23,0,1 * * *"

# Event reminders — fires every 5 minutes. The handler selects events whose start instant falls
# in [55, 65) minutes from "now" (netlify/functions/eventreminders.mjs). The window is TWICE the
# cadence on purpose: consecutive runs overlap, so each event is offered to two runs and a single
# skipped/delayed cron fire cannot lose a reminder. The slack is on the FLOOR, not the ceiling — a
# missed run means the next one sees the event FEWER minutes ahead, not more. A Firestore idempotency marker — not the
# window arithmetic — is what prevents the resulting double send. All-day events are excluded (no
# single instant to be "1 hour before" of). Activates only after deploy.
[functions."eventreminders"]
  schedule = "*/5 * * * *"

# ---- GFFL custom domain: goatfantasyleague.com (bought 2026-08-10) ----
# Netlify -> Domain management -> add goatfantasyleague.com to THIS site, then point the
# registrar's DNS at Netlify (nameservers, or the A/ALIAS + www CNAME Netlify shows) and
# turn OFF any registrar parking/forwarding. HTTPS provisions automatically afterwards.
#
# ⚠ THE RULES BELOW ARE force = true AND MATCH THE EXACT ROOT, not "/*" with force = false.
# The earlier draft of this block had it the other way round and would NOT have worked:
# force = false means "serve the real file if one exists", and a real file DOES exist at
# "/" — index.html, the FARM app. The league domain would have opened Bucky. Forcing only
# the exact root rewrites the bare domain and leaves every other path alone, so
# /league.html, /ffdraft.html, /icons/*, /assets/* and /.netlify/functions/* keep resolving
# normally without needing a wildcard at all.
#
# WHY THIS EXISTS AT ALL (2026-08-10, user hit it): a PWA's install identity is its
# ORIGIN. Bucky is installed with scope "/" — manifest.webmanifest declares no scope
# and start_url "/" — and Chrome will not install a second app whose scope is already
# covered by an installed one; it offers "open in Bucky" instead. So on
# amenfarms.netlify.app only ONE of the two can ever be installed. A distinct manifest
# id does not help (GFFL already has one), and neither does moving the league into a
# subdirectory — web.dev's "multiple PWAs on the same domain" is explicit that an inner
# app gets no install prompt while the outer app is installed, and that its notifications
# are misattributed to the outer app. A separate origin is the documented fix, and a
# domain ALIAS on THIS site is the cheap form of it: same functions, same env vars, one
# deploy — only the hostname differs, which is exactly what PWA identity keys on.
#
# DO NOT change league.webmanifest. start_url/id stay "/league.html": the same manifest
# file is served from BOTH hostnames and its URLs resolve against whichever one loaded it,
# so "/league.html" is correct on both. Setting start_url to "/" would open BUCKY on
# amenfarms.netlify.app. scope stays absent for the same reason it always was — it defaults
# to "/", which keeps ffdraft.html inside the installed window.
#
# Install the league FROM goatfantasyleague.com (amenfarms.netlify.app still hands you
# Bucky — that is the point). A new origin starts with empty localStorage, so each device
# re-enters the family password and re-picks who it is (gffl_pass, choreUser,
# choreUnlocked, dadPinHash). League data lives in Firestore and is untouched.

[[redirects]]
  from = "https://goatfantasyleague.com/"
  to = "/league.html"
  status = 200
  force = true

# www too, in case Netlify's own www->apex redirect is not enabled for this domain. Harmless
# if it is: the rule simply never matches.
[[redirects]]
  from = "https://www.goatfantasyleague.com/"
  to = "/league.html"
  status = 200
  force = true

# ---- Standalone apps (2026-10-08): /news and /shop are index.html in app mode ----
# Same page, same functions: the head script in index.html reads the path (or ?app=news|shop),
# sets html[data-app] and swaps the manifest, title and icon. See docs/bucky-app.md. These are
# plain 200 rewrites (no force): no file or folder called news or shop exists at the root, and
# the exact-root league rules above are untouched. Both slash forms are listed so neither
# depends on how Netlify normalises a trailing slash. A real file ever named "news" or "shop"
# would shadow these; tools/_verify-standalone.cjs checks that none does.
[[redirects]]
  from = "/news"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/news/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/shop"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/shop/"
  to = "/index.html"
  status = 200

# iOS standalone often restores a frozen document and, when it does re-request
# HTML, WebKit will reuse last week's league.html if the browser is allowed to
# cache it. Script tags are already cache-busted (?v=); the document must not
# be. Netlify's default is max-age=0 must-revalidate — restated here so a
# future default change cannot stick a phone on an old deploy.
[[headers]]
  for = "/league.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# GFFL engine scripts are versioned by name+query: league.html is the ONLY page that loads them and
# every reference carries ?v=<deploy stamp> (assets/league/lg-core.js?v=..., lg-data, lg-ui), bumped
# on every change to them, so a given URL's bytes never change and a phone may keep it for a year
# instead of revalidating three files on every cold open. (A change to an lg-*.js file WITHOUT
# bumping its ?v= would now stick on phones that already have it: bump first. league.html itself
# stays no-store above.) Nothing else lives under /assets/league/ that a page loads unversioned.
[[headers]]
  for = "/assets/league/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify serves *.webmanifest as application/octet-stream; browsers want the manifest media type.
[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# GFFL self-hosted fonts (2026-10-04). Versioned vendor files that never change in place — if one
# is ever replaced, give the new file a new NAME (a new @font-face url), because "immutable" means
# a browser will not even ask. Without this each launch revalidates them (a round trip apiece).
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The ~10 byte version file the home-screen copy of league.html compares itself against. It must
# NEVER be served from a cache: a cached answer is exactly the stale-copy bug it exists to catch.
[[headers]]
  for = "/gffl-version.txt"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
