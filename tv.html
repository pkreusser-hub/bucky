<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#3f5c46" />
<title>Bucky TV</title>
<link rel="icon" href="bucky.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
<!-- GFFL live scores come from Sunday's scoring engine rather than a third copy of it. That
     file is written to stand alone (no DOM, no sd-app.js dependency) and exposes FF.load /
     FF.ingestBoard / FF.poll / FF.teamScore, so loading it here keeps the TV's numbers the same
     as Sunday's instead of drifting from a fork. -->
<script src="assets/sunday/sd-fantasy.js"></script>
<style>
  /* Bucky TV: the family's TV home screen, shown full-screen by the Bucky TV Android app
     (android-tv/). Sized in rem where 1rem = 1/120 of the screen width, so the same layout
     fills a 1080p TV (WebView reports 960 CSS px there) and a desktop browser alike.

     Farmstead look, from index.html's #farmstead-theme: pine green, cream cards, clay accent,
     Fraunces for display type. The page ground is the pine green of the desktop rail rather than
     the app's cream, because a full-screen cream page glares in a dark living room; the cards
     carry the cream. Text colours are picked for contrast, measured in tools/_verify-tv.cjs:
     the app's --muted (#8b9184) is 3.2:1 on cream, too faint across a room, so cards use
     #6f7668 (4.6:1), and labels on the green use #e2e5da (5.0:1 at the lightest point of
     the ground, under the 6% cream highlight).

     Layout (user, 2026-10-20: "keep it simple"): the Bucky TV mark with the week's weather and
     the clock; one Watch row of the two apps and five shows; this week's calendar beside a goat
     slideshow; the GFFL strip ("actually lets keep the GFFL strip"). The weather sits in the
     header so all of that fits one 1080p screen. */
  :root {
    --green: #3f5c46; --green-d: #2f4634; --green-dd: #24372a;
    --cream: #fffdf8; --paper: #f4f1e8; --line: #e3ded0;
    --ink: #26332b; --ink-2: #4b584e; --muted: #6f7668;
    --on-green: #fffdf8; --on-green-2: #e2e5da;
    --clay: #b8552f; --clay-soft: #f3e4dc;
    --shadow: 0 .2rem .5rem rgba(20,30,24,.18), 0 .8rem 2rem rgba(20,30,24,.16);
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html { font-size: calc(100vw / 120); }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(80% 60% at 10% -10%, rgba(255,253,248,.06) 0%, transparent 60%), linear-gradient(180deg, var(--green) 0%, var(--green-d) 70%, var(--green-dd) 100%);
    color: var(--on-green);
    font-family: "Source Sans 3", Roboto, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 1.5rem;
    cursor: default;
  }
  #home { height: 100%; overflow: hidden; padding: 2rem 5rem 4rem; }

  /* ---------- header: the Bucky TV mark | clock + date ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.4rem; }
  .brand { display: flex; align-items: center; gap: 1.6rem; }
  .brand .mark { width: 6.4rem; height: 6.4rem; border-radius: 1.4rem; display: block; box-shadow: 0 .3rem .9rem rgba(0,0,0,.25); }
  .wordmark { font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 4.4rem; line-height: 1; color: var(--on-green); letter-spacing: -.01em; }
  /* The rail's clay-and-cream stripe, under the name. */
  .wordmark::after { content: ""; display: block; width: 7rem; height: .4rem; margin-top: .7rem; border-radius: .2rem;
    background: repeating-linear-gradient(90deg, var(--clay) 0 1.2rem, var(--cream) 1.2rem 1.9rem); }
  .right { text-align: right; }
  .clock { font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 5.2rem; line-height: 1; letter-spacing: -.03em; }
  .date { color: var(--on-green-2); font-size: 1.3rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin-top: .5rem; }

  /* ---------- the Watch row: two apps, then the shows ---------- */
  .row-label { font-size: 1.3rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--on-green-2); margin: 0 0 .8rem; }
  .row { display: flex; gap: 1.1rem; overflow: hidden; padding: .9rem .9rem 1.2rem; margin: -.9rem -.9rem .6rem; scroll-behavior: smooth; }
  .tile {
    flex: 0 0 auto; position: relative; width: 15rem; height: 10rem; border-radius: 1.4rem; border: 0;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; padding: 1rem 1.2rem;
    color: #fff; font: inherit; font-weight: 700; font-size: 2.1rem; line-height: 1.1;
    text-align: left; background: var(--green-dd); overflow: hidden; outline: none;
    transition: transform .12s ease, box-shadow .12s ease;
    box-shadow: var(--shadow);
  }
  .tile img.banner { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tile .sub { display: block; font-family: "Source Sans 3", Roboto, sans-serif; font-size: 1.15rem; font-weight: 600; opacity: .9; margin-top: .35rem; line-height: 1.2; }
  /* Focus: a cream ring with a clay keyline outside it, the farm's two accent colours. */
  .tile:focus, .tile.focus { transform: scale(1.06); box-shadow: 0 0 0 .32rem var(--cream), 0 0 0 .6rem var(--clay), 0 1.2rem 2.6rem rgba(10,18,12,.5); z-index: 2; }
  .t-prime { background: linear-gradient(135deg, #1a98ff, #0f4fa8); }
  .t-yttv { background: linear-gradient(135deg, #e3262f, #8e0f16); }
  /* Show tiles: the title in Fraunces, a chip naming the app it opens in. */
  /* Content starts below the app chip and runs down, so a two-line title can't run up into it
     (bottom-aligned, a long title overflowed upward over the chip). */
  /* Width: 2 x 15 + 5 x 14.6 + 6 gaps x 1.1 = 109.6rem of the 110 between the side margins.
     At 13.4rem "Monday Night Football" ran to three lines and pushed its game line out of the
     tile, and "Sun 7:20 · KC @ BUF" was cut short; the suite now checks neither happens. */
  .t-show { width: 14.6rem; justify-content: flex-start; padding-top: 3.3rem; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 1.7rem; }
  .t-show .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 12.2rem; }
  .t-show .app { position: absolute; top: .9rem; left: 1.2rem; font-family: "Source Sans 3", Roboto, sans-serif; font-size: 1rem; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; padding: .2rem .6rem; border-radius: 99rem; background: rgba(255,253,248,.18); }
  .s-redzone { background: linear-gradient(135deg, var(--clay) 0%, var(--clay) 50%, var(--ink) 50%, var(--ink) 100%); }
  .s-mnf { background: linear-gradient(160deg, #5a2a1d, #2b1712); }
  .s-snf { background: linear-gradient(160deg, #24365c, #141f36); }
  .s-trek { background: radial-gradient(120% 90% at 80% 0%, #2b3550 0%, #0d1018 60%); color: #f3d58a; }
  /* Logo tiles: the channel's logo on a white plate (the logos are drawn for white), with the
     show's name and this week's game small beneath it. */
  .t-show img.logo, .t-show img.art { display: none; }
  .t-show.has-logo { background: #fff; color: var(--ink); justify-content: flex-end; padding-top: 1rem; }
  /* Stacked top to bottom: chip, logo (2.7-5.6rem), then one line of name and one of game. A
     two-line name at 1.2rem ran up into the logo, so the name is one line at 1.1rem. */
  .t-show.has-logo img.logo { display: block; position: absolute; left: 1.2rem; right: 1.2rem; top: 2.7rem; height: 2.9rem; width: calc(100% - 2.4rem); object-fit: contain; }
  .t-show.has-logo .ttl { display: block; width: 100%; font-family: "Source Sans 3", Roboto, sans-serif; font-weight: 700; font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-show.has-logo .sub { color: var(--muted); opacity: 1; }
  .t-show.has-logo .app { background: #efeadd; color: var(--ink-2); }
  /* Art tiles: the show's artwork fills the tile, its title over a dark fade at the bottom. */
  .t-show.has-art { justify-content: flex-end; padding-top: 1rem; color: #fffdf8; }
  .t-show.has-art img.art { display: block; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .t-show.has-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(8,10,14,.92) 0%, rgba(8,10,14,.55) 45%, rgba(8,10,14,0) 75%); }
  .t-show.has-art .app, .t-show.has-art .ttl { position: relative; z-index: 1; }
  .t-show.has-art .app { position: absolute; background: rgba(8,10,14,.6); }
  /* Prime Video and YouTube TV: on the TV, each app's own banner (read from the installed app).
     Where there is none, in a browser or for an app without a banner, its logo on a white plate. */
  .t-prime img.logo, .t-yttv img.logo { display: none; }
  .t-prime.has-logo, .t-yttv.has-logo { background: #fff; }
  .t-prime.has-logo img.logo, .t-yttv.has-logo img.logo { display: block; position: absolute; inset: 1.6rem 1.4rem; width: calc(100% - 2.8rem); height: calc(100% - 3.2rem); object-fit: contain; }
  .t-prime.has-logo > span, .t-yttv.has-logo > span { display: none; }
  .t-app { background: var(--cream); color: var(--ink); }
  .t-setup { background: var(--cream); color: var(--ink); font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 1.9rem; box-shadow: inset 0 0 0 .3rem var(--clay), var(--shadow); }
  .t-setup .sub { color: var(--muted); }
  .t-settings { background: var(--green-dd); width: 14rem; box-shadow: inset 0 0 0 1px rgba(255,253,248,.2), var(--shadow); }
  .t-settings svg { position: absolute; top: 1.2rem; left: 1.4rem; width: 3rem; height: 3rem; opacity: .9; }

  /* ---------- this week: calendar | goats ---------- */
  .week { display: grid; grid-template-columns: 1.25fr 1fr; gap: 1.8rem; margin: .4rem 0 1.6rem; height: 25rem; }
  .panel { background: var(--cream); color: var(--ink); border: 1px solid var(--line); border-radius: 1.6rem; padding: 1.2rem 1.8rem; box-shadow: var(--shadow); overflow: hidden; }
  .panel h2 { margin: 0 0 .5rem; font-family: Fraunces, Georgia, serif; font-size: 1.9rem; font-weight: 600; color: var(--ink); }
  .cal-day { font-size: 1.15rem; color: var(--muted); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin: .55rem 0 .1rem; padding-top: .45rem; border-top: 1px solid var(--line); }
  .cal-day:first-of-type { border-top: 0; padding-top: 0; margin-top: .2rem; }
  .ev { display: flex; gap: 1.4rem; align-items: baseline; padding: .18rem 0; font-size: 1.65rem; }
  .ev .when { flex: 0 0 8.6rem; color: var(--clay); font-weight: 700; font-size: 1.45rem; }
  .ev .what { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more { font-size: 1.3rem; color: var(--muted); font-weight: 600; margin-top: .5rem; }
  .empty { color: var(--muted); font-size: 1.6rem; }
  /* The goats: each photo at its own shape over a blurred copy of itself. */
  .goats { position: relative; border-radius: 1.6rem; overflow: hidden; background: var(--green-dd); box-shadow: var(--shadow); }
  .ph { position: absolute; inset: 0; opacity: 0; transition: opacity 1.6s ease; overflow: hidden; }
  .ph.on { opacity: 1; }
  /* Goat photos are stored 500 px wide; stretched to a TV they go soft. Each shows at its own
     shape, over a blurred, darkened copy of itself filling the frame. */
  .ph .bk { position: absolute; inset: -4rem; background-size: cover; background-position: center; filter: blur(2.4rem) brightness(.55); }
  .ph .im { position: absolute; inset: 0; background-size: contain; background-position: center; background-repeat: no-repeat; }
  .goats .scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 35%; background: linear-gradient(0deg, rgba(20,30,24,.75), transparent); }
  .goats .cap { position: absolute; left: 1.6rem; bottom: 1.2rem; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 2.2rem; color: var(--paper); text-shadow: 0 .2rem .8rem rgba(0,0,0,.6); }

  /* ---------- the week's weather, in the header ---------- */
  .wx { display: flex; gap: .7rem; flex: 1; justify-content: center; padding: 0 2rem; }
  /* All weather text is cream: on today's lighter card (16% cream over pine) the softer
     --on-green-2 measured 3.9:1, under the 4.5:1 the suite holds every text colour to. */
  .wx-day { width: 6.6rem; background: rgba(255,253,248,.08); border: 1px solid rgba(255,253,248,.14); border-radius: 1.1rem; padding: .5rem .3rem; text-align: center; color: var(--on-green); font-size: 1.2rem; }
  .wx-day b { display: block; color: var(--on-green); font-size: 1.25rem; font-weight: 700; }
  .wx-day svg { width: 2.4rem; height: 2.4rem; display: block; margin: .2rem auto .1rem; }
  .wx-day .t { color: var(--on-green); font-size: 1.45rem; font-weight: 700; white-space: nowrap; }
  .wx-day .t span { color: var(--on-green); font-weight: 400; }
  .wx-day .pp { color: var(--on-green); font-size: 1.05rem; font-weight: 700; min-height: 1.3rem; }
  /* Today stands out by its border more than its fill: at 16% cream the fill took cream text to
     4.3:1; 12% holds 4.7:1. */
  .wx-day.today { background: rgba(255,253,248,.12); border-color: rgba(255,253,248,.4); }

  /* ---------- GFFL strip ---------- */
  .gffl { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.2rem; margin-bottom: 2rem; }
  .mu { background: var(--cream); color: var(--ink); border: 1px solid var(--line); border-radius: 1.3rem; padding: .9rem 1.3rem; box-shadow: var(--shadow); }
  .mu .tm { display: flex; justify-content: space-between; gap: 1rem; font-size: 1.6rem; padding: .15rem 0; color: var(--ink-2); }
  .mu .tm .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mu .tm .pts { font-weight: 800; font-variant-numeric: tabular-nums; }
  .mu .tm.lead { color: var(--ink); }
  .mu .tm.lead .nm { font-weight: 700; }
  .mu .meta { font-size: 1.2rem; color: var(--muted); margin-top: .35rem; padding-top: .35rem; border-top: 1px solid var(--line); display: flex; justify-content: space-between; }
  .mu .meta .live { color: #3e7d51; font-weight: 700; }
  .gffl-h { display: flex; align-items: baseline; gap: 1.2rem; }
  .gffl-h .row-label { margin-bottom: .8rem; }
  .gffl-h .note { font-size: 1.3rem; color: var(--on-green-2); }

  #toast { position: fixed; left: 50%; bottom: 4rem; transform: translateX(-50%); background: var(--ink); color: var(--cream); border: 1px solid rgba(255,253,248,.2);
    padding: 1.1rem 2rem; border-radius: 1.2rem; font-size: 1.7rem; z-index: 60; max-width: 80rem; text-align: center; box-shadow: var(--shadow); }
</style>
</head>
<body>
<main id="home">
  <header class="top">
    <div class="brand">
      <img class="mark" src="bucky.png" alt="" width="256" height="256" />
      <div class="wordmark">Bucky TV</div>
    </div>
    <div class="wx" id="wx" hidden></div>
    <div class="right">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>
  </header>

  <h2 class="row-label">Watch</h2>
  <div class="row" id="watchRow">
    <button class="tile t-prime" data-act="prime" aria-label="Prime Video"><span>Prime Video</span></button>
    <button class="tile t-yttv" data-act="yttv" aria-label="YouTube TV"><span>YouTube TV</span></button>
    <!-- show tiles are added from SHOWS -->
    <button class="tile t-setup" data-act="homesetup" id="homeSetup" hidden><span>Make Home open Bucky<span class="sub">One switch in the TV's settings</span></span></button>
  </div>

  <section class="week">
    <div class="panel" id="calPanel">
      <h2>This week</h2>
      <div id="calList"><div class="empty">Loading the calendar</div></div>
    </div>
    <div class="goats" id="goats">
      <div class="ph" id="gs0"><div class="bk"></div><div class="im"></div></div>
      <div class="ph" id="gs1"><div class="bk"></div><div class="im"></div></div>
      <div class="scrim"></div>
      <div class="cap" id="goatCap"></div>
    </div>
  </section>

  <section id="gfflSec" hidden>
    <div class="gffl-h"><h2 class="row-label" id="gfflTitle">GFFL</h2><span class="note" id="gfflNote"></span></div>
    <div class="gffl" id="gffl"></div>
  </section>

  <section id="appsSec" hidden>
    <h2 class="row-label">Apps</h2>
    <div class="row" id="appsRow"></div>
  </section>
</main>

<div id="toast" hidden></div>

<script>
"use strict";
// ============================================================================================
// Config (duplicated per page on purpose — see CLAUDE.md)
// ============================================================================================
const FAMILY_PASSWORD = "amenfarms";
function roomId(pw){ let h=0; for (const ch of pw.toLowerCase()) h=(h*31+ch.charCodeAt(0))>>>0; return "fam"+h.toString(36); }
const FAM = roomId(FAMILY_PASSWORD);
const FS_KEY = "AIzaSyAA1hn-j9_pPuXoaHIzcyyXYJN6EhUccJU";
const FS_BASE = "https://firestore.googleapis.com/v1/projects/amen-farms-app/databases/(default)/documents";
const LAT = 34.686537, LON = -86.210417;
const TZ = "America/Chicago";
// ?week=N pins the GFFL week, ?idle=S sets how long without a button press counts as nobody
// using the TV, and ?check=S the update check, in seconds, for previews and tools/_verify-tv.cjs.
// The TV itself loads the bare URL.
const QS = new URLSearchParams(location.search);
const IDLE_MS = (Number(QS.get("idle")) || 5 * 60) * 1000;
const GOAT_MS = 8 * 1000;

// Android package names for the apps the tiles open.
const PKG = {
  prime: "com.amazon.amazonvideo.livingroom",
  yttv: "com.google.android.youtube.tvunplugged",
};
const APP_NAME = { prime: "Prime Video", yttv: "YouTube TV" };
// Both logos are on Wikimedia Commons, loaded from there like the channel logos below.
const APP_LOGO = {
  prime: "https://upload.wikimedia.org/wikipedia/commons/1/11/Amazon_Prime_Video_logo.svg",
  yttv: "https://upload.wikimedia.org/wikipedia/commons/f/f7/YouTube_TV_logo.svg",
};

// The show tiles, in order. `url` is the show's own link, handed to its app. Until one is
// filled in, the tile opens the app and says the show isn't linked yet.
//   YouTube TV channels: on a computer, open tv.youtube.com, go to Live, start the channel,
//   and copy the address bar (tv.youtube.com/watch/...). MNF is on ESPN, SNF on NBC.
//   Prime Video shows: in the Prime Video app on a phone, open the show, Share, Copy link.
// Query strings from the copied links (?vp=..., ?ref_=...) are player and tracking settings and
// are left off; the channel or show is the path.
// MNF and SNF also show this week's game on the tile, from ESPN's scoreboard.
//
// Pictures (user, 2026-10-20: "can we use the actual logos"). They are loaded from where they
// already live, never copied into this public repo, and any that fails to load leaves the tile
// as its plain text design:
//   logo: the channel's logo on a white plate. ESPN's wordmark and NBC's peacock are public
//         domain on Wikimedia Commons; RedZone's is the one on its Wikipedia article.
//   tvmaze: the show's id on TVmaze (free, CORS-open); its landscape artwork fills the tile.
const SHOWS = [
  { id: "redzone", title: "NFL RedZone", app: "yttv", url: "https://tv.youtube.com/browse/UC2P9QOChMRn6kPUpBcjVlWw", cls: "s-redzone", sub: "Sundays from noon",
    logo: "https://upload.wikimedia.org/wikipedia/en/7/7b/NFL_Network_Redzone.png" },
  { id: "mnf", title: "Monday Night Football", app: "yttv", url: "https://tv.youtube.com/watch/PFuNFGzJDE4", cls: "s-mnf", sub: "ESPN", game: { day: "Mon" },
    logo: "https://upload.wikimedia.org/wikipedia/commons/2/2f/ESPN_wordmark.svg" },
  { id: "snf", title: "Sunday Night Football", app: "yttv", url: "https://tv.youtube.com/watch/5-T6_ZU9bmA", cls: "s-snf", sub: "NBC", game: { day: "Sun" },
    logo: "https://upload.wikimedia.org/wikipedia/commons/3/3f/NBC_logo.svg" },
  { id: "voyager", title: "Star Trek: Voyager", app: "prime", url: "https://www.amazon.com/gp/video/detail/B00C16V4B0", cls: "s-trek", sub: "", tvmaze: 492 },
  { id: "tng", title: "Star Trek: TNG", app: "prime", url: "https://www.amazon.com/gp/video/detail/B0CQ7XDXSJ", cls: "s-trek", sub: "The Next Generation", tvmaze: 491 },
];

// The Android wrapper (android-tv/) injects window.BuckyTV. In a plain browser it is absent,
// and the tiles fall back to the services' websites so the page can be previewed anywhere.
const TV = window.BuckyTV || null;
const WEB_FALLBACK = { prime: "https://www.primevideo.com", yttv: "https://tv.youtube.com" };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

// ============================================================================================
// Firestore REST (read-only; no SDK needed for a page that never writes)
// ============================================================================================
function fsDec(v) {
  if (!v || typeof v !== "object") return null;
  if ("nullValue" in v) return null;
  if ("booleanValue" in v) return !!v.booleanValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return Number(v.doubleValue);
  if ("stringValue" in v) return v.stringValue;
  if ("timestampValue" in v) return String(v.timestampValue);
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(fsDec);
  if ("mapValue" in v) return fsDecFields(v.mapValue.fields);
  return null;
}
function fsDecFields(fields) { const o = {}; for (const k of Object.keys(fields || {})) o[k] = fsDec(fields[k]); return o; }
async function fsWhere(coll, field, value, select) {
  const q = { from: [{ collectionId: coll }], where: { fieldFilter: { field: { fieldPath: field }, op: "EQUAL", value: { stringValue: value } } } };
  if (select) q.select = { fields: select.map((f) => ({ fieldPath: f })) };
  const r = await fetch(FS_BASE + ":runQuery?key=" + FS_KEY, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ structuredQuery: q }) });
  if (!r.ok) throw new Error("Firestore query " + r.status);
  const rows = await r.json();

}
function goHome() {
  $("home").scrollTop = 0;
  focusTile(tiles()[0]);
}

// ============================================================================================
// Goat photos: the slideshow on the home screen
// ============================================================================================
const STATIC_PHOTOS = [{ src: "Goat1.png", cap: "" }, { src: "Goat2.png", cap: "" }, { src: "logo.png", cap: "Amen Farms" }];
let photos = null, photosAt = 0;
async function loadPhotos() {
  if (photos && Date.now() - photosAt < 60 * 60 * 1000) return;
  try {
    const goats = await fsWhere("chores_" + FAM, "frequency", "goathooves", ["name", "photos", "photo"]);
    const list = [];
    for (const g of goats) {
      const ps = Array.isArray(g.photos) && g.photos.length ? g.photos : (g.photo ? [g.photo] : []);
      for (const p of ps) if (typeof p === "string" && p.startsWith("data:image/")) list.push({ src: p, cap: g.name || "" });
    }
    // Shuffle so the slideshow isn't the same goat order every time.
    for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
    photos = list.length ? list : STATIC_PHOTOS;
    photosAt = Date.now();
  } catch (e) { console.warn(e); if (!photos) photos = STATIC_PHOTOS; }
}
// One crossfading slideshow over two stacked frames.
function makeShow(frameA, frameB, capId) {
  let ix = 0;
  return function next() {
    if (!photos || !photos.length) return;
    const p = photos[ix % photos.length];
    const on = $(ix % 2 ? frameB : frameA), off = $(ix % 2 ? frameA : frameB);
    const bg = 'url("' + p.src + '")';
    on.querySelector(".bk").style.backgroundImage = bg;
    on.querySelector(".im").style.backgroundImage = bg;
    on.classList.add("on");
    off.classList.remove("on");
    $(capId).textContent = p.cap || "";
    ix++;
  };
}
const goatSlide = makeShow("gs0", "gs1", "goatCap");
let goatTimer = 0;
async function startGoats() {
  await loadPhotos();
  goatSlide();
  clearInterval(goatTimer);
  goatTimer = setInterval(goatSlide, GOAT_MS);
}
// No screensaver (user, 2026-10-20: "get rid of the screensaver view, I just want it to show the
// bucky tv page at all times"). What is left of "idle" is knowing when nobody is using the
// remote, so a new deploy can load then (see checkForUpdate).
const IDLE_SLACK = 1000;
let lastInput = Date.now(), idleTimer = 0;
function nobodyUsing() { return Date.now() - lastInput >= IDLE_MS - IDLE_SLACK; }
function armIdle() {
  lastInput = Date.now();
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (updatePending) location.reload(); }, IDLE_MS);
}

// ============================================================================================
// Input
// ============================================================================================
const KEY_DIR = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" };
document.addEventListener("keydown", (e) => {
  armIdle();
  if (KEY_DIR[e.key]) { e.preventDefault(); move(KEY_DIR[e.key]); return; }
  if (e.key === "Enter" || e.key === " ") {
    const t = document.activeElement;
    if (t && t.classList.contains("tile")) { e.preventDefault(); launch(t.dataset.act, t); }
    return;
  }
  if (e.key === "Escape") { e.preventDefault(); goHome(); }
});
document.addEventListener("click", (e) => {
  armIdle();
  const t = e.target.closest(".tile");
  if (t) launch(t.dataset.act, t);
});
document.addEventListener("pointermove", armIdle, { passive: true });
// From the Android wrapper: Back, Home pressed while already home, and coming back from an app.
window.addEventListener("buckytv-back", () => { armIdle(); goHome(); });
window.addEventListener("buckytv-home", () => { armIdle(); goHome(); });
window.addEventListener("buckytv-resume", () => { armIdle(); updateHomeSetup(); refreshAll(); });

// ============================================================================================
// Picking up new deploys. The wrapper keeps this page open for days as the home screen, so a
// change to the site would otherwise wait for the TV to restart. Every few minutes the page
// re-reads its own source (and the GFFL engine it loads); when either differs from what it
// booted with, it reloads once nobody has pressed a button for IDLE_MS, never under someone's
// thumb. (It used to wait for the screensaver, which is gone.)
// ============================================================================================
const UPDATE_CHECK_MS = (Number(QS.get("check")) || 10 * 60) * 1000;
const SELF_FILES = [location.pathname, "assets/sunday/sd-fantasy.js"];
let bootHash = null, updatePending = false;
function hashText(t) { let h = 0x811c9dc5; for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(36) + ":" + t.length; }
async function deployedHash() {
  const texts = await Promise.all(SELF_FILES.map(async (f) => {
    const r = await fetch(f, { cache: "no-store" });
    if (!r.ok) throw new Error("update check " + r.status + " for " + f);
    return r.text();
  }));
  return hashText(texts.join("\n"));
}
async function checkForUpdate() {
  try {
    const h = await deployedHash();
    if (bootHash == null) bootHash = h;
    else if (h !== bootHash) updatePending = true;
  } catch (e) { /* offline or mid-deploy: try again next time */ }
  if (updatePending && nobodyUsing()) location.reload();
}

// ============================================================================================
// Boot + refresh
// ============================================================================================
let lastRefresh = 0;
function refreshAll() {
  // Coming back from an app re-reads what may have changed, at most once a minute.
  if (Date.now() - lastRefresh < 60 * 1000) return;
  lastRefresh = Date.now();
  loadCalendar();
  loadGames();
  if (gfflLoadedWeek) refreshGfflBoard();
}
tickClock();
setInterval(tickClock, 1000);
buildShows();
setupApps();
updateHomeSetup();
focusTile(tiles()[0]);
armIdle();
loadWeather();
loadCalendar();
loadGames();
loadGffl();
startGoats();
lastRefresh = Date.now();
setInterval(loadWeather, 15 * 60 * 1000);
setInterval(loadCalendar, 10 * 60 * 1000);
// Past midnight the week moves on even with no new events, and ended events drop off.
setInterval(renderCalendar, 5 * 60 * 1000);
// A new GFFL week starts Tuesday morning; check hourly whether the loaded week is stale.
setInterval(() => { if (typeof FF !== "undefined" && !QS.get("week") && FF._currentWeek() !== gfflLoadedWeek) loadGffl(); }, 60 * 60 * 1000);
checkForUpdate();
setInterval(checkForUpdate, UPDATE_CHECK_MS);
</script>
</body>
