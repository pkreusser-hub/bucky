<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#3f5c46" />
<title>Bucky TV</title>
<link rel="icon" href="bucky.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
<!-- GFFL live scores come from Sunday's scoring engine rather than a third copy of it. That
     file is written to stand alone (no DOM, no sd-app.js dependency) and exposes FF.load /
     FF.ingestBoard / FF.poll / FF.teamScore, so loading it here keeps the TV's numbers the same
     as Sunday's instead of drifting from a fork. -->
<script src="assets/sunday/sd-fantasy.js"></script>
<style>
  /* Bucky TV: the family's TV home screen, shown full-screen by the Bucky TV Android app
     (android-tv/). Sized in rem where 1rem = 1/120 of the screen width, so the same layout
     fills a 1080p TV (WebView reports 960 CSS px there) and a desktop browser alike.

     Farmstead look, from index.html's #farmstead-theme: pine green, cream cards, clay accent,
     Fraunces for display type. The page ground is the pine green of the desktop rail rather than
     the app's cream, because a full-screen cream page glares in a dark living room; the cards
     carry the cream. Text colours are picked for contrast, measured in tools/_verify-tv.cjs:
     the app's --muted (#8b9184) is 3.2:1 on cream, too faint across a room, so cards use
     #6f7668 (4.6:1), and labels on the green use #e2e5da (5.0:1 at the lightest point of
     the ground, under the 6% cream highlight). */
  :root {
    --green: #3f5c46; --green-d: #2f4634; --green-dd: #24372a;
    --cream: #fffdf8; --paper: #f4f1e8; --line: #e3ded0;
    --ink: #26332b; --ink-2: #4b584e; --muted: #6f7668;
    --on-green: #fffdf8; --on-green-2: #e2e5da;
    --clay: #b8552f; --clay-soft: #f3e4dc;
    --good: #3e7d51; --good-soft: #e4eee6;
    --amber: #c08a3e; --amber-soft: #f5ecdb;
    --shadow: 0 .2rem .5rem rgba(20,30,24,.18), 0 .8rem 2rem rgba(20,30,24,.16);
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html { font-size: calc(100vw / 120); }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(80% 60% at 10% -10%, rgba(255,253,248,.06) 0%, transparent 60%), linear-gradient(180deg, var(--green) 0%, var(--green-d) 70%, var(--green-dd) 100%);
    color: var(--on-green);
    font-family: "Source Sans 3", Roboto, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 1.5rem;
    cursor: default;
  }
  #home { height: 100%; overflow: hidden; padding: 2rem 5rem 4rem; }

  /* ---------- header: brand + greeting | clock + weather ---------- */
  .top { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 1.8rem; }
  .brand { display: flex; align-items: center; gap: 1.1rem; margin-bottom: 1.1rem; }
  .brand .mark { width: 3.4rem; height: 3.4rem; border-radius: .9rem; display: block; box-shadow: 0 .2rem .6rem rgba(0,0,0,.2); }
  .wordmark { font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 2.3rem; line-height: 1; color: var(--on-green); }
  .hub { font-size: 1.05rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--on-green-2); margin-top: .35rem; }
  /* The rail's red-and-cream stripe under "Family Farm Hub". */
  .hub::after { content: ""; display: block; width: 5rem; height: .3rem; margin-top: .45rem; border-radius: .2rem;
    background: repeating-linear-gradient(90deg, var(--clay) 0 1rem, var(--cream) 1rem 1.6rem); }
  .date { color: var(--on-green-2); font-size: 1.3rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .greet { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 3.7rem; line-height: 1.05; margin-top: .2rem; }
  .right { text-align: right; }
  .clock { font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 5.4rem; line-height: 1; letter-spacing: -.03em; }
  .wx { display: flex; align-items: center; justify-content: flex-end; gap: 2.2rem; margin-top: .6rem; }
  .wx-now { display: flex; align-items: center; gap: .8rem; text-align: left; }
  .wx-now svg { width: 3.8rem; height: 3.8rem; }
  .wx-temp { font-size: 3.4rem; font-weight: 700; line-height: 1; }
  .wx-desc { color: var(--on-green-2); font-size: 1.35rem; }
  .wx-days { display: flex; gap: 1.5rem; padding-left: 2.2rem; border-left: 1px solid rgba(255,253,248,.18); }
  .wx-day { text-align: center; font-size: 1.3rem; color: var(--on-green-2); }
  .wx-day b { display: block; color: var(--on-green); font-weight: 700; }
  .wx-day svg { width: 2.3rem; height: 2.3rem; display: block; margin: .2rem auto; }
  .wx-day .pp { color: #cfe3ff; font-size: 1.15rem; font-weight: 600; }

  /* ---------- rows + tiles ---------- */
  .row-label { font-size: 1.3rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--on-green-2); margin: 0 0 .8rem; }
  .row { display: flex; gap: 1.6rem; overflow: hidden; padding: .9rem .9rem 1.2rem; margin: -.9rem -.9rem .6rem; scroll-behavior: smooth; }
  .tile {
    flex: 0 0 auto; position: relative; width: 19rem; height: 10.7rem; border-radius: 1.4rem; border: 0;
    display: flex; align-items: flex-end; padding: 1.1rem 1.4rem; color: #fff; font: inherit; font-weight: 700; font-size: 1.9rem;
    text-align: left; background: var(--green-dd); overflow: hidden; outline: none;
    transition: transform .12s ease, box-shadow .12s ease;
    box-shadow: var(--shadow);
  }
  .tile img.banner { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tile .sub { display: block; font-size: 1.2rem; font-weight: 600; opacity: .9; margin-top: .2rem; }
  .tile.big { width: 24rem; height: 13rem; font-size: 2.4rem; }
  /* Focus: a cream ring with a clay keyline outside it, the farm's two accent colours. */
  .tile:focus, .tile.focus { transform: scale(1.06); box-shadow: 0 0 0 .32rem var(--cream), 0 0 0 .6rem var(--clay), 0 1.2rem 2.6rem rgba(10,18,12,.5); z-index: 2; }
  .t-prime { background: linear-gradient(135deg, #1a98ff, #0f4fa8); }
  .t-yttv { background: linear-gradient(135deg, #e3262f, #8e0f16); }
  .t-redzone { background: linear-gradient(135deg, var(--clay) 0%, var(--clay) 50%, var(--ink) 50%, var(--ink) 100%); }
  .t-redzone .rz { font-family: Fraunces, Georgia, serif; font-size: 2.9rem; letter-spacing: -.01em; }
  .t-app { background: var(--cream); color: var(--ink); }
  .t-setup { background: var(--cream); color: var(--ink); font-family: Fraunces, Georgia, serif; font-weight: 600; box-shadow: inset 0 0 0 .3rem var(--clay), var(--shadow); }
  .t-setup .sub { font-family: "Source Sans 3", Roboto, sans-serif; color: var(--muted); }
  .t-settings { background: var(--green-dd); width: 14rem; box-shadow: inset 0 0 0 1px rgba(255,253,248,.2), var(--shadow); }
  .t-settings svg { position: absolute; top: 1.2rem; left: 1.4rem; width: 3rem; height: 3rem; opacity: .9; }

  /* ---------- today: calendar + chores, as the app's cream cards ---------- */
  .today { display: grid; grid-template-columns: 1.35fr 1fr; gap: 1.8rem; margin: .3rem 0 1.6rem; }
  .panel { background: var(--cream); color: var(--ink); border: 1px solid var(--line); border-radius: 1.6rem; padding: 1.2rem 1.8rem; min-height: 13rem; box-shadow: var(--shadow); }
  .panel h2 { margin: 0 0 .7rem; font-family: Fraunces, Georgia, serif; font-size: 1.9rem; font-weight: 600; color: var(--ink); }
  .ev { display: flex; gap: 1.4rem; align-items: baseline; padding: .4rem 0; font-size: 1.8rem; }
  .ev .when { flex: 0 0 9.5rem; color: var(--clay); font-weight: 700; font-size: 1.6rem; }
  .ev .what { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev-day { font-size: 1.2rem; color: var(--muted); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin: .8rem 0 .2rem; padding-top: .7rem; border-top: 1px solid var(--line); }
  .empty { color: var(--muted); font-size: 1.6rem; }
  .care { display: flex; gap: 1rem; margin-bottom: .9rem; }
  .care span { background: var(--good-soft); color: var(--ink-2); border-radius: 99rem; padding: .3rem 1.1rem; font-size: 1.35rem; }
  .care span b { color: var(--green-d); }
  .care span.away { background: var(--amber-soft); }
  .care span.away b { color: #8a5d1e; }
  .chore { display: flex; align-items: center; gap: .9rem; font-size: 1.7rem; padding: .28rem 0; }
  .chore svg { flex: 0 0 auto; width: 1.8rem; height: 1.8rem; }
  .chore.done { color: var(--muted); }
  .chore.done .nm { text-decoration: line-through; text-decoration-color: rgba(38,51,43,.3); }
  .chore .by { margin-left: auto; font-size: 1.3rem; color: var(--muted); }
  .chore-sum { font-size: 1.35rem; color: var(--ink-2); font-weight: 600; margin-top: .6rem; }

  /* ---------- GFFL strip ---------- */
  .gffl { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.2rem; margin-bottom: 2rem; }
  .mu { background: var(--cream); color: var(--ink); border: 1px solid var(--line); border-radius: 1.3rem; padding: .9rem 1.3rem; box-shadow: var(--shadow); }
  .mu .tm { display: flex; justify-content: space-between; gap: 1rem; font-size: 1.6rem; padding: .15rem 0; color: var(--ink-2); }
  .mu .tm .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mu .tm .pts { font-weight: 800; font-variant-numeric: tabular-nums; }
  .mu .tm.lead { color: var(--ink); }
  .mu .tm.lead .nm { font-weight: 700; }
  .mu .meta { font-size: 1.2rem; color: var(--muted); margin-top: .35rem; padding-top: .35rem; border-top: 1px solid var(--line); display: flex; justify-content: space-between; }
  .mu .meta .live { color: var(--good); font-weight: 700; }
  .gffl-h { display: flex; align-items: baseline; gap: 1.2rem; }
  .gffl-h .row-label { margin-bottom: .8rem; }
  .gffl-h .note { font-size: 1.3rem; color: var(--on-green-2); }

  /* ---------- idle screen ---------- */
  #idle { position: fixed; inset: 0; background: var(--green-dd); z-index: 50; }
  #idle .ph { position: absolute; inset: 0; opacity: 0; transition: opacity 1.6s ease; overflow: hidden; }
  #idle .ph.on { opacity: 1; }
  /* Goat photos are stored 500 px wide; stretched to a TV they go soft. Each shows at its own
     shape, over a blurred, darkened copy of itself filling the screen. */
  #idle .ph .bk { position: absolute; inset: -4rem; background-size: cover; background-position: center; filter: blur(2.4rem) brightness(.55); }
  #idle .ph .im { position: absolute; inset: 0; background-size: contain; background-position: center; background-repeat: no-repeat; }
  #idle .scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: linear-gradient(0deg, rgba(20,30,24,.8), transparent); }
  #idle .corner { position: absolute; left: 5rem; bottom: 3.6rem; text-shadow: 0 .2rem 1rem rgba(0,0,0,.6); }
  #idle .corner .clock { font-size: 7rem; }
  #idle .corner .line { font-size: 2rem; color: var(--paper); margin-top: .6rem; }
  #idle .cap { position: absolute; right: 5rem; bottom: 3.8rem; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 2.4rem; color: var(--paper); text-shadow: 0 .2rem 1rem rgba(0,0,0,.6); }

  #toast { position: fixed; left: 50%; bottom: 4rem; transform: translateX(-50%); background: var(--ink); color: var(--cream); border: 1px solid rgba(255,253,248,.2);
    padding: 1.1rem 2rem; border-radius: 1.2rem; font-size: 1.7rem; z-index: 60; max-width: 80rem; text-align: center; box-shadow: var(--shadow); }
</style>
</head>
<body>
<main id="home">
  <header class="top">
    <div>
      <div class="brand">
        <img class="mark" src="bucky.png" alt="" width="256" height="256" />
        <div><div class="wordmark">Bucky</div><div class="hub">Family Farm Hub</div></div>
      </div>
      <div class="date" id="date"></div>
      <div class="greet" id="greet"></div>
    </div>
    <div class="right">
      <div class="clock" id="clock">--:--</div>
      <div class="wx" id="wx" hidden>
        <div class="wx-now"><span id="wxNowIcon"></span><div><div class="wx-temp" id="wxTemp"></div><div class="wx-desc" id="wxDesc"></div></div></div>
        <div class="wx-days" id="wxDays"></div>
      </div>
    </div>
  </header>

  <h2 class="row-label">Watch</h2>
  <div class="row" id="watchRow">
    <button class="tile big t-prime" data-act="prime"><span>Prime Video</span></button>
    <button class="tile big t-yttv" data-act="yttv"><span>YouTube TV</span></button>
    <button class="tile big t-redzone" data-act="redzone"><span><span class="rz">RedZone</span><span class="sub">on YouTube TV</span></span></button>
    <button class="tile big t-setup" data-act="homesetup" id="homeSetup" hidden><span>Make Home open Bucky<span class="sub">One switch in the TV's settings</span></span></button>
  </div>

  <section class="today">
    <div class="panel" id="calPanel">
      <h2>Today</h2>
      <div id="calList"><div class="empty">Loading the calendar</div></div>
    </div>
    <div class="panel" id="chorePanel">
      <h2>Chores</h2>
      <div class="care" id="care"></div>
      <div id="choreList"><div class="empty">Loading chores</div></div>
    </div>
  </section>

  <section id="gfflSec" hidden>
    <div class="gffl-h"><h2 class="row-label" id="gfflTitle">GFFL</h2><span class="note" id="gfflNote"></span></div>
    <div class="gffl" id="gffl"></div>
  </section>

  <section id="appsSec" hidden>
    <h2 class="row-label">Apps</h2>
    <div class="row" id="appsRow"></div>
  </section>
</main>

<div id="idle" hidden>
  <div class="ph" id="ph0"><div class="bk"></div><div class="im"></div></div>
  <div class="ph" id="ph1"><div class="bk"></div><div class="im"></div></div>
  <div class="scrim"></div>
  <div class="corner"><div class="clock" id="idleClock"></div><div class="line" id="idleLine"></div></div>
  <div class="cap" id="idleCap"></div>
</div>
<div id="toast" hidden></div>

<script>
"use strict";
// ============================================================================================
// Config (duplicated per page on purpose — see CLAUDE.md)
// ============================================================================================
const FAMILY_PASSWORD = "amenfarms";
function roomId(pw){ let h=0; for (const ch of pw.toLowerCase()) h=(h*31+ch.charCodeAt(0))>>>0; return "fam"+h.toString(36); }
const FAM = roomId(FAMILY_PASSWORD);
const FS_KEY = "AIzaSyAA1hn-j9_pPuXoaHIzcyyXYJN6EhUccJU";
const FS_BASE = "https://firestore.googleapis.com/v1/projects/amen-farms-app/databases/(default)/documents";
const LAT = 34.686537, LON = -86.210417;
const TZ = "America/Chicago";
// ?week=N pins the GFFL week, ?idle=S sets the idle timer and ?check=S the update check, in
// seconds, for previews and tools/_verify-tv.cjs. The TV itself loads the bare URL.
const QS = new URLSearchParams(location.search);
const IDLE_MS = (Number(QS.get("idle")) || 5 * 60) * 1000;
const SLIDE_MS = 12 * 1000;

// Android package names for the featured tiles.
const PKG = {
  prime: "com.amazon.amazonvideo.livingroom",
  yttv: "com.google.android.youtube.tvunplugged",
};
// YouTube TV's live channels each have a fixed watch link (tv.youtube.com/watch/<id>). The
// app opens a channel when handed that link. Paste RedZone's here once it's known: on a
// computer, open tv.youtube.com, go to Live, start NFL RedZone, and copy the address bar.
// Until then the tile opens YouTube TV itself.
const REDZONE_URL = "";

// The Android wrapper (android-tv/) injects window.BuckyTV. In a plain browser it is absent,
// and the tiles fall back to the services' websites so the page can be previewed anywhere.
const TV = window.BuckyTV || null;
const WEB_FALLBACK = { prime: "https://www.primevideo.com", yttv: "https://tv.youtube.com" };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");

// ============================================================================================
// Firestore REST (read-only; no SDK needed for a page that never writes)
// ============================================================================================
function fsDec(v) {
  if (!v || typeof v !== "object") return null;
  if ("nullValue" in v) return null;
  if ("booleanValue" in v) return !!v.booleanValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return Number(v.doubleValue);
  if ("stringValue" in v) return v.stringValue;
  if ("timestampValue" in v) return String(v.timestampValue);
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(fsDec);
  if ("mapValue" in v) return fsDecFields(v.mapValue.fields);
  return null;
}
function fsDecFields(fields) { const o = {}; for (const k of Object.keys(fields || {})) o[k] = fsDec(fields[k]); return o; }
async function fsGet(path) {
  const r = await fetch(FS_BASE + "/" + path + "?key=" + FS_KEY);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error("Firestore " + r.status + " for " + path);
  return fsDecFields((await r.json()).fields);
}
async function fsWhere(coll, field, value, select) {
  const q = { from: [{ collectionId: coll }], where: { fieldFilter: { field: { fieldPath: field }, op: "EQUAL", value: { stringValue: value } } } };
  if (select) q.select = { fields: select.map((f) => ({ fieldPath: f })) };
  const r = await fetch(FS_BASE + ":runQuery?key=" + FS_KEY, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ structuredQuery: q }) });
  if (!r.ok) throw new Error("Firestore query " + r.status);
  const rows = await r.json();
  return rows.filter((x) => x.document).map((x) => Object.assign({ _id: x.document.name.split("/").pop() }, fsDecFields(x.document.fields)));
}

// ============================================================================================
// Clock
// ============================================================================================
function fmtTime(d) { return d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }).replace(/\s?[AP]M$/i, ""); }
function greeting(d) {
  const h = d.getHours();
  return h >= 5 && h < 12 ? "Good morning" : h >= 12 && h < 17 ? "Good afternoon" : "Good evening";
}
function tickClock() {
  const d = new Date();
  $("clock").textContent = fmtTime(d);
  $("date").textContent = d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  $("greet").textContent = greeting(d);
  $("idleClock").textContent = fmtTime(d);
}

// ============================================================================================
// Weather (Open-Meteo, same source and spot as weather.html)
// ============================================================================================
const ICON = {
  sun: '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="9" fill="#f6c343"/><g stroke="#f6c343" stroke-width="3.2" stroke-linecap="round"><path d="M24 5v6M24 37v6M5 24h6M37 24h6M10.6 10.6l4.2 4.2M33.2 33.2l4.2 4.2M10.6 37.4l4.2-4.2M33.2 14.8l4.2-4.2"/></g></svg>',
  partly: '<svg viewBox="0 0 48 48"><circle cx="18" cy="17" r="8" fill="#f6c343"/><path d="M15 38h20a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0 1 13z" fill="#dfe6f2"/></svg>',
  cloud: '<svg viewBox="0 0 48 48"><path d="M13 37h22a9 9 0 0 0 0-18 12 12 0 0 0-23 3 7.5 7.5 0 0 0 1 15z" fill="#c4cedf"/></svg>',
  fog: '<svg viewBox="0 0 48 48"><g stroke="#c4cedf" stroke-width="3.4" stroke-linecap="round"><path d="M8 18h32M5 26h38M10 34h28"/></g></svg>',
  rain: '<svg viewBox="0 0 48 48"><path d="M13 30h22a9 9 0 0 0 0-18 12 12 0 0 0-23 3 7.5 7.5 0 0 0 1 15z" fill="#c4cedf"/><g stroke="#6fb1ff" stroke-width="3" stroke-linecap="round"><path d="M16 35l-2 6M25 35l-2 6M34 35l-2 6"/></g></svg>',
  snow: '<svg viewBox="0 0 48 48"><path d="M13 30h22a9 9 0 0 0 0-18 12 12 0 0 0-23 3 7.5 7.5 0 0 0 1 15z" fill="#c4cedf"/><g fill="#fff"><circle cx="16" cy="38" r="2.4"/><circle cx="25" cy="41" r="2.4"/><circle cx="34" cy="38" r="2.4"/></g></svg>',
  storm: '<svg viewBox="0 0 48 48"><path d="M13 29h22a9 9 0 0 0 0-18 12 12 0 0 0-23 3 7.5 7.5 0 0 0 1 15z" fill="#9aa6bd"/><path d="M25 30l-6 9h6l-3 7 9-11h-6l3-5z" fill="#f6c343"/></svg>',
};
function wxKind(code) {
  if (code === 0) return ["sun", "Clear"];
  if (code === 1 || code === 2) return ["partly", "Partly cloudy"];
  if (code === 3) return ["cloud", "Cloudy"];
  if (code === 45 || code === 48) return ["fog", "Fog"];
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return ["snow", "Snow"];
  if (code >= 95) return ["storm", "Storms"];
  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return ["rain", code <= 57 ? "Drizzle" : "Rain"];
  return ["cloud", "Cloudy"];
}
let wxLine = "";
async function loadWeather() {
  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
    "&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
    "&temperature_unit=fahrenheit&timezone=America%2FChicago&forecast_days=5";
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error("weather " + r.status);
    const j = await r.json();
    const [kind, label] = wxKind(j.current.weather_code);
    const t = Math.round(j.current.temperature_2m);
    $("wxNowIcon").innerHTML = ICON[kind];
    $("wxTemp").textContent = t + "°";
    const hi = Math.round(j.daily.temperature_2m_max[0]), lo = Math.round(j.daily.temperature_2m_min[0]);

// Calendar (Google Calendar through the calendar function, same call index.html makes)
// ============================================================================================
let calEvents = [];
function dayStart(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function evStart(ev) { return ev.allDay ? new Date(ev.start + "T00:00:00") : new Date(ev.start); }

async function loadCalendar() {
  const t0 = dayStart(new Date()), t1 = new Date(t0); t1.setDate(t1.getDate() + 2);
  try {
    const r = await fetch("/.netlify/functions/calendar", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ secret: FAMILY_PASSWORD, action: "list", timeMin: t0.toISOString(), timeMax: t1.toISOString() }),
    });
    if (!r.ok) throw new Error("calendar " + r.status);
    const j = await r.json();
    calEvents = (j.events || []).slice().sort((a, b) => evStart(a) - evStart(b) || (b.allDay ? 1 : 0) - (a.allDay ? 1 : 0));
    renderCalendar();
  } catch (e) {
    console.warn(e);
    if (!calEvents.length) $("calList").innerHTML = '<div class="empty">Couldn\'t reach the calendar</div>';
  }
  updateIdleLine();
}
function renderCalendar() {
  const now = new Date(), today = dayStart(now), tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
  const after = new Date(tomorrow); after.setDate(tomorrow.getDate() + 1);
  // Timed events drop off once they've ended; all-day ones stay up for the whole day.
  const on = (ev, a, b) => evStart(ev) < b && evEnd(ev) > a && (ev.allDay || evEnd(ev) > now);
  const todays = calEvents.filter((ev) => on(ev, today, tomorrow));
  const tmrw = calEvents.filter((ev) => on(ev, tomorrow, after));
  const line = (ev) => '<div class="ev"><span class="when">' + (ev.allDay ? "All day" : fmtTime(evStart(ev)) + (evStart(ev).getHours() < 12 ? " am" : " pm")) +
    '</span><span class="what">' + esc(ev.title || "(no title)") + "</span></div>";
  let html = todays.length ? todays.slice(0, 5).map(line).join("") : '<div class="empty">Nothing on the calendar today</div>';
  const room = Math.max(0, 5 - Math.max(todays.length, 1));
  if (tmrw.length && room > 0) html += '<div class="ev-day">Tomorrow</div>' + tmrw.slice(0, room).map(line).join("");
  $("calList").innerHTML = html;
}
function nextEventText() {
  const now = new Date(), end = new Date(dayStart(now)); end.setDate(end.getDate() + 1);
  const ev = calEvents.find((e) => !e.allDay && evStart(e) > now && evStart(e) < end);
  return ev ? (ev.title || "Event") + " at " + fmtTime(evStart(ev)) + (evStart(ev).getHours() < 12 ? " am" : " pm") : "";
}

// ============================================================================================
// Chores + animal-care rota (rules copied from index.html: periodKey, curPeriodLog, isDone,
// choreCareSlot, careSlotValue, choreOnDuty)
// ============================================================================================
const CARE_OWNER_GROUP = "Kreussers";

  const wk = (careData.defaults || {})[CARE_DAYS[d.getDay()]] || {};

}
function choreCareSlot(c) { return (c.timeOfDay === "noon" || c.timeOfDay === "night") ? "pm" : "am"; }
function choreOnDuty(c, d) { return careSlotGroup(d, choreCareSlot(c)) === CARE_OWNER_GROUP; }

async function loadChores() {

const CHECK = { done: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#3e7d51"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  open: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#b9b29f" stroke-width="2.2"/></svg>' };

// GFFL live strip (Sunday's engine: assets/sunday/sd-fantasy.js)
// ============================================================================================
let gfflBoard = [];

async function loadGffl() {
  if (typeof FF === "undefined") return;

    const r = await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=" + FF.season + "&seasontype=2&week=" + week);
    if (r.ok) { gfflBoard = (await r.json()).events || []; FF.ingestBoard(gfflBoard); }

    // started game once means the strip shows real totals on the first paint, not partial ones.
    const started = gfflBoard.filter((e) => { const s = e.status?.type?.state || e.competitions?.[0]?.status?.type?.state; return s === "in" || s === "post"; }).length;
    for (let i = 0; i < Math.ceil(started / 4); i++) await FF.poll();
  } catch (e) { console.warn(e); }

  const live = gfflBoard.some((e) => (e.status?.type?.state || "") === "in");

  $("gfflNote").textContent = live ? live + (live === 1 ? " NFL game live" : " NFL games live") : "";
  $("gffl").innerHTML = ms.slice(0, 4).map((m) => {
    const A = FF.teamScore(m.home), B = FF.teamScore(m.away);
    const ta = FF.teams.get(m.home) || {}, tb = FF.teams.get(m.away) || {};

    const final = A.done && B.done;
    const a = started ? A.pts : A.proj, b = started ? B.pts : B.proj;
    const row = (t, v, lead) => '<div class="tm' + (lead ? " lead" : "") + '"><span class="nm">' + esc(t.name || "Team") + '</span><span class="pts">' + fmtPts(v) + "</span></div>";

// ============================================================================================
// Remote-control navigation: arrow keys move focus to the nearest tile in that direction.
// ============================================================================================

  // Rows have no visible scrollbar; keep the focused tile's whole row in view.
  const sec = t.closest("section") || t.closest(".row");
  if (sec) sec.scrollIntoView({ block: "nearest" });

}
function move(dir) {
  const all = tiles();
  const cur = document.activeElement && document.activeElement.classList.contains("tile") ? document.activeElement : null;
  if (!cur) { focusTile(all[0]); return; }
  const a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bestScore = Infinity;
  for (const t of all) {
    if (t === cur) continue;
    const b = t.getBoundingClientRect(), bx = b.left + b.width / 2, by = b.top + b.height / 2;
    const dx = bx - ax, dy = by - ay;
    let main, cross;
    // Left/Right never leave the row: only tiles that overlap this one vertically qualify.
    // Otherwise Right on the last Watch tile slid diagonally into the Apps row below.
    const sameRow = b.top < a.bottom && b.bottom > a.top;
    if (dir === "left") { if (dx >= -1 || !sameRow) continue; main = -dx; cross = Math.abs(dy); }
    else if (dir === "right") { if (dx <= 1 || !sameRow) continue; main = dx; cross = Math.abs(dy); }
    else if (dir === "up") { if (dy >= -1) continue; main = -dy; cross = Math.abs(dx); }
    else { if (dy <= 1) continue; main = dy; cross = Math.abs(dx); }

    const score = (dir === "left" || dir === "right") ? main + cross * 4 : main + cross * 0.6;

}

// ============================================================================================
// Picking up new deploys. The wrapper keeps this page open for days as the home screen, so a
// change to the site would otherwise wait for the TV to restart. Every few minutes the page
// re-reads its own source (and the GFFL engine it loads); when either differs from what it
// booted with, it reloads the next time the idle screen comes up, never under someone's thumb.
// ============================================================================================
const UPDATE_CHECK_MS = (Number(QS.get("check")) || 10 * 60) * 1000;

let bootHash = null, updatePending = false;
function hashText(t) { let h = 0x811c9dc5; for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(36) + ":" + t.length; }
async function deployedHash() {
  const texts = await Promise.all(SELF_FILES.map(async (f) => {
    const r = await fetch(f, { cache: "no-store" });
    if (!r.ok) throw new Error("update check " + r.status + " for " + f);
    return r.text();
  }));
  return hashText(texts.join("\n"));
}
async function checkForUpdate() {
  try {
    const h = await deployedHash();
    if (bootHash == null) bootHash = h;
    else if (h !== bootHash) updatePending = true;
  } catch (e) { /* offline or mid-deploy: try again next time */ }
  if (updatePending && idleOn) location.reload();
}

focusTile(tiles()[0]);
armIdle();
loadWeather();
loadCalendar();
loadChores();
loadGffl();
lastRefresh = Date.now();
setInterval(loadWeather, 15 * 60 * 1000);
setInterval(loadCalendar, 10 * 60 * 1000);
setInterval(() => { loadChores(); renderCalendar(); }, 2 * 60 * 1000);
// A new GFFL week starts Tuesday morning; check hourly whether the loaded week is stale.
setInterval(() => { if (typeof FF !== "undefined" && !QS.get("week") && FF._currentWeek() !== gfflLoadedWeek) loadGffl(); }, 60 * 60 * 1000);
// Warm the slideshow so the idle screen doesn't open on a blank frame.
setTimeout(loadPhotos, 20 * 1000);
checkForUpdate();
setInterval(checkForUpdate, UPDATE_CHECK_MS);
</script>
</body>
