# Fires the Draft Day audio generation (ElevenLabs, via the deployed
# audiogen-background function) from a runner with open egress — the agent
# sandbox can reach neither the site nor ElevenLabs, but it CAN reach
# Firestore, where the finished audio lands for `--collect` to pick up.
name: draft-audio
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "generator mode"
        default: "--fire"
        type: string
      voice_id:
        description: "explicit ElevenLabs voice id (skips the by-name lookup)"
        default: ""
        type: string
      say_style:
        description: "player announcement text: plain (default) or phonetic"
        default: "plain"
        type: string

jobs:
  fire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/_gen-draft-audio.mjs ${{ inputs.mode || '--fire' }}
        env:
          # 2026-09-02: audiogen-background.mjs is gated by its OWN secret now (never the
          # family password that ships in client JS — that gate cost nothing to an outsider
          # and each call is up to 200 billed ElevenLabs jobs). Set the same value in
          # Netlify's env AND in this repo's Actions secrets, or --fire is refused 401.
          AUDIOGEN_SECRET: ${{ secrets.AUDIOGEN_SECRET }}
          SAY_VOICE_ID: ${{ inputs.voice_id }}
          SAY_STYLE: ${{ inputs.say_style }}
