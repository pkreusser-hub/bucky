# One-shot diagnostic for the sports feature: what do ESPN's API and the live
# sports function actually return from a neutral datacenter? Dispatch by hand
# (Actions tab or API). The family passphrase in the POST below is not a
# secret — it ships in every page's client source; the real gates are
# server-side env vars this workflow never sees.
name: sports-diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: espn scoreboard direct
        run: |
          code=$(curl -sS -o /tmp/sb.json -w "%{http_code}" \
            "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            -H "accept: application/json" || echo FAIL)
          echo "ESPN scoreboard HTTP $code, $(wc -c < /tmp/sb.json) bytes"
          head -c 700 /tmp/sb.json; echo
      - name: espn scoreboard no-UA
        run: |
          code=$(curl -sS -o /tmp/sb2.json -w "%{http_code}" \
            "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" || echo FAIL)
          echo "ESPN (default curl UA) HTTP $code, $(wc -c < /tmp/sb2.json) bytes"
      - name: espn UA variants
        run: |
          for ua in "EMPTY" "node" "bucky-family-app/1.0"; do
            if [ "$ua" = "EMPTY" ]; then
              code=$(curl -sS -o /tmp/v.json -w "%{http_code}" -H "User-Agent:" \
                "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" || echo FAIL)
            else
              code=$(curl -sS -o /tmp/v.json -w "%{http_code}" -A "$ua" \
                "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" || echo FAIL)
            fi
            echo "UA [$ua] -> HTTP $code, $(wc -c < /tmp/v.json) bytes"
          done
          code=$(curl -sS -o /tmp/sum.json -w "%{http_code}" -A "bucky-family-app/1.0" \
            "https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=$(python3 -c "import json;d=json.load(open('/tmp/sb2.json'));print(d['events'][0]['id'])" 2>/dev/null || echo 401772510)" || echo FAIL)
          echo "summary with bucky UA -> HTTP $code, $(wc -c < /tmp/sum.json) bytes"
      - name: live sports function
        run: |
          code=$(curl -sS -o /tmp/fn.json -w "%{http_code}" -X POST \
            "https://amenfarms.netlify.app/.netlify/functions/sports" \
            -H "Content-Type: application/json" \
            --data '{"secret":"amenfarms","action":"nfl_scoreboard"}' || echo FAIL)
          echo "function HTTP $code, $(wc -c < /tmp/fn.json) bytes"
          head -c 900 /tmp/fn.json; echo
      - name: ncaa scoreboard shapes
        run: |
          for g in "" "80" "8" "5"; do
            if [ -z "$g" ]; then u="https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard";
            else u="https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=$g"; fi
            code=$(curl -sS -o /tmp/cfb.json -w "%{http_code}" "$u" || echo FAIL)
            n=$(python3 -c "import json;d=json.load(open('/tmp/cfb.json'));print(len(d.get('events',[])))" 2>/dev/null || echo "?")
            echo "CFB groups=[$g] -> HTTP $code, $n events"
          done
          python3 <<'PY'
          import json
          d = json.load(open('/tmp/cfb.json'))
          evs = d.get('events', [])
          print('season', d.get('season'), 'week', d.get('week'))
          cal = (d.get('leagues') or [{}])[0].get('calendar') or []
          print('calendar groups:', [c.get('label') for c in cal][:4])
          if evs:
              ev = evs[0]
              comp = ev['competitions'][0]
              c0 = comp['competitors'][0]
              print('first event:', ev.get('shortName'), ev.get('date'), comp.get('status', {}).get('type', {}).get('state'))
              print('competitor keys:', sorted(c0.keys()))
              print('curatedRank:', c0.get('curatedRank'))
              print('team abbrev/name:', c0.get('team', {}).get('abbreviation'), '/', c0.get('team', {}).get('shortDisplayName'))
              print('records:', c0.get('records') and c0['records'][0])
              print('broadcast:', comp.get('broadcasts'))
          PY
      - name: live fantasy action
        run: |
          code=$(curl -sS -o /tmp/ff.json -w "%{http_code}" -X POST \
            "https://amenfarms.netlify.app/.netlify/functions/sports" \
            -H "Content-Type: application/json" \
            --data '{"secret":"amenfarms","action":"ff_league"}' || echo FAIL)
          echo "ff_league HTTP $code, $(wc -c < /tmp/ff.json) bytes"
          python3 -c "import json;d=json.load(open('/tmp/ff.json'));print('teams:',[ (t['id'],t['name'],t.get('owner')) for t in d.get('teams',[]) ])" || head -c 600 /tmp/ff.json; echo
      - name: live stage-5 actions
        run: |
          fn() { curl -sS -o /tmp/o.json -w "%{http_code}" -X POST \
            "https://amenfarms.netlify.app/.netlify/functions/sports" \
            -H "Content-Type: application/json" --data "$1"; }
          code=$(fn '{"secret":"amenfarms","action":"ncaa_scoreboard"}' || echo FAIL)
          echo "ncaa_scoreboard HTTP $code, $(wc -c < /tmp/o.json) bytes"
          python3 -c "import json;d=json.load(open('/tmp/o.json'));evs=d.get('events',[]);ranked=[e for e in evs if any(t.get('rank') for t in e['teams'])];print('ok',d.get('ok'),'week',d.get('week'),len(evs),'events,',len(ranked),'ranked')" || head -c 300 /tmp/o.json
          code=$(fn '{"secret":"amenfarms","action":"ncaa_scoreboard","group":8}' || echo FAIL)
          python3 -c "import json;d=json.load(open('/tmp/o.json'));print('SEC: ok',d.get('ok'),len(d.get('events',[])),'events')" || head -c 300 /tmp/o.json
          code=$(fn '{"secret":"amenfarms","action":"ff_scoreboard"}' || echo FAIL)
          python3 -c "import json;d=json.load(open('/tmp/o.json'));print('ff_scoreboard: ok',d.get('ok'),'week',d.get('week'),len(d.get('matchups',[])),'matchups, famId',d.get('familyTeamId'))" || head -c 300 /tmp/o.json
          for nm in "The Goat Kids" "Wyoming Cowboys" "Nails for Breakfast"; do
            code=$(fn "{\"secret\":\"amenfarms\",\"action\":\"ff_league\",\"teamName\":\"$nm\"}" || echo FAIL)
            python3 -c "import json;d=json.load(open('/tmp/o.json'));print('$nm ->','famId',d.get('familyTeamId'))" || head -c 200 /tmp/o.json
          done
      - name: live draft-room actions
        run: |
          fn() { curl -sS -o /tmp/o.json -w "%{http_code}" -X POST \
            "https://amenfarms.netlify.app/.netlify/functions/sports" \
            -H "Content-Type: application/json" --data "$1"; }
          # deployed PAGE check — which pool-cache generation is the CDN serving?
          curl -sS -o /tmp/page.html "https://amenfarms.netlify.app/ffdraft.html"
          echo "ffdraft.html $(wc -c < /tmp/page.html) bytes | pool cache gen: $(grep -o 'ffd_pool[0-9]*_' /tmp/page.html | sort -u | tr '\n' ' ')| poolHealthy refs: $(grep -c poolHealthy /tmp/page.html)"
          code=$(fn '{"secret":"amenfarms","action":"ff_draftinfo"}' || echo FAIL)
          echo "ff_draftinfo HTTP $code, $(wc -c < /tmp/o.json) bytes"
          python3 -c "import json;d=json.load(open('/tmp/o.json'));print('ok',d.get('ok'),d.get('reason',''),'| teams',len(d.get('teams',[])),'| rosterSize',d.get('rosterSize'),'| ppr',d.get('ppr'),'| byes',len(d.get('byes',{})));print([t['name'] for t in d.get('teams',[])])" || head -c 400 /tmp/o.json
          code=$(fn '{"secret":"amenfarms","action":"ff_draftpool","format":"ppr"}' || echo FAIL)
          echo "ff_draftpool HTTP $code, $(wc -c < /tmp/o.json) bytes"
          python3 -c "import json;d=json.load(open('/tmp/o.json'));ps=d.get('players',[]);print('ok',d.get('ok'),d.get('reason',''),len(ps),'players; top5:',[(p['rank'],p['name'],p['pos'],p['proTeam'],p['adp'],'proj',p.get('proj'),'last',p.get('lastPts')) for p in ps[:5]]);print('with proj:',sum(1 for p in ps if p.get('proj') is not None),'with lastPts:',sum(1 for p in ps if p.get('lastPts') is not None))" || head -c 400 /tmp/o.json
          # position coverage — D/ST went missing live 2026-08-06 (the rank-sorted
          # fetch excludes them); the slot sweep must bring them back.
          python3 -c "
          import json,collections;d=json.load(open('/tmp/o.json'));ps=d.get('players',[])
          print('by pos:',dict(collections.Counter(p['pos'] for p in ps)))
          dst=[p for p in ps if p['pos']=='D/ST']
          print(len(dst),'defenses; first 3:',[(p.get('rank'),p['name'],'adp',p.get('adp'),'proj',p.get('proj')) for p in dst[:3]])
          print('DEFENSES OK' if len(dst) >= 20 else 'DEFENSES MISSING — dig into the slot sweep')
          " || true
          pid=$(python3 -c "import json;d=json.load(open('/tmp/o.json'));print(d['players'][0]['pid'])" 2>/dev/null || echo 0)
          code=$(fn "{\"secret\":\"amenfarms\",\"action\":\"ff_player\",\"pid\":$pid}" || echo FAIL)
          echo "ff_player($pid) HTTP $code, $(wc -c < /tmp/o.json) bytes"
          python3 -c "
          import json;d=json.load(open('/tmp/o.json'));p=d.get('player',{})
          print('ok',d.get('ok'),d.get('reason',''),'|',p.get('name'),'| outlook',len(p.get('outlook','')),'chars | proj',(p.get('proj') or {}).get('total'),'| last',(p.get('last') or {}).get('total'))
          print('proj lines:',(p.get('proj') or {}).get('lines'))
          print('last lines:',(p.get('last') or {}).get('lines'))
          " || head -c 400 /tmp/o.json
          code=$(fn '{"secret":"amenfarms","action":"ff_lastdraft"}' || echo FAIL)
          echo "ff_lastdraft HTTP $code, $(wc -c < /tmp/o.json) bytes"
          python3 -c "
          import json;d=json.load(open('/tmp/o.json'))
          ps=d.get('picks',[]);ks=[p for p in ps if p.get('keeper')]
          print('ok',d.get('ok'),d.get('reason',''),'| season',d.get('season'),'| drafted',d.get('drafted'),'|',len(ps),'picks,',len(ks),'keeper-flagged,',len(d.get('rosters',[])),'rosters')
          print('keeper-flagged:',[(k['pid'],'R'+str(k['round']),'team',k['teamId']) for k in ks][:12])
          # keep-chains vs the family's PDFs: exactly FOUR 3-straight keeps
          # entering 2026 — Saquon Barkley, Amon-Ra St. Brown, Davante Adams,
          # Garrett Wilson. Anything else here is drift worth reading.
          nm={p['pid']:p['name'] for r in d.get('rosters',[]) for p in r.get('players',[])}
          ch=d.get('chains',{}) or {}
          print('historyOk',d.get('historyOk'),'| chained players:',len(ch))
          print(sorted((n, nm.get(int(p), p)) for p, n in ch.items()) if ch else 'NO CHAINS')
          exp={'Saquon Barkley','Amon-Ra St. Brown','Davante Adams','Garrett Wilson'}
          got={nm.get(int(p), str(p)) for p, n in ch.items() if n == 3}
          print('chain-3 expected:', sorted(exp))
          print('chain-3 from API:', sorted(got))
          print('MATCH' if exp == got else 'MISMATCH — investigate before trusting eligibility')
          " || head -c 400 /tmp/o.json
      - name: live fantasy-AI actions
        run: |
          fn() { curl -sS -o /tmp/o.json -w "%{http_code}" -X POST \
            "https://amenfarms.netlify.app/.netlify/functions/sports" \
            -H "Content-Type: application/json" --data "$1"; }
          # Free agents through the real kona_player_info view + X-Fantasy-Filter header.
          code=$(fn '{"secret":"amenfarms","action":"ff_freeagents"}' || echo FAIL)
          echo "ff_freeagents HTTP $code, $(wc -c < /tmp/o.json) bytes"
          python3 -c "import json;d=json.load(open('/tmp/o.json'));ps=d.get('players',[]);print('ok',d.get('ok'),len(ps),'players; top:',ps[0] if ps else None)" || head -c 300 /tmp/o.json
          # One real Grok fantasy smoke through the live farmgpt function (a tiny stub
          # matchup — costs a fraction of a cent; do NOT trigger ffrecap here, it would
          # WRITE a junk preseason column doc the whole family then reads).
          code=$(curl -sS -o /tmp/ai.txt -w "%{http_code}" -X POST \
            "https://amenfarms.netlify.app/.netlify/functions/farmgpt" \
            -H "Content-Type: application/json" \
            --data '{"secret":"amenfarms","mode":"fantasy","kind":"question","question":"One sentence: is my QB fine this week?","matchup":{"familyTeamId":1,"matchup":{"home":{"teamId":1,"name":"Battle Kreussers","roster":[{"name":"Josh Allen","slot":"QB","starter":true,"proj":21.3,"injury":""}]},"away":{"teamId":2,"name":"Test","roster":[]}}},"freeAgents":[]}' || echo FAIL)
          echo "fantasy AI HTTP $code, $(wc -c < /tmp/ai.txt) bytes"
          head -c 400 /tmp/ai.txt; echo
  ffdata:
    runs-on: ubuntu-latest
    steps:
      - name: sleeper state + CORS
        run: |
          code=$(curl -sS -D /tmp/h.txt -o /tmp/state.json -w "%{http_code}" "https://api.sleeper.app/v1/state/nfl" || echo FAIL)
          echo "state HTTP $code"; cat /tmp/state.json; echo
          echo "CORS headers:"; grep -i "access-control" /tmp/h.txt || echo "  NONE"
      - name: sleeper players dump
        run: |
          code=$(curl -sS -o /tmp/players.json -w "%{http_code}" "https://api.sleeper.app/v1/players/nfl" || echo FAIL)
          echo "players HTTP $code, $(wc -c < /tmp/players.json) bytes"
          python3 <<'PY'
          import json
          d = json.load(open('/tmp/players.json'))
          print('players:', len(d))
          withespn = 0; defenses = []
          sample = None
          for pid, p in d.items():
              if not isinstance(p, dict): continue
              if p.get('espn_id'): withespn += 1
              if p.get('position') == 'DEF': defenses.append(pid)
              if p.get('full_name') == 'Josh Allen' and p.get('position') == 'QB' and p.get('team'):
                  sample = (pid, p)
          print('with espn_id:', withespn, '| team defenses:', len(defenses), defenses[:6])
          if sample:
              pid, p = sample
              keep = {k: p.get(k) for k in ('full_name','team','position','espn_id','yahoo_id','injury_status','status','active','depth_chart_order')}
              print('sample', pid, keep)
          PY
      - name: sleeper stats + projections shapes
        run: |
          wk=$(python3 -c "import json;print(json.load(open('/tmp/state.json')).get('week',1))" 2>/dev/null || echo 1)
          st=$(python3 -c "import json;print(json.load(open('/tmp/state.json')).get('season_type','pre'))" 2>/dev/null || echo pre)
          echo "state says week=$wk season_type=$st"
          for u in \
            "https://api.sleeper.app/v1/stats/nfl/pre/2026/1" \
            "https://api.sleeper.app/v1/stats/nfl/$st/2026/$wk" \
            "https://api.sleeper.app/v1/projections/nfl/pre/2026/1" \
            "https://api.sleeper.com/stats/nfl/2026/1?season_type=pre"; do
            code=$(curl -sS -D /tmp/h.txt -o /tmp/o.json -w "%{http_code}" "$u" || echo FAIL)
            echo "$u -> HTTP $code, $(wc -c < /tmp/o.json) bytes"
            grep -i "access-control-allow-origin" /tmp/h.txt || echo "  (no CORS header)"
            python3 <<'PY'
          import json
          try:
              d = json.load(open('/tmp/o.json'))
          except Exception as e:
              print('  parse fail:', e); raise SystemExit
          if isinstance(d, dict):
              print('  map of', len(d), 'players')
              for pid, st in list(d.items())[:2]:
                  if isinstance(st, dict):
                      print('  ', pid, dict(list(st.items())[:16]))
          elif isinstance(d, list):
              print('  list of', len(d))
              if d: print('  first:', json.dumps(d[0])[:500])
          PY
          done
      - name: espn tonight + CORS
        run: |
          code=$(curl -sS -D /tmp/h.txt -o /tmp/sb.json -w "%{http_code}" "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=20260806" || echo FAIL)
          echo "scoreboard(20260806) HTTP $code, $(wc -c < /tmp/sb.json) bytes"
          echo "CORS headers:"; grep -i "access-control" /tmp/h.txt || echo "  NONE"
          python3 <<'PY'
          import json
          d = json.load(open('/tmp/sb.json'))
          print('week', d.get('week'), 'season', d.get('season'))
          for e in d.get('events', []):
              c = e['competitions'][0]
              print(e['id'], e.get('shortName'), e.get('date'), c['status']['type'].get('state'), c['status']['type'].get('shortDetail'))
          PY
      - name: espn recent final preseason boxscore shape
        run: |
          code=$(curl -sS -o /tmp/sbr.json -w "%{http_code}" "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=20260728-20260806" || echo FAIL)
          echo "scoreboard(range) HTTP $code"
          eid=$(python3 -c "
          import json
          d = json.load(open('/tmp/sbr.json'))
          done = [e for e in d.get('events', []) if e['competitions'][0]['status']['type'].get('state') == 'post']
          print(done[-1]['id'] if done else '')")
          echo "most recent FINAL preseason event: [$eid]"
          if [ -n "$eid" ]; then
            curl -sS -o /tmp/sum.json "https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=$eid"
            echo "summary $(wc -c < /tmp/sum.json) bytes"
            python3 <<'PY'
          import json
          d = json.load(open('/tmp/sum.json'))
          bp = d.get('boxscore', {}).get('players', [])
          for t in bp[:1]:
              print('team', t.get('team', {}).get('abbreviation'))
              for g in t.get('statistics', []):
                  a = (g.get('athletes') or [{}])[0]
                  ath = a.get('athlete', {})
                  print(' ', g.get('name'), '| labels', g.get('labels'), '| keys', g.get('keys'))
                  print('    first athlete:', ath.get('id'), ath.get('displayName'), (ath.get('position') or {}).get('abbreviation'), a.get('stats'))
          hdr = (d.get('header', {}).get('competitions') or [{}])[0]
          st = hdr.get('status', {})
          print('header status:', st.get('type', {}).get('state'), '| clock', st.get('displayClock'), '| period', st.get('period'))
          PY
          fi
  gffl:
    runs-on: ubuntu-latest
    steps:
      - name: live lg_espn_settings
        run: |
          code=$(curl -sS -o /tmp/lgs.json -w "%{http_code}" -X POST \
            "https://amenfarms.netlify.app/.netlify/functions/league" \
            -H "Content-Type: application/json" \
            --data '{"secret":"amenfarms","action":"lg_espn_settings"}' || echo FAIL)
          echo "lg_espn_settings HTTP $code, $(wc -c < /tmp/lgs.json) bytes"
          python3 <<'PY'
          import json
          try:
              d = json.load(open('/tmp/lgs.json'))
          except Exception as e:
              print('parse fail:', e)
              print(open('/tmp/lgs.json', 'rb').read(400))
              raise SystemExit
          print('ok', d.get('ok'), '| reason', d.get('reason'))
          print('leagueName', d.get('leagueName'), '| season', d.get('season'))
          print('--- scoring ---')
          scoring = d.get('scoring') or {}
          for k in sorted(scoring.keys()):
              print(f'  {k} = {scoring[k]}')
          print('--- unmapped (CRITICAL — ESPN scoring rules our importer did not recognize) ---')
          for u in (d.get('unmapped') or []):
              print(' ', u)
          print('--- slots ---', d.get('slots'))
          print('regularSeasonWeeks', d.get('regularSeasonWeeks'), '| playoffTeams', d.get('playoffTeams'))
          print('--- trade ---', d.get('trade'))
          print('--- acquisition ---', d.get('acquisition'))
          print('--- teams ---')
          for t in (d.get('teams') or []):
              print(' ', (t.get('id'), t.get('name'), t.get('owner')))
          PY
      - name: live lg_espn_rosters
        run: |
          code=$(curl -sS -o /tmp/lgr.json -w "%{http_code}" -X POST \
            "https://amenfarms.netlify.app/.netlify/functions/league" \
            -H "Content-Type: application/json" \
            --data '{"secret":"amenfarms","action":"lg_espn_rosters"}' || echo FAIL)
          echo "lg_espn_rosters HTTP $code, $(wc -c < /tmp/lgr.json) bytes"
          python3 <<'PY'
          import json
          try:
              d = json.load(open('/tmp/lgr.json'))
          except Exception as e:
              print('parse fail:', e)
              print(open('/tmp/lgr.json', 'rb').read(400))
              raise SystemExit
          print('ok', d.get('ok'), '| reason', d.get('reason'))
          teams = d.get('teams') or []
          print('teams:', len(teams))
          if teams:
              t0 = teams[0]
              print('first team:', t0.get('name'))
              for p in (t0.get('players') or [])[:5]:
                  print('  ', (p.get('espnId'), p.get('name'), p.get('pos'), p.get('proTeam'), p.get('lineupSlot'), p.get('injury')))
          print('--- player counts per team ---')
          for t in teams:
              print(' ', (t.get('name'), len(t.get('players') or [])))
          PY
      - name: live page assets (deploy marker)
        run: |
          # Confirms the LATEST static deploy is actually being served — the
          # 2026-08-07 scoring-review deploy sat in Netlify's queue for an hour
          # and only the function probes existed to notice.
          for f in league.html assets/league/lg-ui.js assets/league/lg-core.js assets/league/lg-data.js; do
            code=$(curl -sS -o /tmp/asset -w "%{http_code}" "https://amenfarms.netlify.app/$f" || echo FAIL)
            echo "$f HTTP $code, $(wc -c < /tmp/asset) bytes"
          done
          curl -sS "https://amenfarms.netlify.app/assets/league/lg-ui.js" -o /tmp/lgui.js
          grep -q "firstImport" /tmp/lgui.js && echo "lg-ui.js: first-run setup card PRESENT" || echo "lg-ui.js: first-run setup card MISSING (stale deploy)"
