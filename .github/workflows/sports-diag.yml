# One-shot diagnostic for the sports feature: what do ESPN's API and the live
# sports function actually return from a neutral datacenter? Dispatch by hand
# (Actions tab or API). The family passphrase in the POST below is not a
# secret — it ships in every page's client source; the real gates are
# server-side env vars this workflow never sees.
name: sports-diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: espn scoreboard direct
        run: |
          code=$(curl -sS -o /tmp/sb.json -w "%{http_code}" \
            "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            -H "accept: application/json" || echo FAIL)
          echo "ESPN scoreboard HTTP $code, $(wc -c < /tmp/sb.json) bytes"
          head -c 700 /tmp/sb.json; echo
      - name: espn scoreboard no-UA
        run: |
          code=$(curl -sS -o /tmp/sb2.json -w "%{http_code}" \
            "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" || echo FAIL)
          echo "ESPN (default curl UA) HTTP $code, $(wc -c < /tmp/sb2.json) bytes"
      - name: espn UA variants
        run: |
          for ua in "EMPTY" "node" "bucky-family-app/1.0"; do
            if [ "$ua" = "EMPTY" ]; then
              code=$(curl -sS -o /tmp/v.json -w "%{http_code}" -H "User-Agent:" \
                "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" || echo FAIL)
            else
              code=$(curl -sS -o /tmp/v.json -w "%{http_code}" -A "$ua" \
                "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" || echo FAIL)
            fi
            echo "UA [$ua] -> HTTP $code, $(wc -c < /tmp/v.json) bytes"
          done
          code=$(curl -sS -o /tmp/sum.json -w "%{http_code}" -A "bucky-family-app/1.0" \
            "https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=$(python3 -c "import json;d=json.load(open('/tmp/sb2.json'));print(d['events'][0]['id'])" 2>/dev/null || echo 401772510)" || echo FAIL)
          echo "summary with bucky UA -> HTTP $code, $(wc -c < /tmp/sum.json) bytes"
      - name: live sports function
        run: |
          code=$(curl -sS -o /tmp/fn.json -w "%{http_code}" -X POST \
            "https://amenfarms.netlify.app/.netlify/functions/sports" \
            -H "Content-Type: application/json" \
            --data '{"secret":"amenfarms","action":"nfl_scoreboard"}' || echo FAIL)
          echo "function HTTP $code, $(wc -c < /tmp/fn.json) bytes"
          head -c 900 /tmp/fn.json; echo
      - name: ncaa scoreboard shapes
        run: |
          for g in "" "80" "8" "5"; do
            if [ -z "$g" ]; then u="https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard";
            else u="https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=$g"; fi
            code=$(curl -sS -o /tmp/cfb.json -w "%{http_code}" "$u" || echo FAIL)
            n=$(python3 -c "import json;d=json.load(open('/tmp/cfb.json'));print(len(d.get('events',[])))" 2>/dev/null || echo "?")
            echo "CFB groups=[$g] -> HTTP $code, $n events"
          done
          python3 <<'PY'
          import json
          d = json.load(open('/tmp/cfb.json'))
          evs = d.get('events', [])
          print('season', d.get('season'), 'week', d.get('week'))
          cal = (d.get('leagues') or [{}])[0].get('calendar') or []
          print('calendar groups:', [c.get('label') for c in cal][:4])
          if evs:
              ev = evs[0]
              comp = ev['competitions'][0]
              c0 = comp['competitors'][0]
              print('first event:', ev.get('shortName'), ev.get('date'), comp.get('status', {}).get('type', {}).get('state'))
              print('competitor keys:', sorted(c0.keys()))
              print('curatedRank:', c0.get('curatedRank'))
              print('team abbrev/name:', c0.get('team', {}).get('abbreviation'), '/', c0.get('team', {}).get('shortDisplayName'))
              print('records:', c0.get('records') and c0['records'][0])
              print('broadcast:', comp.get('broadcasts'))
          PY
      - name: live fantasy action
        run: |
          code=$(curl -sS -o /tmp/ff.json -w "%{http_code}" -X POST \
            "https://amenfarms.netlify.app/.netlify/functions/sports" \
            -H "Content-Type: application/json" \
            --data '{"secret":"amenfarms","action":"ff_league"}' || echo FAIL)
          echo "ff_league HTTP $code, $(wc -c < /tmp/ff.json) bytes"
          python3 -c "import json;d=json.load(open('/tmp/ff.json'));print('teams:',[ (t['id'],t['name'],t.get('owner')) for t in d.get('teams',[]) ])" || head -c 600 /tmp/ff.json; echo
      - name: live stage-5 actions
        run: |
          fn() { curl -sS -o /tmp/o.json -w "%{http_code}" -X POST \
            "https://amenfarms.netlify.app/.netlify/functions/sports" \
            -H "Content-Type: application/json" --data "$1"; }
          code=$(fn '{"secret":"amenfarms","action":"ncaa_scoreboard"}' || echo FAIL)
          echo "ncaa_scoreboard HTTP $code, $(wc -c < /tmp/o.json) bytes"
          python3 -c "import json;d=json.load(open('/tmp/o.json'));evs=d.get('events',[]);ranked=[e for e in evs if any(t.get('rank') for t in e['teams'])];print('ok',d.get('ok'),'week',d.get('week'),len(evs),'events,',len(ranked),'ranked')" || head -c 300 /tmp/o.json
          code=$(fn '{"secret":"amenfarms","action":"ncaa_scoreboard","group":8}' || echo FAIL)
          python3 -c "import json;d=json.load(open('/tmp/o.json'));print('SEC: ok',d.get('ok'),len(d.get('events',[])),'events')" || head -c 300 /tmp/o.json
          code=$(fn '{"secret":"amenfarms","action":"ff_scoreboard"}' || echo FAIL)
          python3 -c "import json;d=json.load(open('/tmp/o.json'));print('ff_scoreboard: ok',d.get('ok'),'week',d.get('week'),len(d.get('matchups',[])),'matchups, famId',d.get('familyTeamId'))" || head -c 300 /tmp/o.json
          for nm in "The Goat Kids" "Wyoming Cowboys" "Nails for Breakfast"; do
            code=$(fn "{\"secret\":\"amenfarms\",\"action\":\"ff_league\",\"teamName\":\"$nm\"}" || echo FAIL)
            python3 -c "import json;d=json.load(open('/tmp/o.json'));print('$nm ->','famId',d.get('familyTeamId'))" || head -c 200 /tmp/o.json
          done
      - name: live draft-room actions
        run: |
          fn() { curl -sS -o /tmp/o.json -w "%{http_code}" -X POST \
            "https://amenfarms.netlify.app/.netlify/functions/sports" \
            -H "Content-Type: application/json" --data "$1"; }
          code=$(fn '{"secret":"amenfarms","action":"ff_draftinfo"}' || echo FAIL)
          echo "ff_draftinfo HTTP $code, $(wc -c < /tmp/o.json) bytes"
          python3 -c "import json;d=json.load(open('/tmp/o.json'));print('ok',d.get('ok'),d.get('reason',''),'| teams',len(d.get('teams',[])),'| rosterSize',d.get('rosterSize'),'| ppr',d.get('ppr'),'| byes',len(d.get('byes',{})));print([t['name'] for t in d.get('teams',[])])" || head -c 400 /tmp/o.json
          code=$(fn '{"secret":"amenfarms","action":"ff_draftpool","format":"ppr"}' || echo FAIL)
          echo "ff_draftpool HTTP $code, $(wc -c < /tmp/o.json) bytes"
          python3 -c "import json;d=json.load(open('/tmp/o.json'));ps=d.get('players',[]);print('ok',d.get('ok'),d.get('reason',''),len(ps),'players; top5:',[(p['rank'],p['name'],p['pos'],p['proTeam'],p['adp']) for p in ps[:5]])" || head -c 400 /tmp/o.json
          code=$(fn '{"secret":"amenfarms","action":"ff_lastdraft"}' || echo FAIL)
          echo "ff_lastdraft HTTP $code, $(wc -c < /tmp/o.json) bytes"
          python3 -c "
          import json;d=json.load(open('/tmp/o.json'))
          ps=d.get('picks',[]);ks=[p for p in ps if p.get('keeper')]
          print('ok',d.get('ok'),d.get('reason',''),'| season',d.get('season'),'| drafted',d.get('drafted'),'|',len(ps),'picks,',len(ks),'keeper-flagged,',len(d.get('rosters',[])),'rosters')
          print('keeper-flagged:',[(k['pid'],'R'+str(k['round']),'team',k['teamId']) for k in ks][:12])
          " || head -c 400 /tmp/o.json
      - name: live fantasy-AI actions
        run: |
          fn() { curl -sS -o /tmp/o.json -w "%{http_code}" -X POST \
            "https://amenfarms.netlify.app/.netlify/functions/sports" \
            -H "Content-Type: application/json" --data "$1"; }
          # Free agents through the real kona_player_info view + X-Fantasy-Filter header.
          code=$(fn '{"secret":"amenfarms","action":"ff_freeagents"}' || echo FAIL)
          echo "ff_freeagents HTTP $code, $(wc -c < /tmp/o.json) bytes"
          python3 -c "import json;d=json.load(open('/tmp/o.json'));ps=d.get('players',[]);print('ok',d.get('ok'),len(ps),'players; top:',ps[0] if ps else None)" || head -c 300 /tmp/o.json
          # One real Grok fantasy smoke through the live farmgpt function (a tiny stub
          # matchup — costs a fraction of a cent; do NOT trigger ffrecap here, it would
          # WRITE a junk preseason column doc the whole family then reads).
          code=$(curl -sS -o /tmp/ai.txt -w "%{http_code}" -X POST \
            "https://amenfarms.netlify.app/.netlify/functions/farmgpt" \
            -H "Content-Type: application/json" \
            --data '{"secret":"amenfarms","mode":"fantasy","kind":"question","question":"One sentence: is my QB fine this week?","matchup":{"familyTeamId":1,"matchup":{"home":{"teamId":1,"name":"Battle Kreussers","roster":[{"name":"Josh Allen","slot":"QB","starter":true,"proj":21.3,"injury":""}]},"away":{"teamId":2,"name":"Test","roster":[]}}},"freeAgents":[]}' || echo FAIL)
          echo "fantasy AI HTTP $code, $(wc -c < /tmp/ai.txt) bytes"
          head -c 400 /tmp/ai.txt; echo
