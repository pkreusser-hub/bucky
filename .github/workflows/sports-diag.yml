      - name: 2025 replay upstream probes (historical slate + archived projections)
        run: |
          # The GFFL 2025 week-1 replay (2026-08-08) leans on two upstream facts the sandbox
          # cannot verify (both hosts egress-blocked there): (1) ESPN's site scoreboard serves
          # a HISTORICAL week via ?dates=<year>&seasontype=2&week=1, and (2) whether Sleeper
          # still serves archived 2025 wk1 PROJECTIONS (if empty, the app derives projections
          # from the real week-1 finals instead — either is correct, this says which fired).
          code=$(curl -sS -o /tmp/sb25.json -w "%{http_code}" "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=2025&seasontype=2&week=1" || echo FAIL)
          echo "espn 2025 wk1 scoreboard HTTP $code, $(wc -c < /tmp/sb25.json) bytes"
          python3 <<'PY'
          import json
          try:
              d = json.load(open('/tmp/sb25.json'))
          except Exception as e:
              print('parse fail:', e); print(open('/tmp/sb25.json','rb').read(300)); raise SystemExit
          evs = d.get('events') or []
          print('events:', len(evs), '| week:', (d.get('week') or {}).get('number'))
          for e in evs[:4]:
              c = (e.get('competitions') or [{}])[0]
              teams = [x.get('team', {}).get('abbreviation') for x in (c.get('competitors') or [])]
              bc = (c.get('broadcasts') or [{}])
              print(' ', e.get('date'), teams, bc[0].get('names') if bc else None)
          PY
          code=$(curl -sS -o /tmp/pr25.json -w "%{http_code}" "https://api.sleeper.app/v1/projections/nfl/regular/2025/1" || echo FAIL)
          echo "sleeper 2025 wk1 projections HTTP $code, $(wc -c < /tmp/pr25.json) bytes"
          python3 <<'PY'
          import json
          try:
              d = json.load(open('/tmp/pr25.json'))
          except Exception as e:
              print('parse fail:', e); print(open('/tmp/pr25.json','rb').read(300)); raise SystemExit
          if isinstance(d, dict):
              ks = list(d.keys())
              F = ('pass_yd','rush_yd','rec_yd','rec','pass_td','fgm_yds','xpm','def_sack','sack')
              n = sum(1 for k in ks if isinstance(d.get(k), dict) and any((d[k] or {}).get(f) for f in F))
              print('players:', len(ks), '| stat-bearing rows:', n)
              print('verdict:', 'USABLE -> app uses these as projections' if n >= 25 else 'ADP HUSK -> app derives projections from real wk1 finals')
              for k in ks:
                  row = d.get(k) or {}
                  if any(row.get(f) for f in F):
                      print('stat sample:', k, dict(list(row.items())[:8])); break
              else:
                  if ks: print('adp-only sample:', ks[0], dict(list((d[ks[0]] or {}).items())[:6]))
          else:
              print('shape:', type(d).__name__, 'len', len(d) if hasattr(d, '__len__') else '?')
          PY

      - name: firestore REST CORS probe (SDK-free transport feasibility)
        run: |
          # Decides the GFFL storage-transport design (2026-08-08): can a BROWSER call the
          # Firestore REST API directly (GET doc + POST :runQuery), or does it need a proxy?
          # A browser will send these with an Origin header and (for the JSON POST) a
          # preflight — so what matters is access-control-allow-origin on the responses.
          KEY="AIzaSyAA1hn-j9_pPuXoaHIzcyyXYJN6EhUccJU"
          BASE="https://firestore.googleapis.com/v1/projects/amen-farms-app/databases/(default)/documents"
          echo "--- GET doc with Origin header ---"
          curl -sS -D - -o /tmp/doc.json -H "Origin: https://amenfarms.netlify.app"             "$BASE/gffl_fam2jan2g/settings?key=$KEY" | tr -d '\r' | grep -iE "^HTTP|access-control" || true
          echo "doc body bytes: $(wc -c < /tmp/doc.json)"
          head -c 200 /tmp/doc.json; echo
          echo "--- OPTIONS preflight for the runQuery POST ---"
          curl -sS -D - -o /dev/null -X OPTIONS             -H "Origin: https://amenfarms.netlify.app"             -H "Access-Control-Request-Method: POST"             -H "Access-Control-Request-Headers: content-type"             "$BASE:runQuery?key=$KEY" | tr -d '\r' | grep -iE "^HTTP|access-control" || true
          echo "--- actual runQuery POST with Origin (kind==team) ---"
          curl -sS -D /tmp/h.txt -o /tmp/q.json -X POST             -H "Origin: https://amenfarms.netlify.app" -H "Content-Type: application/json"             --data '{"structuredQuery":{"from":[{"collectionId":"gffl_fam2jan2g"}],"where":{"fieldFilter":{"field":{"fieldPath":"kind"},"op":"EQUAL","value":{"stringValue":"team"}}}}}'             "$BASE:runQuery?key=$KEY"
          tr -d '\r' < /tmp/h.txt | grep -iE "^HTTP|access-control" || true
          echo "runQuery body bytes: $(wc -c < /tmp/q.json)"
          python3 -c "import json; d=json.load(open('/tmp/q.json')); rows=[r for r in d if 'document' in r]; print('team docs:', len(rows))"

