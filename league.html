<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The GFFL — Goat Fantasy Football League</title>
<meta name="description" content="The Goat Fantasy Football League — fast, clean, ours.">
<meta name="theme-color" content="#101613">
<style>
  :root {
    --bg:#101613; --card:#1a231e; --line:#2b3a31; --ink:#eef4ef; --mut:#93a69a;
    --green:#4cc38a; --gold:#e2b93b; --red:#e5534b; --blue:#6cb6ff;
    --accent:#37905f; --mono:Consolas,Menlo,monospace;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif;
         padding-bottom:calc(74px + env(safe-area-inset-bottom)); }
  header { position:sticky; top:0; z-index:20; display:flex; align-items:baseline; gap:8px;
           padding:10px 14px; background:rgba(16,22,19,.92); backdrop-filter:blur(8px);
           border-bottom:1px solid var(--line); }
  header .wordmark { font-weight:800; font-size:18px; letter-spacing:.02em; }
  header .wordmark .goat { margin-right:6px; }
  header .sub { color:var(--mut); font-size:11.5px; }
  main { max-width:860px; margin:0 auto; padding:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .card.center { text-align:center; }
  h1 { margin:6px 0; } h2 { font-size:13px; margin:0 0 10px; color:var(--mut); text-transform:uppercase; letter-spacing:.06em; }
  .mut { color:var(--mut); } .small { font-size:12px; }
  .bad { color:var(--red); } .ok { color:var(--green); } .warn { color:var(--gold); }
  .logo { font-size:52px; }
  button { background:#23312a; color:var(--ink); border:1px solid var(--line); border-radius:10px;
           padding:9px 14px; font-size:14px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:#3f9f6c; font-weight:700; }
  input { background:#0e1411; color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-size:15px; }
  .card.center input { display:block; margin:14px auto; width:min(90%,280px); text-align:center; }
  .rowline { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .panner { overflow-x:auto; }
  table.tbl { border-collapse:collapse; width:100%; font-size:14px; }
  .tbl th, .tbl td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  .tbl th { color:var(--mut); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  .tbl td.num, .tbl th.num { text-align:right; font-family:var(--mono); }
  .tlogo { width:20px; height:20px; border-radius:50%; vertical-align:-4px; margin-right:6px; object-fit:cover; }
  .health { font-size:12px; padding:2px 10px; border-radius:99px; border:1px solid var(--line); }
  .health.ok { color:var(--green); } .health.warn { color:#101613; background:var(--gold); border-color:var(--gold); font-weight:700; }
  .health.bad { color:#fff; background:var(--red); border-color:var(--red); font-weight:700; }
  /* matchup cards on league home */
  .mucard { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px;
            width:100%; text-align:left; margin-bottom:8px; padding:12px; }
  .mucard.mine { outline:2px solid var(--accent); }
  .muteam { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .muteam.right { text-align:right; }
  .muscore { font-family:var(--mono); font-weight:700; }
  /* matchup page */
  .muhrow { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:start; }
  .muhteam { min-width:0; } .muhteam.right { text-align:right; }
  .bigpts { font-family:var(--mono); font-size:26px; font-weight:800; }
  .muhmid { text-align:center; min-width:96px; padding-top:6px; }
  .wpbar { height:8px; border-radius:99px; background:#26332c; overflow:hidden; margin:6px 0; }
  .wpfill { height:100%; background:linear-gradient(90deg,var(--blue),var(--green)); }
  table.mutable td { vertical-align:top; }
  .slotcell { color:var(--mut); font-size:11px; text-align:center; width:44px; font-weight:700; }
  .pcell { width:50%; } .pcell.right { text-align:right; }
  .pwrap { display:flex; justify-content:space-between; gap:8px; }
  .pwrap.right { flex-direction:row-reverse; }
  .pts { font-family:var(--mono); font-weight:700; display:block; }
  .live { color:var(--green); font-weight:700; }
  .fline { padding:5px 0; border-bottom:1px dotted #26332c; font-size:13.5px; }
  .fline.sys { color:var(--mut); }
  .delta { font-family:var(--mono); font-weight:700; }
  .delta.up { color:var(--green); } .delta.down { color:var(--red); }
  /* team page */
  .lrow { display:flex; align-items:center; gap:10px; width:100%; text-align:left; margin-bottom:6px; padding:10px 12px; }
  .lrow.locked { opacity:.72; }
  .slotchip { flex:0 0 52px; text-align:center; font-size:11px; font-weight:800; color:var(--mut);
              border:1px solid var(--line); border-radius:8px; padding:4px 0; }
  .lname { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .lpts { font-family:var(--mono); white-space:nowrap; }
  .lock { flex:0 0 auto; }
  .inj { color:var(--gold); font-weight:700; }
  .sheet { position:fixed; inset:auto 0 0 0; z-index:40; padding:10px; background:rgba(10,14,12,.6); backdrop-filter:blur(3px); }
  .sheet .card { max-height:60vh; overflow-y:auto; box-shadow:0 -8px 30px rgba(0,0,0,.5); }
  .swaprow { display:flex; justify-content:space-between; gap:10px; width:100%; text-align:left; margin-bottom:6px; padding:11px 12px; }
  .teamrow { display:flex; align-items:center; gap:12px; width:100%; text-align:left; margin-bottom:8px; padding:12px; }
  .teamrow img { width:34px; height:34px; border-radius:50%; object-fit:cover; }
  .rv input.redit { width:76px; text-align:right; font-family:var(--mono); padding:4px 6px; }
  #toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom));
           background:#0e1411; border:1px solid var(--accent); border-radius:12px; padding:10px 16px; z-index:60; }
  /* bottom nav */
  .bnav { position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex;
          background:rgba(14,20,17,.96); backdrop-filter:blur(8px); border-top:1px solid var(--line);
          padding:6px 8px calc(6px + env(safe-area-inset-bottom)); }
  .bnav button { flex:1 1 0; background:none; border:none; color:var(--mut); font-size:12px; padding:6px 2px; border-radius:10px; }
  .bnav button .ico { display:block; font-size:20px; }
  .bnav button.on { color:var(--ink); background:#222f28; }
  @media (min-width:900px) {
    header { padding:12px 20px; }
    .bnav { position:sticky; top:49px; bottom:auto; max-width:860px; margin:0 auto; border:1px solid var(--line);
            border-radius:12px; margin-top:10px; }
    body { padding-bottom:24px; }
    .bnav button { font-size:13px; display:flex; gap:8px; align-items:center; justify-content:center; }
    .bnav button .ico { display:inline; font-size:16px; }
  }
</style>
</head>
<body>
  <header>
    <span class="wordmark"><span class="goat">🐐</span>The GFFL</span>
    <span class="sub">Goat Fantasy Football League</span>
  </header>
  <nav class="bnav" id="bnav">
    <button data-v="league"><span class="ico">🏟</span>League</button>
    <button data-v="matchup"><span class="ico">⚔️</span>Matchup</button>
    <button data-v="team"><span class="ico">👥</span>My Team</button>
    <button data-v="rules"><span class="ico">📜</span>Rules</button>
  </nav>
  <main id="main"><div class="card mut">Loading the league…</div></main>
  <div id="toast" hidden></div>

  <script src="assets/league/lg-core.js"></script>
  <script src="assets/league/lg-data.js"></script>
  <script src="assets/league/lg-ui.js"></script>
  <script>
    "use strict";
    document.querySelectorAll(".bnav button").forEach((b) =>
      b.addEventListener("click", () => LG.ui.show(b.dataset.v)));
    LG.backendReady.then(() => LG.ui.boot());
    // Test hook — the suites drive and inspect through this.
    window.__GFFL__ = { LG, get D() { return LG.data; }, get UI() { return LG.ui; } };
  </script>
</body>
</html>
