  .rchead { padding:0 12px 4px; font:600 9.5px var(--font-display); letter-spacing:1px;
            text-transform:uppercase; color:var(--faint); }
  .rchead .num, .swaprow .rcnum { text-align:right; }
  /* The list is the ONLY thing that scrolls — the header, the bid and the footer stay put, so
     a long roster never pushes the submit button off the card. */
  .rclist { overflow-y:auto; overscroll-behavior:contain; flex:1 1 auto; min-height:0; margin:0 -2px; padding:0 2px 2px; }
  .swaprow { width:100%; text-align:left; background:var(--card); min-height:44px;
             border:1px solid var(--border-card); border-radius:var(--radius-sm); margin-bottom:6px; padding:9px 12px;
             text-transform:none; letter-spacing:normal; }
  .swaprow:hover { border-color:var(--border-hover); background:var(--row-hover2); }
  .swaprow.picked { border-color:var(--accent); background:var(--nested); }
  .swaprow:disabled { opacity:.45; cursor:default; }
  .swaprow:disabled:hover { border-color:var(--border-card); background:var(--card); }
  /* 2026-08-13: the face rides first, so the row is face + a text stack; .rcwhotxt carries
     the wrap/baseline behaviour the whole cell used to (its b/small descendant rules below
     still match through it). */
  .rcwho { min-width:0; display:flex; align-items:center; gap:8px; }
  .rcwhotxt { min-width:0; display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; }
  .rcwho b { font-weight:600; }
  .rcwho small { font-size:11px; }
  .rcblock { color:var(--faint); font-size:10px; text-transform:uppercase; letter-spacing:.5px; }
  .rcnum { font:600 13px var(--font-display); font-variant-numeric:tabular-nums; }
  /* A destination-slot row carries no player, so it has no numbers to line up — it spans the
     whole grid instead of leaving two empty columns. */
  .swaprow.rcslot { display:block; font:600 13px var(--font-display); letter-spacing:.5px; }
  .rcfoot { display:flex; flex-direction:column; gap:6px; padding-top:10px; }
  .rcfoot button { min-height:44px; }
  /* Submit is disabled until a drop is picked, and the card's loudest element must not LOOK
     tappable while it isn't — the app has no generic .primary:disabled rule, so this is scoped
     to the card rather than changing every primary button in the league. */
  .rcfoot .primary:disabled { opacity:.42; cursor:default; }
  .rcghost { background:transparent; border:1px solid var(--border-card); color:var(--mut); }
  .rcghost:hover { border-color:var(--border-hover); color:var(--ink2); }

  /* ---- S6: trending chrome. Text, never an emoji (the app's zero-emoji chrome rule). ---- */
  .trendchip { display:inline-block; vertical-align:middle; border-radius:var(--radius-badge);
               padding:1px 4px; font:700 9px var(--font-display); letter-spacing:.6px; }
  .trendchip.up { background:var(--gold); color:#1a1205; }
  .trendchip.down { background:var(--nested); color:var(--faint); border:1px solid var(--border-card); }
  .hotcard .hotrow { display:flex; gap:6px; overflow-x:auto; overscroll-behavior-x:contain; padding-bottom:2px; }
  .hotpick { flex:0 0 auto; display:flex; align-items:center; gap:6px; min-height:44px;
             background:var(--nested2); border:1px solid var(--border-card); border-radius:var(--radius-sm);
             padding:6px 10px; text-transform:none; letter-spacing:normal; }
  .hotpick b { font-weight:600; font-size:13px; }
  .hotpick small { font-size:11px; }
  .hotn { font:600 11px var(--font-display); font-variant-numeric:tabular-nums; }
  /* ---- item 12 (2026-08-09): the Moves player list is a bounded box, not the whole page ----
     The table already pans HORIZONTALLY inside .panner with its PLAYER column sticky-left; the
     vertical cap is added to that SAME container rather than a wrapper around it, because a
     position:sticky cell only sticks to the scrollport it actually lives in — wrapping the
     panner in a second scroller would leave the sticky column pinned to the wrong box and it
     would drift out of view on a horizontal pan. The header row gets top:0 for the same
     reason (it is now scrolling within its own container, so it needs to stick to it), and
     the top-left cell needs both axes plus the highest z-index of the three.
     "Show more ↓" is rendered AFTER the .panner, so it stays below the box and growing the
     pool can never blow the box's own height out. */
  #faResults .panner { max-height:340px; overflow:auto; overscroll-behavior:contain; }
  @media (min-width:1024px) { #faResults .panner { max-height:560px; } }
  table.faTable thead th { position:sticky; top:0; background:var(--card); z-index:1; }
  /* The scroll cap moved onto .tradepick (item 20) — the whole side no longer scrolls, only
     the picker inside it, so a chosen player can never scroll out of sight. */
  /* ---- item 13 (2026-08-09): "My pending", compact ----
     Same information, roughly a third of the room: the card's own padding comes in, the
     sub-headings stop reserving a full text block each, rows tighten, and an empty state is
     one quiet line rather than a paragraph. The action buttons deliberately keep a 44px
     minimum — this is the one card where shrinking must not shrink a tap target. */
  .pendcard { padding:10px 12px; }
  .pendcard h2 { margin-bottom:4px; }
  .pendcard h2.small { margin:8px 0 2px; }
  /* The row's text and its action button share ONE line. .rowline wraps by default, and with
     a 44px button that meant every pending row cost two full lines (measured 76-94px each)
     for one sentence. nowrap + a shrinkable text column lets the sentence wrap INSIDE its own
     share instead, so the row is only ever as tall as the taller of the two. */
  .pendcard .rowline { padding:3px 0; font-size:12.5px; gap:8px; flex-wrap:nowrap; align-items:center; }
  .pendcard .rowline > span:first-child { flex:1 1 auto; min-width:0; }
  .pendcard .rowline > button { flex:0 0 auto; }
  /* DIRECT children only — the ACTION buttons (Cancel/Accept/Decline/Veto) are children of
     .rowline, while the player-name links (.pcinline) are inline text nested inside its
     <span>. A bare descendant selector here gives every name link a 44px box and triples the
     card's height, which is the opposite of the point. */
  .pendcard .rowline > button { min-height:44px; }
  .pendcard .fline { padding:4px 0; font-size:12.5px; }
  .pendcard .pendnone { margin:0; }
  /* ---- S7: a counter chain renders as ONE thread ----
     The live offer keeps the ordinary .rowline it always had; its ancestors sit under it as
     quiet single lines behind a rail, so an exchange reads as one item in the list rather
     than as several competing offers. */
  .tradethread { padding:2px 0; }
  .tradethread + .tradethread { border-top:1px solid var(--divider2); }
  .tradeanc { margin:1px 0 3px 2px; padding-left:9px; border-left:2px solid var(--divider); }
  .tradeancline { padding:1px 0; font-size:11.5px; line-height:1.35; }
  /* An OFFER made to me carries three actions (Accept · Counter · Decline). At 390px three
     44px buttons plus the sentence do not fit on one nowrap line with the sentence still
     readable, so this row alone is allowed to wrap: the sentence takes the full width and the
     buttons sit under it. Every other pending row keeps the single-line treatment. */
  .pendcard .rowline.tactions { flex-wrap:wrap; }
  .pendcard .rowline.tactions > span:first-child { flex:1 1 100%; }
  #mvCounterNote { margin:0 0 8px; }
  #mvTradeTeam { width:100%; margin-bottom:8px; }
  #faSearch, #mvTradeNote { width:100%; margin:6px 0; }
  .teamrow { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--card);
             border:1px solid var(--border-card); border-radius:var(--radius-sm); margin-bottom:8px; padding:12px;
             text-transform:none; letter-spacing:normal; }
  .teamrow:hover { border-color:var(--border-hover); background:var(--row-hover2); }
  .teamrow img { width:34px; height:34px; border-radius:50%; object-fit:cover; }
  /* item 9 cleanup: this rule used to be scoped ".rv input.redit" — .rv never existed in the
     markup, so it never actually applied. Fixed to target .redit directly. */
  /* Polish pass (2026-08-08): 76px fit every NUMERIC rule field, but a few carry short STRING
     enums instead (keepers.waiverCost defaults to "last-round") — at 76px that value truncated
     to "last-roun", silently hiding the last character of an editable setting. 112px is sized
     off that actual longest value at this font, with a little headroom; every numeric field
     (1-4 digits) sits comfortably inside it too. */
  input.redit { width:112px; text-align:right; font-family:var(--font-display); font-weight:700; padding:4px 6px; }
  #toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(74px + env(safe-area-inset-bottom));
           background:var(--nested); border:1px solid var(--border-hover); border-left:3px solid var(--accent);
           border-radius:var(--radius-sm); padding:10px 16px; font:13px var(--font-body); z-index:60;
           box-shadow:0 8px 24px rgba(0,0,0,.5); }
  /* team-name tap targets -> locker */
  .teamlink { cursor:pointer; text-decoration:none; }
  .teamlink:hover, .teamlink:focus { text-decoration:underline; color:var(--accent); }

  /* Item 16 (2026-08-09): the Rules / Draft pair that replaced their bottom-nav tabs. Two
     equal columns on one row (they stack under 380px, which no phone in this family has, but
     flex-wrap makes that safe anyway); every target is ≥44px. Styled as one language even
     though one is a <button> and the other an <a> — the difference is in how they behave, not
     in how they look. */
  .leaguelinks { display:flex; flex-wrap:wrap; gap:10px; }
  .navlinkbtn { flex:1 1 150px; min-height:52px; display:flex; flex-direction:column; justify-content:center;
                gap:2px; text-align:left; padding:9px 12px; background:var(--nested); color:var(--ink);
                border:1px solid var(--border-card); border-radius:var(--radius-sm); text-decoration:none;
                font:600 13px var(--font-display); letter-spacing:.6px; text-transform:uppercase; }
  .navlinkbtn:hover { border-color:var(--border-hover); color:var(--ink); }
  .navlinkbtn .small { font:400 11px var(--font-body); letter-spacing:0; text-transform:none; }
  /* S2's quiet "Drafted ✓" line — appended AFTER the two buttons above, on its own row. */
  .draftedline { flex:1 1 100%; margin:2px 0 0; }

  /* S2: the draft-day card, first on the league home while the draft is still ahead. Centered,
     a little larger than an ordinary card — this is the one thing on the page with a clock
     running against it. LIVE reuses the app's existing LIVE colour language (var(--accent),
     same as .mulive/.sccard.live/.scstate.live) rather than inventing a new one. */
  .draftcard { text-align:center; }
  .draftcard h2 { font-size:15px; letter-spacing:1px; }
  .draftwhen { margin:2px 0 10px; }
  .draftclock { font:700 30px var(--font-display); letter-spacing:.5px; margin-bottom:12px; }
  .draftcard .navlinkbtn { display:inline-flex; flex:0 0 auto; text-align:center; min-width:180px; }
  .draftlive { border-color:var(--accent); }
  .draftlive .draftjoin { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* ---------------- chat ---------------- */
  .chatcard { padding-bottom:0; }
  .chatlist { max-height:52vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:2px 2px 8px; }
  /* Item 14 (2026-08-09, user: "on mobile the new message appears on the bottom of the screen
     as it should, but on desktop it appears at the top"). MEASURED: the list box HUGS its
     content (max-height only, no height), so on a phone — where 52vh is most of the screen and
     a real history overflows it immediately — the newest message lands near the bottom of the
     SCREEN, while on a desktop the same card is a short block floating at the top of a 900px
     page. Same code, different relationship to the viewport.
     Two parts, and both are needed:
       · the dedicated Chat tab is a chat PANE — a definite 52vh box at every width, so the
         composer sits low and the newest message sits just above it however few messages
         there are. The matchup page's trash-talk thread deliberately does NOT get this: it is
         one card among many on that page, and a half-empty 52vh box mid-page would be worse
         than a short one.
       · content is BOTTOM-ANCHORED with an auto top margin on the first message.
     ⚠ NOT justify-content:flex-end on the scroller — the obvious fix and a trap: on an
     OVERFLOWING flex column several engines make the overflowed content at the top
     unreachable, so scrolling up clips the earliest messages away. An auto margin resolves to
     zero once free space is negative, so a full history stays completely scrollable. */
  /* THE CHAT TAB FILLS THE SCREEN (2026-08-14, user: "the chat in mobile has a blank space
     between the chat window and the bottom row of tabs"). It was a FIXED 52vh — on an 844px
     phone that is 439px of list, and header + card + composer + the body's 64px nav clearance
     left ~200px of dead space below the card. --chatlist-h is MEASURED by sizeChatList()
     (the --cal-sticky-top / sizeEmbeds convention) as the real gap between the list's own top
     and the nav; the vh value is only the pre-measurement fallback for the first paint. */
  .chatcard .chatlist { height:var(--chatlist-h, 52vh); }
  .chatlist > :first-child { margin-top:auto; }
  .chatRowMsg { display:flex; }
  .chatBubble { background:var(--nested2); border:1px solid var(--border-card); border-radius:12px; padding:8px 10px; max-width:88%; }
  .chatBubble.mine { background:var(--card); border-color:var(--accent); margin-left:auto; }
  /* S3: the byline leads with the team's crest, so a thread reads as a conversation between
     teams rather than a column of names. align-items:center keeps the 20px crest, the name and
     the timestamp on one baseline band; the timestamp keeps its right-hand berth via the auto
     margin (justify-content can no longer do it now that the row has three children). */
  .chatMeta { display:flex; align-items:center; gap:6px; font-size:12px; margin-bottom:2px; }
  .chatMeta .small { margin-left:auto; white-space:nowrap; }
  .chatMeta b { font-family:var(--font-display); font-weight:600; letter-spacing:.3px; }
  .chatcrest { width:20px; height:20px; font-size:9px; vertical-align:0; }
  .teamrowcrest { width:38px; height:38px; font-size:14px; vertical-align:0; }
  .teamrowname { font-size:15px; }
  .chatQuote { border-left:2px solid var(--border-card); padding-left:8px; margin:4px 0; color:var(--mut); font-size:12.5px; }
  .chatText2 { white-space:pre-wrap; word-break:break-word; }
  .chatImg { max-width:220px; max-height:220px; border-radius:10px; margin-top:6px; display:block; cursor:zoom-in; }
  .chatActions { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  /* THE TROPHY CASE (2026-08-12, reworked 2026-08-13) — one shelf per award kind, and a
     repeat winner gets ONE ICON PER YEAR (the user's call — a row of cups, not "×3"), each
     icon wearing its own year. Icon colours: gold cup, silver medal, green points bars. */
  .trophycase .tcshelf { display:flex; align-items:center; gap:9px; padding:8px 0; flex-wrap:wrap;
    border-bottom:1px solid var(--divider2); }
  .trophycase .tcshelf:last-child { border-bottom:0; padding-bottom:2px; }
  .trophycase svg { flex:0 0 auto; }
  .tk-champ svg { color:var(--gold); } .tk-silver svg { color:#c3cbdb; }
  .tk-points svg { color:var(--green); }
  .trophycase .tclabel { font:700 13px var(--font-display); letter-spacing:.5px; text-transform:uppercase; color:var(--ink); }
  .trophycase .tcyears { display:flex; flex-wrap:wrap; gap:8px; margin-left:auto; }
  .trophycase .tctoken { display:inline-flex; flex-direction:column; align-items:center; gap:1px;
    background:var(--nested2); border:1px solid var(--border-card); border-radius:var(--radius-badge); padding:5px 7px 3px; }
  .trophycase .tcyear { font:600 10.5px var(--font-display); letter-spacing:.4px; color:var(--ink2); }
  /* The AI trade analyst's read (2026-08-12) — a quiet nested panel under the Suggest button. */
  .mvsugai { background:var(--nested2); border:1px solid var(--border-card); border-radius:10px;
    padding:10px 12px; margin:8px 0 10px; font-size:13px; line-height:1.5; color:var(--ink2);
    position:relative; }
  /* the analysis persists across repaints; the ✕ is its one deliberate exit (with a new run) */
  .mvsugx { position:absolute; top:4px; right:4px; width:28px; height:28px; line-height:1;
    background:none; border:none; color:var(--mut); font-size:14px; cursor:pointer;
    border-radius:6px; padding:0; }
  .mvsugx:hover { color:var(--ink); background:var(--card); }
  .mvsugbody { padding-right:26px; }
  .mvsugai p { margin:0 0 8px; } .mvsugai p:last-child { margin-bottom:0; }
  .mvsugai b { color:var(--ink); }
  .mvsugai[hidden] { display:none; } /* the house [hidden] restatement, again */
  /* Refinement 4: reactions. A chip only exists when someone reacted; a lit ring marks YOUR
     team's own reaction; the add-button is the SVG smiley-plus; the palette is the same
     keyboard the composer uses, anchored to one message at a time. */
  .chatReact.on { border-color:var(--accent); color:var(--ink); }
  .chatReactAdd { display:inline-flex; align-items:center; justify-content:center; }
  .reactPalette { display:flex; flex-wrap:wrap; gap:2px; background:var(--nested2);
    border:1px solid var(--border-card); border-radius:10px; padding:5px; margin-top:6px; }
  .reactPalette .chatEmoji { font-size:18px; line-height:1; padding:4px; min-height:32px; min-width:32px;
    background:none; border:none; border-radius:6px; cursor:pointer; }
  .reactPalette .chatEmoji:hover { background:var(--nested); }
  .chatActions button { background:var(--nested2); border:1px solid var(--border-card); border-radius:var(--radius-pill);
                         padding:3px 9px; font-size:12px; text-transform:none; letter-spacing:0; }
  .chatDel { color:var(--accent); }
  .chatSys { color:var(--mut); font-size:13px; background:var(--nested2); border:1px dashed var(--border-card);
             border-radius:10px; padding:6px 10px; width:100%; }
  .chatcompose { border-top:1px solid var(--border-card); margin-top:8px; padding-top:10px; position:sticky; bottom:0; background:var(--card); }
  /* Boot-speed/polish pass (2026-08-08): PHOTO/IMAGES/GIF/SEND are all fixed-width text
     buttons (flex:0 0 auto — they never shrink) sharing one row with the message box; at
     390px their combined width (~260px incl. gaps) left the textarea only ~40px — three or
     four characters — before any typing even started. flex-wrap + a real basis on the
     textarea forces a clean two-line layout instead: the three icon buttons comfortably fit
     line 1 on their own (~215px of 332px available), so a basis bigger than what's left on
     that line (120px) pushes the textarea (and Send, right after it) onto their own full-
     width line 2 — no HTML restructuring needed, just where the wrap naturally falls.
     Also lifted .chatText out from the unstyled-by-default `<textarea>` gap: the base
     `input, select { }` rule never touches textareas, so this box was relying on browser
     defaults for everything but width. */
  .chatRow { display:flex; gap:6px 8px; align-items:center; flex-wrap:wrap; row-gap:8px; }
  .chaticon { padding:7px 9px; flex:0 0 auto; font-size:11.5px; }
  .chatText { flex:1 1 200px; min-width:0; background:var(--nested2); color:var(--ink);
              border:1px solid var(--border-card); border-radius:var(--radius-sm);
              padding:9px 10px; font:15px var(--font-body); resize:none; }
  .chatText:focus { outline:none; border-color:var(--border-hover); }
  .chatSend { flex:0 0 auto; }
  .chatgifbox, .chatEmojiBox { background:var(--nested2); border:1px solid var(--border-card); border-radius:12px; padding:8px; margin-bottom:8px; }
  .chatGifQ { width:100%; margin-bottom:8px; }
  .chatGifGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:6px; }
  /* Refinement 3: the emoji picker keyboard — big tap targets, no button chrome. */
  .chatEmojiGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(38px,1fr)); gap:2px; max-height:180px; overflow-y:auto; }
  .chatEmojiGrid .chatEmoji { font-size:21px; line-height:1; padding:6px 2px; min-height:38px; background:none; border:none; border-radius:8px; cursor:pointer; }
  .chatEmojiGrid .chatEmoji:hover { background:var(--nested); }
  .gifThumb { padding:0; border-radius:8px; overflow:hidden; border:1px solid var(--border-card); background:none; }
  .gifThumb img { width:100%; height:64px; object-fit:cover; display:block; }
  .chatReplyPreview, .chatPending { display:flex; align-items:center; gap:8px; background:var(--nested2); border:1px solid var(--border-card);
    border-radius:10px; padding:6px 10px; margin-bottom:8px; }
  .chatPending img { width:44px; height:44px; object-fit:cover; border-radius:8px; }
  .chatReplyX, .chatPendingX { margin-left:auto; background:none; border:none; padding:2px 6px; }
  /* the house [hidden]-override lesson, again — every chat auxiliary panel
     sets its own `display` unconditionally, so each needs this restated */
  .chatEmojiBox[hidden], .chatgifbox[hidden], .chatReplyPreview[hidden], .chatPending[hidden] { display:none; }
  .imgoverlay { position:fixed; inset:0; z-index:70; background:rgba(6,7,8,.92); display:flex; align-items:center; justify-content:center;
                 padding:calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left)); }
  .imgoverlay[hidden] { display:none; } /* the house [hidden]-override lesson — an author rule always beats the UA [hidden]{display:none} */
  .imgoverlay img { max-width:100%; max-height:100%; border-radius:10px; }

  /* ---------------- record book (S6) + league-home collapsible cards (item 4) ----------------
     .collapsecard ( Recent moves /  League chat) is a DELIBERATELY SEPARATE class from
     .recordbook, even though the disclosure styling is identical — several existing tests
     select ".recordbook" specifically to reach the ACTUAL record book, and the two new cards
     render ABOVE it in DOM order, so sharing the class made document.querySelector(".recordbook")
     grab the wrong card. */
  .recordbook summary, .collapsecard summary { cursor:pointer; font:600 12px var(--font-display); color:var(--mut); text-transform:uppercase;
                         letter-spacing:2px; list-style:none; }
  .recordbook summary::-webkit-details-marker, .collapsecard summary::-webkit-details-marker { display:none; }
  .recordbook summary::before, .collapsecard summary::before { content:"▸ "; color:var(--accent); }
  .recordbook[open] summary::before, .collapsecard[open] summary::before { content:"▾ "; }
  .recordbook[open] summary, .collapsecard[open] summary { margin-bottom:10px; }
  .h2hline { text-align:center; margin-top:6px; }

  /* ---------------- playoff bracket (S7) ---------------- */
  .champbanner { text-align:center; padding:18px; margin-bottom:12px; border-radius:var(--radius-card);
                 background:linear-gradient(135deg,var(--gold),#8a6110); color:var(--bg); font:800 16px var(--font-display);
                 letter-spacing:.5px; text-transform:uppercase; }
  .toiletbanner { text-align:center; padding:10px; margin-bottom:12px; border-radius:var(--radius-sm);
                  border:1px dashed var(--accent); color:var(--accent); font-size:13px; }
  .bracketrounds { display:flex; flex-direction:column; gap:16px; }
  .bracketcol { min-width:0; }
  .byerow { padding:8px 10px; margin-bottom:6px; border:1px dashed var(--border-card); border-radius:var(--radius-sm); color:var(--mut); font-size:13px; }
  .bgame { display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--border-card);
           border-radius:var(--radius-sm); margin-bottom:8px; padding:10px 12px;
           text-transform:none; letter-spacing:normal; }
  .bgame:not([disabled]):hover { border-color:var(--border-hover); }
  .bgame[disabled] { cursor:default; opacity:.82; }
  .bgame .bside { display:flex; justify-content:space-between; gap:10px; font:500 13.5px var(--font-body); padding:2px 0; }
  .bgame .bside .mut { font-family:var(--font-display); font-weight:700; }
  .bgame .bside.winner { font-weight:800; color:var(--green); }
  @media (min-width:900px) {
    .bracketrounds { flex-direction:row; align-items:flex-start; }
    .bracketcol { flex:1 1 0; }
  }

  /* ---------------- scores tab (item 2, playtest batch 2 — ESPN-scoreboard-style day-grouped
     cards, replacing the old plain gmrow list; card grid goes 2-up at ≥1024px below) ---------------- */
  .scoreday { margin-bottom:14px; }
  .scoreday h2 { margin-bottom:6px; }
  .scgrid { display:grid; grid-template-columns:1fr; gap:8px; }
  .sccard { background:var(--card); border:1px solid var(--border-card); border-radius:var(--radius-sm); padding:10px 12px; }
  .sccard.live { border-color:var(--accent); }
  /* 2026-08-13: the matchup page's slash on the NFL cards, in each team's OWN colours
     (ESPN's team.color/alternateColor, slimmed by lg-data). Primary slash + secondary
     stripe per side — the NFL has no tertiary. Hosts: the card's own pseudos (primary) and
     .scstaterow's (secondary — always rendered, unpositioned, unclipped). A colour ESPN
     never sent leaves its var unset and `background:var(--tpa, transparent)` paints
     nothing — the card is otherwise byte-identical. */
  .sccard.scslash { position:relative; isolation:isolate; overflow:hidden; }
  .sccard.scslash::before { content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
    background:var(--tpa, transparent); clip-path:polygon(0 0, 34px 0, 14px 100%, 0 100%); }
  .sccard.scslash::after { content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
    background:var(--tph, transparent); clip-path:polygon(calc(100% - 34px) 0, 100% 0, 100% 100%, calc(100% - 14px) 100%); }
  .sccard.scslash .scstaterow::before { content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
    background:var(--tsa, transparent); clip-path:polygon(39px 0, 43px 0, 23px 100%, 19px 100%); }
  .sccard.scslash .scstaterow::after { content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
    background:var(--tsh, transparent); clip-path:polygon(calc(100% - 43px) 0, calc(100% - 39px) 0, calc(100% - 19px) 100%, calc(100% - 23px) 100%); }
  /* 2026-08-13 rework: everything is CENTERED now — the state row (network · time CT), the
     team columns, the vegas line, the player count — and the crests moved OFF the slashes
     into their columns, so the slashes are pure edge decoration and nothing needs a
     clearance pad beyond the card's own padding. */
  .sccard.scslash .scstaterow { justify-content:center; gap:10px; }
  .sccard.scslash .scteams { padding:0 34px; } /* the columns center between the bands, never under them */
  /* Week cycling (2026-08-13): ‹ Week N › over both cards; a browsed GFFL pairing is a
     STATIC card — same slash language, no pointer, because the Matchup view belongs to the
     live week alone. */
  .scweeknav .rowline { justify-content:center; gap:14px; }
  .scweeknav button { min-width:44px; min-height:36px; background:var(--nested2);
    border:1px solid var(--border-card); border-radius:var(--radius-badge); color:var(--ink);
    font:700 15px var(--font-display); cursor:pointer; }
  .scweeknav button:disabled { opacity:.35; cursor:default; }
  .scweeknav .scweeklabel { font:700 15px var(--font-display); letter-spacing:.5px; text-transform:uppercase; }
  .mucard.static { cursor:default; }
  .mucard.static .herorow { padding:0; min-height:0; }
  .scnet { font:600 10.5px var(--font-display); letter-spacing:.5px; text-transform:uppercase; color:var(--mut); }
  .scstate { font:600 11.5px var(--font-display); letter-spacing:.5px; text-transform:uppercase; color:var(--mut); }
  .scstate.live { color:var(--accent); }
  /* REWORKED 2026-08-13 from the user's own screenshot: each side is a CENTERED COLUMN —
     big crest, the full team name over two rows, the score beneath while playing. The state
     row (network · kickoff/clock), the vegas line and the player count all center too. */
  .scteams { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-top:6px; font:600 15px var(--font-display); }
  .scteam { display:flex; flex-direction:column; align-items:center; gap:2px; flex:1 1 0; min-width:0; text-align:center; }
  .scat { align-self:center; flex:0 0 auto; }
  /* FIXED box (matching the img's own width/height attributes) so the column's height is
     decided before the image arrives — a slow, missing or failed crest can never shift the
     name rows; a crest-less team gets an EMPTY box the same size so both columns stay level. */
  .sclogo { width:44px; height:44px; flex:0 0 auto; object-fit:contain; }
  .sccity { font:600 12px var(--font-display); letter-spacing:.4px; color:var(--ink2); max-width:100%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .scnick { font:700 15px var(--font-display); letter-spacing:.4px; max-width:100%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .scpts { font-weight:800; font-size:19px; font-variant-numeric:tabular-nums; margin-top:1px; }
  /* Down / distance / possession on a LIVE score card (2026-08-14). The pip rides the
     possessing team's nickname (gold = has the ball, the matchup rows' own language);
     the centered line states it in words. Red zone turns both accent-red. */
  .scposs { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--gold); margin-left:5px; vertical-align:middle; }
  .scposs.rz { background:var(--accent); }
  .scsitu { text-align:center; margin-top:7px; font-size:12.5px; color:var(--ink2); }
  .scsitu b { font-weight:800; color:var(--ink); }
  .scsitu.rz b { color:var(--accent); }
  .scspread, .scmine { margin-top:5px; text-align:center; }
  .ffrow { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .ffside { display:flex; flex-direction:column; gap:1px; min-width:0; }
  .ffside.mut { flex-direction:row; }
  .ffpts { font:700 15px var(--font-display); font-variant-numeric:tabular-nums; }
  @media (min-width:1024px) { .scgrid { grid-template-columns:1fr 1fr; } }
  /* Item 28 (2026-08-09): the score card is a <button> now (it opens the game view). The base
     `button` rule's uppercase + letter-spacing must be cancelled exactly the way .mucard
     cancels them, or the kickoff times and "at" separator come out shouty and mis-spaced. */
  .sccard { width:100%; text-align:left; cursor:pointer; font:inherit;
            text-transform:none; letter-spacing:normal;
            /* PRE-EXISTING, found by reading the review plate's pixels (measured: the live
               card's abbrevs and scores rendered rgb(213,10,10), the upcoming card's the
               correct rgb(233,237,244)). The generic `.live { color:var(--accent) }` rule far
               above matches `.sccard.live` and cascades red into every descendant that sets no
               colour of its own — so a live game's team abbrevs and scores have been red since
               the card shipped, which contradicts the batch-AG rule that red means live-clock
               and injury and nothing else. `.scstate.live` (two classes) still wins for the
               state chip, which is the one thing that SHOULD be red. */
            color:var(--ink); }
  .sccard:hover, .sccard:focus-visible { border-color:var(--border-hover); background:var(--row-hover2); }
  .sccard.live:hover, .sccard.live:focus-visible { border-color:var(--accent); }
  .sccard:disabled { cursor:default; }

  /* ---------------- item 28 — the NFL game view (field · play-by-play · box scores) ----------------
     The STRUCTURE is ported from sports.html (same payload, same field maths); the DRESS is
     this app's own tokens, because sports.html lives in the cream main-Bucky shell and the
     GFFL is broadcast-dark. --turf/--turf-2/--chalk are scoped to the field container rather
     than :root — nothing else in the league is a football pitch. */
  .nflbar { margin-bottom:10px; }
  .nflback { background:var(--nested); }
  .nfllivechip { font:700 11px var(--font-display); letter-spacing:1px; text-transform:uppercase; color:var(--accent); }
  .seclabel { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px;
              font:700 12px var(--font-display); letter-spacing:1px; text-transform:uppercase; }
  .seclabel .mut { text-transform:none; letter-spacing:normal; font-family:var(--font-body); }
  /* Header: crest+abbrev on the outer edges, the two scores facing each other across the
     status column — the same arrangement the matchup header uses, so the two read as one app. */
  .nflhead { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .nflside { display:flex; align-items:center; gap:7px; min-width:0; }
  .nflcrest { width:26px; height:26px; flex:0 0 auto; object-fit:contain; }
  .nflab { font:700 15px var(--font-display); letter-spacing:.5px; display:inline-flex; align-items:center; gap:5px; }
  .nflposs { width:7px; height:7px; border-radius:50%; background:var(--gold); display:inline-block; }
  .nflscores { display:flex; align-items:center; gap:10px; flex:0 0 auto; }
  .nflbig { font:800 26px/1 var(--font-display); font-variant-numeric:tabular-nums; }
  .nflbig.losing { color:var(--mut); }
  .nflmid { display:flex; flex-direction:column; align-items:center; gap:1px; min-width:66px; }
  .nflq { font:700 11.5px var(--font-display); letter-spacing:.6px; text-transform:uppercase; color:var(--accent); }
  .nflq.done { color:var(--mut); }
  table.nflline { margin-top:10px; font-size:12.5px; text-align:center; }
  table.nflline td, table.nflline th { text-align:center; padding:3px 6px; }
  /* The team column is a label, not a number — centring it left it floating in the middle of a
     wide desktop row (seen on the plate). */
  table.nflline td:first-child, table.nflline th:first-child { text-align:left; width:22%; }
  table.nflline .nfltot { font-weight:800; }
  .nflkick > div { padding:2px 0; }
  .nflkick .mut { display:inline-block; min-width:56px; font-size:12px; }
  /* The field. A 1000x300 viewBox scaled to the card's width — at 390px that is ~106px tall,
     which is enough for the ball, the two lines and the yard numbers to all read. */
  .nflfield { --turf:#1c3b28; --turf-2:#21462f; --chalk:#dfe7f2; padding:10px 12px 12px; }
  .nfldiag { display:block; width:100%; height:auto; border-radius:var(--radius-xs); }
  /* ESPN-style gamecast chrome (2026-08-13): the field card carries a CURRENT DRIVE header,
     the event label + Down/Ball-on strip centered above the field, and the last-play card
     with the live Win %. .nflsitu/.nfllast retired with the old flat layout. */
  .nfldrivehead { display:flex; align-items:center; gap:10px; padding-bottom:8px; border-bottom:1px solid var(--divider2); margin-bottom:6px; }
  .nfldrivehead .nfldht { display:flex; flex-direction:column; gap:1px; }
  .nfldrivehead b { font:700 14px var(--font-display); letter-spacing:1.2px; }
  .nflevent { display:flex; align-items:center; justify-content:center; gap:7px; margin-top:4px; font:600 13.5px var(--font-body); }
  .nflevent .nflcrest { width:18px; height:18px; }
  .nflddrow { display:flex; align-items:baseline; justify-content:center; gap:26px; margin:4px 0 2px; }
  .nfldditem { display:flex; align-items:baseline; gap:7px; }
  .nfldditem b { font:800 19px var(--font-num); font-variant-numeric:tabular-nums; letter-spacing:.2px; }
  .nfllastcard { margin-top:8px; padding:10px 12px; background:var(--nested2); border:1px solid var(--divider2); border-radius:var(--radius-xs); }
  .nfllphead { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:5px; }
  .nfllph { font:800 15px var(--font-body); }
  .nfllpr { display:flex; align-items:center; gap:10px; }
  .nfllpwp { display:flex; align-items:center; gap:5px; }
  .nfllpwp .nflcrest { width:18px; height:18px; }
  .nfllpwp b { font:800 15px var(--font-num); font-variant-numeric:tabular-nums; }
  .nfllpchip { font:700 10.5px var(--font-display); letter-spacing:.8px; text-transform:uppercase; color:var(--mut);
               background:var(--nested); border:1px solid var(--divider); border-radius:var(--radius-xs); padding:3px 8px; }
  .nfllptext { font-size:13px; line-height:1.5; color:var(--ink2); }
  .nfltag { display:inline-block; min-width:34px; text-align:center; padding:1px 5px; border-radius:var(--radius-badge);
            font:700 10.5px var(--font-display); letter-spacing:.5px; color:#fff; }
  /* Play-by-play. The current drive is capped and scrolls inside its own box so a long drive
     can't push the box score off the bottom of the page. */
  .nflplays { max-height:280px; overflow-y:auto; overscroll-behavior:contain; }
  .nflplay { display:grid; grid-template-columns:52px 1fr auto; gap:8px; align-items:baseline;
             padding:6px 0; border-top:1px solid var(--divider2); font-size:13px; }
  .nflplay:first-child { border-top:none; }
  .nflplay.score { background:rgba(255,182,18,.07); }
  .nfldd { font:700 10.5px var(--font-display); letter-spacing:.4px; color:var(--mut); text-transform:uppercase; }
  .nfltext { min-width:0; }
  .nfldrv { display:grid; grid-template-columns:auto auto 1fr; gap:8px; align-items:baseline;
            padding:6px 0; border-top:1px solid var(--divider2); font-size:13px; }
  .nfldrv:first-of-type { border-top:none; }
  /* item 5 (2026-08-22): "In this game" — one compact row per GFFL-rostered player, AWAY
     team's group then HOME's, each led by its own .nfltag chip. */
  .nflgteam { margin-top:10px; }
  .nflgteam:first-child { margin-top:0; }
  /* 2026-08-22 RESTAGE: the global `button{}` reset (font:600 12.5px var(--font-display),
     uppercase, letter-spacing:1px — the app's BUTTON voice) was leaking through .nflgprow's
     own `font:inherit` — inherit resets family/weight/size/line-height but NOT
     text-transform/letter-spacing, which .fline/.nflgprow never explicitly reset either. The
     row read in small-caps button type instead of the page's own body/small scale that every
     sibling drive row (.nfldrv, .nflplay) already uses — same 13px this rule already declared,
     but dressed as a button label instead of a line of text. Reset explicitly now. */
  .nflgprow { display:flex; width:100%; align-items:baseline; gap:6px; flex-wrap:wrap;
              text-align:left; background:none; border:none; border-top:1px solid var(--divider2);
              padding:6px 0; font:inherit; color:inherit; font-size:13px;
              text-transform:none; letter-spacing:normal; }
  .nflgprow:first-of-type { border-top:none; }
  .nflgprow > :last-child { margin-left:auto; }
  /* Previous drives are DROPDOWNS (2026-08-13 game night). The <details> keeps the plain
     drive-line grid on its SUMMARY (plus a quiet "N plays" count and a chevron); its play list
     reuses .nflplays/.nflplay unchanged and is inset under a hairline so it reads as the
     drive's own contents, not a new section. The reader's open/closed state is theirs — the
     live morph never syncs a details' `open` (see patchInto's rules). */
  details.nfldrvd { display:block; padding:0; }
  details.nfldrvd > summary { display:grid; grid-template-columns:auto auto 1fr auto; gap:8px;
    align-items:baseline; padding:6px 0; cursor:pointer; list-style:none; font-size:13px; }
  details.nfldrvd > summary::-webkit-details-marker { display:none; }
  details.nfldrvd > summary::after { content:"▾"; color:var(--mut); font-size:11px;
    align-self:center; transition:transform .12s; }
  details.nfldrvd[open] > summary::after { transform:rotate(180deg); }
  .nfldrvn { white-space:nowrap; }
  details.nfldrvd > .nflplays { margin:0 0 6px 10px; padding-left:8px;
    border-left:2px solid var(--divider2); max-height:340px; }
  .nflres { font:700 11.5px var(--font-display); letter-spacing:.5px; text-transform:uppercase; color:var(--ink2); }
  .nflres.scored { color:var(--gold); }
  .nflwp { display:flex; align-items:center; gap:12px; }
  .nflwp svg { flex:1 1 auto; height:56px; min-width:0; }
  .nflwpv { flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; }
  .nflwpv b { font:700 15px var(--font-display); }
  .nflsplit { border-top:1px solid var(--divider); margin:12px 0; }
  .nflsb { margin:8px 0; }
  .nflsbl { display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:12.5px; }
  .nflsbl b { font-variant-numeric:tabular-nums; }
  .nflsbt { display:flex; height:6px; border-radius:var(--radius-pill); overflow:hidden; background:var(--border-card); margin-top:3px; }
  .nflsbt i, .nflsbt em { display:block; height:100%; }
  .nflboxt { font:700 11px var(--font-display); letter-spacing:1px; text-transform:uppercase; color:var(--mut); margin:10px 0 4px; }
  table.nflbox { font-size:12.5px; min-width:340px; }
  table.nflbox th, table.nflbox td { padding:4px 8px; white-space:nowrap; }
  .nflsc { display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:baseline;
           padding:6px 0; border-top:1px solid var(--divider2); font-size:13px; }
  .nflsc:first-of-type { border-top:none; }
  .nflafter { font-variant-numeric:tabular-nums; }
  @media (max-width:420px) {
    .nflbig { font-size:22px; }
    .nflcrest { width:22px; height:22px; }
    .nflscores { gap:6px; }
    .nflmid { min-width:56px; }
  }
  /* Desktop: the game view is a READING COLUMN, not a full-bleed page. Reviewed at 1440px and
     fixed — unconstrained, the 1000x300 field scaled to 1126px wide and stood 338px tall (it
     ate the screen), the header's two scores sat marooned in the middle of a 1150px row with
     the team names pinned to the far edges, and the linescore's four quarters were spaced a
     handspan apart. One max-width on the body fixes all three at once, and the field's own
     aspect ratio then caps its height at ~216px. */
  @media (min-width:1024px) {
    .nflbar, #nflBody { max-width:720px; margin-left:auto; margin-right:auto; }
    .nflplay { grid-template-columns:66px 1fr auto; }
  }

  /* ---------------- lockers ---------------- */
  /* Item 10 (2026-08-09 playtest: "need to shrink the team name card in half"). MEASURED at
     390px: 182px tall for a logo, a name, a motto and a record. Everything it carried stays —
     colour, crest, name, record, motto — at about half the scale: 8px padding instead of 16,
     a 38px logo instead of 64, a 17px name instead of 24, and the owner's edit buttons on a
     tighter row. */
  /* S3 THE HERO — FABLE DESIGN PASS (2026-08-10). The first cut stacked three translucent
     layers (the logo blurred 22px, a primary→secondary gradient, a darkening wash) and the
     result was mud: every team's banner converged on the same murky smear, and the chosen
     colours never arrived crisply. Modern-minimalist means FLAT and GEOMETRIC: the card is
     the app's own dark surface, and the team's colour arrives as one sharp diagonal PANEL of
     primary behind the crest with a thin parallel STRIPE of secondary beside it — broadcast
     package language, which is the app's own heritage (ffdraft). Every banner is now
     unmistakably that team's, and every name is guaranteed-legible white on dark, with no
     dependence on what colour the owner picked. Item 10's height discipline still holds:
     one compact band, roster within a phone screen of the top.
     The panel geometry is PX-based, not %, so the cut sits identically behind the 96px and
     128px crests instead of stretching with the card's width. */
  .lockerhead { position:relative; isolation:isolate; overflow:hidden;
                border-radius:var(--radius-card); padding:10px 12px; margin-bottom:10px;
                background:var(--card); border:1px solid var(--border-card); color:#fff; }
  .lockerhead::before { content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
                        background:var(--tp, var(--accent));
                        clip-path:polygon(0 0, 132px 0, 92px 100%, 0 100%); }
  .lockerhead::after { content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
                       background:var(--ts, var(--accent));
                       clip-path:polygon(140px 0, 148px 0, 108px 100%, 100px 100%); }
  /* Refinement 2 (2026-08-11, user): the TERTIARY strip completes the scheme — all three
     team colours on the slash. Hosted on the inner row's ::before (the card's own two pseudos
     are taken); same abs-inset-0/z-1 pattern, .lockerhead-inner is unpositioned so it
     resolves against the card. */
  .lockerhead .lockerhead-inner::before { content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
                       background:var(--tt, var(--accent));
                       clip-path:polygon(156px 0, 162px 0, 122px 100%, 116px 100%); }
  .lockerhead-inner { display:flex; align-items:center; gap:16px; }
  .lockerlogo { width:96px; height:96px; border-radius:14px; object-fit:cover; flex:0 0 auto;
                background:rgba(255,255,255,.14); box-shadow:0 3px 14px rgba(0,0,0,.42), inset 0 0 0 1px rgba(255,255,255,.22); }
  /* The hero's own cut-out case — the one in the report. The lighter rounded square was this
     element's `background` + inset ring; the drop shadow drew a second square edge under it.
     All three go, and the mark lands straight on the team's colour slash. */
  .lockerlogo.cutout { background:none; box-shadow:none; object-fit:contain; }
  .lockerlogo-ph { display:flex; align-items:center; justify-content:center;
                   font:800 34px var(--font-display); letter-spacing:1px; }
  /* Refinement 2: the identity block is CENTERED in the space right of the crest, with a
     slash-side clearance pad so its box never reaches under any of the three colour strips.
     The name wraps to two rows and is FIT-SIZED by fitHeroNames — never ellipsized. */
  .lockerid { min-width:0; flex:1 1 auto; text-align:center; padding-left:32px; }
  .lockername { margin:0; font-size:24px; line-height:1.08; white-space:normal; }
  /* Design pass: the name sits on the DARK side of the diagonal, never on the colour panel,
     so white is always right and no per-team ink derivation is needed here. A short
     secondary-coloured underline beneath the name is the one place the scheme touches the
     type — an accent, not a fill. */
  .lockerhead .lockername.tname { color:#fff; }
  /* (a secondary underline under the name was tried and removed — the panel + stripe already
     carry the scheme, and a third accent is one more than minimal) */
  .lockermotto { margin:4px 0 0; color:var(--mut); font-style:italic; font-size:12.5px; line-height:1.3; }
  .lockerrec { margin:2px 0 0; font:600 12.5px/1.3 var(--font-display); color:var(--mut); letter-spacing:.4px; }
  /* S4 — the league-alerts card. The bell is an inline SVG, not an emoji: section U scans every
     app-authored string on every view and a bell emoji would fail it (and read as a different
     glyph on every platform besides). */
  .alertcard h2 { display:flex; align-items:center; gap:7px; }
  .alertcard .alertbell { flex:0 0 auto; color:var(--mut); }
  .alertcard p { margin:6px 0 0; }
  .alertrow { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:12px; }
  .alertrow button { min-height:44px; }
  /* Design pass: the controls live in their own quiet FOOTER BAND under the identity row —
     full-bleed to the card's edges with a hairline on top, solid card colour, so the diagonal
     panel behind the hero can never run underneath a button or a label. Identity above the
     line, utility below it. (Owner/commish only — the whole band is hidden for everyone else,
     and the [hidden] restatement below is the house lesson, again.) */
  .lockerfoot { position:relative; margin:10px -12px -10px; padding:2px 12px 10px;
                background:var(--card); border-top:1px solid var(--border-card);
                border-radius:0 0 var(--radius-card) var(--radius-card); }
  .lockerfoot[hidden] { display:none; }
  /* Design pass 2: the pencil. The one visible edit affordance — a quiet ghost disc, top
     right of the hero, over the dark side of the card (the identity block is padded away
     from it below). Owner/commish only; toggles the .lockerfoot disclosure. */
  .lockerpencil { position:absolute; top:8px; right:8px; z-index:1;
                  display:inline-flex; align-items:center; justify-content:center;
                  width:30px; height:30px; padding:0; border-radius:50%;
                  background:rgba(255,255,255,.05); border:1px solid var(--border-card);
                  color:var(--mut); cursor:pointer; }
  .lockerpencil:hover { color:var(--ink); }
  .lockerpencil.on { color:var(--ink); background:rgba(255,255,255,.1); }
  .lockerhead-inner { padding-right:34px; } /* the name never runs under the pencil */
  .lockeredit { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  /* The house [hidden]-override lesson, and this one had genuinely bitten: .lockeredit's own
     display:flex beats the UA's [hidden]{display:none}, so a rival looking at somebody else's
     locker could SEE the Name / Motto / Logo buttons even though renderLocker had marked the
     block hidden. The PIN was still the real gate — pressing one landed on gateCommish and
     changed nothing — but the affordance was on offer to someone who has no business with it.
     Caught by an S3 review plate; section L now measures visibility rather than the attribute. */
  .lockeredit[hidden] { display:none; }
  /* Design pass: these sit on the app's own dark card now, not on a colour fill, so they are
     ordinary quiet ghost controls — the identity surface stops looking like a control panel. */
  .lockeredit button { padding:5px 10px; font-size:11.5px;
                       background:rgba(255,255,255,.05); border-color:var(--border-card); color:var(--mut); }
  .lockeredit button:hover { color:var(--ink); }
  /* The three swatches. Native <input type="color"> — the platform's own picker on every
     device this family owns — stripped back to a plain square so it reads as a swatch rather
     than as a form control. Targets are 30px, inside a 34px label, so the row stays tappable. */
  /* ONE row, and it has to STAY one row: a second wrapped line here costs the roster ~34px of
     the phone screen, which is precisely what item 10's complaint was about. Hence the short
     "Colours" label and the bare ↺ button (its meaning is in the title/aria) rather than the
     "Team colours" / "↺ from logo" wording the first cut used and measured 215px with. */
  .lockercolors { display:flex; align-items:center; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .lockercolors[hidden] { display:none; }
  .tclabel { font:600 10.5px var(--font-display); letter-spacing:.9px; text-transform:uppercase; opacity:.88; }
  .tcslot { position:relative; display:inline-flex; align-items:center; justify-content:center;
            width:30px; height:30px; border-radius:7px; background:rgba(255,255,255,.05);
            border:1px solid var(--border-card); cursor:pointer; }
  .tcslot span { position:absolute; right:1px; bottom:0; font:700 8px var(--font-display); opacity:.7; pointer-events:none; }
  .tcswatch { -webkit-appearance:none; appearance:none; width:26px; height:26px; padding:0; cursor:pointer;
              border:1px solid rgba(255,255,255,.55); border-radius:5px; background:transparent; }
  .tcswatch::-webkit-color-swatch-wrapper { padding:0; }
  .tcswatch::-webkit-color-swatch { border:0; border-radius:5px; }
  .tcswatch::-moz-color-swatch { border:0; border-radius:5px; }
  .tcreset { width:30px; height:30px; padding:0; font-size:14px; line-height:1;
             background:rgba(255,255,255,.05); border-color:var(--border-card); color:var(--mut); }
  .tcstate { opacity:.8; letter-spacing:.3px; }
  /* Desktop has room for the TOP of each S3 size band; the phone keeps the FLOOR of each,
     because the matchup header's 120px cap and the locker's "the roster still starts within a
     phone screen" rule are both measured at 390px and neither is negotiable. */
  @media (min-width:700px) {
    /* NOTE the matchup crest is deliberately NOT bumped here. A 52px crest measured the header
       at 128px on a matchup that HAS an all-time-series line — 8px past the ceiling — and the
       ceiling is a real constraint from a real complaint, so the design shrank to fit it rather
       than the other way round. 44px is the S3 band's floor and it stays 44 at every width. */
    .lockerlogo { width:128px; height:128px; border-radius:18px; }
    .lockerlogo-ph { font-size:44px; }
    .lockername { font-size:30px; }
    /* the diagonal cut widens with the crest so the panel still frames it */
    .lockerhead::before { clip-path:polygon(0 0, 172px 0, 124px 100%, 0 100%); }
    .lockerhead::after { clip-path:polygon(180px 0, 188px 0, 140px 100%, 132px 100%); }
    .lockerhead .lockerhead-inner::before { clip-path:polygon(196px 0, 202px 0, 154px 100%, 148px 100%); } /* tertiary, refinement 2 */
    .lockerid { padding-left:44px; } /* clearance past the wider desktop slash */
  }
  /* S1's commissioner-only "Reset owner PIN" — deliberately quieter than the identity edits
     beside it: it is a rare administrative action, not something to invite a tap. */
  .lockeredit button.lockerpin { background:transparent; border-color:rgba(255,255,255,.22); color:rgba(255,255,255,.72); font-size:11px; }

  /* ---------------- player stats card (2026-08-08) ----------------
     A row that used to both "inform" (show a player) and "act" (open a sheet, add them to a
     trade, claim them) is now split: the row's own info area opens the stats card below;
     whatever it used to DO moves onto its own explicit button (.lswap in the lineup editor,
     .pcpick in the trade builder, .faMoveBtn in the FA table). .linfo/.pcinfo/.pcinline are
     three flavors of "reset a <button> back to plain content" for that info area — .linfo
     keeps the lineup row's existing name-left/points-right layout, .pcinfo is a simple block
     (trade-chip name + meta, one line), .pcinline is inline text (a name mid-sentence in the
     claims/trades lists). */
  .linfo { flex:1 1 auto; min-width:0; display:flex; align-items:center; justify-content:space-between; gap:8px;
           background:none; border:none; padding:0; margin:0; color:inherit; font:inherit;
           text-align:left; text-transform:none; letter-spacing:normal; cursor:pointer; }
  /* Item 8 (2026-08-09 playtest: "on the my team tab the formatting totally cuts off player
     names"). MEASURED at 390px before the fix: .lname was 94px wide, every name wrapped to
     THREE lines, and a longer one ("C. McLaughlin K · TB") overflowed its 94px box outright
     and was clipped by the overflow:hidden above. The row's fixed costs are a 52px slot chip,
     a ~72px Swap button and a nowrap points column that will not shrink below its own text —
     which between them left the name about a quarter of the row. Stacking .linfo on a phone
     gives the name the WHOLE remaining width and puts the points on their own line beneath it,
     which is also the natural reading order for a lineup row. */
  @media (max-width:700px) {
    .linfo { flex-direction:column; align-items:stretch; justify-content:center; gap:1px; }
    .lname { white-space:normal; overflow:visible; text-overflow:clip; }
    /* the meta wraps as a UNIT — otherwise a long name breaks the line right after
       "QB ·" and leaves the team abbreviation stranded on its own */
    .lname small { white-space:nowrap; }
    .lpts { font-size:13px; }
  }
  .lswap { flex:0 0 auto; }
  /* Item 9: the LOCKED word is gone — a greyed-out Swap is the whole signal. It must READ as
     unavailable (not merely be inert), and it must not brighten on hover the way a live button
     does. Kept at the same size, so the row's geometry doesn't change when a game kicks off. */
  .lswap[disabled] { opacity:.42; cursor:default; }
  .lswap[disabled]:hover { border-color:var(--border-card); }
  .lswapfill { flex:1 1 auto; text-align:left; text-transform:none; letter-spacing:normal; }
  /* The dedicated Drop (2026-08-15). Sits beside Swap, deliberately QUIETER than it — dropping
     is the irreversible one, so it should not be the button the thumb lands on by habit; it
     earns its weight only on hover/focus. Same disabled treatment as Swap, and the same size
     either way so the row's geometry never shifts. On a phone the two together must not squeeze
     the name column the locker fought to widen (AD8's measured ≥140px floor), hence the tighter
     padding below 1024px. */
  .ldrop { flex:0 0 auto; color:var(--mut); }
  .ldrop:hover:not([disabled]), .ldrop:focus-visible:not([disabled]) { color:var(--accent); border-color:var(--accent); }
  .ldrop[disabled] { opacity:.42; cursor:default; }
  .ldrop[disabled]:hover { border-color:var(--border-card); }
  /* ⚠ THE WORD "Drop" COSTS THE NAME COLUMN EXACTLY WHAT IT CANNOT SPARE. Measured at 390px:
     the row is 332px = chip 52 + name + Swap 52 + Drop 52 + gaps, and a 52px Drop drove the
     name to 120px — under the ≥140px floor AD8 measured and this app already paid to reach.
     So on a phone the button keeps its 44px tap target but shows a glyph instead of the word;
     "Drop" stays in the DOM for a screen reader (and the title/aria-label name the player), so
     nothing is lost but the pixels. Desktop has room and keeps the word. */
  @media (max-width:1023px) {
    .lswap { padding-left:8px; padding-right:8px; }
    .ldrop { padding-left:9px; padding-right:9px; }
    .ldrop .ldroptxt { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
    .ldrop::before { content:"\2715"; font-size:13px; line-height:1; }
  }
  /* The claim card's "no drop needed" row — an affordance, not a player, so it carries no
     projection/ownership columns and reads as a choice rather than a roster line. */
  .rcnodrop { justify-content:flex-start; }
  .pcinfo { flex:1 1 auto; min-width:0; text-align:left; background:none; border:none; padding:0; margin:0;
            color:inherit; font:inherit; text-transform:none; letter-spacing:normal; cursor:pointer; }
  .pickchip.picked .pcpick { border-color:var(--accent); color:var(--accent); }
  .pcinline { background:none; border:none; padding:0; margin:0; font:inherit; color:inherit;
              text-decoration:underline dotted; text-underline-offset:2px; text-transform:none;
              letter-spacing:normal; cursor:pointer; }
  .pcinline:hover { color:var(--accent); }
  /* S9's injury feed rows — the same "reset a <button> back to plain content" idiom as
     .linfo/.pcinfo/.pcinline above, keeping .fline's own row styling (padding/border/font)
     and only resetting the <button> chrome underneath the tap target it needs to be. */
  .fline.injline { display:block; width:100%; background:none; border:none;
                   border-bottom:1px dotted var(--divider2); padding:6px 0; margin:0;
                   color:inherit; font:inherit; font-size:13.5px; text-align:left;
                   text-transform:none; letter-spacing:normal; cursor:pointer; }
  .fline.injline:hover { color:var(--accent); }
  .fline.injline .injto { color:var(--accent); font-weight:700; }
  /* item 7 (2026-08-22): a transition TO Healthy is good news — green, not the plain text it
     used to render as (Q/D/Out keep .injto's red above). */
  .fline.injline .injok { color:var(--green-lt); font-weight:700; }
  /* the row-level tap target itself (matchup half-cells, the read-only locker roster table) —
     the FA table already carries its own `table.faTable tbody tr { cursor:pointer }` rule. */
  .pcellgrid[data-pk] { cursor:pointer; }
  tr[data-pk] { cursor:pointer; }
  /* an "explicit, accent-outlined MOVE button" per the FA table row split — .faAddBtn keeps
     its existing sizing rule above, this just adds the accent outline treatment. */
  .faMoveBtn { background:transparent; border-color:var(--accent); color:var(--accent); font-weight:700; }
  .faMoveBtn:hover { background:var(--accent); color:#fff; }

  .pcoverlay { position:fixed; inset:0; z-index:68; background:rgba(6,7,8,.82); backdrop-filter:blur(3px);
               display:flex; align-items:center; justify-content:center;
               padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  .pcoverlay[hidden] { display:none; } /* the house [hidden]-override lesson, again */
  .pccard { position:relative; width:100%; max-width:420px; max-height:86vh; overflow-y:auto;
            background:var(--card); border:1px solid var(--border-card); border-radius:var(--radius-card);
            padding:20px 18px 16px; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .pccard.center { text-align:center; padding:40px 18px; }
  .pcclose { position:absolute; top:10px; right:10px; width:32px; height:32px; padding:0;
             display:flex; align-items:center; justify-content:center; border-radius:50%; font-size:14px; }
  .pchead { padding-right:34px; margin-bottom:14px; }
  .pcname { margin:0 0 6px; font:700 22px var(--font-display); letter-spacing:.4px; text-transform:none; }
  .pcmeta { display:flex; align-items:center; gap:8px; font-size:13px; }
  .pcweek { background:var(--nested2); border:1px solid var(--border-card); border-radius:var(--radius-sm);
            padding:10px 12px; margin-bottom:14px; }
  .pcweekrow { display:flex; align-items:baseline; gap:12px; margin-top:4px; flex-wrap:wrap; }
  .pcweekrow .pts { font:800 28px var(--font-display); }
  .pcadj { margin-top:6px; border-top:1px dashed var(--border-card); padding-top:6px; }
  .pctiles { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
  .pctile { text-align:center; background:var(--nested2); border:1px solid var(--border-card);
            border-radius:var(--radius-sm); padding:10px 6px; }
  .pctileval { font:700 18px var(--font-display); font-variant-numeric:tabular-nums; }
  .pctilelabel { margin-top:2px; text-transform:uppercase; letter-spacing:.5px; }
  .pclog table.tbl th, .pclog table.tbl td { padding:7px 8px; }

  /* ---- PLAYER HEADSHOTS (2026-08-13, user: "bring in player images") ----
     One circular fixed-size box (.pshot), ALWAYS rendered where a face belongs — the box is
     what keeps every row's name on one left edge whether ESPN has shot this man or not; a
     404'ing image hides itself (onerror) and leaves the disc standing (the crest-placeholder
     discipline, again). --nested2 gives the disc a quiet seat so a transparent-PNG headshot
     doesn't float on the card colour.
     .mushot (matchup rows) and .lkshot (My Team rows) exist ONLY at >=1024px: the phone
     matchup row's 101px name budget and the locker's measured >=140px name floor (AD8) were
     both bought by measurement, and a face + gap costs exactly what those fights won. */
  .pshot { width:24px; height:24px; flex:0 0 24px; border-radius:50%; background:var(--nested2);
           border:1px solid var(--border-card); overflow:hidden; display:inline-flex; align-self:center; }
  .pshot img { width:100%; height:100%; object-fit:cover; display:block; }
  .pshot.pshotbig { width:72px; height:72px; flex-basis:72px; }
  .pcheadshot { display:flex; align-items:center; gap:14px; }
  .pcheadshot .pcheadtxt { min-width:0; flex:1 1 auto; }
  /* players table + the read-only roster table: face beside the existing text stack */
  .faply { display:flex; align-items:center; gap:8px; }
  .faply .faplytxt, .faply > span:last-child { min-width:0; }
  /* desktop-only surfaces — the base rule hides them, the media block below paints them */
  .pshot.mushot, .pshot.lkshot { display:none; }
  @media (min-width:1024px) {
    .pcellgrid .mushot { display:inline-flex; width:38px; height:38px; flex:0 0 38px; }
    .linfo .lkshot { display:inline-flex; width:30px; height:30px; flex:0 0 30px; }
  }

  /* ---------------- nav — mobile bottom bar / desktop top-nav row ---------------- */
  .bnav { position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex;
          background:var(--tabbar); backdrop-filter:blur(8px); border-top:1px solid var(--border-card);
          padding:6px calc(6px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left)); }
  /* Polish pass (2026-08-08): the house [hidden]-override lesson, again — .bnav's own
     display:flex above beats the UA [hidden]{display:none} rule, so hideBnav()'s `hidden`
     attribute (gate/first-run/claim screens — nothing usable behind the tabs yet) needs this
     restated or the bar stays visible and tappable regardless of the attribute. */
  .bnav[hidden] { display:none; }
  /* item 6 (2026-08-08 playtest): the active-tab indicator is a border-bottom that spans the
     button's own FULL border-box — so it's only ever horizontally centered under the label when
     that box's padding is itself symmetric (text-align:center centers the label within the same
     box the border spans). Mobile's padding already is (2px/2px) — the border just needed to
     exist. `* { box-sizing:border-box }` (top of this stylesheet) means adding it never nudges
     the button's own size/height. */
  .bnav button, .bnav .bnavlink { flex:1 1 0; background:none; border:none; border-bottom:2px solid transparent;
                 color:var(--faint); min-height:44px; text-align:center;
                 font:600 11.5px var(--font-display); letter-spacing:1px; text-transform:uppercase;
                 padding:6px 2px; cursor:pointer; text-decoration:none; display:flex;
                 align-items:center; justify-content:center; box-sizing:border-box; }
  .bnav button.on { color:var(--accent); border-bottom-color:var(--accent); }
  .bnav button:hover, .bnav .bnavlink:hover { color:var(--ink2); }
  .bnav button.on:hover { color:var(--accent); }

  /* ============ desktop (≥1024px) — the design's top-nav pattern ============
     header (wordmark + week/avatar meta) and #bnav (the link row) stay separate
     elements — see the containing-block note above — but share one background
     with no border between them, so together they read as the mockup's single
     60px top-nav strip: wordmark left, links across the middle, "WEEK N · YEAR"
     + avatar pinned right. */
  @media (min-width:1024px) {
    header { padding:env(safe-area-inset-top) calc(24px + env(safe-area-inset-right)) 0 calc(24px + env(safe-area-inset-left));
             height:calc(46px + env(safe-area-inset-top)); border-bottom:none; }
    /* Design handoff 2026-08-11: the tagline reads centered, white, bold on a desktop —
       flex:1 lets it take the slack between the wordmark and the right-hand meta group. */
    header .sub { display:inline; flex:1 1 auto; text-align:center; color:#fff; font-weight:700; }
    header .hmeta { display:flex; }
    header .hcrest { height:30px; }
    /* Only when .hmeta is ACTUALLY on screen does it take over the pinning, so the two read as
       one right-hand group. While it is [hidden] the crest keeps its own auto margin above. */
    header .hmeta:not([hidden]) ~ .hcrest { margin-left:0; }
    main { max-width:1200px; padding:20px calc(24px + env(safe-area-inset-right)) 20px calc(24px + env(safe-area-inset-left)); }
    body { padding-bottom:24px; }
    .bnav { position:sticky; top:calc(46px + env(safe-area-inset-top)); background:var(--tabbar); border-top:none; border-bottom:1px solid var(--border-card);
            padding:0 calc(24px + env(safe-area-inset-right)) 0 calc(24px + env(safe-area-inset-left)); max-width:none; margin:0; height:34px; }
    /* item 6 fix, desktop half: the OLD padding here was asymmetric (0 16px 0 0 — "left" gap
       folded entirely into the right side), so the border-bottom below — which spans the
       button's FULL border-box — sat centered on a box whose CONTENT (and therefore its
       justify-content:center label) was itself off-center within that box. Symmetric padding
       (0 12px) makes the box's own center and its label's center the same point, so the
       full-width border is correctly centered under the label at every label width, without
       needing to know the label's rendered text width at all. */
    .bnav button, .bnav .bnavlink { flex:0 0 auto; display:flex; align-items:center; justify-content:center; min-height:0;
                   height:100%; font-size:12.5px; letter-spacing:1.5px; padding:0 12px;
                   border-bottom:2px solid transparent; color:var(--mut); }
    .bnav button.on { color:var(--ink); border-bottom-color:var(--accent); }
    .bnav button:hover, .bnav .bnavlink:hover { color:var(--ink2); }
    /* ============ THE LEAGUE DASHBOARD (2026-08-11) ============
       "it looks too much like an app." The old treatment here was `column-count:2` (3 at
       1360px) — a MASONRY, which deals cards into whichever column is shortest, so nothing on
       the page meant anything by being where it was and every card was a different width from
       the same card yesterday. Replaced by two columns with JOBS: MAIN is the league's state
       (what's being played, where everyone stands, what has ever happened), the RAIL is its
       pulse (talk, and transactions). The rail is a FIXED width so a long chat message can
       never squeeze the standings, and both columns are plain flex stacks so the gutter
       between cards is the same 16px as the gutter between the columns.
       340px at 1024-1359 and 380px above it: at exactly 1024px the content box is 976px, so a
       380px rail would leave MAIN 580 — under what the 10-column standings table needs. The
       step is what buys MAIN ~620px at the tightest legal desktop. */
    main[data-view="league"] { padding-bottom:24px; }
    .lgdesk { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; align-items:start; }
    .lgmain, .lgrail { min-width:0; display:flex; flex-direction:column; gap:16px; }
    /* Layout editor (2026-08-11): every card sits in a .deskcard registry wrapper.
       display:contents keeps the CARDS as the flex items (an EMPTY wrapper — a self-hiding
       card — costs no box and no gap slot), so the child selector below had to widen from
       `.lgmain > .card` to a descendant — the wrapper is in the DOM tree even when it has
       no box. */
    .lgdesk .card { margin-bottom:0; }
    .deskcard { display:contents; }
    /* Per-card text size — CSS zoom, because the stylesheet is px-based and a font-size
       multiplier on an ancestor would move nothing. :not(.deskedit) keeps the editor strip
       itself at 100%. */
    .deskcard[data-cz="85"] > :not(.deskedit) { zoom:0.85; }
    .deskcard[data-cz="115"] > :not(.deskedit) { zoom:1.15; }
    .deskcard[data-cz="130"] > :not(.deskedit) { zoom:1.3; }
    /* Density: Comfortable (default 16px) vs Compact. */
    .lgdesk.compact { gap:10px; }
    .lgdesk.compact .lgmain, .lgdesk.compact .lgrail { gap:10px; }
    .lgdesk.compact .card { padding:10px 12px; }
    /* The edit bar + per-card strips. */
    .lgdeskbar { display:flex; justify-content:flex-end; align-items:center; gap:10px; margin:0 0 10px; flex-wrap:wrap; }
    .deskpencil { display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--mut);
      background:none; border:1px solid var(--line, var(--border-card)); border-radius:6px; padding:4px 9px; cursor:pointer; }
    .deskpencil:hover { color:var(--ink); border-color:var(--ink); }
    .lgdeskbar.editing { justify-content:flex-start; background:var(--card); border:1px dashed var(--accent);
      border-radius:var(--radius-card); padding:8px 12px; font-size:12px; color:var(--ink2); }
    .lgdeskbar .dlgroup { display:inline-flex; align-items:center; gap:6px; color:var(--mut); }
    .lgdeskbar .dlval { min-width:38px; text-align:center; font-variant-numeric:tabular-nums; color:var(--ink); }
    .lgdeskbar.editing button { font-size:11px; padding:3px 8px; border:1px solid var(--line, var(--border-card));
      background:var(--nested); color:var(--ink2); border-radius:5px; cursor:pointer; }
    .lgdeskbar .dldone { margin-left:auto; background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
    .lgdesk.editing .deskcard { display:block; border:1px dashed var(--line, var(--border-card)); border-radius:var(--radius-card); }
    .lgdesk.editing .deskcard .deskedit { display:flex; align-items:center; gap:6px; padding:6px 10px;
      background:var(--nested); border-radius:var(--radius-card) var(--radius-card) 0 0; font-size:11px; }
    .deskedit b { margin-right:auto; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--mut); }
    .deskedit button { font-size:11px; padding:2px 7px; border:1px solid var(--line, var(--border-card));
      background:var(--card); color:var(--ink2); border-radius:4px; min-width:26px; cursor:pointer; }
    .deskedit button:hover { color:var(--ink); border-color:var(--ink); }
    .deskempty { opacity:0.6; }
    /* THE CHAT PANEL — always expanded, never a disclosure. "Always expanded" is about the
       PANEL, not about height: the message list keeps its own internal scroll, and the panel is
       capped so Recent moves beneath it is never pushed off the fold. */
    .lgrail .chatpanel { padding-bottom:0; }
    .lgrail .chatpanel .chatlist { height:440px; max-height:440px; } /* 376 → 440, 2026-08-11 rail balance */
    .lgrail .movespanel .fline { font-size:12px; }
    /* In the narrow rail the trending strip wraps into rows instead of panning sideways —
       a sideways scroller inside a 360px column hides most of its own content. */
    .lgrail .hotcard .hotrow { flex-wrap:wrap; overflow-x:visible; }
    .lgrail .injline { font-size:12px; }
    /* THE STANDINGS TABLE MUST NOT SCROLL — not sideways inside a .panner, not at 1024px. Ten
       columns in ~620px is paid for here, out of the padding and the figure size, and out of
       PF/PA rendering as whole numbers (see standingsHtml). */
    .standtbl th, .standtbl td { padding:7px 5px; }
    .standtbl td.num { font-size:13px; }
    .standtbl th:first-child, .standtbl td:first-child { padding-left:2px; padding-right:2px; }
    /* The crest stays at S3's own 28px standings size — measured, not assumed: the ten columns
       still fit at 1024px without it, so there is no reason to spend the one place in this app
       where most people meet most teams. */
    .standtbl .tname { font-size:13px; }
  }
  @media (min-width:1360px) {
    .lgdesk { grid-template-columns:minmax(0,1fr) 380px; }
  }
  /* A run of results, coloured by what it IS — the app's own good/bad language. Only ever on a
     real run; "—" stays quiet ink. */
  .standtbl .stkw { color:var(--green); }
  .standtbl .stkl { color:var(--accent); }
  /* A clinched or eliminated playoff line is only ever painted when EVERY simulated season
     agreed — see LG.playoffOdds' own rounding rule. */
  .standtbl .poin { color:var(--green); font-weight:700; }
  .standtbl .poout { color:var(--faint); }
  /* A player's name inside a chat message. .pcinline already carries the "inline text that is
     really a button" reset; this adds the one hint that it can be tapped. */
  .pcinline.chatname { text-decoration:underline; text-decoration-style:dotted; text-underline-offset:2px;
                       text-decoration-color:var(--faint); }
  .pcinline.chatname:hover { text-decoration-color:var(--accent); }

  /* ITEM 18 (2026-08-09): the "2025 SEASON REPLAY" banner (#simBanner) that used to live here
     is GONE at the user's request — they know which environment they are in. Its CSS went with
     it, and nothing is positioned off it any more (the offline chip below used to add its
     measured height to its own sticky top). */
  /* Offline-with-a-mirror chip (2026-08-08, the REST transport): the league renders normally
     from this device's saved copy, so the chip is what keeps that honest — which copy, how
     old, and that we're still trying. Clay rather than gold: this is a state to get out of,
     not a mode to settle into. [hidden] restated because the rule above sets a display. */
  #offlineChip { position:sticky; top:calc(52px + env(safe-area-inset-top)); z-index:19; background:var(--accent); color:#fff;
                 font:700 11px var(--font-display); letter-spacing:.4px; text-transform:uppercase;
                 text-align:center; padding:6px 10px; }
  #offlineChip[hidden] { display:none; }
  @media (min-width:1024px) { #offlineChip { top:calc(46px + env(safe-area-inset-top)); } }
</style>
</head>
<body>
  <header>
    <span class="wordmark">The <span class="accentword">GFFL</span></span>
    <span class="sub">G.O.A.T. Fantasy Football League</span>
    <span class="hmeta" id="hMeta" hidden>
      <span id="hWeekYear"></span>
      <span id="hAvatar" hidden></span>
    </span>
    <!-- The crest is LAST so it pins to the top-right corner on every view and at every
         width. alt="" on purpose: the wordmark beside it already says "THE GFFL", so a
         screen reader announcing the same name twice is noise, not information. Intrinsic
         width/height are set so the box is reserved before the PNG decodes. -->
    <img class="hcrest" src="icons/gffl-mark.png" alt="" width="110" height="136" decoding="async">
  </header>
  <div id="offlineChip" hidden></div>
  <!-- #bnav stays a SIBLING of <header>, never a descendant: header sets backdrop-filter,
       and a backdrop-filter/filter/transform ancestor becomes the containing block for any
       position:fixed descendant in Chromium — nesting nav inside header would silently break
       the mobile fixed bottom bar. At ≥1024px the two are styled to read as one continuous
       top-nav strip (matching background, no border between them) without that risk. -->
  <nav class="bnav" id="bnav">
    <button data-v="league">League</button>
    <button data-v="matchup">Matchup</button>
    <button data-v="team">My Team</button>
    <button data-v="moves">Moves</button>
    <button data-v="chat">Chat</button>
    <button data-v="scores">Scores</button>
    <!-- Item 16 (2026-08-09, user: "lets remove the tabs for rules and draft, put a link to
         each in the league page instead"). Rules and Draft used to live here — eight entries
         in one row, which is why DRAFT clipped to "DR" at 390px. Both now live on the League
         page (see leagueLinksHtml in lg-ui.js): Rules routes through UI.navTo like any other
         in-app view, Draft stays a real <a href> because it genuinely navigates away to
         ffdraft.html. Nothing in the highlight loop needed changing — it toggles .on by
         `b.dataset.v === name`, so a view with no tab (rules, bracket) simply leaves every
         tab off, which is now the Rules view's normal state. -->
  </nav>
  <main id="main"><div class="card mut">Loading the league…</div></main>
  <div id="toast" hidden></div>
  <div id="imgOverlay" class="imgoverlay" hidden><img id="imgOverlayImg" alt=""></div>
  <div id="playerCard" class="pcoverlay" hidden></div>
