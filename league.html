<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The GFFL — Goat Fantasy Football League</title>
<meta name="description" content="The Goat Fantasy Football League — fast, clean, ours.">
<meta name="theme-color" content="#0c1017">
<!-- ITEM 33 (2026-08-10, user: "hide the browser bar at the top so it truly behaves like an
     app, like bucky does"). The league gets its OWN manifest, deliberately not the family app's
     manifest.webmanifest: that one's start_url is "/", so installing from here would put a Bucky
     goat on the home screen that opens the FARM app, not the league. Its name, id, theme and
     splash colours are the league's own dark tokens (#0c1017 is --bg) so the launch screen and
     the status bar match the app instead of flashing Bucky's cream.
     ICONS (2026-08-10): the league has its OWN crest now — the user's GFFL shield, baked by
     tools/_gffl_icons.cjs into icons/gffl-*.png. They are deliberately NEW files rather than
     overwrites of icons/icon-192/512 + maskable-*, which manifest.webmanifest still points at:
     those are the family app's Bucky goat and installing the FARM app must not change.
     iOS reads NONE of the manifest for display mode, so the two apple-* metas below are what
     actually give an iPhone a chrome-less window; black-translucent is the right status bar for
     a dark app (with viewport-fit=cover above, the page paints under it — which is why every
     fixed/sticky element in this stylesheet carries a safe-area inset). -->
<link rel="manifest" href="league.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GFFL">
<link rel="apple-touch-icon" href="icons/gffl-apple-touch.png">
<link rel="icon" href="icons/gffl-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============ The GFFL design tokens ============
     Item 9 (playtest batch 2, 2026-08-08): retheme'd to match ffdraft.html's aesthetic —
     the family's own draft-day tool. ffdraft is a deep-navy broadcast-dark NFL theme (not
     the old Gridiron black/red): --bg is a cold near-black navy (#0c1017, NOT true black),
     cards float on it a shade lighter with a cool blue-grey line/border color, Barlow
     Condensed still carries display type (headings/scores/tabs — unchanged, both apps
     already shared it), but body copy moves off Public Sans onto Inter (ffdraft's body
     font — a hair more geometric/neutral than Public Sans). Signature accents: a hot red
     (#d50a0a, brighter/more saturated than the old #D0454C brick-red), a deep NFL navy
     (#013369) used for "selected/active" chip fills and info badges — not just a wordmark
     color — and a warm gold (#ffb612) for standout/highlight moments (a step brighter and
     warmer than the old muted #C98F1B). Position-color tokens (--pos-QB/RB/WR/TE/K/DST/X)
     are NEW — lifted straight from ffdraft's draft-board cell palette — used to tint the
     Free Agents table's position badges (added this batch) the same way ffdraft's board
     tints its player cells. TOKEN NAMES are unchanged from before (every component rule
     below still just reads var(--bg)/var(--card)/var(--accent)/etc.) — only the VALUES
     assigned to them moved, per the retheme brief ("swap the token layer, keep every
     structural/layout improvement"). Fonts degrade to system stacks when the Google Fonts
     request is blocked/offline (the family app must never depend on reaching
     fonts.googleapis.com). */
  :root {
    --bg:#0c1017; --bg-page:#070a0f; --tabbar:#0d1320; --band:#101724;
    --card:#151b26; --nested:#1a2231; --nested2:#0e131d;
    --border-card:#263043; --divider:#263043; --divider2:#1c2534; --border-hover:#3a4558;
    --ink:#e9edf4; --ink2:#c3cbdb; --mut:#8a94a7; --faint:#5b6579;
    --accent:#d50a0a; --green:#2e8659; --gold:#ffb612; --blue:#013369;
    --row-hover:#121722; --row-hover2:#171f2c;
    --pos-QB:#a03449; --pos-RB:#2e8659; --pos-WR:#3a72b5; --pos-TE:#c07c2b;
    --pos-K:#7b5ea7; --pos-DST:#6b6154; --pos-X:#454c5c;
    --radius-card:10px; --radius-sm:7px; --radius-xs:6px; --radius-badge:4px; --radius-pill:16px;
    --font-display:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,system-ui,sans-serif;
    --font-body:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  html { background:var(--bg-page); }
  body { background:var(--bg); color:var(--ink); font:15px/1.45 var(--font-body);
         padding-bottom:calc(64px + env(safe-area-inset-bottom)); }
  h1, h2, h3 { font-family:var(--font-display); }
  /* the ffdraft "broadcast" signature: a hairline accent rule along the very top edge of
     chrome, ahead of everything else on the page (ffdraft's own header carries the same
     3px accent top-border). box-sizing:border-box (above) keeps the header's own declared
     height whole — the border eats into content padding, not layout height. */
  /* ITEM 33 (2026-08-10) safe areas: installed standalone there is no browser chrome to
     absorb the notch, so the header GROWS by the top inset and pads by it rather than sliding
     down (a sticky element with top:0 has to keep painting to the very top edge, or the strip
     of page scrolling past above it shows through). The left/right insets are the landscape
     case — a rotated phone puts the notch beside the wordmark. Every value is env(...), which
     is 0 in a browser tab, so nothing about the tabbed layout moves. */
  header { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:16px;
           padding:env(safe-area-inset-top) calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left));
           height:calc(52px + env(safe-area-inset-top)); background:var(--tabbar); backdrop-filter:blur(8px);
           border-top:3px solid var(--accent); border-bottom:1px solid var(--border-card); }
  header .wordmark { font:700 20px/1 var(--font-display); letter-spacing:1.2px; text-transform:uppercase; white-space:nowrap; }
  header .wordmark .accentword { color:var(--accent); }
  header .sub { display:none; color:var(--mut); font-size:11px; }
  header .hmeta { display:none; align-items:center; gap:10px; margin-left:auto; }
  header .hmeta[hidden] { display:none; } /* the house [hidden]-override lesson — restate it, an author rule always beats the UA one */
  /* The crest owns the right end of the header. It carries the auto margin ITSELF so it pins
     right no matter what else is in the bar — including the gate, claim, outage and setup
     screens, where #hMeta is still [hidden] and there is nothing else on the right at all.
     (The desktop block below hands the margin back to .hmeta for the one case where .hmeta is
     genuinely on screen — two auto margins would otherwise SPLIT the free space and strand
     .hmeta mid-header. That handover is keyed to :not([hidden]), i.e. to whether .hmeta is
     really there, not to the width alone — an earlier cut keyed it to width and put the crest
     in the middle of every desktop screen that had not loaded its data yet.) */
  header .hcrest { margin-left:auto; flex:0 0 auto; display:block; height:34px; width:auto; }
  #hWeekYear { font:600 12px var(--font-display); letter-spacing:1px; text-transform:uppercase; color:var(--mut); white-space:nowrap; }
  #hAvatar { width:32px; height:32px; border-radius:50%; flex:0 0 auto; overflow:hidden; cursor:pointer;
             background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center;
             font:700 13px var(--font-display); }
  #hAvatar[hidden] { display:none; }
  #hAvatar img { width:100%; height:100%; object-fit:cover; display:block; }
  main { max-width:860px; margin:0 auto;
         padding:12px calc(12px + env(safe-area-inset-right)) 12px calc(12px + env(safe-area-inset-left)); }
  .card { background:var(--card); border:1px solid var(--border-card); border-radius:var(--radius-card); padding:16px; margin-bottom:12px; }
  .card.center { text-align:center; }
  h1 { margin:6px 0; font:700 26px var(--font-display); letter-spacing:1px; text-transform:uppercase; }
  h2 { font:600 12px var(--font-display); margin:0 0 10px; color:var(--mut); text-transform:uppercase; letter-spacing:2px; }
  .mut { color:var(--mut); } .small { font-size:12px; }
  .bad { color:var(--accent); } .ok { color:var(--green); } .warn { color:var(--gold); }
  .logo { font-size:52px; }
  /* Plain low-specificity base — every "row card" button below (.mucard/.lrow/
     .swaprow/.teamrow/.bgame etc.) already redeclares background/border/padding
     with a more specific selector, which is all a single class needs to win over
     a bare `button` rule. (A `:not(...)` exclusion chain was tried first and
     rejected — each `:not(.x)` clause counts as a class for specificity, so a
     chain of eight of them outranks `.mucard`/`.bnav button`/etc. outright and
     silently un-does their overrides — a real trap, not a style nit.) */
  button {
    background:var(--nested); color:var(--ink); border:1px solid var(--border-card); border-radius:var(--radius-sm);
    padding:8px 14px; font:600 12.5px var(--font-display); letter-spacing:1px; text-transform:uppercase; cursor:pointer;
    transition:border-color .15s,background .15s;
  }
  button:hover { border-color:var(--border-hover); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  button.primary:hover { opacity:.88; border-color:var(--accent); }
  input, select { background:var(--nested2); color:var(--ink); border:1px solid var(--border-card); border-radius:var(--radius-sm);
          padding:9px 10px; font:15px var(--font-body); }
  input:focus, select:focus { outline:none; border-color:var(--border-hover); }
  select { color-scheme:dark; } /* keeps the native option-list dropdown dark too, not just the closed control */
  .card.center input { display:block; margin:14px auto; width:min(90%,280px); text-align:center; }
  .rowline { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .panner { overflow-x:auto; }
  table.tbl { border-collapse:collapse; width:100%; font-size:13.5px; }
  .tbl th, .tbl td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--divider); white-space:nowrap; font-family:var(--font-body); }
  .tbl th { color:var(--faint); font:600 10.5px var(--font-display); text-transform:uppercase; letter-spacing:1px; padding-bottom:6px; }
  .tbl td.num, .tbl th.num { text-align:right; }
  .tbl td.num { font:700 14px var(--font-display); font-variant-numeric:tabular-nums; }
  .tbl tbody tr:hover { background:var(--row-hover); }
  /* ---------------- S3: team identity — the crest and the name ----------------
     ONE crest element everywhere (.tcrest), sized by a modifier class, and ONE name treatment
     (.tname). Both read the SAME custom properties, which every render site sets from
     LG.palStyle(LG.teamPalette(t)) and from nowhere else:
       --tp/--ts/--tt   the team's colours as FILLS, contrast-floored against the page
       --ti/--ti2       the ink that belongs ON --tp / --ts (black or white, whichever wins)
       --tpd/--tsd/--ttd the same three colours as INK on a dark card, floored at AA 4.5:1
     A crest with a real picture shows the picture; one without shows initials on the team's
     own primary disc, which is why a logo-less team is now identifiable instead of blank.
     The DEFAULTS on .tcrest/.tname matter: an element that somehow renders without a palette
     falls back to app chrome rather than to nothing. */
  .tcrest { display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
            width:28px; height:28px; border-radius:50%; overflow:hidden; vertical-align:-8px;
            background:var(--tp, var(--nested)); color:var(--ti, var(--ink));
            font:800 11px var(--font-display); letter-spacing:.3px; line-height:1;
            box-shadow:inset 0 0 0 1px rgba(255,255,255,.14); }
  .tcrest img { width:100%; height:100%; object-fit:cover; display:block; }
  .tlogo { margin-right:7px; }
  .tmini { width:18px; height:18px; font-size:8.5px; vertical-align:-4px; margin-right:4px; }
  /* The stylized name — FABLE DESIGN PASS (2026-08-10, user: S3's look needed "modern,
     minimalist but impactful … a polished app"). The S3 cut filled every team name with its
     team colour and put a secondary-coloured edge under the big sizes. Eight coloured names
     on one standings table read as a rainbow, not as identity — polished sports apps keep
     TEXT neutral and spend colour on STRUCTURE (the crest, a rail, a bar, one hero surface).
     So: names are app ink at EVERY size, styled by typography alone (condensed, heavy,
     uppercase, tracked); the palette custom properties stay on the element — the crest ring,
     the hero panel and the stat bars consume them — but the glyphs themselves no longer do.
     The clamps in teamPalette are untouched; this changes where colour is SPENT, not how it
     is derived. */
  .tname { font-family:var(--font-display); font-weight:700; text-transform:uppercase;
           letter-spacing:.4px; color:var(--ink); }
  .tname.big { font-weight:800; letter-spacing:.9px; text-shadow:0 0 12px rgba(0,0,0,.35); }
  .tmention { display:inline-flex; align-items:center; gap:0; white-space:nowrap; }
  .tmention .tname { letter-spacing:.3px; }
  .health { font:600 11px var(--font-display); letter-spacing:.8px; text-transform:uppercase; padding:3px 10px; border-radius:var(--radius-pill); border:1px solid var(--border-card); }
  .health.ok { color:var(--accent); border-color:var(--border-card); background:var(--nested); }
  .health.warn { color:var(--bg); background:var(--gold); border-color:var(--gold); font-weight:700; }
  .health.bad { color:#fff; background:var(--accent); border-color:var(--accent); font-weight:700; }

  /* ---------------- free agents (item 1) — browsable table + position chips ----------------
     .poschip mirrors ffdraft's own .chips button language (outlined pill, filled navy when
     .on); .posbadge borrows ffdraft's per-position board-cell palette (--pos-QB/RB/WR/TE/K/
     DST/X) as a small colored tag instead of a whole tinted cell — right-sized for a table
     row. .rzdot/.conflictflag are item-10's "emoji becomes a CSS affordance" pieces: a red-
     zone indicator that used to be a 🔴 emoji is now a plain pulsing dot, and a "sources
     disagree" flag that used to be ⚠ is now a small bordered text chip. */
  .poschips { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:10px; }
  .poschip { background:transparent; border:1px solid var(--border-card); color:var(--mut);
             border-radius:var(--radius-xs); padding:5px 12px; font:600 12.5px var(--font-display);
             letter-spacing:.8px; }
  .poschip.on { background:var(--blue); border-color:var(--blue); color:#fff; }
  /* ESPN-style sortable stats table (2026-08-08 rework, columns re-ordered 2026-08-09 by
     ITEM 22) — PLAYER · ADD · TYPE · PROJ · LAST · OPP · AVG, every header a sort control
     (.thsort). STATUS, SCORE and FPTS were dropped with the re-order; see faRowHtml's own
     note, which spells out what that costs.
     .faname is sticky-left so it stays in view while the rest of the row pans inside .panner
     on a phone — cheap since the table already lives in an overflow-x:auto container. */
  table.faTable tbody tr { cursor:pointer; }
  table.faTable .faname { width:150px; min-width:150px; position:sticky; left:0; background:var(--card); z-index:1; }
  table.faTable .faname b { font-family:var(--font-body); font-weight:600; }
  table.faTable .fatype, table.faTable .faopp { min-width:60px; }
  table.faTable .faproj, table.faTable .faavg, table.faTable .falast { min-width:56px; }
  table.faTable .faadd { text-align:left; min-width:70px; }
  table.faTable thead th:first-child { position:sticky; left:0; background:var(--card); z-index:3; }
  .faAddBtn { padding:6px 12px; font-size:11.5px; }
  /* A row whose player is already owned gets a REAL disabled button naming the owner in its
     title, not the empty cell it used to get — "you can't have him" is information, and a
     blank space says nothing. */
  .faAddBtn:disabled { opacity:.4; cursor:not-allowed; border-color:var(--divider2); color:var(--mut); }
  .faAddBtn:disabled:hover { border-color:var(--divider2); }
  /* ITEM 22's phone half: "on mobile view we need to be able to see add, type and projection
     without horizontal scrolling". At 390px the card's own content box is ~342px, and the
     four columns that have to fit inside it are PLAYER + ADD + TYPE + PROJ. Measured budget:
       116  PLAYER (sticky; was 150 — a name wraps to its second line here rather than
            stealing the room the three data columns need)
        66  ADD    (a 58px button plus its cell)
        44  TYPE   ("FA" or a 2-4 character abbrev)
        50  PROJ
        32  4 cells x 8px of horizontal padding (was 16px a cell)
      = 308, inside 342 with room to spare. Everything after PROJ pans as it always did. */
  @media (max-width:560px) {
    table.faTable th, table.faTable td { padding:7px 4px; }
    table.faTable .faname { width:116px; min-width:116px; }
    table.faTable .faadd { min-width:58px; }
    table.faTable .fatype { min-width:36px; }
    table.faTable .faproj { min-width:42px; }
    table.faTable .faopp, table.faTable .faavg, table.faTable .falast { min-width:48px; }
    .faAddBtn { padding:5px 7px; font-size:10.5px; letter-spacing:.4px; }
  }
  /* ---- ITEM 19 (2026-08-09): the Waivers card is three data blocks, no prose ----
     FAAB budget, then the two acquisition regimes side by side with the one in force marked
     "Now" and the other muted, so which rule you are under is a glance rather than a
     paragraph. The waiver block's VALUE is the deadline itself (time on the value line, date
     under it) — that timestamp used to be parenthetical inside a sentence. */
  /* Capped rather than stretched: three equal thirds of a 1130px card is a lot of empty
     parchment around a five-character number. A phone gets the full width, a desktop gets
     three tidy tiles at the left. */
  .mvblocks { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-bottom:12px; max-width:660px; }
  .mvblk { position:relative; background:var(--nested2); border:1px solid var(--border-card);
           border-radius:var(--radius-sm); padding:10px 10px 9px; min-width:0; }
  .mvblk .mvblab { display:block; font:600 10px var(--font-display); letter-spacing:1px;
                   text-transform:uppercase; color:var(--faint); }
  .mvblk .mvbval { display:block; font:700 20px/1.15 var(--font-display); color:var(--ink);
                   margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* The sub-label WRAPS rather than ellipsing: it is the three words that used to be a whole
     paragraph, and "first come, first ser…" would have thrown away the half of it that says
     what the rule is. The grid stretches all three blocks to the tallest, so a second line
     costs the row, not the block. */
  .mvblk .mvbsub { display:block; font-size:10.5px; line-height:1.25; color:var(--mut); margin-top:2px; }
  .mvblk.on { border-color:var(--gold); }
  .mvblk.on .mvbval { color:var(--gold); }
  .mvblk.off .mvbval, .mvblk.off .mvblab, .mvblk.off .mvbsub { opacity:.5; }
  .mvblk .mvbtag { position:absolute; top:7px; right:7px; font:700 9px var(--font-display);
                   letter-spacing:.8px; text-transform:uppercase; color:var(--bg);
                   background:var(--gold); border-radius:var(--radius-badge); padding:1px 5px; }
  .mvprow { margin-bottom:10px; }
  @media (max-width:420px) {
    .mvblk { padding:8px 7px; }
    .mvblk .mvbval { font-size:17px; }
    .mvblk .mvbsub { font-size:9.5px; }
    .mvblk .mvbtag { top:5px; right:5px; }
  }
  /* ---- ITEM 20 (2026-08-09): the trade builder starts collapsed ----
     A side is the players already chosen plus a "+"; the roster picker underneath only exists
     while the "+" is open. .tradepick keeps the old #mvGive/#mvGet scroll cap so an open
     picker still can't run away with the page. */
  .tradesel { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:6px; }
  .tradechip { display:inline-flex; align-items:center; gap:6px; background:var(--nested);
               border:1px solid var(--accent); border-radius:var(--radius-pill); padding:3px 4px 3px 10px; }
  .tradechip .pcinline { font-size:12.5px; }
  .tradechip small { font:600 10px var(--font-display); letter-spacing:.5px; }
  .tradechip .tradedrop { padding:0; width:22px; height:22px; min-height:0; line-height:1;
                          border-radius:50%; font-size:14px; letter-spacing:0; color:var(--mut); }
  .tradeadd { width:44px; height:44px; padding:0; font-size:20px; line-height:1; letter-spacing:0;
              border-style:dashed; color:var(--mut); }
  .tradeadd.open { border-style:solid; border-color:var(--accent); color:var(--accent); }
  .tradepick { max-height:220px; overflow-y:auto; }
  .tradepick[hidden] { display:none; } /* the house [hidden]-override lesson — an author display rule beats the UA one */
  .mvsugrow { margin-bottom:10px; gap:10px; }
  .mvsugrow #mvSuggestWhy { flex:1 1 160px; min-width:0; }
  .tbl th.thsort { cursor:pointer; user-select:none; }
  .tbl th.thsort:hover { color:var(--ink2); }
  .tbl th.thsort.active { color:var(--accent); }
  .tbl th .sortarrow { font-size:9px; margin-left:2px; }
  .posbadge { display:inline-block; min-width:30px; text-align:center; border-radius:var(--radius-badge);
              color:#fff; font:700 10.5px var(--font-display); letter-spacing:.5px; padding:2px 6px; }
  .posbadge[data-pos="QB"] { background:var(--pos-QB); }
  .posbadge[data-pos="RB"] { background:var(--pos-RB); }
  .posbadge[data-pos="WR"] { background:var(--pos-WR); }
  .posbadge[data-pos="TE"] { background:var(--pos-TE); }
  .posbadge[data-pos="K"] { background:var(--pos-K); }
  .posbadge[data-pos="DST"] { background:var(--pos-DST); }
  .posbadge:not([data-pos="QB"]):not([data-pos="RB"]):not([data-pos="WR"]):not([data-pos="TE"]):not([data-pos="K"]):not([data-pos="DST"]) { background:var(--pos-X); }
  .rzdot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent);
           margin-right:5px; vertical-align:1px; animation:rzpulse 1.3s infinite; }
  @keyframes rzpulse { 50% { opacity:.4; } }
  .conflictflag { display:inline-block; border:1px solid #5b4a17; color:var(--gold); background:#1c1608;
                  border-radius:var(--radius-xs); font:700 9.5px var(--font-display); letter-spacing:.6px;
                  padding:1px 6px; margin-left:5px; }

  /* ---------------- matchup cards on league home ---------------- */
  /* Polish pass (2026-08-08): 140px let TWO cards land side by side at both 390px (main's
     content width) and inside a desktop masonry column (~450px) — real team names ("Waffle
     House Warriors") were truncating down to a single letter + ellipsis in that width, on
     BOTH mobile and desktop. 260px is picked from the actual card contents at this font size
     (name column + the auto score column + the other name column) rather than guessed —
     it's the point past which .muteam stops needing to ellipsize the longest real team name
     in a week-15-style compact card. Below it, cards stack one per row; a genuinely wide
     container (≥560px of its own) still lets two sit side by side. */
  .mugrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:10px; margin-bottom:2px; }
  .mucard { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px;
            width:100%; text-align:left; background:var(--card); border:1px solid var(--border-card);
            border-radius:var(--radius-sm); padding:10px 12px; cursor:pointer;
            text-transform:none; letter-spacing:normal; } /* button's own uppercase must not inherit onto natural-case team names */
  .mucard:hover, .mucard:focus-visible { border-color:var(--border-hover); background:var(--row-hover2); }
  /* The hero ("mine") card can't keep the compact card's 3-column [name|score|name]
     layout at its bigger type scale — a 32px combined "4.0 — 41.0" string in the middle
     "auto" column leaves too little room either side and forces team names into an
     ugly wrap-or-truncate fight. Reflowed into its own row-based grid instead: names
     on row 1 (one per side, plenty of width each), the score centered full-width on
     row 2, badge/win-prob full-width on row 3 — .muteam/.muscore keep their required
     class names and text (data/tests are unaffected), only their grid placement differs
     under .mine. */
  .mucard.mine { grid-column:1 / -1; order:-1; grid-template-columns:1fr 1fr; grid-template-rows:auto auto auto;
                 gap:4px 10px; border-color:var(--accent); border-radius:var(--radius-card);
                 padding:16px; background:var(--card); }
  /* S3: each side of a card is a crest + a name in that team's own ink. The crest keeps its
     own box (flex), so a long name ellipsizes against the text and never against the picture. */
  .muteam { overflow:hidden; display:flex; align-items:center; gap:0; min-width:0;
            font:600 13px var(--font-display); letter-spacing:.3px; }
  .muteam .muteamname { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; font-size:13px; }
  .muteam.right { justify-content:flex-end; text-align:right; }
  .mucard.mine .muteam { grid-row:1; font-size:14px; }
  .mucard.mine .muteam .muteamname { font-size:14px; }
  .muscore { font:700 16px var(--font-display); font-variant-numeric:tabular-nums; }
  .mucard.mine .muscore { grid-row:2; grid-column:1 / -1; text-align:center; font-size:32px; }
  /* ITEM 27 (2026-08-09): the badge + win-prob bar now renders on EVERY matchup card, not just
     .mine. The explicit `grid-row:3` was written for the hero card's 3-row grid and had to move
     under .mine — on the compact card (a single implicit row) it would have forced an EMPTY row 2
     and dropped the strip to row 3. Full-width placement (grid-column:1/-1) is right for both. */
  .herorow { grid-column:1 / -1; display:flex; align-items:center; gap:12px; margin-top:2px; }
  .mucard.mine .herorow { grid-row:3; }
  /* The compact card's strip is quieter than the hero's — it sits under a 13px name row, so a
     full-size badge would out-shout the score it belongs to. */
  .mucard:not(.mine) .herobadge { font-size:10px; }
  .mucard:not(.mine) .wpbar.mini { height:4px; }
  .herobadge { display:inline-flex; align-items:center; gap:6px; font:600 11px var(--font-display); letter-spacing:1px;
               text-transform:uppercase; color:var(--faint); flex:0 0 auto; }
  .herobadge.live { color:var(--accent); }
  .herobadge .dot { width:6px; height:6px; border-radius:50%; background:var(--accent); }
  .wpbar.mini { flex:1 1 auto; height:5px; }
  /* An empty track — no lineup data on either side, so nothing to claim (see matchupHeroExtra). */
  .wpbar.mini.unknown { background:var(--divider2); }
  .wpfillmini { height:100%; background:var(--accent); display:block; }

  /* ---------------- matchup page ---------------- */
  /* Item 6 (2026-08-09 playtest: "slim down the matchup card at the top by half so you can see
     more players below"). MEASURED at 390px: the header card was 220px tall — a third of the
     phone's viewport spent on two team names before a single lineup row. Halved by consolidating
     rather than deleting: Proj and the to-play/live counts now share ONE line (they were two),
     the avatar drops 44->28px, the score 30->22px, and the card takes 10px of padding instead of
     16. Everything the header carried is still on it — including the win-probability bar and the
     live/Final indicator, which are the two things that must not go. */
  /* S3 trimmed this 8px -> 7px: crest-vs-crest costs the top row 12px, and this is part of
     paying for it out of the design rather than out of the 120px ceiling. */
  .card.muhead { padding:7px 12px; }
  .muhrow { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:start; }
  .muhteam { min-width:0; display:flex; flex-direction:column; gap:0; }
  .muhteam.right { text-align:right; align-items:flex-end; }
  /* S3 crest-vs-crest. 44px at phone width, 52px from 700px up — the spec's 44-56 band, and
     no larger, because the header's MEASURED 120px ceiling (item 6, from a real user complaint
     about a third of the phone spent before the first lineup row) is a harder constraint than
     the crest size. It is the design that shrinks to fit the cap, never the cap that moves.
     Colours come from .tcrest; only the geometry and the "this one is yours" ring live here. */
  .muavatar { width:44px; height:44px; font-size:15px; vertical-align:0; }
  .muavatar.mine { box-shadow:inset 0 0 0 2px rgba(255,255,255,.2), 0 0 0 2px var(--accent); }
  .bigpts { font:800 19px/1.05 var(--font-display); font-variant-numeric:tabular-nums; }
  /* THE ESPN HEADER (2026-08-09, from the user's own screenshot of the real app): crest on the
     OUTER edge, score block on the INNER — mirrored, so the two big numbers face each other
     across the centre column — with the projection directly BENEATH the score as a bare muted
     number, then the team name, then owner · record.
     The 2026-08-08 batch's height budget still binds: this arrangement adds a line (owner ·
     record) and must NOT grow past the 111px it measured at, so the type is tightened to pay
     for it rather than the card being allowed to creep back toward its original 220px. */
  .muhtop { display:flex; align-items:center; gap:8px; min-width:0; width:100%; }
  .muhteam.right .muhtop { flex-direction:row-reverse; }
  .muhscore { display:flex; flex-direction:column; align-items:flex-end; min-width:0; line-height:1; }
  .muhteam.right .muhscore { align-items:flex-start; }
  .muhead .muhname { display:block; max-width:100%; min-width:0; font-size:12px; line-height:1.2;
                     white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* S3: the score block gets a hairline of the team's own colour on its inner edge and the
     name takes the team's ink. The middle column — LIVE/Final, the win-probability bar, the
     percentages — is NOT touched by any of this: identity colours the teams, the verdict
     colours the outcome, and the verdict has the last word wherever they meet. */
  .muhead .muhscore { border-right:3px solid var(--tp, transparent); padding-right:7px; }
  .muhead .muhteam.right .muhscore { border-right:0; border-left:3px solid var(--tp, transparent); padding-right:0; padding-left:7px; }
  /* Kept at the 12px item 6 tightened it to: the display treatment here is carried by weight,
     tracking and the secondary edge, not by extra size, so the name gains a team's colours
     without spending a pixel of the header's height budget. */
  /* design pass: the edge shadow went with the coloured fills — the side's identity is its
     crest and its 3px score-block rail, and the name stays quiet ink */
  .muhead .muhname.tname.big { font-size:12px; letter-spacing:.6px; text-shadow:none; }
  .muhead .muhproj { font:600 10px/1.2 var(--font-display); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .muhead .muhowner { font-size:9.5px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .muhead .muhsub { font-size:9.5px; line-height:1.2; white-space:nowrap; }
  .muhead .h2hline { margin-top:2px; }
  .muhmid { text-align:center; min-width:84px; padding-top:2px; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .mulive { display:flex; align-items:center; gap:6px; font:600 12px var(--font-display); letter-spacing:1px; color:var(--accent); text-transform:uppercase; }
  .mulive .dot { width:6px; height:6px; border-radius:50%; background:var(--accent); }
  .mulive.done { color:var(--mut); }
  .wpbar { height:5px; border-radius:var(--radius-pill); background:var(--border-card); overflow:hidden; margin:2px 0; width:100%; }
  .wpfill { height:100%; background:var(--accent); display:block; }

  /* ---------------- S3: split stat bars (the NFL box-score mechanic, ported) ----------------
     Deliberately the SAME shape as .nflsb/.nflsbt further down this sheet — value, label,
     value over one track filled from both ends — because it is the same idea and a reader who
     has met it on an NFL game page should meet it again here, not a second dialect of it.
     What differs is only where the two fills' colours come from: --abar/--hbar, set once on
     .gsbars from each team's own clamped palette, instead of the NFL feed's team hex. */
  .gsbkey { display:flex; align-items:center; gap:6px; font:600 10.5px var(--font-display);
            letter-spacing:.6px; text-transform:uppercase; color:var(--mut); margin-bottom:8px; }
  .gsbdot { width:10px; height:10px; border-radius:2px; flex:0 0 auto; }
  .gsbdot.right { margin-left:auto; }
  .gsb { margin-bottom:9px; }
  .gsbl { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:3px; }
  .gsbl b { font:700 13px var(--font-display); font-variant-numeric:tabular-nums; }
  .gsbl .small { text-transform:uppercase; letter-spacing:.7px; font-size:10px; }
  .gsbt { display:flex; height:7px; border-radius:var(--radius-pill); overflow:hidden; background:var(--divider2); }
  .gsbt i { background:var(--abar, var(--mut)); }
  .gsbt em { background:var(--hbar, var(--faint)); margin-left:auto; }
  /* Nothing on either side yet — an empty track, never a 50/50 split, for the same reason
     .wpbar.mini.unknown exists: a half-and-half bar is a claim about a game nobody has played. */
  .gsbt.unknown i, .gsbt.unknown em { background:transparent; }
  /* table-layout:fixed + an explicit white-space:normal override are both required here:
     .tbl td (shared with the standings tables, which DO want single-line rows) sets
     white-space:nowrap, which — under the default table-layout:auto — let a long player
     name/meta string force this column wider than its declared share and shove the slot
     badge + opposing player off the right edge of a 390px phone. Locking the layout AND
     letting this table's own cells wrap keeps every row inside the card at any width. */
  table.mutable { table-layout:fixed; }
  table.mutable td { vertical-align:middle; white-space:normal; }
  /* td.slotcell, not .slotcell — .tbl td's text-align:left otherwise outweighs it and the
     slot badge has rendered left-of-center since the day it shipped. */
  /* THE CENTRE BAND (2026-08-09). In the real app the middle of the table is ONE continuous
     darker vertical strip running the full height, with the slot label centred in each row —
     not a pill floating in space per row. So the CELL carries the band (--nested2, a shade
     darker than the card, with its row divider suppressed so consecutive cells read as one
     unbroken strip) and the compact coloured BADGE sits inside it.
     That keeps BOTH things the user has asked for: the continuous band from this screenshot,
     and the draft position palette they asked for in the previous batch.

     ITEM 23 (2026-08-09): "that font should be much larger and the color should take up the
     width and height of the column so there isn't blank space." The badge used to be a
     compact pill floating in the middle of the cell with ~10px of dead band above and below
     it and ~24% of the column unpainted either side. It now FILLS the cell — width:100%,
     height:100%, square corners, no cell padding — so the position colour IS the column, and
     because consecutive cells already suppress their row divider the colours meet with no
     seam (the continuous band from the previous batch is preserved, it is simply the position
     colour now instead of a neutral strip behind a pill).
     height:100% needs something definite to resolve against, exactly like td.pcell below —
     hence height:1px on the cell (the standard table trick; with auto height the percentage
     resolves to auto and silently does nothing).
     The type steps up hard, 11px -> 16px, which is the readable half of the ask. .sbwide is
     the one modifier: a label longer than three characters (BENCH, FLEX) drops to 0.72em, or
     "BENCH" cannot fit an 11%-of-390px column at the bigger size. */
  td.slotcell { color:var(--mut); font:600 16px var(--font-display); letter-spacing:.5px; text-align:center; width:12%;
              background:var(--nested2); border-bottom-color:transparent; padding:0; height:1px; }
  td.slotcell .slotbadge { display:flex; align-items:center; justify-content:center;
              width:100%; height:100%; min-height:34px; background:var(--nested);
              border-radius:0; padding:2px 1px; overflow:hidden; }
  td.slotcell .slotbadge.sbwide { font-size:.72em; letter-spacing:.3px; }
  /* Item 2 (2026-08-09 playtest: "the player position indicator between the two teams should be
     color coded the same as the way positions are colored in the draft"). Same --pos-* tokens
     the players table's .posbadge already tints with — lifted from ffdraft's board palette, so
     a QB reads the same colour in the draft room and in the matchup. td.slotcell[data-pos]
     (0,2,1) outranks the plain td.slotcell rule above (0,1,1), which is what lets it replace
     the neutral --nested background. FLEX/BENCH/TOT/IR carry data-pos="X" — they are not a
     single position, and --pos-X is the neutral the badge already uses for that same case. */
  td.slotcell[data-pos="QB"] .slotbadge { background:var(--pos-QB); color:#fff; }
  td.slotcell[data-pos="RB"] .slotbadge { background:var(--pos-RB); color:#fff; }
  td.slotcell[data-pos="WR"] .slotbadge { background:var(--pos-WR); color:#fff; }
  td.slotcell[data-pos="TE"] .slotbadge { background:var(--pos-TE); color:#fff; }
  td.slotcell[data-pos="K"]  .slotbadge { background:var(--pos-K);  color:#fff; }
  td.slotcell[data-pos="DST"] .slotbadge { background:var(--pos-DST);color:#fff; }
  td.slotcell[data-pos="X"]  .slotbadge { background:var(--pos-X);  color:var(--ink2); }
  /* height:1px is the standard "let a child use height:100%" cell trick — a table cell always
     grows to its own content, but declaring a height gives the percentage below something
     definite to resolve against (with auto height it resolves to auto and silently does
     nothing, which is exactly what happened on the first attempt). */
  /* td.pcell, not .pcell — .tbl td's own padding (0,1,1) outranks a bare class (0,1,0).
     ITEM 25 moved 2px of the cell's own padding INSIDE .pcellgrid so the gold possession ring
     has something to sit in; the cell gives back exactly that much (5px -> 3px) so the ROW is
     the height it always was. The half-cell BOX reads 4px taller than before for the same
     reason — the padding did not appear, it moved. */
  td.pcell { width:44%; height:1px; padding:3px 8px; }
  /* THE ESPN HEAD-TO-HEAD ROW. Rebuilt 2026-08-09 from the user's own screenshot of the real
     app; the 2026-08-08 pass had inferred it from a lower-resolution one and got the text
     alignment backwards.
     Mirrored two-part cell: name/meta on the OUTER edge, a fixed-width points column on the
     INNER edge hugging the slot band, so both teams' point columns line up down the middle of
     the row regardless of name length on either side. (Before 2026-08-08 the .pcellgrid markup
     shipped with NO layout rule at all — the .scgrid family of bug — so both halves stacked
     their two divs in raw DOM order and nothing across the row lined up.)

     ⚠ THE TEXT ALIGNMENT MIRRORS TOO — CORRECTED 2026-08-09.
     This block used to carry the opposite rule, with a comment asserting that "only the column
     ORDER mirrors; text stays left-aligned on BOTH sides". That was inferred from an earlier,
     lower-resolution screenshot and it is WRONG. In the real app team A's text hugs the LEFT
     edge and team B's hugs the RIGHT — names and meta both — which is exactly what the user
     asked for ("team a is formatted to hug left, team b hug right"). */
  .pcellgrid { display:flex; align-items:center; gap:10px; height:100%; }
  .pcellgrid .pinfo { flex:1 1 auto; min-width:0; }
  .pcellgrid .ppts { flex:0 0 52px; font-variant-numeric:tabular-nums; text-align:right; }
  .pcellgrid.right .pinfo, .pcellgrid.right .ppts, td.pcell.right { text-align:right; }
  .pcellgrid.right .pname { flex-direction:row-reverse; }

  /* EXACTLY THREE LINES, EXACTLY THIS TALL — the "exactly even height for every player" the
     user asked for. Every line of both halves is a fixed-height, single-line, ellipsised
     block, so a row's height is a CONSTANT (3 lines + the cell's padding) and cannot depend on
     what the row happens to hold: a 20-character name, an "Empty" placeholder, a live stat
     line and a pre-game blank all render the same box.
     Line 3 is present even when the stat summary is empty — reserving it is what stops a
     pre-game row being shorter than a live one, and it is why .pstatline is rendered
     unconditionally rather than only when there are stats. */
  .pcellgrid .pline { height:17px; line-height:17px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .pcellgrid .pmeta, .pcellgrid .pstatline, .pcellgrid .pproj, .pcellgrid .pstatpad { height:14px; line-height:14px; font-size:10.5px; }
  /* The crest is the OUTERMOST thing on the line, mirrored with the rest of the row — which
     row-reverse alone already achieves: in a reversed row main-start IS the right edge, so the
     default flex-start packing puts the crest hard against it. (justify-content:flex-end here
     would pack toward main-END, i.e. the LEFT — the opposite of what it reads as.) */
  .pcellgrid .pname { display:flex; align-items:center; gap:5px; }
  /* The name is the only thing in the row allowed to be long, so it — not its line box — is
     what ellipsises. It must NOT wrap: a two-line name would make its row taller than every
     other row in the table, which is the whole property this layout exists to guarantee. */
  .pcellgrid .pname b { font:600 13px/17px var(--font-body); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pcellgrid .pname .plogo { flex:0 0 auto; width:14px; height:14px; object-fit:contain; }
  .pcellgrid .pname .plogoph { display:block; }
  .pcellgrid .ppts .pts { font:700 15px/17px var(--font-display); display:block; }
  .totalrow .ppts .pts { font-size:17px; }
  /* Phone: the fixed points column + centre band leave ~110px per name at 390px — tighten the
     row's fixed costs so the name and the opponent line keep a readable share. */
  /* Every fixed cost in the row is trimmed here, because at 390px they add up to more than the
     name gets: cell padding, the gap, the points column, the crest and the centre band between
     them were leaving ~84px for a name (about twelve characters — "A. St. Brown" only just
     fits, and "M. Harrison Jr." came out as "M. ..."). These take it back to ~100px. A phone
     still truncates the longest names, as the reference app does — that is what the title
     attribute is for — but it truncates far fewer of them. */
  @media (max-width:560px) {
    /* MEASURED at 390px, before this pass: the table was 332px wide and the name got 83.8px of
       it, while the fixture's longest real name ("J. Smith-Njigba") needs 98 — so four names a
       row were coming out as "M. Ha…" / "J. Smi…". Four characters does not identify a player,
       and a title attribute is not reachable on a phone. The reference app fits these names
       whole at this width, so this was ours to fix, not to document.
       WHERE THE WIDTH CAME FROM, in the order it was cheapest:
         +20px  the CARD's own 16px side padding — by far the largest slack in the row, and
                spending it costs no text at all (the reference's rows are near full-bleed)
         +12px  the points column, which was 36px holding a 28px "41.0" — 6px of pure slack
                per side. The TOTAL row keeps its own wider basis below, because a team total
                really is "141.0" (43px at 17px) and WAS being clipped here even at 36px.
          +4px  cell padding 4 -> 3
          +4px  the two 4px gaps -> 3px
       Nothing was taken from the name's own font, the crest, the band, the colours or either
       point value. Result: 106px for the name — "J. Smith-Njigba" fits with 8px to spare, and
       the opponent line ("@DEN Fri 1:00 AM", 97px) stops truncating as well. */
    .card.lineupcard { padding:12px 6px; }
    .pcellgrid { gap:3px; padding:2px 2px; }
    /* ITEM 25 gave .pcellgrid 3px of horizontal padding (the gold ring has to sit somewhere),
       and item 17 had left the longest real name — "J. Smith-Njigba", 97px — fitting a 103px
       budget with 6px to spare. Six is exactly what the ring would have cost, so the cell
       hands it straight back: 1px of cell padding + 2px of grid padding is the same 3px a
       side the row had before, only now the ring is drawn inside it. Measured: the name
       budget is 103px either way. */
    td.pcell { width:44.5%; padding:3px 1px; }
    .pcellgrid .ppts { flex-basis:30px; }
    /* A player never scores 141; a TEAM does. The TOTAL row is its own row and its columns do
       not have to line up with the players' — both halves still match each other. */
    .totalrow .ppts { flex-basis:44px; }
    .pcellgrid .pname { gap:3px; }
    .pcellgrid .pname b { font-size:11.5px; }
    .pcellgrid .pname .plogo { width:12px; height:12px; }
    .pcellgrid .pmeta, .pcellgrid .pstatline, .pcellgrid .pproj, .pcellgrid .pstatpad { font-size:9.5px; }
    .pcellgrid .ppts .pts { font-size:14px; }
    /* ITEM 23's phone half. The badge fills the cell now, so the only variable left is the
       type size: 13px for a position label (was 9px — the "much larger" the user asked for),
       stepping to .72em = 9.4px for BENCH/FLEX, which is what still fits an 11%-of-390px
       column. Padding is 0 horizontally: the badge is the cell, so every pixel of the column
       is available to the word inside it. */
    td.slotcell { width:11%; font-size:13px; letter-spacing:0; padding:0; }
    td.slotcell .slotbadge { padding:2px 0; min-height:30px; }
  }
  .pts { font:700 14px var(--font-display); display:block; }
  .live { color:var(--accent); font-weight:700; }
  /* ITEM 24 (2026-08-09, user: "the time and quarter of a game should not be in red text, just
     same text as any other stat. What should be red is Q, D, our OUT status for players").
     The clock keeps .live's bold weight — it still has to be findable at a glance on a line
     of small muted type — and gives up the colour, inheriting .pmeta's own muted ink like the
     opponent and kickoff it replaces. Red now means exactly one thing on a lineup row: this
     player might not play. */
  .gclock { font-weight:700; }
  /* ITEM 26: the designation leads line 2, so it needs its gap on the RIGHT. Nothing about its
     own box may grow the line — .pmeta is a fixed 14px with a matching line-height and .inj is
     10.5px, so this cannot move a row's height; the suite measures that rather than trusting
     it. vertical-align keeps the small caps sitting on the clock's own baseline. */
  .pcellgrid .pmeta .inj { margin-right:3px; vertical-align:baseline; font-size:inherit; }
  /* ITEM 25 (2026-08-09, user: "we need players where there offense has the ball to be
     highlighted, you can put a gold border around that player"). Replaces the pip + faint
     row tint the previous batch shipped.
     An INSET ring, not a border: a real border would add 2px to the cell's box and break the
     "exactly even height for every player" rule the whole row layout is built on. box-shadow
     is painted, not laid out, so a highlighted row measures identically to its neighbours.
     The 2px of padding is on EVERY .pcellgrid, not just the highlighted one, for the same
     reason — so the ring has something to sit in without moving the text when it appears. */
  .pcellgrid { padding:2px 3px; border-radius:var(--radius-badge); }
  .pcellgrid.hasball { box-shadow:inset 0 0 0 2px var(--gold); background:rgba(255,182,18,.07); }
  .lrow.hasball { box-shadow:inset 0 0 0 2px var(--gold); border-color:var(--gold); }
  .fline { padding:6px 0; border-bottom:1px dotted var(--divider2); font-size:13.5px; }
  .fline.sys { color:var(--mut); }
  .delta { font:700 13px var(--font-display); font-variant-numeric:tabular-nums; }
  .delta.up { color:var(--green); } .delta.down { color:var(--accent); }
  /* ---- the matchup feed (item 1, 2026-08-09) ----
     A bounded scroll box so the feed can't push the AI read and the trash-talk thread miles
     down the page, with overscroll-behavior:contain so a rubber-band drag at its own edge
     stops there instead of chaining to the document (the house convention). Each line carries
     its team's short tag AND a matching left accent — the tag is what actually answers "which
     team is this from"; the accent alone would only say "one of the two". */
  #mufeed { max-height:300px; overflow-y:auto; overscroll-behavior:contain; }
  @media (min-width:1024px) { #mufeed { max-height:420px; } }
  .feedfilter { margin-bottom:8px; }
  .fteam { display:inline-block; min-width:30px; text-align:center; border:1px solid var(--border-card);
           border-radius:var(--radius-badge); background:var(--nested); color:var(--ink2);
           font:700 10px var(--font-display); letter-spacing:.5px; padding:1px 5px; margin-right:6px; }
  .fteam.away { border-color:#2a4f80; background:rgba(1,51,105,.55); color:#cfe0ff; }
  .fteam.home { border-color:#7a2020; background:rgba(213,10,10,.20); color:#ffd2d2; }
  .fline.away { border-left:3px solid #2a4f80; padding-left:7px; }
  .fline.home { border-left:3px solid #7a2020; padding-left:7px; }

  /* ---------------- team / roster page ---------------- */
  .lrow { display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:var(--card);
          border:1px solid var(--border-card); border-radius:var(--radius-sm); margin-bottom:6px; padding:10px 12px;
          text-transform:none; letter-spacing:normal; }
  .lrow:hover { border-color:var(--border-hover); background:var(--row-hover2); }
  .lrow.locked { opacity:.72; }
  .slotchip { flex:0 0 52px; text-align:center; font:600 11px var(--font-display); letter-spacing:.5px; color:var(--mut);
              background:var(--nested); border:1px solid var(--border-card); border-radius:var(--radius-badge); padding:4px 0; }
  .lname { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; font-family:var(--font-body); }
  .lpts { font:700 14px var(--font-display); white-space:nowrap; }
  /* ITEM 24's other half: Q / D / OUT is the app's one genuine "this might not happen" flag,
     so it takes --accent, the alarm colour the live clock just gave up. It used to be
     ffdraft's own softer coral (#ef6a4d), which read as a third, weaker signal beside the
     red clock rather than the strongest one on the row. Every surface that renders .inj —
     the matchup rows, the locker, the swap sheet, the players table and the stats card —
     shares this one rule, so they cannot disagree. */
  .inj { color:var(--accent); font-weight:700; font-size:10.5px; letter-spacing:.3px; text-transform:uppercase; }
  /* ITEM 33: a bottom sheet's LAST row is its Cancel — standalone, the home indicator sits
     exactly there, so the bottom padding carries the inset (and the sides carry theirs for
     landscape). */
  .sheet { position:fixed; inset:auto 0 0 0; z-index:40;
           padding:10px calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
           background:rgba(6,7,8,.7); backdrop-filter:blur(3px); }
  .sheet .card { max-height:60vh; overflow-y:auto; box-shadow:0 -8px 30px rgba(0,0,0,.55); }
  .swaprow { display:flex; justify-content:space-between; gap:10px; width:100%; text-align:left; background:var(--card);
             border:1px solid var(--border-card); border-radius:var(--radius-sm); margin-bottom:6px; padding:11px 12px;
             text-transform:none; letter-spacing:normal; }
  .swaprow:hover { border-color:var(--border-hover); background:var(--row-hover2); }
  .swaprow.picked { border-color:var(--accent); background:var(--nested); }
  /* ---- item 12 (2026-08-09): the Moves player list is a bounded box, not the whole page ----
     The table already pans HORIZONTALLY inside .panner with its PLAYER column sticky-left; the
     vertical cap is added to that SAME container rather than a wrapper around it, because a
     position:sticky cell only sticks to the scrollport it actually lives in — wrapping the
     panner in a second scroller would leave the sticky column pinned to the wrong box and it
     would drift out of view on a horizontal pan. The header row gets top:0 for the same
     reason (it is now scrolling within its own container, so it needs to stick to it), and
     the top-left cell needs both axes plus the highest z-index of the three.
     "Show more ↓" is rendered AFTER the .panner, so it stays below the box and growing the
     pool can never blow the box's own height out. */
  #faResults .panner { max-height:340px; overflow:auto; overscroll-behavior:contain; }
  @media (min-width:1024px) { #faResults .panner { max-height:560px; } }
  table.faTable thead th { position:sticky; top:0; background:var(--card); z-index:1; }
  /* The scroll cap moved onto .tradepick (item 20) — the whole side no longer scrolls, only
     the picker inside it, so a chosen player can never scroll out of sight. */
  /* ---- item 13 (2026-08-09): "My pending", compact ----
     Same information, roughly a third of the room: the card's own padding comes in, the
     sub-headings stop reserving a full text block each, rows tighten, and an empty state is
     one quiet line rather than a paragraph. The action buttons deliberately keep a 44px
     minimum — this is the one card where shrinking must not shrink a tap target. */
  .pendcard { padding:10px 12px; }
  .pendcard h2 { margin-bottom:4px; }
  .pendcard h2.small { margin:8px 0 2px; }
  /* The row's text and its action button share ONE line. .rowline wraps by default, and with
     a 44px button that meant every pending row cost two full lines (measured 76-94px each)
     for one sentence. nowrap + a shrinkable text column lets the sentence wrap INSIDE its own
     share instead, so the row is only ever as tall as the taller of the two. */
  .pendcard .rowline { padding:3px 0; font-size:12.5px; gap:8px; flex-wrap:nowrap; align-items:center; }
  .pendcard .rowline > span:first-child { flex:1 1 auto; min-width:0; }
  .pendcard .rowline > button { flex:0 0 auto; }
  /* DIRECT children only — the ACTION buttons (Cancel/Accept/Decline/Veto) are children of
     .rowline, while the player-name links (.pcinline) are inline text nested inside its
     <span>. A bare descendant selector here gives every name link a 44px box and triples the
     card's height, which is the opposite of the point. */
  .pendcard .rowline > button { min-height:44px; }
  .pendcard .fline { padding:4px 0; font-size:12.5px; }
  .pendcard .pendnone { margin:0; }
  #mvTradeTeam { width:100%; margin-bottom:8px; }
  #faSearch, #mvTradeNote { width:100%; margin:6px 0; }
  .teamrow { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--card);
             border:1px solid var(--border-card); border-radius:var(--radius-sm); margin-bottom:8px; padding:12px;
             text-transform:none; letter-spacing:normal; }
  .teamrow:hover { border-color:var(--border-hover); background:var(--row-hover2); }
  .teamrow img { width:34px; height:34px; border-radius:50%; object-fit:cover; }
  /* item 9 cleanup: this rule used to be scoped ".rv input.redit" — .rv never existed in the
     markup, so it never actually applied. Fixed to target .redit directly. */
  /* Polish pass (2026-08-08): 76px fit every NUMERIC rule field, but a few carry short STRING
     enums instead (keepers.waiverCost defaults to "last-round") — at 76px that value truncated
     to "last-roun", silently hiding the last character of an editable setting. 112px is sized
     off that actual longest value at this font, with a little headroom; every numeric field
     (1-4 digits) sits comfortably inside it too. */
  input.redit { width:112px; text-align:right; font-family:var(--font-display); font-weight:700; padding:4px 6px; }
  #toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(74px + env(safe-area-inset-bottom));
           background:var(--nested); border:1px solid var(--border-hover); border-left:3px solid var(--accent);
           border-radius:var(--radius-sm); padding:10px 16px; font:13px var(--font-body); z-index:60;
           box-shadow:0 8px 24px rgba(0,0,0,.5); }
  /* team-name tap targets -> locker */
  .teamlink { cursor:pointer; text-decoration:none; }
  .teamlink:hover, .teamlink:focus { text-decoration:underline; color:var(--accent); }

  /* Item 16 (2026-08-09): the Rules / Draft pair that replaced their bottom-nav tabs. Two
     equal columns on one row (they stack under 380px, which no phone in this family has, but
     flex-wrap makes that safe anyway); every target is ≥44px. Styled as one language even
     though one is a <button> and the other an <a> — the difference is in how they behave, not
     in how they look. */
  .leaguelinks { display:flex; flex-wrap:wrap; gap:10px; }
  .navlinkbtn { flex:1 1 150px; min-height:52px; display:flex; flex-direction:column; justify-content:center;
                gap:2px; text-align:left; padding:9px 12px; background:var(--nested); color:var(--ink);
                border:1px solid var(--border-card); border-radius:var(--radius-sm); text-decoration:none;
                font:600 13px var(--font-display); letter-spacing:.6px; text-transform:uppercase; }
  .navlinkbtn:hover { border-color:var(--border-hover); color:var(--ink); }
  .navlinkbtn .small { font:400 11px var(--font-body); letter-spacing:0; text-transform:none; }
  /* S2's quiet "Drafted ✓" line — appended AFTER the two buttons above, on its own row. */
  .draftedline { flex:1 1 100%; margin:2px 0 0; }

  /* S2: the draft-day card, first on the league home while the draft is still ahead. Centered,
     a little larger than an ordinary card — this is the one thing on the page with a clock
     running against it. LIVE reuses the app's existing LIVE colour language (var(--accent),
     same as .mulive/.sccard.live/.scstate.live) rather than inventing a new one. */
  .draftcard { text-align:center; }
  .draftcard h2 { font-size:15px; letter-spacing:1px; }
  .draftwhen { margin:2px 0 10px; }
  .draftclock { font:700 30px var(--font-display); letter-spacing:.5px; margin-bottom:12px; }
  .draftcard .navlinkbtn { display:inline-flex; flex:0 0 auto; text-align:center; min-width:180px; }
  .draftlive { border-color:var(--accent); }
  .draftlive .draftjoin { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* ---------------- chat ---------------- */
  .chatcard { padding-bottom:0; }
  .chatlist { max-height:52vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:2px 2px 8px; }
  /* Item 14 (2026-08-09, user: "on mobile the new message appears on the bottom of the screen
     as it should, but on desktop it appears at the top"). MEASURED: the list box HUGS its
     content (max-height only, no height), so on a phone — where 52vh is most of the screen and
     a real history overflows it immediately — the newest message lands near the bottom of the
     SCREEN, while on a desktop the same card is a short block floating at the top of a 900px
     page. Same code, different relationship to the viewport.
     Two parts, and both are needed:
       · the dedicated Chat tab is a chat PANE — a definite 52vh box at every width, so the
         composer sits low and the newest message sits just above it however few messages
         there are. The matchup page's trash-talk thread deliberately does NOT get this: it is
         one card among many on that page, and a half-empty 52vh box mid-page would be worse
         than a short one.
       · content is BOTTOM-ANCHORED with an auto top margin on the first message.
     ⚠ NOT justify-content:flex-end on the scroller — the obvious fix and a trap: on an
     OVERFLOWING flex column several engines make the overflowed content at the top
     unreachable, so scrolling up clips the earliest messages away. An auto margin resolves to
     zero once free space is negative, so a full history stays completely scrollable. */
  .chatcard .chatlist { height:52vh; }
  .chatlist > :first-child { margin-top:auto; }
  .chatRowMsg { display:flex; }
  .chatBubble { background:var(--nested2); border:1px solid var(--border-card); border-radius:12px; padding:8px 10px; max-width:88%; }
  .chatBubble.mine { background:var(--card); border-color:var(--accent); margin-left:auto; }
  /* S3: the byline leads with the team's crest, so a thread reads as a conversation between
     teams rather than a column of names. align-items:center keeps the 20px crest, the name and
     the timestamp on one baseline band; the timestamp keeps its right-hand berth via the auto
     margin (justify-content can no longer do it now that the row has three children). */
  .chatMeta { display:flex; align-items:center; gap:6px; font-size:12px; margin-bottom:2px; }
  .chatMeta .small { margin-left:auto; white-space:nowrap; }
  .chatMeta b { font-family:var(--font-display); font-weight:600; letter-spacing:.3px; }
  .chatcrest { width:20px; height:20px; font-size:9px; vertical-align:0; }
  .teamrowcrest { width:38px; height:38px; font-size:14px; vertical-align:0; }
  .teamrowname { font-size:15px; }
  .chatQuote { border-left:2px solid var(--border-card); padding-left:8px; margin:4px 0; color:var(--mut); font-size:12.5px; }
  .chatText2 { white-space:pre-wrap; word-break:break-word; }
  .chatImg { max-width:220px; max-height:220px; border-radius:10px; margin-top:6px; display:block; cursor:zoom-in; }
  .chatActions { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .chatActions button { background:var(--nested2); border:1px solid var(--border-card); border-radius:var(--radius-pill);
                         padding:3px 9px; font-size:12px; text-transform:none; letter-spacing:0; }
  .chatDel { color:var(--accent); }
  .chatSys { color:var(--mut); font-size:13px; background:var(--nested2); border:1px dashed var(--border-card);
             border-radius:10px; padding:6px 10px; width:100%; }
  .chatcompose { border-top:1px solid var(--border-card); margin-top:8px; padding-top:10px; position:sticky; bottom:0; background:var(--card); }
  /* Boot-speed/polish pass (2026-08-08): PHOTO/IMAGES/GIF/SEND are all fixed-width text
     buttons (flex:0 0 auto — they never shrink) sharing one row with the message box; at
     390px their combined width (~260px incl. gaps) left the textarea only ~40px — three or
     four characters — before any typing even started. flex-wrap + a real basis on the
     textarea forces a clean two-line layout instead: the three icon buttons comfortably fit
     line 1 on their own (~215px of 332px available), so a basis bigger than what's left on
     that line (120px) pushes the textarea (and Send, right after it) onto their own full-
     width line 2 — no HTML restructuring needed, just where the wrap naturally falls.
     Also lifted .chatText out from the unstyled-by-default `<textarea>` gap: the base
     `input, select { }` rule never touches textareas, so this box was relying on browser
     defaults for everything but width. */
  .chatRow { display:flex; gap:6px 8px; align-items:center; flex-wrap:wrap; row-gap:8px; }
  .chaticon { padding:7px 9px; flex:0 0 auto; font-size:11.5px; }
  .chatText { flex:1 1 200px; min-width:0; background:var(--nested2); color:var(--ink);
              border:1px solid var(--border-card); border-radius:var(--radius-sm);
              padding:9px 10px; font:15px var(--font-body); resize:none; }
  .chatText:focus { outline:none; border-color:var(--border-hover); }
  .chatSend { flex:0 0 auto; }
  .chatgifbox, .chatmeme { background:var(--nested2); border:1px solid var(--border-card); border-radius:12px; padding:8px; margin-bottom:8px; }
  .chatGifQ { width:100%; margin-bottom:8px; }
  .chatGifGrid, .chatmeme { display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:6px; }
  .gifThumb, .memeThumb { padding:0; border-radius:8px; overflow:hidden; border:1px solid var(--border-card); background:none; }
  .gifThumb img, .memeThumb img { width:100%; height:64px; object-fit:cover; display:block; }
  .chatReplyPreview, .chatPending { display:flex; align-items:center; gap:8px; background:var(--nested2); border:1px solid var(--border-card);
    border-radius:10px; padding:6px 10px; margin-bottom:8px; }
  .chatPending img { width:44px; height:44px; object-fit:cover; border-radius:8px; }
  .chatReplyX, .chatPendingX { margin-left:auto; background:none; border:none; padding:2px 6px; }
  /* the house [hidden]-override lesson, again — every chat auxiliary panel
     sets its own `display` unconditionally, so each needs this restated */
  .chatmeme[hidden], .chatgifbox[hidden], .chatReplyPreview[hidden], .chatPending[hidden] { display:none; }
  .imgoverlay { position:fixed; inset:0; z-index:70; background:rgba(6,7,8,.92); display:flex; align-items:center; justify-content:center;
                 padding:calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left)); }
  .imgoverlay[hidden] { display:none; } /* the house [hidden]-override lesson — an author rule always beats the UA [hidden]{display:none} */
  .imgoverlay img { max-width:100%; max-height:100%; border-radius:10px; }

  /* ---------------- record book (S6) + league-home collapsible cards (item 4) ----------------
     .collapsecard ( Recent moves /  League chat) is a DELIBERATELY SEPARATE class from
     .recordbook, even though the disclosure styling is identical — several existing tests
     select ".recordbook" specifically to reach the ACTUAL record book, and the two new cards
     render ABOVE it in DOM order, so sharing the class made document.querySelector(".recordbook")
     grab the wrong card. */
  .recordbook summary, .collapsecard summary { cursor:pointer; font:600 12px var(--font-display); color:var(--mut); text-transform:uppercase;
                         letter-spacing:2px; list-style:none; }
  .recordbook summary::-webkit-details-marker, .collapsecard summary::-webkit-details-marker { display:none; }
  .recordbook summary::before, .collapsecard summary::before { content:"▸ "; color:var(--accent); }
  .recordbook[open] summary::before, .collapsecard[open] summary::before { content:"▾ "; }
  .recordbook[open] summary, .collapsecard[open] summary { margin-bottom:10px; }
  .h2hline { text-align:center; margin-top:6px; }

  /* ---------------- playoff bracket (S7) ---------------- */
  .champbanner { text-align:center; padding:18px; margin-bottom:12px; border-radius:var(--radius-card);
                 background:linear-gradient(135deg,var(--gold),#8a6110); color:var(--bg); font:800 16px var(--font-display);
                 letter-spacing:.5px; text-transform:uppercase; }
  .toiletbanner { text-align:center; padding:10px; margin-bottom:12px; border-radius:var(--radius-sm);
                  border:1px dashed var(--accent); color:var(--accent); font-size:13px; }
  .bracketrounds { display:flex; flex-direction:column; gap:16px; }
  .bracketcol { min-width:0; }
  .byerow { padding:8px 10px; margin-bottom:6px; border:1px dashed var(--border-card); border-radius:var(--radius-sm); color:var(--mut); font-size:13px; }
  .bgame { display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--border-card);
           border-radius:var(--radius-sm); margin-bottom:8px; padding:10px 12px;
           text-transform:none; letter-spacing:normal; }
  .bgame:not([disabled]):hover { border-color:var(--border-hover); }
  .bgame[disabled] { cursor:default; opacity:.82; }
  .bgame .bside { display:flex; justify-content:space-between; gap:10px; font:500 13.5px var(--font-body); padding:2px 0; }
  .bgame .bside .mut { font-family:var(--font-display); font-weight:700; }
  .bgame .bside.winner { font-weight:800; color:var(--green); }
  @media (min-width:900px) {
    .bracketrounds { flex-direction:row; align-items:flex-start; }
    .bracketcol { flex:1 1 0; }
  }

  /* ---------------- scores tab (item 2, playtest batch 2 — ESPN-scoreboard-style day-grouped
     cards, replacing the old plain gmrow list; card grid goes 2-up at ≥1024px below) ---------------- */
  .scoreday { margin-bottom:14px; }
  .scoreday h2 { margin-bottom:6px; }
  .scgrid { display:grid; grid-template-columns:1fr; gap:8px; }
  .sccard { background:var(--card); border:1px solid var(--border-card); border-radius:var(--radius-sm); padding:10px 12px; }
  .sccard.live { border-color:var(--accent); }
  .scnet { font:600 10.5px var(--font-display); letter-spacing:.5px; text-transform:uppercase; color:var(--mut); }
  .scstate { font:600 11.5px var(--font-display); letter-spacing:.5px; text-transform:uppercase; color:var(--mut); }
  .scstate.live { color:var(--accent); }
  .scteams { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:4px; font:600 15px var(--font-display); }
  .scteam { display:flex; align-items:center; gap:8px; }
  /* Item 4 (2026-08-09): the NFL crest beside each abbrev. FIXED width/height (matching the
     img element's own width/height attributes) so the row's height is decided before the image
     arrives — a slow, missing or failed logo can never shift the score beside it. */
  .sclogo { width:22px; height:22px; flex:0 0 auto; object-fit:contain; }
  .scpts { font-weight:800; font-variant-numeric:tabular-nums; }
  .scspread, .scmine { margin-top:4px; }
  .ffrow { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .ffside { display:flex; flex-direction:column; gap:1px; min-width:0; }
  .ffside.mut { flex-direction:row; }
  .ffpts { font:700 15px var(--font-display); font-variant-numeric:tabular-nums; }
  @media (min-width:1024px) { .scgrid { grid-template-columns:1fr 1fr; } }
  /* Item 28 (2026-08-09): the score card is a <button> now (it opens the game view). The base
     `button` rule's uppercase + letter-spacing must be cancelled exactly the way .mucard
     cancels them, or the kickoff times and "at" separator come out shouty and mis-spaced. */
  .sccard { width:100%; text-align:left; cursor:pointer; font:inherit;
            text-transform:none; letter-spacing:normal;
            /* PRE-EXISTING, found by reading the review plate's pixels (measured: the live
               card's abbrevs and scores rendered rgb(213,10,10), the upcoming card's the
               correct rgb(233,237,244)). The generic `.live { color:var(--accent) }` rule far
               above matches `.sccard.live` and cascades red into every descendant that sets no
               colour of its own — so a live game's team abbrevs and scores have been red since
               the card shipped, which contradicts the batch-AG rule that red means live-clock
               and injury and nothing else. `.scstate.live` (two classes) still wins for the
               state chip, which is the one thing that SHOULD be red. */
            color:var(--ink); }
  .sccard:hover, .sccard:focus-visible { border-color:var(--border-hover); background:var(--row-hover2); }
  .sccard.live:hover, .sccard.live:focus-visible { border-color:var(--accent); }
  .sccard:disabled { cursor:default; }

  /* ---------------- item 28 — the NFL game view (field · play-by-play · box scores) ----------------
     The STRUCTURE is ported from sports.html (same payload, same field maths); the DRESS is
     this app's own tokens, because sports.html lives in the cream main-Bucky shell and the
     GFFL is broadcast-dark. --turf/--turf-2/--chalk are scoped to the field container rather
     than :root — nothing else in the league is a football pitch. */
  .nflbar { margin-bottom:10px; }
  .nflback { background:var(--nested); }
  .nfllivechip { font:700 11px var(--font-display); letter-spacing:1px; text-transform:uppercase; color:var(--accent); }
  .seclabel { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px;
              font:700 12px var(--font-display); letter-spacing:1px; text-transform:uppercase; }
  .seclabel .mut { text-transform:none; letter-spacing:normal; font-family:var(--font-body); }
  /* Header: crest+abbrev on the outer edges, the two scores facing each other across the
     status column — the same arrangement the matchup header uses, so the two read as one app. */
  .nflhead { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .nflside { display:flex; align-items:center; gap:7px; min-width:0; }
  .nflcrest { width:26px; height:26px; flex:0 0 auto; object-fit:contain; }
  .nflab { font:700 15px var(--font-display); letter-spacing:.5px; display:inline-flex; align-items:center; gap:5px; }
  .nflposs { width:7px; height:7px; border-radius:50%; background:var(--gold); display:inline-block; }
  .nflscores { display:flex; align-items:center; gap:10px; flex:0 0 auto; }
  .nflbig { font:800 26px/1 var(--font-display); font-variant-numeric:tabular-nums; }
  .nflbig.losing { color:var(--mut); }
  .nflmid { display:flex; flex-direction:column; align-items:center; gap:1px; min-width:66px; }
  .nflq { font:700 11.5px var(--font-display); letter-spacing:.6px; text-transform:uppercase; color:var(--accent); }
  .nflq.done { color:var(--mut); }
  table.nflline { margin-top:10px; font-size:12.5px; text-align:center; }
  table.nflline td, table.nflline th { text-align:center; padding:3px 6px; }
  /* The team column is a label, not a number — centring it left it floating in the middle of a
     wide desktop row (seen on the plate). */
  table.nflline td:first-child, table.nflline th:first-child { text-align:left; width:22%; }
  table.nflline .nfltot { font-weight:800; }
  .nflkick > div { padding:2px 0; }
  .nflkick .mut { display:inline-block; min-width:56px; font-size:12px; }
  /* The field. A 1000x300 viewBox scaled to the card's width — at 390px that is ~106px tall,
     which is enough for the ball, the two lines and the yard numbers to all read. */
  .nflfield { --turf:#1c3b28; --turf-2:#21462f; --chalk:#dfe7f2; padding:10px 12px 12px; }
  .nfldiag { display:block; width:100%; height:auto; border-radius:var(--radius-xs); }
  .nflsitu { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .nflsitu b { font:700 14px var(--font-display); letter-spacing:.5px; color:var(--gold); }
  .nfllast { margin-top:6px; padding-top:6px; border-top:1px solid var(--divider2); font-size:13px; }
  .nfltag { display:inline-block; min-width:34px; text-align:center; padding:1px 5px; border-radius:var(--radius-badge);
            font:700 10.5px var(--font-display); letter-spacing:.5px; color:#fff; }
  /* Play-by-play. The current drive is capped and scrolls inside its own box so a long drive
     can't push the box score off the bottom of the page. */
  .nflplays { max-height:280px; overflow-y:auto; overscroll-behavior:contain; }
  .nflplay { display:grid; grid-template-columns:52px 1fr auto; gap:8px; align-items:baseline;
             padding:6px 0; border-top:1px solid var(--divider2); font-size:13px; }
  .nflplay:first-child { border-top:none; }
  .nflplay.score { background:rgba(255,182,18,.07); }
  .nfldd { font:700 10.5px var(--font-display); letter-spacing:.4px; color:var(--mut); text-transform:uppercase; }
  .nfltext { min-width:0; }
  .nfldrv { display:grid; grid-template-columns:auto auto 1fr; gap:8px; align-items:baseline;
            padding:6px 0; border-top:1px solid var(--divider2); font-size:13px; }
  .nfldrv:first-of-type { border-top:none; }
  .nflres { font:700 11.5px var(--font-display); letter-spacing:.5px; text-transform:uppercase; color:var(--ink2); }
  .nflres.scored { color:var(--gold); }
  .nflwp { display:flex; align-items:center; gap:12px; }
  .nflwp svg { flex:1 1 auto; height:56px; min-width:0; }
  .nflwpv { flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; }
  .nflwpv b { font:700 15px var(--font-display); }
  .nflsplit { border-top:1px solid var(--divider); margin:12px 0; }
  .nflsb { margin:8px 0; }
  .nflsbl { display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:12.5px; }
  .nflsbl b { font-variant-numeric:tabular-nums; }
  .nflsbt { display:flex; height:6px; border-radius:var(--radius-pill); overflow:hidden; background:var(--border-card); margin-top:3px; }
  .nflsbt i, .nflsbt em { display:block; height:100%; }
  .nflboxt { font:700 11px var(--font-display); letter-spacing:1px; text-transform:uppercase; color:var(--mut); margin:10px 0 4px; }
  table.nflbox { font-size:12.5px; min-width:340px; }
  table.nflbox th, table.nflbox td { padding:4px 8px; white-space:nowrap; }
  .nflsc { display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:baseline;
           padding:6px 0; border-top:1px solid var(--divider2); font-size:13px; }
  .nflsc:first-of-type { border-top:none; }
  .nflafter { font-variant-numeric:tabular-nums; }
  @media (max-width:420px) {
    .nflbig { font-size:22px; }
    .nflcrest { width:22px; height:22px; }
    .nflscores { gap:6px; }
    .nflmid { min-width:56px; }
  }
  /* Desktop: the game view is a READING COLUMN, not a full-bleed page. Reviewed at 1440px and
     fixed — unconstrained, the 1000x300 field scaled to 1126px wide and stood 338px tall (it
     ate the screen), the header's two scores sat marooned in the middle of a 1150px row with
     the team names pinned to the far edges, and the linescore's four quarters were spaced a
     handspan apart. One max-width on the body fixes all three at once, and the field's own
     aspect ratio then caps its height at ~216px. */
  @media (min-width:1024px) {
    .nflbar, #nflBody { max-width:720px; margin-left:auto; margin-right:auto; }
    .nflplay { grid-template-columns:66px 1fr auto; }
  }

  /* ---------------- lockers ---------------- */
  /* Item 10 (2026-08-09 playtest: "need to shrink the team name card in half"). MEASURED at
     390px: 182px tall for a logo, a name, a motto and a record. Everything it carried stays —
     colour, crest, name, record, motto — at about half the scale: 8px padding instead of 16,
     a 38px logo instead of 64, a 17px name instead of 24, and the owner's edit buttons on a
     tighter row. */
  /* S3 THE HERO — FABLE DESIGN PASS (2026-08-10). The first cut stacked three translucent
     layers (the logo blurred 22px, a primary→secondary gradient, a darkening wash) and the
