<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The GFFL — Goat Fantasy Football League</title>
<meta name="description" content="The Goat Fantasy Football League — fast, clean, ours.">
<meta name="theme-color" content="#0c1017">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============ The GFFL design tokens ============
     Item 9 (playtest batch 2, 2026-08-08): retheme'd to match ffdraft.html's aesthetic —
     the family's own draft-day tool. ffdraft is a deep-navy broadcast-dark NFL theme (not
     the old Gridiron black/red): --bg is a cold near-black navy (#0c1017, NOT true black),
     cards float on it a shade lighter with a cool blue-grey line/border color, Barlow
     Condensed still carries display type (headings/scores/tabs — unchanged, both apps
     already shared it), but body copy moves off Public Sans onto Inter (ffdraft's body
     font — a hair more geometric/neutral than Public Sans). Signature accents: a hot red
     (#d50a0a, brighter/more saturated than the old #D0454C brick-red), a deep NFL navy
     (#013369) used for "selected/active" chip fills and info badges — not just a wordmark
     color — and a warm gold (#ffb612) for standout/highlight moments (a step brighter and
     warmer than the old muted #C98F1B). Position-color tokens (--pos-QB/RB/WR/TE/K/DST/X)
     are NEW — lifted straight from ffdraft's draft-board cell palette — used to tint the
     Free Agents table's position badges (added this batch) the same way ffdraft's board
     tints its player cells. TOKEN NAMES are unchanged from before (every component rule
     below still just reads var(--bg)/var(--card)/var(--accent)/etc.) — only the VALUES
     assigned to them moved, per the retheme brief ("swap the token layer, keep every
     structural/layout improvement"). Fonts degrade to system stacks when the Google Fonts
     request is blocked/offline (the family app must never depend on reaching
     fonts.googleapis.com). */
  :root {
    --bg:#0c1017; --bg-page:#070a0f; --tabbar:#0d1320; --band:#101724;
    --card:#151b26; --nested:#1a2231; --nested2:#0e131d;
    --border-card:#263043; --divider:#263043; --divider2:#1c2534; --border-hover:#3a4558;
    --ink:#e9edf4; --ink2:#c3cbdb; --mut:#8a94a7; --faint:#5b6579;
    --accent:#d50a0a; --green:#2e8659; --gold:#ffb612; --blue:#013369;
    --row-hover:#121722; --row-hover2:#171f2c;
    --pos-QB:#a03449; --pos-RB:#2e8659; --pos-WR:#3a72b5; --pos-TE:#c07c2b;
    --pos-K:#7b5ea7; --pos-DST:#6b6154; --pos-X:#454c5c;
    --radius-card:10px; --radius-sm:7px; --radius-xs:6px; --radius-badge:4px; --radius-pill:16px;
    --font-display:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,system-ui,sans-serif;
    --font-body:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  html { background:var(--bg-page); }
  body { background:var(--bg); color:var(--ink); font:15px/1.45 var(--font-body);
         padding-bottom:calc(64px + env(safe-area-inset-bottom)); }
  h1, h2, h3 { font-family:var(--font-display); }
  /* the ffdraft "broadcast" signature: a hairline accent rule along the very top edge of
     chrome, ahead of everything else on the page (ffdraft's own header carries the same
     3px accent top-border). box-sizing:border-box (above) keeps the header's own declared
     height whole — the border eats into content padding, not layout height. */
  header { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:16px;
           padding:0 14px; height:52px; background:var(--tabbar); backdrop-filter:blur(8px);
           border-top:3px solid var(--accent); border-bottom:1px solid var(--border-card); }
  header .wordmark { font:700 20px/1 var(--font-display); letter-spacing:1.2px; text-transform:uppercase; white-space:nowrap; }
  header .wordmark .accentword { color:var(--accent); }
  header .sub { display:none; color:var(--mut); font-size:11px; }
  header .hmeta { display:none; align-items:center; gap:10px; margin-left:auto; }
  header .hmeta[hidden] { display:none; } /* the house [hidden]-override lesson — restate it, an author rule always beats the UA one */
  #hWeekYear { font:600 12px var(--font-display); letter-spacing:1px; text-transform:uppercase; color:var(--mut); white-space:nowrap; }
  #hAvatar { width:32px; height:32px; border-radius:50%; flex:0 0 auto; overflow:hidden; cursor:pointer;
             background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center;
             font:700 13px var(--font-display); }
  #hAvatar[hidden] { display:none; }
  #hAvatar img { width:100%; height:100%; object-fit:cover; display:block; }
  main { max-width:860px; margin:0 auto; padding:12px; }
  .card { background:var(--card); border:1px solid var(--border-card); border-radius:var(--radius-card); padding:16px; margin-bottom:12px; }
  .card.center { text-align:center; }
  h1 { margin:6px 0; font:700 26px var(--font-display); letter-spacing:1px; text-transform:uppercase; }
  h2 { font:600 12px var(--font-display); margin:0 0 10px; color:var(--mut); text-transform:uppercase; letter-spacing:2px; }
  .mut { color:var(--mut); } .small { font-size:12px; }
  .bad { color:var(--accent); } .ok { color:var(--green); } .warn { color:var(--gold); }
  .logo { font-size:52px; }
  /* Plain low-specificity base — every "row card" button below (.mucard/.lrow/
     .swaprow/.teamrow/.bgame etc.) already redeclares background/border/padding
     with a more specific selector, which is all a single class needs to win over
     a bare `button` rule. (A `:not(...)` exclusion chain was tried first and
     rejected — each `:not(.x)` clause counts as a class for specificity, so a
     chain of eight of them outranks `.mucard`/`.bnav button`/etc. outright and
     silently un-does their overrides — a real trap, not a style nit.) */
  button {
    background:var(--nested); color:var(--ink); border:1px solid var(--border-card); border-radius:var(--radius-sm);
    padding:8px 14px; font:600 12.5px var(--font-display); letter-spacing:1px; text-transform:uppercase; cursor:pointer;
    transition:border-color .15s,background .15s;
  }
  button:hover { border-color:var(--border-hover); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  button.primary:hover { opacity:.88; border-color:var(--accent); }
  input, select { background:var(--nested2); color:var(--ink); border:1px solid var(--border-card); border-radius:var(--radius-sm);
          padding:9px 10px; font:15px var(--font-body); }
  input:focus, select:focus { outline:none; border-color:var(--border-hover); }
  select { color-scheme:dark; } /* keeps the native option-list dropdown dark too, not just the closed control */
  .card.center input { display:block; margin:14px auto; width:min(90%,280px); text-align:center; }
  .rowline { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .panner { overflow-x:auto; }
  table.tbl { border-collapse:collapse; width:100%; font-size:13.5px; }
  .tbl th, .tbl td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--divider); white-space:nowrap; font-family:var(--font-body); }
  .tbl th { color:var(--faint); font:600 10.5px var(--font-display); text-transform:uppercase; letter-spacing:1px; padding-bottom:6px; }
  .tbl td.num, .tbl th.num { text-align:right; }
  .tbl td.num { font:700 14px var(--font-display); font-variant-numeric:tabular-nums; }
  .tbl tbody tr:hover { background:var(--row-hover); }
  .tlogo { width:20px; height:20px; border-radius:50%; vertical-align:-4px; margin-right:6px; object-fit:cover; }
  .health { font:600 11px var(--font-display); letter-spacing:.8px; text-transform:uppercase; padding:3px 10px; border-radius:var(--radius-pill); border:1px solid var(--border-card); }
  .health.ok { color:var(--accent); border-color:var(--border-card); background:var(--nested); }
  .health.warn { color:var(--bg); background:var(--gold); border-color:var(--gold); font-weight:700; }
  .health.bad { color:#fff; background:var(--accent); border-color:var(--accent); font-weight:700; }

  /* ---------------- free agents (item 1) — browsable table + position chips ----------------
     .poschip mirrors ffdraft's own .chips button language (outlined pill, filled navy when
     .on); .posbadge borrows ffdraft's per-position board-cell palette (--pos-QB/RB/WR/TE/K/
     DST/X) as a small colored tag instead of a whole tinted cell — right-sized for a table
     row. .rzdot/.conflictflag are item-10's "emoji becomes a CSS affordance" pieces: a red-
     zone indicator that used to be a 🔴 emoji is now a plain pulsing dot, and a "sources
     disagree" flag that used to be ⚠ is now a small bordered text chip. */
  .poschips { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:10px; }
  .poschip { background:transparent; border:1px solid var(--border-card); color:var(--mut);
             border-radius:var(--radius-xs); padding:5px 12px; font:600 12.5px var(--font-display);
             letter-spacing:.8px; }
  .poschip.on { background:var(--blue); border-color:var(--blue); color:#fff; }
  /* ESPN-style sortable stats table (2026-08-08 rework) — PLAYER · TYPE · OPP · STATUS · PROJ
     · SCORE · FPTS · AVG · LAST, every header a sort control (.thsort), + a trailing
     unlabeled MOVE-button column. .faname is sticky-left so it stays in view while the rest
     of the row pans inside .panner on a phone — cheap since the table already lives in an
     overflow-x:auto container. */
  table.faTable tbody tr { cursor:pointer; }
  table.faTable .faname { width:150px; min-width:150px; position:sticky; left:0; background:var(--card); z-index:1; }
  table.faTable .faname b { font-family:var(--font-body); font-weight:600; }
  table.faTable .fatype, table.faTable .faopp, table.faTable .fastatus { min-width:64px; }
  table.faTable .faproj, table.faTable .fascore, table.faTable .fafpts, table.faTable .faavg, table.faTable .falast { min-width:56px; }
  table.faTable .faadd { text-align:right; min-width:64px; }
  table.faTable thead th:first-child { position:sticky; left:0; background:var(--card); z-index:3; }
  .faAddBtn { padding:6px 12px; font-size:11.5px; }
  .tbl th.thsort { cursor:pointer; user-select:none; }
  .tbl th.thsort:hover { color:var(--ink2); }
  .tbl th.thsort.active { color:var(--accent); }
  .tbl th .sortarrow { font-size:9px; margin-left:2px; }
  .posbadge { display:inline-block; min-width:30px; text-align:center; border-radius:var(--radius-badge);
              color:#fff; font:700 10.5px var(--font-display); letter-spacing:.5px; padding:2px 6px; }
  .posbadge[data-pos="QB"] { background:var(--pos-QB); }
  .posbadge[data-pos="RB"] { background:var(--pos-RB); }
  .posbadge[data-pos="WR"] { background:var(--pos-WR); }
  .posbadge[data-pos="TE"] { background:var(--pos-TE); }
  .posbadge[data-pos="K"] { background:var(--pos-K); }
  .posbadge[data-pos="DST"] { background:var(--pos-DST); }
  .posbadge:not([data-pos="QB"]):not([data-pos="RB"]):not([data-pos="WR"]):not([data-pos="TE"]):not([data-pos="K"]):not([data-pos="DST"]) { background:var(--pos-X); }
  .rzdot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent);
           margin-right:5px; vertical-align:1px; animation:rzpulse 1.3s infinite; }
  @keyframes rzpulse { 50% { opacity:.4; } }
  .conflictflag { display:inline-block; border:1px solid #5b4a17; color:var(--gold); background:#1c1608;
                  border-radius:var(--radius-xs); font:700 9.5px var(--font-display); letter-spacing:.6px;
                  padding:1px 6px; margin-left:5px; }

  /* ---------------- matchup cards on league home ---------------- */
  /* Polish pass (2026-08-08): 140px let TWO cards land side by side at both 390px (main's
     content width) and inside a desktop masonry column (~450px) — real team names ("Waffle
     House Warriors") were truncating down to a single letter + ellipsis in that width, on
     BOTH mobile and desktop. 260px is picked from the actual card contents at this font size
     (name column + the auto score column + the other name column) rather than guessed —
     it's the point past which .muteam stops needing to ellipsize the longest real team name
     in a week-15-style compact card. Below it, cards stack one per row; a genuinely wide
     container (≥560px of its own) still lets two sit side by side. */
  .mugrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:10px; margin-bottom:2px; }
  .mucard { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px;
            width:100%; text-align:left; background:var(--card); border:1px solid var(--border-card);
            border-radius:var(--radius-sm); padding:10px 12px; cursor:pointer;
            text-transform:none; letter-spacing:normal; } /* button's own uppercase must not inherit onto natural-case team names */
  .mucard:hover, .mucard:focus-visible { border-color:var(--border-hover); background:var(--row-hover2); }
  /* The hero ("mine") card can't keep the compact card's 3-column [name|score|name]
     layout at its bigger type scale — a 32px combined "4.0 — 41.0" string in the middle
     "auto" column leaves too little room either side and forces team names into an
     ugly wrap-or-truncate fight. Reflowed into its own row-based grid instead: names
     on row 1 (one per side, plenty of width each), the score centered full-width on
     row 2, badge/win-prob full-width on row 3 — .muteam/.muscore keep their required
     class names and text (data/tests are unaffected), only their grid placement differs
     under .mine. */
  .mucard.mine { grid-column:1 / -1; order:-1; grid-template-columns:1fr 1fr; grid-template-rows:auto auto auto;
                 gap:4px 10px; border-color:var(--accent); border-radius:var(--radius-card);
                 padding:16px; background:var(--card); }
  .muteam { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:600 13px var(--font-display); letter-spacing:.3px; }
  .muteam.right { text-align:right; }
  .mucard.mine .muteam { grid-row:1; font-size:14px; }
  .muscore { font:700 16px var(--font-display); font-variant-numeric:tabular-nums; }
  .mucard.mine .muscore { grid-row:2; grid-column:1 / -1; text-align:center; font-size:32px; }
  .herorow { grid-column:1 / -1; grid-row:3; display:flex; align-items:center; gap:12px; margin-top:2px; }
  .herobadge { display:inline-flex; align-items:center; gap:6px; font:600 11px var(--font-display); letter-spacing:1px;
               text-transform:uppercase; color:var(--faint); flex:0 0 auto; }
  .herobadge.live { color:var(--accent); }
  .herobadge .dot { width:6px; height:6px; border-radius:50%; background:var(--accent); }
  .wpbar.mini { flex:1 1 auto; height:5px; }
  .wpfillmini { height:100%; background:var(--accent); display:block; }

  /* ---------------- matchup page ---------------- */
  /* Item 6 (2026-08-09 playtest: "slim down the matchup card at the top by half so you can see
     more players below"). MEASURED at 390px: the header card was 220px tall — a third of the
     phone's viewport spent on two team names before a single lineup row. Halved by consolidating
     rather than deleting: Proj and the to-play/live counts now share ONE line (they were two),
     the avatar drops 44->28px, the score 30->22px, and the card takes 10px of padding instead of
     16. Everything the header carried is still on it — including the win-probability bar and the
     live/Final indicator, which are the two things that must not go. */
  .card.muhead { padding:10px 12px; }
  .muhrow { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:start; }
  .muhteam { min-width:0; display:flex; flex-direction:column; gap:1px; }
  .muhteam.right { text-align:right; align-items:flex-end; }
  .muavatar { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
              font:700 11px var(--font-display); background:var(--border-card); color:var(--mut); overflow:hidden;
              margin-bottom:1px; }
  .muavatar.mine { background:var(--accent); color:#fff; }
  .muavatar img { width:100%; height:100%; object-fit:cover; display:block; }
  .bigpts { font:800 22px/1.1 var(--font-display); font-variant-numeric:tabular-nums; }
  /* The three vertical rows the header used to spend on each side (avatar / name / score /
     Proj / to-play) are folded into three: crest BESIDE the name, projection BESIDE the score,
     and the to-play·live count on its own short line. Nothing is dropped — it costs half the
     height because it stops stacking things that fit side by side. */
  .muhtop { display:flex; align-items:center; gap:6px; min-width:0; width:100%; }
  .muhteam.right .muhtop { flex-direction:row-reverse; }
  .muhscore { display:flex; align-items:baseline; gap:6px; min-width:0; }
  .muhteam.right .muhscore { flex-direction:row-reverse; }
  .muhead .muhteam b { flex:1 1 auto; min-width:0; font-size:13px; line-height:1.2;
                       white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .muhead .muhproj { font:600 10.5px var(--font-display); letter-spacing:.3px; white-space:nowrap; }
  .muhead .muhsub { font-size:10.5px; line-height:1.3; white-space:nowrap; }
  .muhead .h2hline { margin-top:3px; }
  .muhmid { text-align:center; min-width:84px; padding-top:2px; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .mulive { display:flex; align-items:center; gap:6px; font:600 12px var(--font-display); letter-spacing:1px; color:var(--accent); text-transform:uppercase; }
  .mulive .dot { width:6px; height:6px; border-radius:50%; background:var(--accent); }
  .mulive.done { color:var(--mut); }
  .wpbar { height:5px; border-radius:var(--radius-pill); background:var(--border-card); overflow:hidden; margin:2px 0; width:100%; }
  .wpfill { height:100%; background:var(--accent); display:block; }
  /* table-layout:fixed + an explicit white-space:normal override are both required here:
     .tbl td (shared with the standings tables, which DO want single-line rows) sets
     white-space:nowrap, which — under the default table-layout:auto — let a long player
     name/meta string force this column wider than its declared share and shove the slot
     badge + opposing player off the right edge of a 390px phone. Locking the layout AND
     letting this table's own cells wrap keeps every row inside the card at any width. */
  table.mutable { table-layout:fixed; }
  table.mutable td { vertical-align:middle; white-space:normal; }
  /* td.slotcell, not .slotcell — .tbl td's text-align:left otherwise outweighs it and the
     slot badge has rendered left-of-center since the day it shipped. */
  /* The colour lives on a compact centred BADGE, not on the cell. Painting the whole cell
     (the first cut) turns a 12%-wide column into a full-row-height block of saturated colour —
     on desktop that is a ~75px slab per row, which shouts over the players either side of it.
     A badge reads the same information at a glance and matches the .posbadge language the
     players table already uses. */
  td.slotcell { color:var(--mut); font:600 11px var(--font-display); letter-spacing:.5px; text-align:center; width:12%;
              background:none; padding:3px 4px; }
  td.slotcell .slotbadge { display:block; background:var(--nested); border-radius:var(--radius-badge); padding:5px 0; }
  /* Item 2 (2026-08-09 playtest: "the player position indicator between the two teams should be
     color coded the same as the way positions are colored in the draft"). Same --pos-* tokens
     the players table's .posbadge already tints with — lifted from ffdraft's board palette, so
     a QB reads the same colour in the draft room and in the matchup. td.slotcell[data-pos]
     (0,2,1) outranks the plain td.slotcell rule above (0,1,1), which is what lets it replace
     the neutral --nested background. FLEX/BENCH/TOT/IR carry data-pos="X" — they are not a
     single position, and --pos-X is the neutral the badge already uses for that same case. */
  td.slotcell[data-pos="QB"] .slotbadge { background:var(--pos-QB); color:#fff; }
  td.slotcell[data-pos="RB"] .slotbadge { background:var(--pos-RB); color:#fff; }
  td.slotcell[data-pos="WR"] .slotbadge { background:var(--pos-WR); color:#fff; }
  td.slotcell[data-pos="TE"] .slotbadge { background:var(--pos-TE); color:#fff; }
  td.slotcell[data-pos="K"]  .slotbadge { background:var(--pos-K);  color:#fff; }
  td.slotcell[data-pos="DST"] .slotbadge { background:var(--pos-DST);color:#fff; }
  td.slotcell[data-pos="X"]  .slotbadge { background:var(--pos-X);  color:var(--ink2); }
  /* height:1px is the standard "let a child use height:100%" cell trick — a table cell always
     grows to its own content, but declaring a height gives the percentage below something
     definite to resolve against (with auto height it resolves to auto and silently does
     nothing, which is exactly what happened on the first attempt). */
  .pcell { width:44%; height:1px; } .pcell.right { text-align:right; }
  /* THE ESPN HEAD-TO-HEAD ROW (2026-08-08 playtest: "the left team's players don't line up
     with the right team's"). The .pcellgrid markup was built as a mirrored two-part cell —
     name+meta on the OUTER edge, a fixed-width points column on the INNER edge hugging the
     slot badge — but shipped with NO layout rule at all (the .scgrid family of bug), so both
     halves stacked their two divs in raw DOM order: the left half read name→points top to
     bottom while the right half read points→name, and nothing across the row lined up.
     Flex row restores the design: .pinfo takes the slack, .ppts is a fixed column whose
     numbers align toward the slot badge on BOTH sides (mirrored, per the ESPN reference). */
  /* height:100% keeps the two halves of a row the SAME height even when one wraps further
     than the other. It mattered the moment the bench table joined table-layout:fixed +
     white-space:normal (item 3): under the old nowrap bench both halves were always exactly
     two lines by accident, and a wrapping player name beside an "Empty" placeholder would
     otherwise render two visibly different boxes inside one aligned row. */
  .pcellgrid { display:flex; align-items:center; gap:10px; height:100%; }
  .pcellgrid .pinfo { flex:1 1 auto; min-width:0; }
  .pcellgrid .pinfo b { font:600 13.5px/1.3 var(--font-body); }
  .pcellgrid .pinfo small { font-size:11px; line-height:1.35; }
  .pcellgrid .pinfo .pstatline { display:block; }
  .pcellgrid .ppts { flex:0 0 56px; font-variant-numeric:tabular-nums; text-align:right; }
  /* Per the ESPN reference only the column ORDER mirrors (points always on the inner edge):
     text stays left-aligned on BOTH sides, so the right team's names all start at one
     consistent x right after their points column — not ragged-right. */
  .pcellgrid.right .pinfo { text-align:left; }
  .pcellgrid.right .ppts { text-align:left; }
  .pcell.right { text-align:left; }
  .pcellgrid .ppts .pts { font:700 15px var(--font-display); }
  .pcellgrid .ppts small { display:block; font-size:10.5px; line-height:1.3; }
  .totalrow .ppts .pts { font-size:17px; }
  /* Phone: the fixed points column + slot badge leave ~90px per name at 390px — tighten the
     row's fixed costs so names/stat lines keep a readable share instead of wrapping 4-deep. */
  @media (max-width:560px) {
    .pcellgrid { gap:6px; }
    .pcellgrid .ppts { flex-basis:42px; }
    .pcellgrid .pinfo b { font-size:12.5px; }
    .pcellgrid .pinfo small { font-size:10px; }
    .pcellgrid .ppts .pts { font-size:14px; }
    .pcellgrid .ppts small { font-size:9.5px; }
    td.slotcell { font-size:10px; }
  }
  .pts { font:700 14px var(--font-display); display:block; }
  .live { color:var(--accent); font-weight:700; }
  /* Item 5 (2026-08-09 playtest: "highlight players when their team has the ball and is on
     offense"). GOLD, not red: --accent is already spoken for by the live clock and the
     red-zone dot, and a second red marker beside them would fight both. A pip plus a very
     faint row tint — enough to sweep the lineup and see who is on the field with the ball,
     never enough to shout over a score. */
  .possdot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--gold);
             margin-left:5px; vertical-align:1px; box-shadow:0 0 0 2px rgba(255,182,18,.16); }
  .pcellgrid.hasball { background:rgba(255,182,18,.09); border-radius:var(--radius-badge); }
  .lrow.hasball { background:rgba(255,182,18,.07); border-color:rgba(255,182,18,.45); }
  .fline { padding:6px 0; border-bottom:1px dotted var(--divider2); font-size:13.5px; }
  .fline.sys { color:var(--mut); }
  .delta { font:700 13px var(--font-display); font-variant-numeric:tabular-nums; }
  .delta.up { color:var(--green); } .delta.down { color:var(--accent); }
  /* ---- the matchup feed (item 1, 2026-08-09) ----
     A bounded scroll box so the feed can't push the AI read and the trash-talk thread miles
     down the page, with overscroll-behavior:contain so a rubber-band drag at its own edge
     stops there instead of chaining to the document (the house convention). Each line carries
     its team's short tag AND a matching left accent — the tag is what actually answers "which
     team is this from"; the accent alone would only say "one of the two". */
  #mufeed { max-height:300px; overflow-y:auto; overscroll-behavior:contain; }
  @media (min-width:1024px) { #mufeed { max-height:420px; } }
  .feedfilter { margin-bottom:8px; }
  .fteam { display:inline-block; min-width:30px; text-align:center; border:1px solid var(--border-card);
           border-radius:var(--radius-badge); background:var(--nested); color:var(--ink2);
           font:700 10px var(--font-display); letter-spacing:.5px; padding:1px 5px; margin-right:6px; }
  .fteam.away { border-color:#2a4f80; background:rgba(1,51,105,.55); color:#cfe0ff; }
  .fteam.home { border-color:#7a2020; background:rgba(213,10,10,.20); color:#ffd2d2; }
  .fline.away { border-left:3px solid #2a4f80; padding-left:7px; }
  .fline.home { border-left:3px solid #7a2020; padding-left:7px; }

  /* ---------------- team / roster page ---------------- */
  .lrow { display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:var(--card);
          border:1px solid var(--border-card); border-radius:var(--radius-sm); margin-bottom:6px; padding:10px 12px;
          text-transform:none; letter-spacing:normal; }
  .lrow:hover { border-color:var(--border-hover); background:var(--row-hover2); }
  .lrow.locked { opacity:.72; }
  .slotchip { flex:0 0 52px; text-align:center; font:600 11px var(--font-display); letter-spacing:.5px; color:var(--mut);
              background:var(--nested); border:1px solid var(--border-card); border-radius:var(--radius-badge); padding:4px 0; }
  .lname { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; font-family:var(--font-body); }
  .lpts { font:700 14px var(--font-display); white-space:nowrap; }
  .inj { color:#ef6a4d; font-weight:700; font-size:10.5px; letter-spacing:.3px; text-transform:uppercase; } /* ffdraft's own literal injury coral — distinct from --accent and --gold */
  .sheet { position:fixed; inset:auto 0 0 0; z-index:40; padding:10px; background:rgba(6,7,8,.7); backdrop-filter:blur(3px); }
  .sheet .card { max-height:60vh; overflow-y:auto; box-shadow:0 -8px 30px rgba(0,0,0,.55); }
  .swaprow { display:flex; justify-content:space-between; gap:10px; width:100%; text-align:left; background:var(--card);
             border:1px solid var(--border-card); border-radius:var(--radius-sm); margin-bottom:6px; padding:11px 12px;
             text-transform:none; letter-spacing:normal; }
  .swaprow:hover { border-color:var(--border-hover); background:var(--row-hover2); }
  .swaprow.picked { border-color:var(--accent); background:var(--nested); }
  /* ---- item 12 (2026-08-09): the Moves player list is a bounded box, not the whole page ----
     The table already pans HORIZONTALLY inside .panner with its PLAYER column sticky-left; the
     vertical cap is added to that SAME container rather than a wrapper around it, because a
     position:sticky cell only sticks to the scrollport it actually lives in — wrapping the
     panner in a second scroller would leave the sticky column pinned to the wrong box and it
     would drift out of view on a horizontal pan. The header row gets top:0 for the same
     reason (it is now scrolling within its own container, so it needs to stick to it), and
     the top-left cell needs both axes plus the highest z-index of the three.
     "Show more ↓" is rendered AFTER the .panner, so it stays below the box and growing the
     pool can never blow the box's own height out. */
  #faResults .panner { max-height:340px; overflow:auto; overscroll-behavior:contain; }
  @media (min-width:1024px) { #faResults .panner { max-height:560px; } }
  table.faTable thead th { position:sticky; top:0; background:var(--card); z-index:1; }
  #mvGive, #mvGet { max-height:220px; overflow-y:auto; }
  /* ---- item 13 (2026-08-09): "My pending", compact ----
     Same information, roughly a third of the room: the card's own padding comes in, the
     sub-headings stop reserving a full text block each, rows tighten, and an empty state is
     one quiet line rather than a paragraph. The action buttons deliberately keep a 44px
     minimum — this is the one card where shrinking must not shrink a tap target. */
  .pendcard { padding:10px 12px; }
  .pendcard h2 { margin-bottom:4px; }
  .pendcard h2.small { margin:8px 0 2px; }
  /* The row's text and its action button share ONE line. .rowline wraps by default, and with
     a 44px button that meant every pending row cost two full lines (measured 76-94px each)
     for one sentence. nowrap + a shrinkable text column lets the sentence wrap INSIDE its own
     share instead, so the row is only ever as tall as the taller of the two. */
  .pendcard .rowline { padding:3px 0; font-size:12.5px; gap:8px; flex-wrap:nowrap; align-items:center; }
  .pendcard .rowline > span:first-child { flex:1 1 auto; min-width:0; }
  .pendcard .rowline > button { flex:0 0 auto; }
  /* DIRECT children only — the ACTION buttons (Cancel/Accept/Decline/Veto) are children of
     .rowline, while the player-name links (.pcinline) are inline text nested inside its
     <span>. A bare descendant selector here gives every name link a 44px box and triples the
     card's height, which is the opposite of the point. */
  .pendcard .rowline > button { min-height:44px; }
  .pendcard .fline { padding:4px 0; font-size:12.5px; }
  .pendcard .pendnone { margin:0; }
  #mvTradeTeam { width:100%; margin-bottom:8px; }
  #faSearch, #mvTradeNote { width:100%; margin:6px 0; }
  .teamrow { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--card);
             border:1px solid var(--border-card); border-radius:var(--radius-sm); margin-bottom:8px; padding:12px;
             text-transform:none; letter-spacing:normal; }
  .teamrow:hover { border-color:var(--border-hover); background:var(--row-hover2); }
  .teamrow img { width:34px; height:34px; border-radius:50%; object-fit:cover; }
  /* item 9 cleanup: this rule used to be scoped ".rv input.redit" — .rv never existed in the
     markup, so it never actually applied. Fixed to target .redit directly. */
  /* Polish pass (2026-08-08): 76px fit every NUMERIC rule field, but a few carry short STRING
     enums instead (keepers.waiverCost defaults to "last-round") — at 76px that value truncated
     to "last-roun", silently hiding the last character of an editable setting. 112px is sized
     off that actual longest value at this font, with a little headroom; every numeric field
     (1-4 digits) sits comfortably inside it too. */
  input.redit { width:112px; text-align:right; font-family:var(--font-display); font-weight:700; padding:4px 6px; }
  #toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(74px + env(safe-area-inset-bottom));
           background:var(--nested); border:1px solid var(--border-hover); border-left:3px solid var(--accent);
           border-radius:var(--radius-sm); padding:10px 16px; font:13px var(--font-body); z-index:60;
           box-shadow:0 8px 24px rgba(0,0,0,.5); }
  /* team-name tap targets -> locker */
  .teamlink { cursor:pointer; text-decoration:none; }
  .teamlink:hover, .teamlink:focus { text-decoration:underline; color:var(--accent); }

  /* ---------------- chat ---------------- */
  .chatcard { padding-bottom:0; }
  .chatlist { max-height:52vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:2px 2px 8px; }
  .chatRowMsg { display:flex; }
  .chatBubble { background:var(--nested2); border:1px solid var(--border-card); border-radius:12px; padding:8px 10px; max-width:88%; }
  .chatBubble.mine { background:var(--card); border-color:var(--accent); margin-left:auto; }
  .chatMeta { display:flex; justify-content:space-between; gap:10px; font-size:12px; margin-bottom:2px; }
  .chatMeta b { font-family:var(--font-display); font-weight:600; letter-spacing:.3px; }
  .chatQuote { border-left:2px solid var(--border-card); padding-left:8px; margin:4px 0; color:var(--mut); font-size:12.5px; }
  .chatText2 { white-space:pre-wrap; word-break:break-word; }
  .chatImg { max-width:220px; max-height:220px; border-radius:10px; margin-top:6px; display:block; cursor:zoom-in; }
  .chatActions { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .chatActions button { background:var(--nested2); border:1px solid var(--border-card); border-radius:var(--radius-pill);
                         padding:3px 9px; font-size:12px; text-transform:none; letter-spacing:0; }
  .chatDel { color:var(--accent); }
  .chatSys { color:var(--mut); font-size:13px; background:var(--nested2); border:1px dashed var(--border-card);
             border-radius:10px; padding:6px 10px; width:100%; }
  .chatcompose { border-top:1px solid var(--border-card); margin-top:8px; padding-top:10px; position:sticky; bottom:0; background:var(--card); }
  /* Boot-speed/polish pass (2026-08-08): PHOTO/IMAGES/GIF/SEND are all fixed-width text
     buttons (flex:0 0 auto — they never shrink) sharing one row with the message box; at
     390px their combined width (~260px incl. gaps) left the textarea only ~40px — three or
     four characters — before any typing even started. flex-wrap + a real basis on the
     textarea forces a clean two-line layout instead: the three icon buttons comfortably fit
     line 1 on their own (~215px of 332px available), so a basis bigger than what's left on
     that line (120px) pushes the textarea (and Send, right after it) onto their own full-
     width line 2 — no HTML restructuring needed, just where the wrap naturally falls.
     Also lifted .chatText out from the unstyled-by-default `<textarea>` gap: the base
     `input, select { }` rule never touches textareas, so this box was relying on browser
     defaults for everything but width. */
  .chatRow { display:flex; gap:6px 8px; align-items:center; flex-wrap:wrap; row-gap:8px; }
  .chaticon { padding:7px 9px; flex:0 0 auto; font-size:11.5px; }
  .chatText { flex:1 1 200px; min-width:0; background:var(--nested2); color:var(--ink);
              border:1px solid var(--border-card); border-radius:var(--radius-sm);
              padding:9px 10px; font:15px var(--font-body); resize:none; }
  .chatText:focus { outline:none; border-color:var(--border-hover); }
  .chatSend { flex:0 0 auto; }
  .chatgifbox, .chatmeme { background:var(--nested2); border:1px solid var(--border-card); border-radius:12px; padding:8px; margin-bottom:8px; }
  .chatGifQ { width:100%; margin-bottom:8px; }
  .chatGifGrid, .chatmeme { display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:6px; }
  .gifThumb, .memeThumb { padding:0; border-radius:8px; overflow:hidden; border:1px solid var(--border-card); background:none; }
  .gifThumb img, .memeThumb img { width:100%; height:64px; object-fit:cover; display:block; }
  .chatReplyPreview, .chatPending { display:flex; align-items:center; gap:8px; background:var(--nested2); border:1px solid var(--border-card);
    border-radius:10px; padding:6px 10px; margin-bottom:8px; }
  .chatPending img { width:44px; height:44px; object-fit:cover; border-radius:8px; }
  .chatReplyX, .chatPendingX { margin-left:auto; background:none; border:none; padding:2px 6px; }
  /* the house [hidden]-override lesson, again — every chat auxiliary panel
     sets its own `display` unconditionally, so each needs this restated */
  .chatmeme[hidden], .chatgifbox[hidden], .chatReplyPreview[hidden], .chatPending[hidden] { display:none; }
  .imgoverlay { position:fixed; inset:0; z-index:70; background:rgba(6,7,8,.92); display:flex; align-items:center; justify-content:center; padding:20px; }
  .imgoverlay[hidden] { display:none; } /* the house [hidden]-override lesson — an author rule always beats the UA [hidden]{display:none} */
  .imgoverlay img { max-width:100%; max-height:100%; border-radius:10px; }

  /* ---------------- record book (S6) + league-home collapsible cards (item 4) ----------------
     .collapsecard ( Recent moves /  League chat) is a DELIBERATELY SEPARATE class from
     .recordbook, even though the disclosure styling is identical — several existing tests
     select ".recordbook" specifically to reach the ACTUAL record book, and the two new cards
     render ABOVE it in DOM order, so sharing the class made document.querySelector(".recordbook")
     grab the wrong card. */
  .recordbook summary, .collapsecard summary { cursor:pointer; font:600 12px var(--font-display); color:var(--mut); text-transform:uppercase;
                         letter-spacing:2px; list-style:none; }
  .recordbook summary::-webkit-details-marker, .collapsecard summary::-webkit-details-marker { display:none; }
  .recordbook summary::before, .collapsecard summary::before { content:"▸ "; color:var(--accent); }
  .recordbook[open] summary::before, .collapsecard[open] summary::before { content:"▾ "; }
  .recordbook[open] summary, .collapsecard[open] summary { margin-bottom:10px; }
  .h2hline { text-align:center; margin-top:6px; }

  /* ---------------- playoff bracket (S7) ---------------- */
  .champbanner { text-align:center; padding:18px; margin-bottom:12px; border-radius:var(--radius-card);
                 background:linear-gradient(135deg,var(--gold),#8a6110); color:var(--bg); font:800 16px var(--font-display);
                 letter-spacing:.5px; text-transform:uppercase; }
  .toiletbanner { text-align:center; padding:10px; margin-bottom:12px; border-radius:var(--radius-sm);
                  border:1px dashed var(--accent); color:var(--accent); font-size:13px; }
  .bracketrounds { display:flex; flex-direction:column; gap:16px; }
  .bracketcol { min-width:0; }
  .byerow { padding:8px 10px; margin-bottom:6px; border:1px dashed var(--border-card); border-radius:var(--radius-sm); color:var(--mut); font-size:13px; }
  .bgame { display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--border-card);
           border-radius:var(--radius-sm); margin-bottom:8px; padding:10px 12px;
           text-transform:none; letter-spacing:normal; }
  .bgame:not([disabled]):hover { border-color:var(--border-hover); }
  .bgame[disabled] { cursor:default; opacity:.82; }
  .bgame .bside { display:flex; justify-content:space-between; gap:10px; font:500 13.5px var(--font-body); padding:2px 0; }
  .bgame .bside .mut { font-family:var(--font-display); font-weight:700; }
  .bgame .bside.winner { font-weight:800; color:var(--green); }
  @media (min-width:900px) {
    .bracketrounds { flex-direction:row; align-items:flex-start; }
    .bracketcol { flex:1 1 0; }
  }

  /* ---------------- scores tab (item 2, playtest batch 2 — ESPN-scoreboard-style day-grouped
     cards, replacing the old plain gmrow list; card grid goes 2-up at ≥1024px below) ---------------- */
  .scoreday { margin-bottom:14px; }
  .scoreday h2 { margin-bottom:6px; }
  .scgrid { display:grid; grid-template-columns:1fr; gap:8px; }
  .sccard { background:var(--card); border:1px solid var(--border-card); border-radius:var(--radius-sm); padding:10px 12px; }
  .sccard.live { border-color:var(--accent); }
  .scnet { font:600 10.5px var(--font-display); letter-spacing:.5px; text-transform:uppercase; color:var(--mut); }
  .scstate { font:600 11.5px var(--font-display); letter-spacing:.5px; text-transform:uppercase; color:var(--mut); }
  .scstate.live { color:var(--accent); }
  .scteams { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:4px; font:600 15px var(--font-display); }
  .scteam { display:flex; align-items:center; gap:8px; }
  /* Item 4 (2026-08-09): the NFL crest beside each abbrev. FIXED width/height (matching the
     img element's own width/height attributes) so the row's height is decided before the image
     arrives — a slow, missing or failed logo can never shift the score beside it. */
  .sclogo { width:22px; height:22px; flex:0 0 auto; object-fit:contain; }
  .scpts { font-weight:800; font-variant-numeric:tabular-nums; }
  .scspread, .scmine { margin-top:4px; }
  .ffrow { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .ffside { display:flex; flex-direction:column; gap:1px; min-width:0; }
  .ffside.mut { flex-direction:row; }
  .ffpts { font:700 15px var(--font-display); font-variant-numeric:tabular-nums; }
  @media (min-width:1024px) { .scgrid { grid-template-columns:1fr 1fr; } }

  /* ---------------- lockers ---------------- */
  /* Item 10 (2026-08-09 playtest: "need to shrink the team name card in half"). MEASURED at
     390px: 182px tall for a logo, a name, a motto and a record. Everything it carried stays —
     colour, crest, name, record, motto — at about half the scale: 8px padding instead of 16,
     a 38px logo instead of 64, a 17px name instead of 24, and the owner's edit buttons on a
     tighter row. */
  .lockerhead { border-radius:var(--radius-card); padding:8px 12px; margin-bottom:10px; background:var(--accent); color:#fff; }
  .lockerhead-inner { display:flex; align-items:center; gap:10px; }
  .lockerlogo { width:38px; height:38px; border-radius:10px; object-fit:cover; flex:0 0 auto; background:rgba(255,255,255,.15); }
  .lockerlogo-ph { display:flex; align-items:center; justify-content:center; font-size:17px; }
  .lockerid { min-width:0; }
  .lockername { margin:0; font:700 17px/1.15 var(--font-display); letter-spacing:.5px; text-transform:uppercase; }
  .lockermotto { margin:0; opacity:.92; font-style:italic; font-size:12px; line-height:1.3; }
  .lockerrec { margin:0; font:600 12px/1.3 var(--font-display); opacity:.92; }
  .lockeredit { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .lockeredit button { padding:5px 10px; font-size:11.5px; }
  .lockeredit button { background:rgba(0,0,0,.25); border-color:rgba(255,255,255,.35); color:#fff; }

  /* ---------------- player stats card (2026-08-08) ----------------
     A row that used to both "inform" (show a player) and "act" (open a sheet, add them to a
     trade, claim them) is now split: the row's own info area opens the stats card below;
     whatever it used to DO moves onto its own explicit button (.lswap in the lineup editor,
     .pcpick in the trade builder, .faMoveBtn in the FA table). .linfo/.pcinfo/.pcinline are
     three flavors of "reset a <button> back to plain content" for that info area — .linfo
     keeps the lineup row's existing name-left/points-right layout, .pcinfo is a simple block
     (trade-chip name + meta, one line), .pcinline is inline text (a name mid-sentence in the
     claims/trades lists). */
  .linfo { flex:1 1 auto; min-width:0; display:flex; align-items:center; justify-content:space-between; gap:8px;
           background:none; border:none; padding:0; margin:0; color:inherit; font:inherit;
           text-align:left; text-transform:none; letter-spacing:normal; cursor:pointer; }
  /* Item 8 (2026-08-09 playtest: "on the my team tab the formatting totally cuts off player
     names"). MEASURED at 390px before the fix: .lname was 94px wide, every name wrapped to
     THREE lines, and a longer one ("C. McLaughlin K · TB") overflowed its 94px box outright
     and was clipped by the overflow:hidden above. The row's fixed costs are a 52px slot chip,
     a ~72px Swap button and a nowrap points column that will not shrink below its own text —
     which between them left the name about a quarter of the row. Stacking .linfo on a phone
     gives the name the WHOLE remaining width and puts the points on their own line beneath it,
     which is also the natural reading order for a lineup row. */
  @media (max-width:700px) {
    .linfo { flex-direction:column; align-items:stretch; justify-content:center; gap:1px; }
    .lname { white-space:normal; overflow:visible; text-overflow:clip; }
    /* the meta wraps as a UNIT — otherwise a long name breaks the line right after
       "QB ·" and leaves the team abbreviation stranded on its own */
    .lname small { white-space:nowrap; }
    .lpts { font-size:13px; }
  }
  .lswap { flex:0 0 auto; }
  /* Item 9: the LOCKED word is gone — a greyed-out Swap is the whole signal. It must READ as
     unavailable (not merely be inert), and it must not brighten on hover the way a live button
     does. Kept at the same size, so the row's geometry doesn't change when a game kicks off. */
  .lswap[disabled] { opacity:.42; cursor:default; }
  .lswap[disabled]:hover { border-color:var(--border-card); }
  .lswapfill { flex:1 1 auto; text-align:left; text-transform:none; letter-spacing:normal; }
  .pcinfo { flex:1 1 auto; min-width:0; text-align:left; background:none; border:none; padding:0; margin:0;
            color:inherit; font:inherit; text-transform:none; letter-spacing:normal; cursor:pointer; }
  .pickchip.picked .pcpick { border-color:var(--accent); color:var(--accent); }
  .pcinline { background:none; border:none; padding:0; margin:0; font:inherit; color:inherit;
              text-decoration:underline dotted; text-underline-offset:2px; text-transform:none;
              letter-spacing:normal; cursor:pointer; }
  .pcinline:hover { color:var(--accent); }
  /* the row-level tap target itself (matchup half-cells, the read-only locker roster table) —
     the FA table already carries its own `table.faTable tbody tr { cursor:pointer }` rule. */
  .pcellgrid[data-pk] { cursor:pointer; }
  tr[data-pk] { cursor:pointer; }
  /* an "explicit, accent-outlined MOVE button" per the FA table row split — .faAddBtn keeps
     its existing sizing rule above, this just adds the accent outline treatment. */
  .faMoveBtn { background:transparent; border-color:var(--accent); color:var(--accent); font-weight:700; }
  .faMoveBtn:hover { background:var(--accent); color:#fff; }

  .pcoverlay { position:fixed; inset:0; z-index:68; background:rgba(6,7,8,.82); backdrop-filter:blur(3px);
               display:flex; align-items:center; justify-content:center; padding:16px; }
  .pcoverlay[hidden] { display:none; } /* the house [hidden]-override lesson, again */
  .pccard { position:relative; width:100%; max-width:420px; max-height:86vh; overflow-y:auto;
            background:var(--card); border:1px solid var(--border-card); border-radius:var(--radius-card);
            padding:20px 18px 16px; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .pccard.center { text-align:center; padding:40px 18px; }
  .pcclose { position:absolute; top:10px; right:10px; width:32px; height:32px; padding:0;
             display:flex; align-items:center; justify-content:center; border-radius:50%; font-size:14px; }
  .pchead { padding-right:34px; margin-bottom:14px; }
  .pcname { margin:0 0 6px; font:700 22px var(--font-display); letter-spacing:.4px; text-transform:none; }
  .pcmeta { display:flex; align-items:center; gap:8px; font-size:13px; }
  .pcweek { background:var(--nested2); border:1px solid var(--border-card); border-radius:var(--radius-sm);
            padding:10px 12px; margin-bottom:14px; }
  .pcweekrow { display:flex; align-items:baseline; gap:12px; margin-top:4px; flex-wrap:wrap; }
  .pcweekrow .pts { font:800 28px var(--font-display); }
  .pctiles { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
  .pctile { text-align:center; background:var(--nested2); border:1px solid var(--border-card);
            border-radius:var(--radius-sm); padding:10px 6px; }
  .pctileval { font:700 18px var(--font-display); font-variant-numeric:tabular-nums; }
  .pctilelabel { margin-top:2px; text-transform:uppercase; letter-spacing:.5px; }
  .pclog table.tbl th, .pclog table.tbl td { padding:7px 8px; }

  /* ---------------- nav — mobile bottom bar / desktop top-nav row ---------------- */
  .bnav { position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex;
          background:var(--tabbar); backdrop-filter:blur(8px); border-top:1px solid var(--border-card);
          padding:6px 6px calc(6px + env(safe-area-inset-bottom)); }
  /* Polish pass (2026-08-08): the house [hidden]-override lesson, again — .bnav's own
     display:flex above beats the UA [hidden]{display:none} rule, so hideBnav()'s `hidden`
     attribute (gate/first-run/claim screens — nothing usable behind the tabs yet) needs this
     restated or the bar stays visible and tappable regardless of the attribute. */
  .bnav[hidden] { display:none; }
  /* item 6 (2026-08-08 playtest): the active-tab indicator is a border-bottom that spans the
     button's own FULL border-box — so it's only ever horizontally centered under the label when
     that box's padding is itself symmetric (text-align:center centers the label within the same
     box the border spans). Mobile's padding already is (2px/2px) — the border just needed to
     exist. `* { box-sizing:border-box }` (top of this stylesheet) means adding it never nudges
     the button's own size/height. */
  .bnav button, .bnav .bnavlink { flex:1 1 0; background:none; border:none; border-bottom:2px solid transparent;
                 color:var(--faint); min-height:44px; text-align:center;
                 font:600 11.5px var(--font-display); letter-spacing:1px; text-transform:uppercase;
                 padding:6px 2px; cursor:pointer; text-decoration:none; display:flex;
                 align-items:center; justify-content:center; box-sizing:border-box; }
  .bnav button.on { color:var(--accent); border-bottom-color:var(--accent); }
  .bnav button:hover, .bnav .bnavlink:hover { color:var(--ink2); }
  .bnav button.on:hover { color:var(--accent); }

  /* ============ desktop (≥1024px) — the design's top-nav pattern ============
     header (wordmark + week/avatar meta) and #bnav (the link row) stay separate
     elements — see the containing-block note above — but share one background
     with no border between them, so together they read as the mockup's single
     60px top-nav strip: wordmark left, links across the middle, "WEEK N · YEAR"
     + avatar pinned right. */
  @media (min-width:1024px) {
    header { padding:0 24px; height:46px; border-bottom:none; }
    header .sub { display:inline; margin-left:2px; }
    header .hmeta { display:flex; }
    main { max-width:1200px; padding:20px 24px; }
    body { padding-bottom:24px; }
    .bnav { position:sticky; top:46px; background:var(--tabbar); border-top:none; border-bottom:1px solid var(--border-card);
            padding:0 24px; max-width:none; margin:0; height:34px; }
    /* item 6 fix, desktop half: the OLD padding here was asymmetric (0 16px 0 0 — "left" gap
       folded entirely into the right side), so the border-bottom below — which spans the
       button's FULL border-box — sat centered on a box whose CONTENT (and therefore its
       justify-content:center label) was itself off-center within that box. Symmetric padding
       (0 12px) makes the box's own center and its label's center the same point, so the
       full-width border is correctly centered under the label at every label width, without
       needing to know the label's rendered text width at all. */
    .bnav button, .bnav .bnavlink { flex:0 0 auto; display:flex; align-items:center; justify-content:center; min-height:0;
                   height:100%; font-size:12.5px; letter-spacing:1.5px; padding:0 12px;
                   border-bottom:2px solid transparent; color:var(--mut); }
    .bnav button.on { color:var(--ink); border-bottom-color:var(--accent); }
    .bnav button:hover, .bnav .bnavlink:hover { color:var(--ink2); }
    /* league home: cheap multi-column dashboard feel without restructuring the cards themselves */
    main[data-view="league"] { column-count:2; column-gap:20px; }
    main[data-view="league"] > * { break-inside:avoid; -webkit-column-break-inside:avoid; }
  }
  @media (min-width:1360px) {
    main[data-view="league"] { column-count:3; }
  }

  /* ---------------- 2025 season replay (2026-08-08) ---------------- */
  /* Persistent banner — always visible while LG.SIM_2025 is true, on every screen (gate/claim/
     setup included), so the replay can never be mistaken for the live 2026 season. Sits BELOW
     header, ABOVE main, as its own sticky band — never inside header (same
     backdrop-filter-containing-block trap #bnav's own comment documents: nest a position:fixed
     descendant inside a filter/backdrop-filter ancestor and it stops being fixed to the
     viewport). [hidden] restated per the house lesson — a styled block/flex/sticky rule always
     beats the UA [hidden]{display:none} one. */
  #simBanner { position:sticky; top:52px; z-index:19; background:var(--gold); color:var(--bg);
               font:700 12px var(--font-display); letter-spacing:.5px; text-transform:uppercase;
               text-align:center; padding:7px 10px; }
  #simBanner[hidden] { display:none; }
  @media (min-width:1024px) { #simBanner { top:46px; } }
  /* Offline-with-a-mirror chip (2026-08-08, the REST transport): the league renders normally
     from this device's saved copy, so the chip is what keeps that honest — which copy, how
     old, and that we're still trying. Clay rather than gold: this is a state to get out of,
     not a mode to settle into. [hidden] restated because the rule above sets a display. */
  #offlineChip { position:sticky; top:52px; z-index:19; background:var(--accent); color:#fff;
                 font:700 11px var(--font-display); letter-spacing:.4px; text-transform:uppercase;
                 text-align:center; padding:6px 10px; }
  #offlineChip[hidden] { display:none; }
  @media (min-width:1024px) { #offlineChip { top:46px; } }
</style>
</head>
<body>
  <header>
    <span class="wordmark">The <span class="accentword">GFFL</span></span>
    <span class="sub">Goat Fantasy Football League</span>
    <span class="hmeta" id="hMeta" hidden>
      <span id="hWeekYear"></span>
      <span id="hAvatar" hidden></span>
    </span>
  </header>
  <div id="simBanner" hidden></div>
  <div id="offlineChip" hidden></div>
  <!-- #bnav stays a SIBLING of <header>, never a descendant: header sets backdrop-filter,
       and a backdrop-filter/filter/transform ancestor becomes the containing block for any
       position:fixed descendant in Chromium — nesting nav inside header would silently break
       the mobile fixed bottom bar. At ≥1024px the two are styled to read as one continuous
       top-nav strip (matching background, no border between them) without that risk. -->
  <nav class="bnav" id="bnav">
    <button data-v="league">League</button>
    <button data-v="matchup">Matchup</button>
    <button data-v="team">My Team</button>
    <button data-v="moves">Moves</button>
    <button data-v="chat">Chat</button>
    <button data-v="scores">Scores</button>
    <button data-v="rules">Rules</button>
    <!-- Item 8 (2026-08-08): Draft leaves league.html entirely — it's ffdraft.html, the
         family's separate keeper-draft-room page — so it's a plain link styled as a tab,
         never toggles .on (that class only ever means "the current league.html view"),
         and carries no data-v (nothing in lg-ui.js's nav-highlight loop should touch it). -->
    <a class="bnavlink" href="ffdraft.html">Draft</a>
  </nav>
  <main id="main"><div class="card mut">Loading the league…</div></main>
  <div id="toast" hidden></div>
  <div id="imgOverlay" class="imgoverlay" hidden><img id="imgOverlayImg" alt=""></div>
  <div id="playerCard" class="pcoverlay" hidden></div>

  <script src="assets/league/lg-core.js"></script>
  <script src="assets/league/lg-data.js"></script>
  <script src="assets/league/lg-ui.js"></script>
  <script>
    "use strict";
    // navTo, not show: pressing a nav tab is a distinct gesture from opening a specific thing
    // (a matchup card, a locker), and the Matchup tab in particular must always land on the
    // logged-in user's OWN game — see UI.navTo's note in lg-ui.js.
    document.querySelectorAll(".bnav button").forEach((b) =>
      b.addEventListener("click", () => LG.ui.navTo(b.dataset.v)));
    document.getElementById("imgOverlay").addEventListener("click", () => { document.getElementById("imgOverlay").hidden = true; });
    // Player stats card (2026-08-08): bound ONCE, same posture as #imgOverlay above — the
    // overlay itself is persistent chrome (a sibling of #main, never destroyed by a render),
    // so this doesn't need re-wiring per view. Backdrop tap closes ONLY when the click target
    // IS the backdrop (e.pageX/e.target === the overlay itself, not a bubbled click from
    // inside .pccard) — a tap anywhere on the card's own content must never close it.
    document.getElementById("playerCard").addEventListener("click", (e) => {
      if (e.target === e.currentTarget) LG.ui.closePlayerCard();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      const ov = document.getElementById("playerCard");
      if (ov && !ov.hidden) LG.ui.closePlayerCard();
    });
    // Bound ONCE — #hAvatar is persistent header chrome, never re-created by a
    // render (unlike main()'s innerHTML swaps), so wiring it through the
    // per-render wireLockerTaps() convention would stack a new listener on
    // every navigation. A single boot-time binding avoids that entirely.
    document.getElementById("hAvatar").addEventListener("click", () => {
      const id = LG.myTeamId();
      if (id) LG.ui.openLocker(id);
    });
    // Boot-speed pass (2026-08-08): called immediately, not gated behind LG.backendReady — an
    // unauthenticated visitor's gate screen needs no backend at all (LG.unlocked() is a plain
    // localStorage read) and used to sit blocked behind the Firebase ESM import + reachability
    // probe for nothing. UI.boot() itself awaits LG.backendReady right before its first real
    // LG.db read, once we actually know we're unlocked.
    // Last-resort net: UI.boot() catches its own backend failures, but a throw anywhere else
    // in the boot chain must still leave a screen a person can act on, never the permanent
    // "Loading the league…" placeholder (live bug 2026-08-08).
    LG.ui.boot().catch((e) => { try { LG.ui.renderOffline(); } catch (_) {} console.error("GFFL boot failed", e); });
    // Test hook — the suites drive and inspect through this.
    window.__GFFL__ = { LG, get D() { return LG.data; }, get UI() { return LG.ui; } };
  </script>
</body>
</html>
