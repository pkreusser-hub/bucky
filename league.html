  <!-- S10 (2026-08-11): the drop/swap card. A SIBLING of #main like the two overlays above —
       the bottom sheets it replaces lived inside main()'s innerHTML and were destroyed by any
       repaint. One element serves BOTH flows (add/claim from the players table, and the
       locker's lineup swap) and it reuses .pcoverlay's own centering rule, so "centered modal"
       has exactly one definition in this stylesheet. -->
  <div id="rosterCard" class="pcoverlay" hidden></div>

  <!-- S4: the family app's FCM helper, reused verbatim. Loaded here (not lazily) only because
       it is 8KB of plain script that defines window.BuckyPush and does NOTHING else at parse
       time — every Firebase SDK it needs is dynamic-imported on the first enable(). -->
  <script src="push-client.js"></script>
  <script src="assets/league/lg-core.js"></script>
  <script src="assets/league/lg-data.js"></script>
  <script src="assets/league/lg-ui.js"></script>
  <script>
    "use strict";
    // navTo, not show: pressing a nav tab is a distinct gesture from opening a specific thing
    // (a matchup card, a locker), and the Matchup tab in particular must always land on the
    // logged-in user's OWN game — see UI.navTo's note in lg-ui.js.
    document.querySelectorAll(".bnav button").forEach((b) =>
      b.addEventListener("click", () => LG.ui.navTo(b.dataset.v)));
    // ITEM 32 (2026-08-10): closing an overlay by tapping its own backdrop hands the history
    // entry it pushed straight back (LG.ui.closeImageOverlay / closePlayerCard both do), so the
    // reader's NEXT Back is a real view change rather than a silently-consumed dead entry.
    document.getElementById("imgOverlay").addEventListener("click", () => LG.ui.closeImageOverlay());
    // Player stats card (2026-08-08): bound ONCE, same posture as #imgOverlay above — the
    // overlay itself is persistent chrome (a sibling of #main, never destroyed by a render),
    // so this doesn't need re-wiring per view. Backdrop tap closes ONLY when the click target
    // IS the backdrop (e.pageX/e.target === the overlay itself, not a bubbled click from
    // inside .pccard) — a tap anywhere on the card's own content must never close it.
    document.getElementById("playerCard").addEventListener("click", (e) => {
      if (e.target === e.currentTarget) LG.ui.closePlayerCard();
    });
    // S10's drop/swap card — same posture, same backdrop-only rule (a tap on the card's own
    // content must never dismiss a half-made move).
    document.getElementById("rosterCard").addEventListener("click", (e) => {
      if (e.target === e.currentTarget) LG.ui.closeRosterCard();
    });
    // Escape closes whatever modal is up — the player card, the lineup swap sheet, the waiver
    // claim sheet, the chat lightbox. It used to know only about the player card; ITEM 32 gave
    // every one of them the same registration, so there is one answer to "what is on top".
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      LG.ui.closeTopOverlay();
    });
    // Bound ONCE — #hAvatar is persistent header chrome, never re-created by a
    // render (unlike main()'s innerHTML swaps), so wiring it through the
    // per-render wireLockerTaps() convention would stack a new listener on
    // every navigation. A single boot-time binding avoids that entirely.
    document.getElementById("hAvatar").addEventListener("click", () => {
      const id = LG.myTeamId();
      if (id) LG.ui.openLocker(id);
    });
    // Boot-speed pass (2026-08-08): called immediately, not gated behind LG.backendReady — an
    // unauthenticated visitor's gate screen needs no backend at all (LG.unlocked() is a plain
    // localStorage read) and used to sit blocked behind the Firebase ESM import + reachability
    // probe for nothing. UI.boot() itself awaits LG.backendReady right before its first real
    // LG.db read, once we actually know we're unlocked.
    // Last-resort net: UI.boot() catches its own backend failures, but a throw anywhere else
    // in the boot chain must still leave a screen a person can act on, never the permanent
    // "Loading the league…" placeholder (live bug 2026-08-08).
    LG.ui.boot().catch((e) => { try { LG.ui.renderOffline(); } catch (_) {} console.error("GFFL boot failed", e); });
    // Test hook — the suites drive and inspect through this.
    window.__GFFL__ = { LG, get D() { return LG.data; }, get UI() { return LG.ui; } };
    // GFFL-CONNECT (2026-08-13): Bucky embeds this page as its GFFL tab (same-origin
    // persistent iframe). A CSS-hidden iframe's own document NEVER reports hidden
    // (visibilityState follows the TOP page), so Bucky sets __buckyEmbedVisible + fires
    // this event when the tab is covered/uncovered — the live poll (8s while games are on)
    // pauses rather than burning requests behind another tab, and resumes with an
    // immediate catch-up poll. Guarded on loopStarts>0 so a pre-boot event (gate screen)
    // can never arm a loop the boot hasn't started. Standalone (goatfantasyleague.com,
    // never framed) the event simply never fires and nothing here runs.
    window.addEventListener("bucky-embed-visibility", () => {
      const D = LG.data;
      if (!D || !D.S || !D.S.loopStarts) return;
      if (window.__buckyEmbedVisible === false) D.stop();
      else if (!D.S.running) { D.start(); }
    });
  </script>
</body>
</html>
