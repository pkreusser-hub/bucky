<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FARMSTEAD — sprite-impostor viability demo</title>
<style>
  html,body{ margin:0; height:100%; overflow:hidden; background:#0d1116; }
  #view{ display:block; width:100vw; height:100vh; }
  #boot{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:20;
    font:700 15px/1.5 ui-monospace,Consolas,monospace; color:#e8f0f8;
    text-shadow:0 2px 6px rgba(0,0,0,.8); pointer-events:none;
  }
  #ui{
    position:fixed; left:10px; top:10px; z-index:10; width:250px;
    background:rgba(14,20,28,.82); border:1px solid rgba(255,255,255,.14); border-radius:10px;
    padding:9px 10px 10px; color:#dfe9f3; backdrop-filter:blur(6px);
    font:600 11px/1.35 ui-monospace,Consolas,monospace; user-select:none;
  }
  #ui.hidden{ display:none; }
  #ui.small .row, #ui.small #stats, #ui.small .note{ display:none; }
  #ui h1{ font-size:12px; margin:0 0 7px; letter-spacing:.4px; color:#fff; }
  #ui h1 span{ float:right; cursor:pointer; opacity:.6; font-weight:400; }
  .row{ display:flex; align-items:center; gap:4px; margin:0 0 5px; flex-wrap:wrap; }
  .lbl{ width:52px; flex:0 0 52px; opacity:.62; font-weight:400; }
  button{
    font:600 11px/1 ui-monospace,Consolas,monospace; color:#cfdcea; cursor:pointer;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16);
    border-radius:6px; padding:4px 7px;
  }
  button:hover{ background:rgba(255,255,255,.13); }
  button.on{ background:#2b6cb0; border-color:#5b9bdc; color:#fff; }
  button.wide{ flex:1; }
  #stats{
    margin-top:8px; padding-top:7px; border-top:1px solid rgba(255,255,255,.13);
    font:400 10.5px/1.5 ui-monospace,Consolas,monospace; color:#9fb6cc;
  }
  #stats b{ color:#eaf3fb; }
  .note{ margin-top:7px; font:400 10px/1.4 ui-monospace,Consolas,monospace; color:#7d94aa; }
  #legend{
    position:fixed; left:0; right:0; bottom:10px; z-index:9; text-align:center;
    pointer-events:none; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.85);
    font:700 12px/1 ui-monospace,Consolas,monospace; letter-spacing:.6px; opacity:.85;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="boot">booting…</div>
<div id="legend"></div>

<div id="ui" class="hidden">
  <h1>SPRITE IMPOSTORS <span data-act="panel">&#9776;</span></h1>

  <div class="row"><span class="lbl">draw</span>
    <button data-k="mode" data-v="sprite">sprite</button>
    <button data-k="mode" data-v="mesh">3D mesh</button>
    <button data-k="mode" data-v="split">split</button>
  </div>
  <div class="row"><span class="lbl">units</span>
    <button data-k="count" data-v="50">50</button>
    <button data-k="count" data-v="200">200</button>
    <button data-k="count" data-v="1000">1000</button>
  </div>
  <div class="row"><span class="lbl">angles</span>
    <button data-k="angles" data-v="8">8</button>
    <button data-k="angles" data-v="16">16</button>
    <span class="lbl" style="width:34px;flex:0 0 34px">px</span>
    <button data-k="cell" data-v="64">64</button>
    <button data-k="cell" data-v="128">128</button>
    <button data-k="cell" data-v="256">256</button>
  </div>
  <div class="row"><span class="lbl">bake</span>
    <button data-k="lightMode" data-v="lit">lit</button>
    <button data-k="lightMode" data-v="flat">flat+tint</button>
    <button data-act="rebake" class="wide">re-bake @ pitch</button>
  </div>
  <div class="row"><span class="lbl">walk</span>
    <button data-k="walk" data-v="1">on</button>
    <button data-k="walk" data-v="0">off</button>
    <span class="lbl" style="width:44px;flex:0 0 44px">shadow</span>
    <button data-k="shadows" data-v="1">on</button>
    <button data-k="shadows" data-v="0">off</button>
  </div>
  <div class="row"><span class="lbl">statics</span>
    <button data-k="statics" data-v="off">off</button>
    <button data-k="statics" data-v="mesh">mesh</button>
    <button data-k="statics" data-v="sprite">impostor</button>
  </div>
  <div class="row"><span class="lbl">quad</span>
    <button data-k="billboard" data-v="view">view-aligned</button>
    <button data-k="billboard" data-v="axis">cylindrical</button>
  </div>
  <div class="row"><span class="lbl">bias</span>
    <button data-k="bias" data-v="0">0</button>
    <button data-k="bias" data-v="0.22">0.22</button>
    <button data-k="bias" data-v="0.45">0.45</button>
    <span class="lbl" style="width:52px;flex:0 0 52px">tint</span>
    <button data-k="tint" data-v="1">on</button>
    <button data-k="tint" data-v="0">off</button>
  </div>

  <div id="stats">…</div>
  <div class="note">drag = orbit &middot; shift/right-drag = pan &middot; wheel = zoom.<br>
  ORBIT is the test: watch the frame swap.</div>
</div>

<script src="../../assets/vendor/three-r128.min.js"></script>
<script src="./GLTFLoader.js"></script>
<script src="./fs-const.js"></script>
<script src="./fs-map.js"></script>
<script src="./sprite-world.js"></script>
<script src="./sprite-impostor.js"></script>
<script src="./sprite-demo.js"></script>
<script>
/* legend text follows the mode so a screenshot explains itself */
(function () {
  const el = document.getElementById("legend");
  setInterval(function () {
    const S = window.__SPRITE__ && window.__SPRITE__.S;
    if (!S) return;
    el.textContent = S.mode === "split" ? "◀  SPRITE IMPOSTORS      |      3D MESHES  ▶"
      : (S.mode === "sprite" ? "ALL SPRITE IMPOSTORS" : "ALL 3D MESHES");
  }, 250);
})();
</script>
</body>
</html>
