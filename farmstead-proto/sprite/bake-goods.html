<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FARMSTEAD — goods impostor baker</title>
<style>
  html,body{ margin:0; height:100%; background:#0d1116; color:#dfe9f3;
    font:600 12px/1.5 ui-monospace,Consolas,monospace; }
  #log{ padding:12px; white-space:pre-wrap; }
  canvas{ position:fixed; left:-4000px; top:0; }   /* the bake never needs to be seen */
</style>
</head>
<body>
<div id="log">idle</div>
<canvas id="gl" width="8" height="8"></canvas>

<!-- the LIVE game files: the goods sculpts ARE the bake source, so there is
     nothing to freeze and nothing that can drift out of step with the game. -->
<script src="../../assets/vendor/three-r128.min.js"></script>
<script src="../../assets/farmstead/fs-const.js"></script>
<script src="../../assets/farmstead/fs-models.js"></script>
<script src="./fs-goods-bake.js"></script>
<script>
/* ONE job: expose window.__GBAKE__.run(cfg) so tools/_fs_bake_goods.cjs can pull
 * the sheet + manifest out of a real WebGL context. Nothing renders to screen. */
(function () {
  "use strict";
  const logEl = document.getElementById("log");
  const renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById("gl"), antialias: true, alpha: true,
    preserveDrawingBuffer: false,
  });
  renderer.setPixelRatio(1);          // the bake ALWAYS runs at dPR 1 (see fs-cast-bake.js)
  renderer.setSize(8, 8, false);

  window.__GBAKE__ = {
    ready: true,
    renderer: renderer,
    run: function (cfg) {
      logEl.textContent = "baking…";
      const t0 = performance.now();
      const out = window.FSGoodsBake.bake(renderer, cfg || {});
      const png = window.FSGoodsBake.toPNG(out.sheet);
      const bytes = Math.floor((png.length - (png.indexOf(",") + 1)) * 3 / 4);
      const ms = Math.round(performance.now() - t0);
      logEl.textContent = "baked " + out.manifest.goods.length + " goods in " + ms + " ms, " +
        Math.round(bytes / 1024) + " KB";
      return { manifest: out.manifest, png: png, stats: { ms: ms, pngBytes: bytes } };
    },
  };
})();
</script>
</body>
</html>
