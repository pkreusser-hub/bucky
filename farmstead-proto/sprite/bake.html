<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FARMSTEAD — Fork B cast sprite baker</title>
<style>
  html,body{ margin:0; height:100%; background:#0d1116; color:#dfe9f3;
    font:600 12px/1.5 ui-monospace,Consolas,monospace; }
  #log{ padding:12px; white-space:pre-wrap; }
  canvas{ position:fixed; left:-4000px; top:0; }   /* the bake never needs to be seen */
</style>
</head>
<body>
<div id="log">idle</div>
<canvas id="gl" width="8" height="8"></canvas>

<script src="../../assets/vendor/three-r128.min.js"></script>
<script src="./GLTFLoader.js"></script>
<script src="./fs-const.js"></script>
<script src="./fs-models-frozen.js"></script>
<script src="./sprite-impostor.js"></script>
<script src="./fs-cast-bake.js"></script>
<script>
/* The bake page has ONE job: expose window.__BAKE__.run(cfg) so the headless
 * driver (tools/_fs_bake_sprites.cjs) can pull sheets + manifest out of a real
 * WebGL context. Nothing renders to screen. */
(function () {
  "use strict";
  const logEl = document.getElementById("log");
  function log(s) { logEl.textContent = s; }

  const renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById("gl"), antialias: true, alpha: true,
    preserveDrawingBuffer: false,
  });
  renderer.setPixelRatio(1);          // the bake ALWAYS runs at dPR 1 — see fs-cast-bake.js
  renderer.setSize(8, 8, false);

  window.__BAKE__ = {
    ready: true,
    renderer: renderer,
    /** returns { manifest, png: { name: dataURL }, stats } — async because a
     * non-minifig source has to load its GLBs first */
    run: async function (cfg) {
      log("baking…");
      const t0 = performance.now();
      const out = await window.FSCastBake.bakeAllAsync(renderer, cfg || {});
      const png = {};
      let bytes = 0;
      for (const name in out.sheets) {
        const d = window.FSCastBake.toPNG(out.sheets[name]);
        png[name] = d;
        bytes += Math.floor((d.length - (d.indexOf(",") + 1)) * 3 / 4);
      }
      const stats = { ms: Math.round(performance.now() - t0), pngBytes: bytes };
      log("baked " + Object.keys(png).length + " sheets in " + stats.ms + " ms, " +
          Math.round(bytes / 1024) + " KB of PNG");
      return { manifest: out.manifest, png: png, stats: stats };
    },
    /** cross-check: the decomposed parts must rebuild the FROZEN merged geometry */
    partAudit: function () {
      const FSM = window.FSModels, FSC = window.FSC;
      function triCount(g) { return (g.index ? g.index.count : g.attributes.position.count) / 3; }
      const merged = FSM.serfGeo(FSC.JOB.LUMBERJACK, 0);          // hat + axe, no pack
      const mergedT = FSM.serfGeo(FSC.JOB.TRANSPORTER, 1);        // hat + pack, no tool
      const kn = FSM.knightGeo(3, 2);
      const kn0 = FSM.knightGeo(0, 2);
      const B = window.FSCastBake;
      return {
        frozenSerfLumberjack: triCount(merged),
        frozenSerfTransporter: triCount(mergedT),
        frozenKnightRank3: triCount(kn),
        frozenKnightRank0: triCount(kn0),
        // rank changes the knight's triangle count by exactly the pips
        knightPipTris: (triCount(kn) - triCount(kn0)) / 3,
        boundsSerf: boxOf(merged), boundsKnight: boxOf(kn),
      };
      function boxOf(g) {
        g.computeBoundingBox();
        const b = g.boundingBox;
        return { min: [r(b.min.x), r(b.min.y), r(b.min.z)], max: [r(b.max.x), r(b.max.y), r(b.max.z)] };
      }
      function r(v) { return Math.round(v * 1e4) / 1e4; }
    },
  };
  log("ready — call __BAKE__.run()");
})();
</script>
</body>
</html>
