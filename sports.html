<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#3f5c46" />
<title>Bucky — Sports · NFL scores</title>
<link rel="icon" href="bucky.png" />
<link rel="apple-touch-icon" href="bucky.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Farmstead redesign: Source Sans 3 body + Fraunces display, exact link from index.html -->
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
<style>
  /* Farmstead skin, written directly (new page — no legacy palette to override). */
  :root {
    --bg: #f4f1e8; --card: #fffdf8; --ink: #26332b; --ink-2: #4b584e; --muted: #8b9184;
    --green: #3f5c46; --green-d: #2f4634; --red: #b8552f;
    --line: #e3ded0; --surface-2: #efeadd;
    --live: #b8552f; --gold: #e0ae35; --good: #3e7d51;
    --turf: #3d6647; --turf-2: #436e4e; --chalk: rgba(255,255,255,.85);
    --shadow: 0 1px 2px rgba(38,51,43,.06), 0 4px 12px rgba(38,51,43,.05);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    /* overscroll: suppress the BROWSER's pull-to-refresh (it would reload the whole page — and
       inside the Bucky embed, the whole app); the page implements its own against
       refreshCurrentView() instead. See the pull-to-refresh block near the bottom. */
    overscroll-behavior-y: contain;
    font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, Roboto, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    min-height: 100dvh;
    padding-bottom: calc(env(safe-area-inset-bottom) + 118px);   /* clears the fixed two-row bottom nav */
    -webkit-font-smoothing: antialiased;
  }

  /* Header matches index.html's app header (cream, wordmark left) — this is a
     bottom-nav TAB, so it must not read as a separate place with a back bar. */
  header {
    background: var(--bg); color: var(--ink);
    padding: calc(env(safe-area-inset-top) + 8px) 14px 7px;
    position: sticky; top: 0; z-index: 30;
    border-bottom: 1px solid var(--line);
  }
  #bar { display: flex; align-items: center; gap: 10px; }
  #bar a#backLink { display: flex; align-items: baseline; gap: 7px; text-decoration: none; flex: 0 0 auto; }
  #bar a#backLink h1 {
    margin: 0; font-family: Fraunces, Georgia, serif; font-size: 18px; font-weight: 700;
    color: var(--green); line-height: 1.1; letter-spacing: .2px;
  }
  #bar a#backLink .subtitle { font-size: 10.5px; font-weight: 600; color: var(--muted); letter-spacing: .3px; line-height: 1.1; }
  #bar .t { margin-left: auto; font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: .2px; }

  main { max-width: 720px; margin: 0 auto; padding: 14px 12px 24px; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow); padding: 12px 14px; margin: 0 0 12px;
  }

  /* pills (NFL / Fantasy) */
  .pills { display: flex; gap: 6px; margin: 2px 2px 10px; align-items: center; }
  .pills[hidden] { display: none; }   /* display:flex beats the UA [hidden] rule without this */

  /* Embedded inside index.html (the Sports tab hosts this page in a persistent
     iframe): the app supplies the header + nav, so this page's own chrome hides
     and the content fills the frame edge to edge. The .embedded class is set by
     an inline script before first paint (window.self !== window.top). */
  .embedded header, .embedded #buckyNav, .embedded #sidenav { display: none !important; }
  .embedded body { padding-bottom: calc(env(safe-area-inset-bottom) + 16px) !important; padding-left: 0 !important; }
  .embedded main { padding-top: 10px; }
  .pills .pill {
    font-size: 12.5px; font-weight: 700; padding: 6px 13px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    font-family: inherit; cursor: default;
  }
  .pills .pill.on { background: var(--green); border-color: var(--green); color: #f4f1e8; }
  .pills .upd {
    margin-left: auto; background: none; border: 0; font-family: inherit; cursor: pointer;
    font-size: 11px; font-weight: 600; color: var(--muted); padding: 6px 2px;
    font-variant-numeric: tabular-nums;
  }
  .pills .upd:active { color: var(--ink); }

  /* week picker */
  .wkrow { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 2px 0 12px; }
  .wkrow .wkname { font-family: Fraunces, Georgia, serif; font-size: 17px; font-weight: 700; }
  .wkrow .dates { color: var(--muted); font-size: 12px; font-weight: 600; }
  .wkbtn {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--card);
    color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center;
    font-size: 15px; cursor: pointer; font-family: inherit;
  }
  .wkbtn:disabled { opacity: .35; cursor: default; }
  .wkbtn:active:not(:disabled) { background: var(--surface-2); }

  /* game list */
  .dayhead {
    font-size: 10.5px; font-weight: 800; letter-spacing: .1em; color: var(--muted);
    display: flex; align-items: center; gap: 6px; margin-bottom: 2px;
  }
  .dayhead.live { color: var(--live); }
  .dayhead .ldot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .dayhead .ldot, .chip.live .dot { animation: none; } }

  .gbtn {
    display: block; width: calc(100% + 8px); background: none; border: 0; padding: 0 4px; margin: 0 -4px;
    font: inherit; color: inherit; cursor: pointer; text-align: left; border-radius: 8px;
  }
  .gbtn:hover { background: var(--surface-2); }
  .gbtn:focus-visible { outline: 2px solid var(--red); outline-offset: -2px; }
  .g { display: grid; grid-template-columns: 1fr auto auto; gap: 2px 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .gbtn:first-of-type .g { border-top: 0; }
  .g .teams { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .g .tm { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; min-width: 0; }
  .g .tm .tn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g .tm .score { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
  .g .tm.poss .score::after { content: "◂"; color: var(--red); font-size: 10px; margin-left: 5px; }
  /* Final games: the LOSING SCORE alone goes muted — the name stays ink so finished games
     scan the same as upcoming ones. Both scores stay ink until status.state is post. */
  .g .tm.dim .score { color: var(--muted); font-weight: 500; }
  /* Pull-to-refresh pill (see the touch handlers near the bottom). */
  #ptrPill {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 54px); left: 50%;
    transform: translateX(-50%) translateY(-10px); z-index: 60;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; font-size: 12px; font-weight: 700; color: var(--muted);
    box-shadow: 0 3px 12px rgba(38, 51, 43, .12);
    opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s;
  }
  #ptrPill.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #ptrPill.armed { color: var(--green); border-color: var(--green); }
  .mono {
    width: 24px; height: 24px; border-radius: 50%; color: #fff; font-size: 9px; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
    position: relative; overflow: hidden; background: #6a6a6a;
  }
  .mono img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .g .st {
    text-align: right; display: flex; flex-direction: column; gap: 3px; align-items: flex-end;
    justify-content: center; font-size: 12px; color: var(--muted); font-weight: 600;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .g .st .clock { color: var(--live); font-weight: 800; }
  .g .chev { align-self: center; color: var(--muted); font-size: 15px; }
  .g .situ { grid-column: 1 / -1; font-size: 12px; color: var(--muted); padding: 2px 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g .situ b { color: var(--ink); font-weight: 700; }
  .g .tm .trec { color: var(--muted); font-weight: 600; font-size: 11px; margin-left: 5px; }
  .ffct { font-weight: 700; }

  .loadrow, .errcard { font-size: 14px; font-weight: 600; color: var(--muted); padding: 14px 6px; }
  .errcard { color: var(--red); }
  .errcard button {
    display: block; margin-top: 10px; font: inherit; font-weight: 700; color: #fff;
    background: var(--green); border: 0; border-radius: 10px; padding: 8px 16px; cursor: pointer;
  }
  .stalenote { font-size: 11.5px; font-weight: 600; color: var(--red); margin: -6px 2px 10px; }

  /* ---------- game detail ---------- */
  .backrow { display: flex; align-items: center; gap: 10px; margin: 0 2px 10px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .backbtn {
    background: none; border: 0; padding: 4px 4px 4px 0; font: inherit; color: var(--green);
    font-weight: 800; cursor: pointer; font-size: 14px;
  }
  .chip { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; padding: 2px 8px; border-radius: 999px; }
  .chip.live { background: var(--live); color: #fff; }
  .chip.live .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #fff; margin-right: 4px; animation: pulse 1.6s infinite; vertical-align: 1px; }
  .chip.final { background: var(--surface-2); color: var(--ink-2); }

  .scorehead { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; text-align: center; }
  .scorehead .side { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .scorehead .mono { width: 42px; height: 42px; font-size: 15px; }
  .scorehead .ab { font-weight: 800; font-size: 14px; letter-spacing: .04em; }
  .scorehead .rec { font-size: 11px; color: var(--muted); font-weight: 600; }
  .scorehead .big { font-family: Fraunces, Georgia, serif; font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .scorehead .big.losing { color: var(--muted); }
  .scorehead .mid { display: flex; flex-direction: column; gap: 4px; align-items: center; color: var(--muted); font-size: 12px; font-weight: 600; }
  .scorehead .q { color: var(--live); font-weight: 800; font-size: 13px; white-space: nowrap; }
  .scorehead .q.done { color: var(--ink-2); }
  .possdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--red); margin-left: 5px; vertical-align: 2px; }

  table.line { border-collapse: collapse; margin: 12px auto 0; font-size: 12px; font-variant-numeric: tabular-nums; }
  table.line th, table.line td { padding: 2px 9px; text-align: center; color: var(--muted); font-weight: 600; }
  table.line td:first-child { font-weight: 800; color: var(--ink); text-align: left; }
  table.line td.tot { font-weight: 800; color: var(--ink); }

  .fieldwrap { padding: 8px; }
  .fieldwrap svg { display: block; width: 100%; height: auto; border-radius: 10px; }
  .situline { display: flex; align-items: baseline; gap: 8px; margin: 10px 6px 0; flex-wrap: wrap; }
  .situline .dd { font-weight: 800; font-size: 15px; }
  .situline .sp { color: var(--muted); font-size: 12.5px; font-weight: 600; }
  .lastplay { background: var(--surface-2); border-radius: 12px; padding: 9px 12px; margin: 10px 6px 4px; font-size: 13px; }
  .lastplay b { font-size: 10.5px; letter-spacing: .1em; color: var(--red); display: block; margin-bottom: 2px; }

  .seclabel { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-weight: 600; padding: 2px 2px 8px; }
  .seclabel b { color: var(--ink); font-size: 13px; font-weight: 800; }
  .seclabel .meta { margin-left: auto; font-variant-numeric: tabular-nums; }
  .mono.sm { width: 18px; height: 18px; font-size: 7.5px; }

  .play { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; padding: 8px 2px; border-top: 1px solid var(--line); font-size: 13px; }
  .play .dd { font-weight: 700; font-size: 11.5px; color: var(--muted); padding-top: 1px; line-height: 1.35; }
  .play.score .dd { color: var(--red); }
  .play .ck { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .drv { display: flex; align-items: center; gap: 9px; padding: 9px 2px; border-top: 1px solid var(--line); font-size: 13px; }
  .drv:first-of-type { border-top: 0; }
  .drv .res { font-weight: 700; min-width: 86px; }
  .drv .res.scored { color: var(--red); }
  .drv .meta { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; text-align: right; }

  .wp { display: flex; gap: 12px; align-items: center; }
  .wp svg { flex: 1; height: 56px; min-width: 0; }
  .wp .val { text-align: right; flex: 0 0 auto; }
  .wp .val b { font-family: Fraunces, Georgia, serif; font-size: 22px; }
  .wp .val small { display: block; color: var(--muted); font-size: 11px; font-weight: 600; }

  .statbars { display: flex; flex-direction: column; gap: 9px; }
  .sb .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
  .sb .lbl b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .sb .tr { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--surface-2); }
  .sb .tr i, .sb .tr em { height: 100%; }

  .panner { overflow-x: auto; }
  .boxteam { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--muted); margin: 10px 2px 4px; }
  table.box { border-collapse: collapse; width: 100%; min-width: 340px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  table.box th { text-align: right; font-weight: 700; color: var(--muted); font-size: 11px; letter-spacing: .05em; padding: 4px 8px; border-bottom: 1px solid var(--line); }
  table.box th:first-child, table.box td:first-child { text-align: left; }
  table.box td { padding: 5px 8px; text-align: right; border-bottom: 1px solid var(--line); }
  table.box tr:last-child td { border-bottom: 0; }

  .sc { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; padding: 8px 2px; border-top: 1px solid var(--line); font-size: 13px; align-items: baseline; }
  .sc:first-of-type { border-top: 0; }
  .sc .qk { color: var(--muted); font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sc .after { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; font-weight: 700; }

  .kick { font-size: 14px; color: var(--ink-2); font-weight: 600; line-height: 1.6; }
  .kick b { color: var(--ink); }

  /* GFFL-CONNECT (2026-08-13): the ESPN fantasy CSS families that lived here
     (.ffleague/.fftm/.ffrow/.ffp/.gdot/table.stand/.ffsetup/.ffmini/.ffvs/.wpct/
     .guardcard/.gw/.aibtn*/.aians/.recapcard) are GONE with the ESPN fantasy
     stack — the family's fantasy lives in the GFFL app now (index.html#gffl).
     Only the 🏆 starter badge (.ffct) survives, re-sourced from the GFFL roster. */

  /* college filter */
  .cfbfilter { margin: 0 2px 10px; }
  .cfbfilter select {
    width: 100%; font: 600 13.5px/1.3 inherit; font-family: inherit; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 9px 12px; box-shadow: var(--shadow);
  }
  .tn .rk { color: var(--muted); font-weight: 800; font-size: 11px; margin-right: 3px; }

  /* Bottom Bucky nav — same pattern as games.html / farmgpt.html / weather.html:
     balanced two-row-on-phone grid (--bnav-cols set from JS). */
  #buckyNav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: grid;
    grid-template-columns: repeat(var(--bnav-cols, 7), minmax(0, 1fr));
    gap: 2px 4px;
    background: rgba(255,253,248,.94);
    -webkit-backdrop-filter: saturate(1.3) blur(14px); backdrop-filter: saturate(1.3) blur(14px);
    border-top: 1px solid var(--line);
    padding: 3px 6px calc(env(safe-area-inset-bottom) + 3px);
    box-shadow: 0 -2px 16px rgba(38,51,43,.08);
  }
  #buckyNav a {
    min-width: 0; text-decoration: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px 0 4px; border-radius: 11px; color: var(--muted);
    transition: color .15s ease, background .15s ease, transform .1s ease;
  }
  #buckyNav a .bico { font-size: 20px; line-height: 1; display: flex; align-items: center; justify-content: center; height: 20px; }
  #buckyNav a .blabel { font-size: 10px; font-weight: 700; letter-spacing: .1px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #buckyNav a:active { transform: scale(.93); }
  #buckyNav a.active { color: #fffdf8; background: var(--green); }
  @media (min-width: 700px) and (max-width: 1023.98px) {
    #buckyNav { grid-template-columns: repeat(var(--bnav-all, 13), minmax(0, 96px)); justify-content: center; gap: 6px; }
  }

  /* Desktop left rail (>=1024px) — mirrors index.html's #sidenav. */
  #sidenav { display: none; }
  @media (min-width: 1024px) {
    :root { --sidenav-w: 230px; }
    body { padding-left: var(--sidenav-w); padding-bottom: 0; }
    #sidenav {
      display: flex; flex-direction: column;
      position: fixed; top: 0; bottom: 0; left: 0; width: var(--sidenav-w); z-index: 50;
      background: linear-gradient(180deg, #4a6b52 0%, var(--green) 55%, var(--green-d) 100%);
      border-right: 1px solid rgba(255,255,255,.10);
      box-shadow: 2px 0 18px rgba(38,51,43,.14);
      overflow-y: auto; overscroll-behavior: contain;
    }
    .sn-brand {
      display: block; width: 100%; text-align: left; text-decoration: none; cursor: pointer;
      background: transparent; border: 0; color: #fff; font: inherit;
      padding: 20px 18px 16px; border-bottom: 1px solid rgba(255,255,255,.12);
    }
    .sn-brand .sn-name { font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 800; letter-spacing: .2px; line-height: 1.05; }
    .sn-brand .sn-sub {
      font-size: 10.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      color: rgba(255,255,255,.62); margin-top: 4px;
    }
    .sn-brand::after {
      content: ""; display: block; height: 3px; width: 46px; margin-top: 10px; border-radius: 2px;
      background: repeating-linear-gradient(90deg, var(--red) 0 9px, #fff 9px 18px);
    }
    .sn-list { display: flex; flex-direction: column; gap: 2px; padding: 12px 10px 20px; }
    .sn-item {
      display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
      text-decoration: none; border: 0; background: transparent; cursor: pointer; font: inherit;
      color: rgba(255,255,255,.80); padding: 10px 12px; border-radius: 11px;
      border-left: 3px solid transparent;
      transition: background .15s ease, color .15s ease;
    }
    .sn-item:hover { background: rgba(255,255,255,.09); color: #fff; }
    .sn-item .sn-ico { font-size: 18px; line-height: 1; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
    .sn-item .sn-label { font-size: 14.5px; font-weight: 700; letter-spacing: .1px; }
    .sn-item.active { background: rgba(255,255,255,.15); color: #fff; border-left-color: var(--red); cursor: default; }

    /* The rail carries the wordmark on desktop — the page name becomes the
       header crumb, exactly like index.html's sections. */
    #bar a#backLink { display: none; }
    #bar .t { margin-left: 0; font-size: 15px; font-weight: 800; color: var(--ink); }
    #buckyNav { display: none; }
    main { max-width: 900px; padding: 20px 24px 32px; }
  }
</style>
<!-- Activity beacon: records that this page was opened + on-screen time for the Dad-only
     activity.html dashboard. Deferred and fully self-guarded — if it fails to load, this
     page behaves exactly as it did before it existed. -->
<script src="/assets/activity.js" data-feature="sports" defer></script>
</head>
<body>
<script>
// Embedded-mode detection MUST run before first paint or the standalone chrome
// flashes inside the app's Sports tab. Same-origin frame, so this never throws.
if (window.self !== window.top) document.documentElement.classList.add("embedded");
</script>

<nav id="sidenav" aria-label="BUCKY sections"></nav>

<header>
  <div id="bar">
    <a href="index.html" id="backLink" title="Back to the Bucky dashboard">
      <h1>Bucky</h1>
      <span class="subtitle">Family Farm Hub</span>
    </a>
    <span class="t">🏈 Sports</span>
  </div>
</header>

<main>
  <div class="pills" id="topPills">
    <button type="button" class="pill on" id="pillNfl">🏈 NFL</button>
    <button type="button" class="pill" id="pillCfb">🎓 College</button>
    <button type="button" class="upd" id="wkUpdated" title="Refresh now" aria-label="Refresh scores now"></button>
  </div>

  <!-- ================= WEEK VIEW ================= -->
  <section id="weekView">
    <div class="wkrow">
      <button type="button" class="wkbtn" id="wkPrev" aria-label="Previous week" disabled>‹</button>
      <span>
        <span class="wkname" id="wkTitle">NFL</span>
        <span class="dates" id="wkDates"></span>
      </span>
      <button type="button" class="wkbtn" id="wkNext" aria-label="Next week" disabled>›</button>
    </div>
    <div id="wkStale" class="stalenote" hidden>Couldn’t refresh — showing the last scores loaded.</div>
    <div id="wkGroups">
      <div class="card"><div class="loadrow">Loading this week’s games…</div></div>
    </div>
  </section>

<script>
(function () {
  "use strict";

  // The real gate is server-side: the function checks this against BUCKY_NOTIFY_SECRET.
  var FAMILY_PASSWORD = "amenfarms";
  var FN = "/.netlify/functions/sports";
  var TZ = "America/Chicago";
  var LS_SB = "bucky_nfl_sb";

  // Poll cadences (ms). Live polling pauses whenever the tab is hidden and
  // refreshes immediately on return — see schedule()/visibilitychange below.
  var IV = { gameLive: 15000, gamePre: 120000, sbLive: 25000, sbIdle: 300000 };

  // ---------------- state ----------------
  var view = "week";          // "week" | "cfb" | "game"
  var gameId = null;
  var gameSport = "nfl";      // which league the open game detail belongs to
  var cur = { week: null, seasontype: null, year: null };   // null = server's current week
  var sb = null;              // latest NFL scoreboard payload
  var sbTs = 0;
  var cfbSb = null;           // latest college scoreboard payload
  var cfbTs = 0;
  var cfbCur = { week: null, seasontype: null, year: null };
  var cfbGroup = localStorage.getItem("bucky_cfb_group") || "top25";
  var game = null;            // latest game payload (either league)
  var pollT = null;
  var lastIv = 0;
  var wkLoading = false, cfbLoading = false, gmLoading = false;

  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function hexColor(c) {
    var v = String(c || "").replace(/[^0-9a-fA-F]/g, "").slice(0, 6);
    return v.length === 6 ? "#" + v : "#6a6a6a";
  }

  async function api(action, params) {
    var body = Object.assign({ secret: FAMILY_PASSWORD, action: action }, params || {});
    var r = await fetch(FN, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error("fn-" + r.status);
    return r.json();
  }

  // ---------------- time helpers (America/Chicago) ----------------
  function dayKeyChi(iso) {
    try { return new Date(iso).toLocaleDateString("en-CA", { timeZone: TZ }); } catch (e) { return ""; }
  }
  function todayKeyChi() { return new Date().toLocaleDateString("en-CA", { timeZone: TZ }); }
  function dayLabel(iso) {
    var k = dayKeyChi(iso);
    if (k && k === todayKeyChi()) return "TODAY";
    try {
      return new Date(iso).toLocaleDateString("en-US", { timeZone: TZ, weekday: "long" }).toUpperCase();
    } catch (e) { return "GAMES"; }
  }
  function kickTime(iso) {
    try {
      return new Date(iso).toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit" });
    } catch (e) { return ""; }
  }
  function kickFull(iso) {
    try {
      return new Date(iso).toLocaleString("en-US", { timeZone: TZ, weekday: "long", month: "long", day: "numeric", hour: "numeric", minute: "2-digit" });
    } catch (e) { return ""; }
  }
  function rangeLabel(startIso, endIso) {
    try {
      var f = { timeZone: TZ, month: "short", day: "numeric" };
      var a = new Date(startIso).toLocaleDateString("en-US", f);
      // ESPN calendar end dates run to the following Tue/Wed — show start..end-1d.
      var b = new Date(new Date(endIso).getTime() - 86400000).toLocaleDateString("en-US", f);
      return a + " – " + b;
    } catch (e) { return ""; }
  }

  // ---------------- field geometry (unit-tested via __SPORTS__) ----------------
  // Field coordinate: 0..100 = yards from the LEFT goal line. Away team's end
  // zone is drawn LEFT, home's RIGHT. `yardsToEndzone` (ESPN) is the distance
  // from the ball to the end zone the OFFENSE is driving toward:
  //   away possesses -> drives right (toward home's EZ) -> pos = 100 - yTE
  //   home possesses -> drives left  (toward away's EZ) -> pos = yTE
  var EZ = 83.33, PER_YD = 8.3334, VB_W = 1000, VB_H = 300;
  function fieldPos(possHomeAway, yTE) {
    var y = Math.max(0, Math.min(100, Number(yTE)));
    return possHomeAway === "home" ? y : 100 - y;
  }
  function firstDownPos(possHomeAway, ballPos, distance) {
    var d = Math.max(0, Number(distance) || 0);
    var p = possHomeAway === "home" ? ballPos - d : ballPos + d;
    return Math.max(0, Math.min(100, p));
  }
  function fieldX(pos) { return EZ + pos * PER_YD; }

  // ---------------- polling ----------------
  function anyLive() {
    return !!(sb && sb.events && sb.events.some(function (e) { return e.status.state === "in"; }));
  }
  function anyCfbLive() {
    return !!(cfbSb && cfbSb.events && cfbSb.events.some(function (e) { return e.status.state === "in"; }));
  }
  function gameLive() { return !!(game && game.status && game.status.state === "in"); }

  function refreshCurrentView() {
    if (view === "game") loadGame(true);
    else if (view === "cfb") loadCfb(true);
    else loadWeek(true);
  }

  function schedule() {
    clearTimeout(pollT); pollT = null; lastIv = 0;
    // Embedded in index.html, this page's document never reports hidden while
    // another tab covers it — the app sets __buckyEmbedVisible instead.
    if (document.hidden || window.__buckyEmbedVisible === false) return;
    var iv = null;
    if (view === "game") {
      if (gameLive()) iv = IV.gameLive;
      else if (game && game.status && game.status.state === "pre") iv = IV.gamePre;
    } else if (view === "cfb") {
      iv = anyCfbLive() ? IV.sbLive : IV.sbIdle;
    } else {
      iv = anyLive() ? IV.sbLive : IV.sbIdle;
    }
    if (iv) {
      lastIv = iv;
      pollT = setTimeout(refreshCurrentView, iv);
    }
  }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { clearTimeout(pollT); pollT = null; lastIv = 0; }
    else refreshCurrentView();
  });
  // The app's Sports tab hides/shows this frame — same pause/refresh semantics
  // as the tab going hidden/visible.
  window.addEventListener("bucky-embed-visibility", function () {
    if (window.__buckyEmbedVisible === false) { clearTimeout(pollT); pollT = null; lastIv = 0; }
    else refreshCurrentView();
  });

  // ---------------- data ----------------
  async function loadWeek(quiet) {
    if (wkLoading) return;
    wkLoading = true;
    try {
      var params = {};
      if (cur.week != null) { params.week = cur.week; params.seasontype = cur.seasontype; params.year = cur.year; }
      var d = await api("nfl_scoreboard", params);
      if (!d || d.ok === false) throw new Error((d && d.reason) || "bad");
      sb = d; sbTs = Date.now();
      if (cur.week == null) {
        try { localStorage.setItem(LS_SB, JSON.stringify({ ts: sbTs, data: d })); } catch (e) {}
      }
      if (view === "week") paintWeek();
    } catch (e) {
      if (view === "week") paintWeekError();
    } finally {
      wkLoading = false;
      schedule();
    }
  }

  async function loadGame(quiet) {
    if (gmLoading || !gameId) return;
    gmLoading = true;
    try {
      var d = await api(gameSport === "ncaa" ? "ncaa_game" : "nfl_game", { eventId: gameId });
      if (!d || d.ok === false) throw new Error((d && d.reason) || "bad");
      game = d;
      if (view === "game") paintGame();
    } catch (e) {
      if (view === "game" && !game) paintGameError();
      // With a stale copy on screen we keep it — next poll retries.
    } finally {
      gmLoading = false;
      schedule();
    }
  }

  var cfbReload = false;
  async function loadCfb(quiet) {
    // A call while one is in flight (e.g. the filter changed during a refetch)
    // latches a reload so the LATEST group/week always ends up on screen.
    if (cfbLoading) { cfbReload = true; return; }
    cfbLoading = true;
    try {
      var params = {};
      if (cfbCur.week != null) { params.week = cfbCur.week; params.seasontype = cfbCur.seasontype; params.year = cfbCur.year; }
      // "Top 25" fetches the default full slate and filters client-side on rank;
      // every other choice is a real ESPN conference group id.
      if (cfbGroup !== "top25") params.group = Number(cfbGroup);
      var d = await api("ncaa_scoreboard", params);
      if (!d || d.ok === false) throw new Error((d && d.reason) || "bad");
      d._fetchGroup = params.group != null ? params.group : null;   // which upstream cut this is
      cfbSb = d; cfbTs = Date.now();
      if (view === "cfb") paintCfb();
    } catch (e) {
      if (view === "cfb") paintCfbError();
    } finally {
      cfbLoading = false;
      if (cfbReload) { cfbReload = false; loadCfb(true); }
      else schedule();
    }
  }

  // ---------------- week rendering ----------------
  function teamMono(t, cls) {
    var span = '<span class="mono ' + (cls || "") + '" style="background:' + hexColor(t.color) + '">' + esc((t.abbrev || "?").slice(0, 3));
    if (t.logo && /^https:\/\/[a-z0-9.-]+\.espncdn\.com\//.test(t.logo)) {
      span += '<img src="' + esc(t.logo) + '" alt="" loading="lazy" onerror="this.remove()">';
    }
    return span + "</span>";
  }

  function teamRow(t, ev) {
    var live = ev.status.state === "in";
    var done = ev.status.state === "post";
    var poss = live && ev.situation && ev.situation.possession && String(ev.situation.possession) === String(t.id);
    var dim = done && !t.winner && ev.teams.some(function (x) { return x.winner; });
    var cls = "tm" + (poss ? " poss" : "") + (dim ? " dim" : "");
    var score = (live || done) && t.score !== "" ? '<span class="score">' + esc(t.score) + "</span>" : "";
    var rank = t.rank ? '<span class="rk">#' + esc(t.rank) + "</span>" : "";
    var rec = t.record ? '<span class="trec">' + esc(t.record) + "</span>" : "";
    return '<div class="' + cls + '">' + teamMono(t) + '<span class="tn">' + rank + esc(t.name || t.abbrev) + rec + "</span>" + score + "</div>";
  }

  // ---------------- MY GFFL starters (the 🏆 badge on NFL rows) ----------------
  // GFFL-CONNECT (2026-08-13): the badge counts MY GFFL starters per NFL game now —
  // the family's own league — instead of the retired ESPN league. Which franchise is
  // mine is by TEAM ID; DUPLICATED in index.html's gfflMyTeamId — keep the two in sync.
  // The read is the same public-key Firestore REST call league.html's own transport
  // makes; failures are silent (badges are a bonus, never worth breaking the scores).
  var GFFL_FS_BASE = "https://firestore.googleapis.com/v1/projects/amen-farms-app/databases/(default)/documents/gffl_fam2jan2g/";
  var GFFL_FS_KEY = "AIzaSyAA1hn-j9_pPuXoaHIzcyyXYJN6EhUccJU";
  var GFFL_SEASON = 2026, GFFL_SEASON_START = "2026-09-08";
  var GFFL_TEAM_BY_USER = { "isaac": 12, "grandpa": 3, "mom": 5 };  // GOAT Kids · Wyoming Cowboys · Nails For Breakfast
  function myGfflTeamId() {
    var who = (localStorage.getItem("choreUser") || "").trim().toLowerCase();
    return GFFL_TEAM_BY_USER[who] || 1;  // default Battle Kreussers
  }
  // The league week, lg-core's own formula (weeks roll Tuesday 05:00 CT).
  function gfflWeek() {
    var t0 = new Date(GFFL_SEASON_START + "T05:00:00-05:00").getTime();
    return Math.max(1, Math.min(18, 1 + Math.floor((Date.now() - t0) / (7 * 24 * 3600 * 1000))));
  }
  // Firestore REST values → plain JS (the small subset the roster doc uses).
  function fsVal(v) {
    if (!v || typeof v !== "object") return null;
    if ("stringValue" in v) return v.stringValue;
    if ("integerValue" in v) return Number(v.integerValue);
    if ("doubleValue" in v) return Number(v.doubleValue);
    if ("booleanValue" in v) return !!v.booleanValue;
    if ("nullValue" in v) return null;
    if ("arrayValue" in v) return ((v.arrayValue && v.arrayValue.values) || []).map(fsVal);
    if ("mapValue" in v) return fsFields((v.mapValue && v.mapValue.fields) || {});
    return null;
  }
  function fsFields(f) {
    var o = {};
    Object.keys(f || {}).forEach(function (k) { o[k] = fsVal(f[k]); });
    return o;
  }
  // Roster rows imported from ESPN carry "WSH" while Sleeper-sourced adds carry
  // "WAS"; the NFL scoreboard's abbrevs are ESPN-style, so normalize the ROSTER side.
  function proAbbrev(t) {
    var a = String(t || "").toUpperCase();
    return a === "WAS" ? "WSH" : a;
  }
  var ffMine = null;   // { proAbbrev: starterCount } — the badge's only input
  async function loadMyGfflCounts() {
    try {
      var id = "roster_" + GFFL_SEASON + "_w" + gfflWeek() + "_t" + myGfflTeamId();
      var r = await fetch(GFFL_FS_BASE + encodeURIComponent(id) + "?key=" + GFFL_FS_KEY);
      if (!r.ok) return;   // 404 = no roster for this week yet → no badges, silently
      var doc = await r.json();
      var players = fsFields((doc && doc.fields) || {}).players;
      if (!Array.isArray(players)) return;
      var by = {};
      players.forEach(function (p) {
        if (!p || !p.team) return;
        var slot = String(p.slot || "").toUpperCase();
        if (slot === "BENCH" || slot === "IR") return;   // starters only
        var ab = proAbbrev(p.team);
        by[ab] = (by[ab] || 0) + 1;
      });
      ffMine = by;
      if (view === "week" && sb) paintWeek();
    } catch (e) { /* no badges — never break the scores */ }
  }
  function ffCountFor(ev) {
    if (!ffMine) return 0;
    return ev.teams.reduce(function (n, t) { return n + (ffMine[t.abbrev] || 0); }, 0);
  }

  function gameRowHTML(ev, sport) {
    var live = ev.status.state === "in";
    var done = ev.status.state === "post";
    var st;
    if (live) {
      st = '<span class="clock">' + esc(ev.status.detail || "LIVE") + "</span>"
        + (ev.broadcast ? "<span>" + esc(ev.broadcast) + "</span>" : "");
    } else if (done) {
      st = "<span>" + esc(ev.status.detail || "FINAL") + "</span>";
    } else {
      st = "<span>" + esc(kickTime(ev.date)) + "</span>"
        + (ev.broadcast ? "<span>" + esc(ev.broadcast) + "</span>" : "");
    }
    var mineN = sport === "nfl" || !sport ? ffCountFor(ev) : 0;
    var mineBit = mineN ? '<span class="ffct" title="Your fantasy starters in this game">🏆 ' + mineN + " of yours</span>" : "";
    var bits = [];
    if (live && ev.situation && (ev.situation.downDistanceText || ev.situation.lastPlay)) {
      if (ev.situation.downDistanceText) bits.push("<b>" + esc(ev.situation.downDistanceText) + "</b>");
      if (ev.situation.possessionText) bits.push(esc(ev.situation.possessionText));
      else if (ev.situation.lastPlay) bits.push(esc(ev.situation.lastPlay));
    } else if (!live && !done && ev.spread) {
      // Upcoming: the betting line rides the quiet bottom line.
      bits.push("<b>" + esc(ev.spread) + "</b>");
    }
    if (mineBit) bits.push(mineBit);
    var situ = bits.length ? '<div class="situ">' + bits.join(" · ") + "</div>" : "";
    // Away team first — the US "BUF @ KC" convention.
    var teams = ev.teams.slice().sort(function (a) { return a.homeAway === "away" ? -1 : 1; });
    return '<button type="button" class="gbtn" data-eid="' + esc(ev.id) + '" data-sport="' + (sport || "nfl") + '">'
      + '<div class="g"><div class="teams">' + teams.map(function (t) { return teamRow(t, ev); }).join("")
      + '</div><div class="st">' + st + '</div><span class="chev">›</span>' + situ + "</div></button>";
  }

  // Group a week's events into the LIVE-first, then by-day card list (shared by
  // the NFL and college views).
  function weekGroupsHTML(evsIn, sport) {
    var evs = evsIn.slice().sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
    var live = evs.filter(function (e) { return e.status.state === "in"; });
    var rest = evs.filter(function (e) { return e.status.state !== "in"; });
    var html = "";
    if (live.length) {
      html += '<div class="card"><div class="dayhead live"><span class="ldot"></span>LIVE NOW</div>'
        + live.map(function (e) { return gameRowHTML(e, sport); }).join("") + "</div>";
    }
    var byDay = new Map();
    rest.forEach(function (e) {
      var k = dayKeyChi(e.date) || "?";
      if (!byDay.has(k)) byDay.set(k, { label: dayLabel(e.date), list: [] });
      byDay.get(k).list.push(e);
    });
    Array.from(byDay.keys()).sort().forEach(function (k) {
      var g = byDay.get(k);
      html += '<div class="card"><div class="dayhead">' + esc(g.label) + "</div>"
        + g.list.map(function (e) { return gameRowHTML(e, sport); }).join("") + "</div>";
    });
    return html;
  }

  // Week header helper — shared by the NFL and college views.
  function paintWeekHeader(sbData, curX, flat, elTitle, elDates, elPrev, elNext, fallback) {
    var title = fallback, dates = "";
    var idx = weekIndexOf(flat, sbData, curX);
    if (idx >= 0) {
      var w = flat[idx];
      title = (w.stLabel === "Regular Season" ? "" : w.stLabel + " · ") + w.label;
      dates = rangeLabel(w.start, w.end);
      $(elPrev).disabled = idx <= 0;
      $(elNext).disabled = idx >= flat.length - 1;
    } else if (sbData && sbData.week != null) {
      title = "Week " + sbData.week;
      $(elPrev).disabled = $(elNext).disabled = true;
    }
    $(elTitle).textContent = title;
    $(elDates).textContent = dates;
  }
  function stampUpdated(ts) {
    $("wkUpdated").textContent = ts
      ? "updated " + new Date(ts).toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit", second: "2-digit" }) + " ↻"
      : "";
  }

  function paintWeek() {
    $("wkStale").hidden = true;
    paintWeekHeader(sb, cur, flatWeeksOf(sb), "wkTitle", "wkDates", "wkPrev", "wkNext", "NFL");
    stampUpdated(sbTs);
    var groups = $("wkGroups");
    if (!sb.events.length) {
      groups.innerHTML = '<div class="card"><div class="loadrow">No games scheduled this week.</div></div>';
      return;
    }
    groups.innerHTML = weekGroupsHTML(sb.events, "nfl");
  }

  function paintCfb() {
    $("cfbStale").hidden = true;
    paintWeekHeader(cfbSb, cfbCur, flatWeeksOf(cfbSb), "cfbTitle", "cfbDates", "cfbPrev", "cfbNext", "College");
    stampUpdated(cfbTs);
    var groups = $("cfbGroups");
    var evs = cfbSb.events || [];
    var note = "";
    // "Top 25" is a client-side cut: ESPN's default college scoreboard is the
    // whole FBS slate (~99 games/week, measured live), so the filter keeps
    // games where either team carries an AP rank. Preseason has NO ranks at
    // all (measured live 2026-08-05: 99 events, 0 ranked) — an empty tab there
    // would read as broken, so fall back to the full slate and say so.
    if (cfbGroup === "top25") {
      var ranked = evs.filter(function (e) { return e.teams.some(function (t) { return t.rank; }); });
      if (ranked.length) evs = ranked;
      else if (evs.length) note = '<div class="card"><div class="loadrow">🏅 No AP Top 25 rankings yet this week — showing every game.</div></div>';
    }
    if (!evs.length) {
      groups.innerHTML = '<div class="card"><div class="loadrow">No games match this filter this week.</div></div>';
      return;
    }
    groups.innerHTML = note + weekGroupsHTML(evs, "ncaa");
  }

  function paintWeekError() {
    if (sb) { $("wkStale").hidden = false; return; }   // keep the stale copy on screen
    $("wkGroups").innerHTML =
      '<div class="card"><div class="errcard">Couldn’t load NFL scores right now. Check your connection and try again.'
      + '<button type="button" id="wkRetry">Try again</button></div></div>';
    var btn = $("wkRetry");
    if (btn) btn.addEventListener("click", function () {
      $("wkGroups").innerHTML = '<div class="card"><div class="loadrow">Loading this week’s games…</div></div>';
      loadWeek();
    });
  }

  function paintCfbError() {
    if (cfbSb) { $("cfbStale").hidden = false; return; }   // keep the stale copy on screen
    $("cfbGroups").innerHTML =
      '<div class="card"><div class="errcard">Couldn’t load college scores right now. Check your connection and try again.'
      + '<button type="button" id="cfbRetry">Try again</button></div></div>';
    var btn = $("cfbRetry");
    if (btn) btn.addEventListener("click", function () {
      $("cfbGroups").innerHTML = '<div class="card"><div class="loadrow">Loading college football…</div></div>';
      loadCfb();
    });
  }

  // ---- week picker over the calendar (shared by the NFL + college views) ----
  function flatWeeksOf(sbData) {
    if (!sbData || !Array.isArray(sbData.calendar)) return [];
    var out = [];
    sbData.calendar.forEach(function (c) {
      // Skip the offseason pseudo-entries some responses carry.
      if (!c.weeks || !c.weeks.length) return;
      c.weeks.forEach(function (w) {
        out.push({ seasontype: c.seasontype, stLabel: c.label, num: w.num, label: w.label, start: w.start, end: w.end });
      });
    });
    return out;
  }
  function weekIndexOf(flat, sbData, curX) {
    if (!sbData) return -1;
    var st = curX.seasontype != null ? curX.seasontype : (sbData.season && sbData.season.type);
    var wk = curX.week != null ? curX.week : sbData.week;
    for (var i = 0; i < flat.length; i++) {
      if (flat[i].seasontype === st && flat[i].num === wk) return i;
    }
    return -1;
  }
  // Step either league's week; curX is mutated in place so loadWeek/loadCfb see it.
  function stepWeekOf(delta, sbData, curX, ids, loadFn, loadingLabel) {
    var flat = flatWeeksOf(sbData);
    var idx = weekIndexOf(flat, sbData, curX);
    if (idx < 0) return;
    var next = flat[idx + delta];
    if (!next) return;
    curX.week = next.num;
    curX.seasontype = next.seasontype;
    curX.year = (sbData.season && sbData.season.year) || null;
    $(ids.groups).innerHTML = '<div class="card"><div class="loadrow">Loading ' + esc(next.label) + "…</div></div>";
    $(ids.title).textContent = next.label;
    $(ids.dates).textContent = rangeLabel(next.start, next.end);
    loadFn();
  }
  function stepWeek(delta) {
    stepWeekOf(delta, sb, cur, { groups: "wkGroups", title: "wkTitle", dates: "wkDates" }, loadWeek);
  }
  function stepCfbWeek(delta) {
    stepWeekOf(delta, cfbSb, cfbCur, { groups: "cfbGroups", title: "cfbTitle", dates: "cfbDates" }, loadCfb);
  }

  // ---------------- game rendering ----------------
  function fieldSVG(g) {
    var away = g.teams.find(function (t) { return t.homeAway === "away"; }) || g.teams[0] || {};
    var home = g.teams.find(function (t) { return t.homeAway === "home"; }) || g.teams[1] || {};
    var s = g.situation;
    var poss = null;
    if (s && s.possessionId) {
      poss = String(s.possessionId) === String(home.id) ? "home" : "away";
    }
    var awayC = hexColor(away.color), homeC = hexColor(home.color);

    var svg = '<svg viewBox="0 0 ' + VB_W + " " + VB_H + '" role="img" aria-label="Field view">';
    svg += '<rect x="0" y="0" width="1000" height="300" fill="var(--turf)"/>';
    for (var i = 1; i < 10; i += 2) {
      svg += '<rect x="' + (EZ + i * 10 * PER_YD).toFixed(1) + '" y="0" width="' + (10 * PER_YD).toFixed(1) + '" height="300" fill="var(--turf-2)"/>';
    }
    svg += '<rect x="0" y="0" width="83.3" height="300" fill="' + awayC + '" opacity="0.85"/>';
    svg += '<rect x="916.7" y="0" width="83.3" height="300" fill="' + homeC + '" opacity="0.85"/>';
    svg += '<text x="41" y="150" fill="#fff" font-size="24" font-weight="800" text-anchor="middle" transform="rotate(-90 41 150)" letter-spacing="3">' + esc((away.name || away.abbrev || "").toUpperCase().slice(0, 10)) + "</text>";
    svg += '<text x="958" y="150" fill="#fff" font-size="24" font-weight="800" text-anchor="middle" transform="rotate(90 958 150)" letter-spacing="3">' + esc((home.name || home.abbrev || "").toUpperCase().slice(0, 10)) + "</text>";

    // Drive band: from the drive's start spot to the ball.
    var ballPos = null;
    if (poss && s && s.yardsToEndzone != null) {
      ballPos = fieldPos(poss, s.yardsToEndzone);
      var dr = g.drives && g.drives.current;
      if (dr && dr.startYardsToEndzone != null) {
        var startPos = fieldPos(poss, dr.startYardsToEndzone);
        var x0 = fieldX(Math.min(startPos, ballPos)), x1 = fieldX(Math.max(startPos, ballPos));
        var possC = poss === "home" ? homeC : awayC;
        if (x1 - x0 > 1) svg += '<rect x="' + x0.toFixed(1) + '" y="0" width="' + (x1 - x0).toFixed(1) + '" height="300" fill="' + possC + '" opacity="0.16"/>';
      }
    }

    // Yard lines + numbers + goal lines + hashes.
    var nums = [10, 20, 30, 40, 50, 40, 30, 20, 10];
    svg += '<g stroke="var(--chalk)" stroke-width="1.4" opacity="0.7">';
    for (var y = 10; y <= 90; y += 10) {
      var lx = fieldX(y).toFixed(1);
      svg += '<line x1="' + lx + '" y1="0" x2="' + lx + '" y2="300"/>';
    }
    svg += "</g>";
    svg += '<g stroke="var(--chalk)" stroke-width="3" opacity="0.9"><line x1="83.3" y1="0" x2="83.3" y2="300"/><line x1="916.7" y1="0" x2="916.7" y2="300"/></g>';
    svg += '<g fill="var(--chalk)" font-size="15" font-weight="700" text-anchor="middle" opacity="0.75">';
    nums.forEach(function (n, i) {
      svg += '<text x="' + fieldX((i + 1) * 10).toFixed(1) + '" y="282">' + n + "</text>";
    });
    svg += "</g>";
    svg += '<g stroke="var(--chalk)" stroke-width="1" opacity="0.35">'
      + '<line x1="83.3" y1="105" x2="916.7" y2="105" stroke-dasharray="1 15.6"/>'
      + '<line x1="83.3" y1="195" x2="916.7" y2="195" stroke-dasharray="1 15.6"/></g>';

    if (ballPos != null) {
      var bx = fieldX(ballPos);
      // First-down line (gold), then line of scrimmage (pale blue-white).
      if (s.distance) {
        var fd = firstDownPos(poss, ballPos, s.distance);
        svg += '<line x1="' + fieldX(fd).toFixed(1) + '" y1="0" x2="' + fieldX(fd).toFixed(1) + '" y2="300" stroke="var(--gold)" stroke-width="3.5"/>';
      }
      svg += '<line x1="' + bx.toFixed(1) + '" y1="0" x2="' + bx.toFixed(1) + '" y2="300" stroke="#eaf2ff" stroke-width="3" opacity="0.95"/>';
      // Drive direction arrow (shaft + head, pointing the way the offense drives).
      var dirRight = poss === "away";
      if (dirRight) {
        svg += '<g fill="#fff" opacity="0.9"><rect x="600" y="41" width="40" height="5" rx="2"/><path d="M 640 33 l 15 10.5 l -15 10.5 z"/></g>';
      } else {
        svg += '<g fill="#fff" opacity="0.9"><rect x="360" y="41" width="40" height="5" rx="2"/><path d="M 360 33 l -15 10.5 l 15 10.5 z"/></g>';
      }
      // Ball.
      svg += '<g transform="translate(' + bx.toFixed(1) + ',150)"><ellipse rx="14" ry="9" fill="#6b3f23" stroke="#fff" stroke-width="1.5"/><line x1="-6" y1="0" x2="6" y2="0" stroke="#fff" stroke-width="1.4"/></g>';
    }
    svg += "</svg>";
    return svg;
  }

  function scoreheadHTML(g) {
    var away = g.teams.find(function (t) { return t.homeAway === "away"; }) || g.teams[0] || {};
    var home = g.teams.find(function (t) { return t.homeAway === "home"; }) || g.teams[1] || {};
    var live = g.status.state === "in", done = g.status.state === "post", pre = g.status.state === "pre";
    var possId = live && g.situation ? String(g.situation.possessionId) : "";
    function side(t) {
      var poss = possId && String(t.id) === possId;
      return '<div class="side">' + teamMono(t)
        + '<span class="ab">' + esc(t.abbrev) + (poss ? '<span class="possdot" title="possession"></span>' : "") + "</span>"
        + (t.record ? '<span class="rec">' + esc(t.record) + "</span>" : "") + "</div>";
    }
    var aScore = away.score === "" ? "–" : away.score;
    var hScore = home.score === "" ? "–" : home.score;
    // Muted score = LOST, a settled fact — not "currently trailing". While the game is live both
    // scores stay ink; a team down 3 in the 4th quarter has not lost yet.
    var aLosing = done && Number(away.score) < Number(home.score);
    var hLosing = done && Number(home.score) < Number(away.score);
    var mid;
    if (pre) {
      mid = '<span class="q done">' + esc(kickTime(g.date)) + "</span>";
    } else {
      mid = '<span class="q' + (done ? " done" : "") + '">' + esc(g.status.detail || "") + "</span>";
      if (live && g.situation && g.situation.downDistanceText) mid += "<span>" + esc(g.situation.downDistanceText) + "</span>";
    }
    var html = '<div class="scorehead">' + side(away)
      + '<div style="display:flex;align-items:center;gap:10px">'
      + '<span class="big' + (aLosing ? " losing" : "") + '">' + esc(aScore) + "</span>"
      + '<span class="mid">' + mid + "</span>"
      + '<span class="big' + (hLosing ? " losing" : "") + '">' + esc(hScore) + "</span>"
      + "</div>" + side(home) + "</div>";

    // Linescore once anything has been played.
    if ((live || done) && (away.linescores.length || home.linescores.length)) {
      var n = Math.max(away.linescores.length, home.linescores.length, 4);
      var head = "<tr><td></td>";
      for (var i = 0; i < n; i++) head += "<th>" + (i < 4 ? i + 1 : "OT") + "</th>";
      head += "<th>T</th></tr>";
      function lrow(t) {
        var r = "<tr><td>" + esc(t.abbrev) + "</td>";
        for (var i = 0; i < n; i++) r += "<td>" + esc(t.linescores[i] != null && t.linescores[i] !== "" ? t.linescores[i] : "–") + "</td>";
        return r + '<td class="tot">' + esc(t.score || "0") + "</td></tr>";
      }
      html += '<table class="line">' + head + lrow(away) + lrow(home) + "</table>";
    }
    return '<div class="card">' + html + "</div>";
  }

  function paintGame() {
    var g = game;
    var live = g.status.state === "in", done = g.status.state === "post", pre = g.status.state === "pre";
    $("gameChip").innerHTML = live ? '<span class="chip live"><span class="dot"></span>LIVE</span>'
      : done ? '<span class="chip final">FINAL</span>' : "";
    $("gameMeta").textContent = [g.venue].filter(Boolean).join(" · ");

    var html = scoreheadHTML(g);

    if (pre) {
      html += '<div class="card"><div class="kick"><b>Kickoff:</b> ' + esc(kickFull(g.date))
        + (g.venue ? "<br><b>Where:</b> " + esc(g.venue) : "")
        + (g.spread ? "<br><b>Spread:</b> " + esc(g.spread) : "") + "</div></div>";
    }

    if (live) {
      html += '<div class="card fieldwrap">' + fieldSVG(g);
      if (g.situation && g.situation.downDistanceText) {
        html += '<div class="situline"><span class="dd">' + esc(g.situation.downDistanceText) + "</span>"
          + '<span class="sp">' + esc(g.situation.possessionAbbrev) + " ball · driving "
          + (String(g.situation.possessionId) === String((g.teams.find(function (t) { return t.homeAway === "away"; }) || {}).id) ? "→" : "←") + "</span></div>";
      } else {
        html += '<div class="situline"><span class="sp">' + esc(g.status.detail || "") + "</span></div>";
      }
      if (g.situation && g.situation.lastPlay) {
        html += '<div class="lastplay"><b>LAST PLAY</b>' + esc(g.situation.lastPlay) + "</div>";
      }
      html += "</div>";
    }

    // Current drive (live): newest play first so the freshest action needs no scroll.
    var cur_ = g.drives && g.drives.current;
    if (live && cur_ && cur_.plays && cur_.plays.length) {
      html += '<div class="card"><div class="seclabel">'
        + '<span class="mono sm" style="background:' + hexColor((g.teams.find(function (t) { return String(t.id) === String(cur_.teamId); }) || {}).color) + '">' + esc(cur_.teamAbbrev || "") + "</span>"
        + "<b>This drive</b>" + (cur_.description ? '<span class="meta">' + esc(cur_.description) + "</span>" : "") + "</div>";
      cur_.plays.slice().reverse().forEach(function (p) {
        if (!p.text) return;
        html += '<div class="play' + (p.scoring ? " score" : "") + '"><span class="dd">' + esc(p.downDistanceText || "—") + '</span><span>' + esc(p.text) + '</span><span class="ck">' + esc(p.clock) + "</span></div>";
      });
      html += "</div>";
    }

    // Previous drives.
    if (g.drives && g.drives.previous && g.drives.previous.length) {
      html += '<div class="card"><div class="seclabel"><b>' + (live ? "Previous drives" : "Drives") + "</b></div>";
      g.drives.previous.slice(0, 14).forEach(function (d) {
        var tc = hexColor((g.teams.find(function (t) { return String(t.id) === String(d.teamId); }) || {}).color);
        html += '<div class="drv"><span class="mono sm" style="background:' + tc + '">' + esc(d.teamAbbrev || "") + "</span>"
          + '<span class="res' + (d.scoring ? " scored" : "") + '">' + esc(d.result || "Drive") + "</span>"
          + '<span class="meta">' + esc(d.description || "") + "</span></div>";
      });
      html += "</div>";
    }

    // Win probability + team stat bars.
    var away = g.teams.find(function (t) { return t.homeAway === "away"; }) || g.teams[0] || {};
    var home = g.teams.find(function (t) { return t.homeAway === "home"; }) || g.teams[1] || {};
    var wpCard = "";
    if (g.winprob && g.winprob.length > 1 && !pre) {
      var pts = g.winprob;
      var poly = pts.map(function (p, i) {
        var x = (i / (pts.length - 1)) * 220;
        var y = 52 - Math.max(0, Math.min(1, p)) * 48;
        return x.toFixed(1) + "," + y.toFixed(1);
      }).join(" ");
      var lastP = pts[pts.length - 1];
      var leadHome = lastP >= 0.5;
      var pct = Math.round((leadHome ? lastP : 1 - lastP) * 100);
      var lead = leadHome ? home : away;
      wpCard += '<div class="wp"><svg viewBox="0 0 220 56" preserveAspectRatio="none" role="img" aria-label="Win probability">'
        + '<line x1="0" y1="28" x2="220" y2="28" stroke="var(--line)" stroke-width="1"/>'
        + '<polyline points="' + poly + '" fill="none" stroke="' + hexColor(home.color) + '" stroke-width="2"/>'
        + "</svg>"
        + '<div class="val"><b>' + esc(lead.abbrev) + " " + pct + "%</b><small>win probability</small></div></div>";
    }
    var statCard = "";
    if (g.boxscore && g.boxscore.teams && g.boxscore.teams.length === 2) {
      var WANT = ["totalYards", "netPassingYards", "rushingYards", "turnovers", "possessionTime", "thirdDownEff"];
      var a = g.boxscore.teams.find(function (t) { return t.abbrev === away.abbrev; }) || g.boxscore.teams[0];
      var h = g.boxscore.teams.find(function (t) { return t.abbrev === home.abbrev; }) || g.boxscore.teams[1];
      function statOf(t, name) { var s = (t.stats || []).find(function (x) { return x.name === name; }); return s ? s : null; }
      var rows = "";
      WANT.forEach(function (name) {
        var sa = statOf(a, name), sh = statOf(h, name);
        if (!sa || !sh) return;
        var na = parseFloat(String(sa.value).replace(/[^\d.]/g, "")) || 0;
        var nh = parseFloat(String(sh.value).replace(/[^\d.]/g, "")) || 0;
        var tot = na + nh || 1;
        rows += '<div class="sb"><div class="lbl"><b>' + esc(sa.value) + "</b><span>" + esc(sa.label) + "</span><b>" + esc(sh.value) + "</b></div>"
          + '<div class="tr"><i style="width:' + Math.round((na / tot) * 100) + "%;background:" + hexColor(away.color) + '"></i><em style="width:' + Math.round((nh / tot) * 100) + "%;background:" + hexColor(home.color) + '"></em></div></div>';
      });
      if (rows) statCard = '<div class="statbars">' + rows + "</div>";
    }
    if (wpCard || statCard) {
      html += '<div class="card">' + wpCard + (wpCard && statCard ? '<hr style="border:none;border-top:1px solid var(--line);margin:12px 0">' : "") + statCard + "</div>";
    }

    // Box score player tables.
    if (g.boxscore && g.boxscore.players && g.boxscore.players.length && !pre) {
      var GROUPS = ["passing", "rushing", "receiving"];
      var box = "";
      g.boxscore.players.forEach(function (t) {
        (t.groups || []).forEach(function (grp) {
          if (GROUPS.indexOf(grp.name) < 0 || !grp.athletes || !grp.athletes.length) return;
          box += '<div class="boxteam">' + esc((t.abbrev + " " + grp.name).toUpperCase()) + "</div>"
            + '<div class="panner"><table class="box"><tr><th></th>'
            + grp.labels.slice(0, 5).map(function (l) { return "<th>" + esc(l) + "</th>"; }).join("") + "</tr>";
          grp.athletes.forEach(function (a2) {
            box += "<tr><td>" + esc(a2.name) + "</td>" + a2.stats.slice(0, 5).map(function (s2) { return "<td>" + esc(s2) + "</td>"; }).join("") + "</tr>";
          });
          box += "</table></div>";
        });
      });
      if (box) html += '<div class="card"><div class="seclabel"><b>Box score</b></div>' + box + "</div>";
    }

    // Scoring plays.
    if (g.scoringPlays && g.scoringPlays.length) {
      html += '<div class="card"><div class="seclabel"><b>Scoring plays</b></div>';
      g.scoringPlays.forEach(function (s) {
        html += '<div class="sc"><span class="qk">Q' + esc(s.period) + " " + esc(s.clock) + "</span>"
          + "<span><b>" + esc(s.team) + (s.type ? " " + esc(s.type.toUpperCase()) : "") + "</b> — " + esc(s.text) + "</span>"
          + '<span class="after">' + esc(s.away) + "-" + esc(s.home) + "</span></div>";
      });
      html += "</div>";
    }

    $("gameBody").innerHTML = html;
  }

  function paintGameError() {
    $("gameBody").innerHTML =
      '<div class="card"><div class="errcard">Couldn’t load this game right now. Check your connection and try again.'
      + '<button type="button" id="gmRetry">Try again</button></div></div>';
    var btn = $("gmRetry");
    if (btn) btn.addEventListener("click", function () {
      $("gameBody").innerHTML = '<div class="card"><div class="loadrow">Loading game…</div></div>';
      loadGame();
    });
  }

  // ---------------- router ----------------
  var VIEW_SECTIONS = ["weekView", "cfbView", "gameView"];
  function showSection(id) {
    VIEW_SECTIONS.forEach(function (v) { $(v).hidden = (v !== id); });
  }
  function route() {
    var h = location.hash || "";
    var mCfb = /cgame=(\d{5,12})/.exec(h);
    // "cgame=…" contains "game=…", so only look for the NFL form when the
    // college form didn't match.
    var mNfl = mCfb ? null : /game=(\d{5,12})/.exec(h);
    var cfb = /^#college/.test(h);
    // GFFL-CONNECT (2026-08-13): the ESPN fantasy views are retired, so the legacy
    // "#fantasy" / "#ffm=<id>" hashes (old bookmarks, the old home-card handoff)
    // match NOTHING here and fall through SILENTLY to the NFL week view.
    var detail = !!(mNfl || mCfb);
    $("topPills").hidden = detail;
    $("pillNfl").classList.toggle("on", !detail && !cfb);
    $("pillCfb").classList.toggle("on", !detail && cfb);
    if (mNfl || mCfb) {
      var id = (mCfb || mNfl)[1];
      var sport = mCfb ? "ncaa" : "nfl";
      if (view !== "game" || gameId !== id || gameSport !== sport) { game = null; }
      view = "game"; gameId = id; gameSport = sport;
      showSection("gameView");
      $("gameBack").textContent = sport === "ncaa" ? "‹ College" : "‹ Scores";
      $("gameChip").innerHTML = "";
      $("gameMeta").textContent = "";
      if (!game) $("gameBody").innerHTML = '<div class="card"><div class="loadrow">Loading game…</div></div>';
      loadGame();
      window.scrollTo(0, 0);
    } else if (cfb) {
      view = "cfb"; gameId = null; game = null;
      showSection("cfbView");
      $("cfbGroup").value = cfbGroup;
      if (cfbSb) paintCfb();
      loadCfb(true);
      window.scrollTo(0, 0);
    } else {
      view = "week"; gameId = null; game = null;
      showSection("weekView");
      if (sb) paintWeek();
      loadWeek(true);
      window.scrollTo(0, 0);
    }
    schedule();
  }

  window.addEventListener("hashchange", route);
  // One delegated click handler serves every score row: NFL/college game
  // buttons open the game detail.
  document.addEventListener("click", function (ev) {
    var el = ev.target;
    while (el && el !== document && !(el.classList && el.classList.contains("gbtn"))) el = el.parentNode;
    if (!el || el === document) return;
    if (el.dataset.eid) {
      location.hash = (el.dataset.sport === "ncaa" ? "cgame=" : "game=") + el.dataset.eid;
    }
  });
  $("gameBack").addEventListener("click", function () {
    location.hash = gameSport === "ncaa" ? "college" : "";
    route();
  });
  $("wkPrev").addEventListener("click", function () { stepWeek(-1); });
  $("wkNext").addEventListener("click", function () { stepWeek(1); });
  $("cfbPrev").addEventListener("click", function () { stepCfbWeek(-1); });
  $("cfbNext").addEventListener("click", function () { stepCfbWeek(1); });
  $("wkUpdated").addEventListener("click", function () { refreshCurrentView(); });

  // ---------------- pull-to-refresh (2026-08-20) ----------------
  // Swipe down from the top of any scores view = force refresh, same as tapping the ↻ stamp.
  // Hand-rolled: the browser's native pull-to-refresh would reload the whole page (and inside
  // the Bucky embed, the whole app) — overscroll-behavior in the CSS suppresses that, and this
  // reimplements the gesture against refreshCurrentView() instead. Passive listeners only: we
  // never preventDefault, so scrolling performance is untouched; the gesture simply arms when
  // the pull STARTS at scrollY 0 and travels far enough downward.
  var PTR_THRESHOLD_PX = 70;   // ~a thumb's length; matches the platform feel
  var ptrStartY = null, ptrArmed = false, ptrRefreshes = 0, ptrHideT = null;
  var ptrPill = document.createElement("div");
  ptrPill.id = "ptrPill";
  ptrPill.setAttribute("aria-hidden", "true");
  document.body.appendChild(ptrPill);
  function ptrShow(text, cls) {
    ptrPill.textContent = text;
    ptrPill.className = cls || "";
    ptrPill.classList.add("show");
    clearTimeout(ptrHideT);
  }
  function ptrHide(afterMs) { clearTimeout(ptrHideT); ptrHideT = setTimeout(function () { ptrPill.classList.remove("show"); }, afterMs || 0); }
  document.addEventListener("touchstart", function (e) {
    ptrStartY = (window.scrollY <= 0 && e.touches.length === 1) ? e.touches[0].clientY : null;
    ptrArmed = false;
  }, { passive: true });
  document.addEventListener("touchmove", function (e) {
    if (ptrStartY == null) return;
    var dy = e.touches[0].clientY - ptrStartY;
    if (window.scrollY > 0 || dy <= 0) { ptrStartY = null; ptrArmed = false; ptrHide(); return; }
    ptrArmed = dy >= PTR_THRESHOLD_PX;
    ptrShow(ptrArmed ? "Release to refresh" : "Pull to refresh", ptrArmed ? "armed" : "");
  }, { passive: true });
  document.addEventListener("touchend", function () {
    if (ptrArmed) {
      ptrRefreshes++;
      ptrShow("Refreshing scores…", "armed");
      refreshCurrentView();
      ptrHide(900);
    } else { ptrHide(); }
    ptrStartY = null; ptrArmed = false;
  }, { passive: true });
  $("pillNfl").addEventListener("click", function () {
    if (location.hash) location.hash = ""; else route();
  });
  $("pillCfb").addEventListener("click", function () { location.hash = "college"; });
  $("cfbGroup").addEventListener("change", function () {
    cfbGroup = this.value;
    try { localStorage.setItem("bucky_cfb_group", cfbGroup); } catch (e) {}
    // Top 25 is a client-side cut of the same default fetch — swapping between
    // it and a conference (or All FBS) changes the upstream request.
    var wantGroup = cfbGroup !== "top25" ? Number(cfbGroup) : null;
    if (cfbSb && cfbSb._fetchGroup === wantGroup) { paintCfb(); return; }
    $("cfbGroups").innerHTML = '<div class="card"><div class="loadrow">Loading college football…</div></div>';
    loadCfb();
  });

  // ---------------- boot ----------------
  // Instant paint from the last cached default-week scoreboard, then refresh.
  try {
    var c = JSON.parse(localStorage.getItem(LS_SB) || "null");
    if (c && c.data && c.data.ok) { sb = c.data; sbTs = c.ts || 0; }
  } catch (e) {}

  // Test hook.
  window.__SPORTS__ = {
    state: function () {
      return {
        view: view, gameId: gameId, gameSport: gameSport, cur: cur,
        hasSb: !!sb, hasGame: !!game, hasCfb: !!cfbSb,
        cfbGroup: cfbGroup, cfbEvents: cfbSb ? (cfbSb.events || []).length : 0,
        anyLive: anyLive(), cfbAnyLive: anyCfbLive(), gameLive: gameLive(),
        // GFFL-CONNECT: the ESPN fantasy fields are gone; ffMine stays — it is the
        // 🏆 badge's map, sourced from the GFFL roster now.
        ffMine: ffMine,
        pollScheduled: !!pollT, pollIv: lastIv,
        ptrRefreshes: ptrRefreshes,   // pull-to-refresh completions (suite hook)
        events: sb ? sb.events.length : 0,
      };
    },
    fieldPos: fieldPos, firstDownPos: firstDownPos, fieldX: fieldX,
    loadWeek: loadWeek, loadGame: loadGame, loadCfb: loadCfb, loadMyGfflCounts: loadMyGfflCounts, route: route,
    setIntervals: function (o) { Object.assign(IV, o || {}); },
  };

  route();
  loadMyGfflCounts();   // background — badges the NFL rows with my GFFL starters
})();
</script>
</body>
</html>
